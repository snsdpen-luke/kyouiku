<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0;font-size:14px}img{max-width:100%}</style>
<title>電子計測制御 後期中間考査 出題範囲</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
/* layout: 問題カード1枚を画面いっぱいに（ふりかえり演習と同じ形）。4:3 横画面に収め、右に用語欄 */
:root{
  --bg:#eef2f6; --card:#ffffff; --ink:#1c2836; --sub:#5b6876; --line:#d5dde6;
  --accent:#2a5fc4; --accent-soft:#e3ebfa; --ok:#1d7f55; --ok-soft:#e1f3ea; --ng:#b8402b; --ng-soft:#fbe7e2; --panel:#f3f6f9;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-head:"Zen Maru Gothic","BIZ UDPGothic","Hiragino Sans",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;box-sizing:border-box}
*{box-sizing:border-box}
.app{max-width:1040px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:8px}
header{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
h1{font-family:var(--f-head);font-size:20px;margin:0;font-weight:900}
.chips{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.chip{font-size:13px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--sub);background:var(--card);font-variant-numeric:tabular-nums}
.chip.now{border-color:var(--accent);color:var(--accent);font-weight:700}
.chip.done{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.count{font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}
.ver{font-size:12px;color:var(--sub)}
.prog{height:6px;flex:none;border-radius:3px;background:var(--line);overflow:hidden}
.prog div{height:100%;background:var(--accent)}
.card{flex:1;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 22px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.qwrap{flex:1;min-height:0;display:flex;gap:18px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.gloss{width:220px;flex:none;background:var(--panel);border-radius:10px;padding:12px 14px;font-size:15px;align-self:flex-start;min-height:180px}
.gloss h2{margin:0 0 8px;font-size:13px;letter-spacing:.12em;color:var(--sub);font-weight:700}
.gloss dt{font-weight:700;color:var(--accent);margin-bottom:2px}
.gloss dd{margin:0}
.gloss .wait{color:var(--sub);font-size:14px;margin:0}
.sec{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec .lbl{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.06em}
.sec .nm{font-family:var(--f-head);font-size:15px;font-weight:700;color:var(--sub)}
.sec .lv{font-size:13px;color:var(--sub);letter-spacing:.08em}
.q{font-size:20px;font-weight:700;line-height:1.5;text-wrap:pretty}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.opts.long{grid-template-columns:1fr}
.opt{font:inherit;font-size:16px;line-height:1.4;text-align:left;padding:8px 13px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:44px;display:flex;gap:10px;align-items:center}
.opt .mk{flex:none;font-weight:700;color:var(--sub)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{border-radius:10px;padding:8px 13px;font-size:15px}
.fb.ok{background:var(--ok-soft)} .fb.ng{background:var(--ng-soft)}
.fb strong{display:block}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:auto;flex-wrap:wrap;position:sticky;bottom:0;background:var(--card);padding-top:4px}
.row .left{margin-right:auto}
.btn{font:inherit;font-weight:700;font-size:16px;padding:9px 20px;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:var(--card);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.hint{font-size:14px;color:var(--sub)}
.res-total{font-family:var(--f-head);font-size:40px;font-weight:900;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:180px 1fr 64px;gap:10px;align-items:center;font-size:15px}
.track{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--accent)}
.num{font-variant-numeric:tabular-nums;text-align:right}
.parts{display:flex;gap:20px;flex-wrap:wrap;font-size:15px}
.parts b{font-size:19px;font-variant-numeric:tabular-nums}
.miss{display:flex;gap:5px;flex-wrap:wrap}
.miss button{font:inherit;font-size:14px;min-width:42px;min-height:34px;border-radius:8px;border:1.5px solid var(--ng);background:var(--ng-soft);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
table.plan{border-collapse:collapse;font-size:16px}
table.plan td{padding:4px 18px 4px 0;border-bottom:1px solid var(--line)}
.mbtn{font:inherit;text-align:left;padding:20px 22px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:8px}
.mbtn:hover{border-color:var(--accent)}
.mbtn .t{font-family:var(--f-head);font-size:24px;font-weight:900;color:var(--accent)}
.mbtn .d{font-size:16px;line-height:1.6}
.mbtn .s{font-size:14px;color:var(--sub)}
.mbtn.game{border-color:var(--accent);background:var(--accent-soft)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hbtn{font:inherit;font-size:14px;font-weight:700;padding:4px 12px;border-radius:8px;border:2px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.nobox label{font-size:15px;color:var(--sub)}
.nobox input{font:inherit;font-size:28px;width:160px;padding:8px 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);letter-spacing:.15em;font-variant-numeric:tabular-nums}
.warn{color:var(--ng);font-size:15px;font-weight:700}
.demo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff6dc;border:2px dashed #d9a400;border-radius:10px;padding:6px 12px;font-size:14px;font-weight:700}
.demo button{font:inherit;font-size:14px;font-weight:700;padding:4px 12px;border-radius:8px;border:2px solid #b07f00;background:var(--card);color:#7a5800;cursor:pointer}
.map{display:flex;gap:6px;flex-wrap:wrap}
.node{flex:1;min-width:120px;border:2px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px;display:flex;flex-direction:column;gap:2px;background:var(--card)}
.node b{font-family:var(--f-head);font-size:15px}
.node .st{color:#c98a00;letter-spacing:.1em;font-size:16px}
.node .st .off{color:var(--line)}
.node.now{border-color:var(--accent);background:var(--accent-soft)}
.node.boss{border-style:dashed}
.node.clear{border-color:var(--ok)}
.big{font-family:var(--f-head);font-size:44px;font-weight:900;line-height:1.1;color:var(--accent)}
.big.ok{color:var(--ok)} .big.ng{color:var(--ng)}
.stars{font-size:46px;letter-spacing:.12em;color:#e0a800;line-height:1}
.stars .off{color:var(--line)}
.tbar{display:flex;align-items:center;gap:12px}
.tm{font-family:var(--f-head);font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;min-width:92px}
.ttrack{flex:1;height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.ttrack div{height:100%;background:var(--ok)}
.tbar.hot .tm{color:var(--ng)} .tbar.hot .ttrack div{background:var(--ng)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{font:inherit;font-size:15px;min-width:40px;min-height:36px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.dots button.fill{background:var(--accent-soft);border-color:var(--accent-soft)}
.dots button.now{border-color:var(--accent);font-weight:700}
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:7px}
.bank .opt{justify-content:center;text-align:center;position:relative}
.opt.pick{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.opt.used{color:var(--sub);border-style:dashed}
.opt .no{position:absolute;top:1px;right:6px;font-size:11px;color:var(--sub)}
.rv{border-top:1px solid var(--line);padding:8px 0;display:flex;flex-direction:column;gap:3px;font-size:15px}
.rv .h{display:flex;gap:10px;align-items:baseline;font-weight:700}
.rv .mark{flex:none;width:26px;font-size:18px}
.rv .mark.o{color:var(--ok)} .rv .mark.x{color:var(--ng)}
.cert{border:3px solid var(--accent);border-radius:16px;padding:16px 20px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,var(--accent-soft),var(--card) 60%)}
.cert .score{font-family:var(--f-head);font-size:60px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.cert .rank{font-family:var(--f-head);font-size:30px;font-weight:900;color:var(--accent)}
.cert .who{font-size:18px}
.cert .who b{font-size:24px;letter-spacing:.1em}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .5s ease-out}.tbar.hot .tm{animation:beat 1s infinite}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes beat{50%{opacity:.45}}
@media (max-width:760px){.menu{grid-template-columns:1fr}.qwrap{flex-direction:column}.gloss{width:auto;align-self:stretch;min-height:0}.opts{grid-template-columns:1fr}.bar{grid-template-columns:120px 1fr 54px}.card{padding:14px}}
@media (prefers-reduced-motion:no-preference){.fill,.prog div{transition:width .5s ease}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="ttl">電子計測制御 後期中間考査 出題範囲</h1>
    <div class="chips" id="chips"></div>
    <div class="count" id="count"></div>
    <div class="ver" id="ver"></div>
    <button class="hbtn" id="menuBtn" hidden>メニュー</button>
  </header>
  <div class="prog"><div id="bar" style="width:0"></div></div>
  <section class="card" id="card"></section>
</div>

<script>
const VER='2026-11-11d';
const TITLE='電子計測制御 後期中間考査 出題範囲';
// 問題データ。1行1問：[分野, 種類, 難しさ, 用語, 問題文, [正解, 誤り4つ], 解説]
// 分野 A〜E（CH）／種類 m 用語→意味・r 意味→用語・u 使いどころ・b 大事な場面（KIND）／難しさ 1〜3。
// 誤りの選択肢は、似た機能・となりの概念など、明らかに違うと分からないものにする（2026-11-09 剛さん）。正解は必ず先頭に書く。画面に出す順番は positions()・order() が解く人ごとに決める。
// 用語は GLOSS の見出しと同じ文字にする（右の用語欄に出る）。直したら node regression-seigyo100.js 制御クイズ100.html で確かめる。
const CH={A:'制御のしくみ',B:'距離を測る（超音波）',C:'回転と速さを測る（車輪速）',D:'電波で測る（レーダー）',E:'測った値で制御する'};
const CHS={A:'制御',B:'超音波',C:'車輪速',D:'レーダー',E:'制御に使う'};
const KIND={m:'用語の意味',r:'用語を当てる',u:'使いどころ',b:'大事な場面'};
const RAW=[
// ===== A 制御のしくみ（自動駐車・自動運転への階段・車の制御50） =====
['A','m',1,'計測','「計測」の説明として正しいものはどれですか。',['センサで、まわりや自分の状態を測ること','測った値を見て、どう動かすか決めること','指令を受けて、モーターやブレーキを動かすこと','決めた順番どおりに、手順を一つずつ進めること','前もって、こうなってほしい値を決めること'],'「測る → 決める → 動かす」の「測る」です。測れないものは制御できません。'],
['A','m',2,'ECU','「ECU」の役割として正しいものはどれですか。',['センサの値を見て、どう動かすか決める','指令を受けて、ハンドルやブレーキを動かす','まわりの様子を測って、電気の信号に変える','電気をためて、モーターやランプに送る','運転手の操作を記録して、画面に表示する'],'車の中のコンピュータで、「決める」を受け持ちます。'],
['A','m',2,'フィードバック制御','「フィードバック制御」の説明はどれですか。',['結果を測って目標とくらべ、ずれを直し続ける','決めた順番どおりに、手順を一つずつ進める','決めた時間がたつごとに、同じ動きをくり返す','運転手の操作の記録を、同じように再生する','いくつかのセンサの結果を、1つにまとめる'],'クルーズコントロールのように、測ってはくらべ、直すことをくり返します。'],
['A','m',2,'シーケンス制御','「シーケンス制御」の説明はどれですか。',['決めた順番どおりに、手順を一つずつ進める','結果を測って目標とくらべ、ずれを直し続ける','決めた時間がたつごとに、同じ動きをくり返す','運転手の操作の記録を、同じように再生する','いくつかのセンサの結果を、1つにまとめる'],'自動駐車の「進む→切る→下がる→もどす→止まる」がこの形です。'],
['A','m',2,'偏差','制御で「偏差（ずれ）」とは何のことですか。',['目標の値と、今測った値との差','目標の値と、前に測った値との差','2つのセンサが測った値どうしの差','自分の速さと、前の車の速さとの差','記録した値と、その平均との差'],'フィードバック制御は、このずれが小さくなるように動かします。'],
['A','m',2,'アクチュエータ','「アクチュエータ」の説明として正しいものはどれですか。',['指令を受けて、実際に動く部品','測った値を、電気の信号に変える部品','センサの値から、動かし方を決める部品','運転手の操作を、ECU に伝える部品','電気をためて、ほかの部品に送る部品'],'モーター・ブレーキなどです。「動かす」を受け持ちます。'],
['A','m',3,'直す強さ','「アクセル ＝（目標の速さ − 今の速さ）× 直す強さ」の「直す強さ」はどれですか。',['ずれ1つ分に対して、どれだけ強く操作するかの倍率','目標の速さに対して、実際に出すことのできる速さの割合','ブレーキが効き始めるまでにかかる時間','車輪速センサが1秒に速さを測る回数','アクセルを踏める量の上限を決める値'],'大きいほど強く直します。強すぎると、ふらつきます。'],
['A','m',2,'遅れ','制御の「遅れ」の説明として正しいものはどれですか。',['気づいてから、実際に動きが効くまでにかかる時間','目標の値に届かずに、残ってしまう差','センサが測れる、いちばん近い距離','手順が次へ進むまでに、待たせる時間','測った値が、本当の値から少しだけずれてしまうこと'],'自動ブレーキは、気づいてから効くまで 0.3 秒の遅れがありました。'],
['A','r',1,'センサ','「まわりの様子を測って、電気の信号に変える部品」を何といいますか。',['センサ','アクチュエータ','ECU','コイル','タイマー'],'明るさ・速さ・距離・温度などを測ります。'],
['A','r',2,'アクチュエータ','「指令を受けて実際に動く部品で、モーターやブレーキのこと」を何といいますか。',['アクチュエータ','センサ','ECU','スイッチ','タイマー'],'センサとアクチュエータがそろって、はじめて制御ができます。'],
['A','r',2,'フィードバック制御','「今の結果を測って目標とくらべ、ずれを小さくするように直し続ける制御」を何といいますか。',['フィードバック制御','シーケンス制御','センサフュージョン','引き継ぎ','操作のレベル'],'自動運転への階段のレベル2（アクセル）がこの形でした。'],
['A','r',2,'シーケンス制御','「決めた順番どおりに、手順を一つずつ進める制御」を何といいますか。',['シーケンス制御','フィードバック制御','センサフュージョン','引き継ぎ','操作のレベル'],'次へ進むきっかけは「終わりの条件」で決めます。'],
['A','r',2,'目標値','「制御で、こうなってほしいと前もって決めておく値（例：目標の速さ）」を何といいますか。',['目標値','偏差','直す強さ','分解能','余裕'],'フィードバック制御は、測った値をこの値とくらべます。'],
['A','r',2,'偏差','「目標の値と、今測った値との差」を何といいますか。',['偏差','目標値','直す強さ','分解能','余裕'],'「ずれ」ともいいます。ずれが0なら、直す必要はありません。'],
['A','r',3,'終わりの条件','「車の向きが90°変わったら次へ」のように、次の手順へ進むきっかけをセンサの値で決めたものを何といいますか。',['終わりの条件','目標値','直す強さ','操作のレベル','引き継ぎ'],'どの手順も「動かす」と「いつ終わるかを測る」のセットでした。'],
['A','r',3,'しきい値','「この値をこえたら動きを切りかえる」と前もって決めておく境目の値を何といいますか。',['しきい値','偏差','直す強さ','分解能','余裕'],'冷却ファンは、水温がこの値をこえると回ります。'],
['A','u',1,'フィードバック制御','フィードバック制御を使っている機能はどれですか。',['クルーズコントロール','間欠ワイパー','ワンタッチウインカー','室内灯','半ドア警告'],'設定した速さと今の速さをくらべ、エンジンの力を調整し続けます。'],
['A','u',2,'シーケンス制御','シーケンス制御の考え方がいちばん合うのはどれですか。',['自動駐車で、進む・切る・下がる・止まるを順に行う','クルーズで、坂道でも決めた速さを保ち続ける','オートエアコンで、車内を決めた温度に保つ','車線維持支援で、真ん中を走るよう直し続ける','ACC で、前の車との車間を保ち続ける'],'ほかの4つは、測って目標とくらべ続けるフィードバック制御です。'],
['A','u',2,'しきい値','「水温が決めた値をこえたら、冷却ファンを回す」の「決めた値」にあたるものはどれですか。',['しきい値','偏差','直す強さ','分解能','相対速度'],'こえたら動かす、という境目の値です。'],
['A','u',2,'センサ','センサを使わず、スイッチとタイマーだけで動く制御はどれですか。',['間欠ワイパー','オートワイパー','オートライト','オートエアコン','半ドア警告'],'レバーで選んだ間隔で動きます。きっかけを測っていません。'],

'引き継ぎ':'自動で動いている途中で、運転手が操作をして運転を受け持つことです。',
'すべりにくさ':'タイヤで速さを変えられる強さの上限を決める、路面の性質です。',
'トラクションコントロール':'発進でタイヤが空回りしたら、エンジンの力をしぼるしくみです。',
'衝突被害軽減ブレーキ':'ぶつかりそうになると警告し、それでも危ないと自動でブレーキをかける機能です。',
'余裕':'記録の数字に足して使う、安全のための上乗せ分です。',
'ヨーレートセンサ':'車の向きが回る速さを測るセンサです。',
'カメラ':'映像から、白線・枠・人・車の位置や種類を見つけます。暗さや雨に弱いです。',
'手動運転の記録':'人が運転したときの速さやブレーキの位置などの記録です。平均を車の数字に使いました。',
'雨滴センサ':'ガラスについた雨を見つけるセンサです。',
'自動ブレーキ':'センサで測った距離が止める距離より近いと、車がブレーキをかけるしくみです。',
};

// 出題の順番：分野を順に回し（A B C D E A …）、各分野の中は難しさ 1・2・3 を順に回す。全員同じ順番
const Q=(()=>{
  const counter={},all=RAW.map(r=>{counter[r[0]]=(counter[r[0]]||0)+1;
    return {id:r[0]+String(counter[r[0]]).padStart(2,'0'),g:r[0],t:r[1],d:r[2],w:r[3],q:r[4],o:r[5],e:r[6]}});
  const lists=Object.keys(CH).map(g=>{
    const by=[1,2,3].map(d=>all.filter(q=>q.g===g&&q.d===d)),out=[];
    for(let k=0;out.length<all.filter(q=>q.g===g).length;k++){const b=by[k%3];if(b.length)out.push(b.shift())}
    return out});
  const seq=[];for(let k=0;seq.length<all.length;k++)for(const l of lists)if(l[k])seq.push(l[k]);
  return seq})();
const LET='アイウエオ';
const KEY='seigyo100-v4'; // 問題を入れかえたので前の記録は引きつがない（v4：計測と制御の5分野に書き直し）
const blank=()=>({i:-1,ans:{},ord:{},pos:null});
let st=blank();
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)st=Object.assign(st,s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){for(let n=a.length-1;n>0;n--){const r=Math.floor(Math.random()*(n+1));[a[n],a[r]]=[a[r],a[n]]}return a}
// 正解の位置：ア〜オを同じ数ずつ配り、同じ位置が3問続かないように並べる（解く人ごとに違う）
function positions(){
  if(st.pos&&st.pos.length===Q.length)return st.pos;
  const pool=Q.map((_,k)=>k%5);let a;
  for(let t=0;t<5000;t++){a=shuffle(pool.slice());if(a.every((v,k)=>k<2||!(v===a[k-1]&&v===a[k-2])))break}
  st.pos=a;save();return a}
// order：画面の上から順に、元の選択肢の番号（0 が正解）を並べたもの
function order(i){const id=Q[i].id;
  if(!st.ord[id]){const a=shuffle([1,2,3,4]);a.splice(positions()[i],0,0);st.ord[id]=a;save()}
  return st.ord[id]}
const answered=i=>st.ans[Q[i].id]!=null;
const correct=i=>st.ans[Q[i].id]===0;
const idxOf=f=>Q.map((q,i)=>i).filter(i=>f(Q[i]));
const doneCount=()=>Q.filter((q,i)=>answered(i)).length;

function chrome(){
  const cur=st.i>=0&&st.i<Q.length?Q[st.i].g:null;
  $('chips').innerHTML=Object.keys(CH).map(g=>{const a=idxOf(q=>q.g===g),n=a.filter(answered).length;
    return `<span class="chip ${cur===g?'now':n===a.length?'done':''}">${CHS[g]} ${n}/${a.length}</span>`}).join('');
  $('count').textContent=st.i>=0&&st.i<Q.length?`${st.i+1} / ${Q.length}`:'';
  $('ver').textContent='版 '+VER;
  $('bar').style.width=(doneCount()/Q.length*100)+'%';
}
function render(){
  stopTick();
  $('ver').textContent='版 '+VER;
  $('menuBtn').hidden=mode==='menu'||(mode==='test'&&ts.phase==='play'&&!ts.done);
  if(mode==='menu')return menu();
  if(mode==='test')return tRender();
  $('ttl').textContent=TITLE;
  chrome();
  if(st.i<0)return start();
  if(st.i>=Q.length)return result();
  question();
}
function question(){
  const i=st.i,q=Q[i],ord=order(i),pick=st.ans[q.id],done=pick!=null,ok=done&&pick===0;
  const long=q.o.some(o=>o.length>15);
  const cls=k=>!done?'':k===0?'right':k===pick?'wrong':'';
  $('card').innerHTML=`<div class="qwrap"><div class="main">
    <div class="sec"><span class="lbl">${KIND[q.t]}</span><span class="nm">${esc(CH[q.g])}</span><span class="lv" aria-label="むずかしさ ${q.d}">${'★'.repeat(q.d)+'☆'.repeat(3-q.d)}</span></div>
    <div class="q">${esc(q.q)}</div>
    <div class="opts ${long?'long':''}">${ord.map((k,pos)=>`<button class="opt ${cls(k)}" data-k="${k}" ${done?'disabled':''}><span class="mk">${LET[pos]}</span><span>${esc(q.o[k])}</span></button>`).join('')}</div>
    ${done?`<div class="fb ${ok?'ok':'ng'}"><strong>${ok?'正解です。':'正解は「'+LET[ord.indexOf(0)]+'」です。'}</strong>${esc(q.e)}</div>`:''}
    <div class="row"><button class="btn ghost left" id="toRes">結果を見る</button><button class="btn ghost" id="back" ${i===0?'disabled':''}>もどる</button>${done?`<button class="btn" id="next">${i===Q.length-1?'採点する':'次へ'}</button>`:''}</div>
   </div>
   <aside class="gloss" aria-label="用語"><h2>用語</h2>${done?`<dl><dt>${esc(q.w)}</dt><dd>${esc(GLOSS[q.w])}</dd></dl>`:'<p class="wait">答えると、この問題の用語の説明がここに出ます。</p>'}</aside></div>`;
  if(!done)document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{st.ans[q.id]=+b.dataset.k;save();render()});
  $('back').onclick=()=>{st.i--;save();render()};
  $('toRes').onclick=()=>{st.i=Q.length;save();render()};
  if($('next'))$('next').onclick=()=>{st.i++;save();render()};
}
function start(){
  $('card').innerHTML=`<div class="q">後期中間考査の出題範囲です。車の制御とセンサの用語を、5択で確かめます</div>
   <table class="plan">${Object.keys(CH).map(g=>`<tr><td>${esc(CH[g])}</td><td>${Q.filter(q=>q.g===g).length}問</td></tr>`).join('')}</table>
   <p style="margin:0">用語の意味、意味から用語、使いどころ、大事な場面を問います。答えるとすぐに正解と解説が出ます。途中でやめても、この端末に続きが残ります。</p>
   <div class="row"><button class="btn ghost" id="tomenu">メニューへ</button><button class="btn" id="go">はじめる</button></div>`;
  $('go').onclick=()=>{st.i=0;positions();save();render()};$('tomenu').onclick=()=>setMode('menu');
}
function result(){
  const all=idxOf(()=>true),n=doneCount(),sc=a=>a.filter(correct).length,total=sc(all);
  const miss=all.filter(i=>answered(i)&&!correct(i)),first=all.find(i=>!answered(i));
  $('card').innerHTML=`<div class="q">結果</div>
   <div><span class="res-total">${total}</span><span style="font-size:20px"> / ${Q.length} 問 正解</span>${n<Q.length?`<span class="hint">　（解いたのは ${n} 問）</span>`:''}</div>
   <div class="bars">${Object.keys(CH).map(g=>{const a=idxOf(q=>q.g===g),r=sc(a);
     return `<div class="bar"><span>${esc(CH[g])}</span><div class="track"><div class="fill" style="width:${r/a.length*100}%"></div></div><span class="num">${r}/${a.length}</span></div>`}).join('')}</div>
   <div class="parts">${Object.keys(KIND).map(t=>{const a=idxOf(q=>q.t===t);return `<span>${KIND[t]} <b>${sc(a)}</b> / ${a.length}</span>`}).join('')}</div>
   ${miss.length?`<div class="hint">まちがえた問題（番号を押すと見直せます）</div><div class="miss">${miss.map(i=>`<button data-i="${i}">${i+1}</button>`).join('')}</div>`:''}
   <div class="hint">いちばん短いバーの分野を見直しましょう。</div>
   <div class="row"><button class="btn ghost left" id="reset">最初からやり直す</button><button class="btn ghost" id="back">最後の問題にもどる</button>${first!=null?`<button class="btn" id="cont">続きをとく</button>`:''}</div>`;
  document.querySelectorAll('.miss button').forEach(b=>b.onclick=()=>{st.i=+b.dataset.i;save();render()});
  $('back').onclick=()=>{st.i=Q.length-1;save();render()};
  if($('cont'))$('cont').onclick=()=>{st.i=first;save();render()};
  // ブラウザの confirm は Classroom などで使えないので、2回押しで確かめる
  let armed=false;const rs=$('reset');
  rs.onclick=()=>{if(!armed){armed=true;rs.textContent='もう一度押すと記録を消します';return}
    st=blank();save();render()};
}
// ===== メニュー =====
let mode='menu';
try{const m=localStorage.getItem('seigyo100-mode');if(m==='drill'||m==='test')mode=m}catch(e){}
function setMode(m){mode=m;try{localStorage.setItem('seigyo100-mode',m)}catch(e){}render()}
$('menuBtn').onclick=()=>setMode('menu');
function menu(){
  $('ttl').textContent=TITLE;$('chips').innerHTML='';$('count').textContent='';$('bar').style.width='0';
  const tst=ts.done?`提出済み（${tScore()} / ${tMax()} 点）`:ts.stages?`とちゅう（STAGE ${ts.s+1} / ${ts.stages.length}）`:'まだ受けていません';
  $('card').innerHTML=`<div class="q">どちらをやりますか</div>
   <div class="menu">
    <button class="mbtn" id="mDrill"><span class="t">練習（${Q.length}問）</span><span class="d">5択。答えるとすぐに正解と解説が出ます。時間の制限はありません。</span><span class="s">進み具合 ${doneCount()} / ${Q.length} 問</span></button>
    <button class="mbtn game" id="mTest"><span class="t">小テスト（${TALL()}点満点）</span><span class="d">練習の問題から、語群で答えます。ステージごとに制限時間があります。全${TPLAN.length}ステージ、およそ30分。受けられるのは1回だけで、最後に提出します。</span><span class="s">${tst}</span></button>
   </div>`;
  $('mDrill').onclick=()=>setMode('drill');$('mTest').onclick=()=>setMode('test');
}

// ===== 小テスト（語群・ステージ制・制限時間つき） =====
// 分野A〜Eは「意味→用語」の8問ずつ（制限4分）、最後のボスは「場面・使いどころ」で答えが用語の問題から10問（制限5分）。
// 語群は、そのステージの正解に、同じ問題の誤りの選択肢から4語を足したもの。語群の言葉は1回ずつ使う。
// 時間は締め切りの時刻で持つので、開き直しても止まらない。時間切れになると、そこまでの答えで採点する。
const TPLAN=[...Object.keys(CH).map(g=>({g,sec:240})),{g:'X',sec:300,n:10}];
const DISTRACT=4;
const TALL=()=>TPLAN.reduce((s,p)=>s+(p.n||Q.filter(q=>q.g===p.g&&q.t==='r').length),0);
const QID=Object.fromEntries(Q.map(q=>[q.id,q]));
// 先生用デモ：URL の末尾に #demo をつけて開く。何度でも受け直せ、生徒の記録とは別の箱に保存する
const DEMO=/^#(demo|teacher|sensei)$/i.test(location.hash);
addEventListener('hashchange',()=>location.reload());
const TKEY=DEMO?'seigyo100-test-demo':'seigyo100-test-v2'; // 問題を入れかえたので v2
const tblank=()=>({no:'',stages:null,s:-1,phase:'intro',i:0,ans:{},dl:0,res:[],done:null});
let ts=tblank();
try{const s=JSON.parse(localStorage.getItem(TKEY)||'null');if(s)ts=Object.assign(ts,s)}catch(e){}
let sending=false; // 送信中の表示（保存しない）
function tSave(){try{localStorage.setItem(TKEY,JSON.stringify(ts))}catch(e){}}
const fixNo=v=>String(v).normalize('NFKC').replace(/\s/g,'');
function mkBank(qs){const ans=qs.map(q=>q.o[0]);
  const wrong=shuffle([...new Set(qs.flatMap(q=>q.o.slice(1)))].filter(w=>!ans.includes(w)));
  return shuffle(ans.concat(wrong.slice(0,DISTRACT)))}
function tMake(){
  return TPLAN.map(p=>{let qs;
    if(p.g!=='X')qs=shuffle(Q.filter(q=>q.g===p.g&&q.t==='r'));
    else{const seen=new Set();qs=[];
      for(const q of shuffle(Q.filter(q=>q.t!=='r'&&GLOSS[q.o[0]]))){if(qs.length>=p.n)break;if(seen.has(q.o[0]))continue;seen.add(q.o[0]);qs.push(q)}}
    return {g:p.g,name:p.g==='X'?'ボス：場面で使い分け':CH[p.g],sec:p.sec,qs:qs.map(q=>q.id),bank:mkBank(qs)}})}
const tAns=s=>ts.ans[s]||(ts.ans[s]={});
const tOK=(s,k)=>tAns(s)[k]===QID[ts.stages[s].qs[k]].o[0];
const tScore=()=>ts.res.reduce((a,r)=>a+(r?r.ok:0),0);
const tMax=()=>ts.stages?ts.stages.reduce((a,S)=>a+S.qs.length,0):TALL();
const starN=r=>!r?0:r.ok===r.n?3:r.ok/r.n>=.75?2:r.ok/r.n>=.5?1:0;
const starHTML=n=>'★'.repeat(n)+`<span class="off">${'★'.repeat(3-n)}</span>`;
const mmss=ms=>{const t=Math.max(0,Math.ceil(ms/1000));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
const stamp=()=>{const d=new Date();return `${d.getMonth()+1}月${d.getDate()}日 ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`};
let tick=null;
function stopTick(){if(tick){clearInterval(tick);tick=null}}
function onTick(){const left=ts.dl-Date.now();
  if(left<=0){tEnd(true);return}
  const S=ts.stages[ts.s];
  if($('tm'))$('tm').textContent=mmss(left);
  if($('tfill'))$('tfill').style.width=(left/(S.sec*1000)*100)+'%';
  if($('tbar'))$('tbar').classList.toggle('hot',left<=60000)}

function tChrome(){
  $('ttl').textContent=DEMO?'小テスト（先生用デモ）':'小テスト';
  $('chips').innerHTML=ts.stages?ts.stages.map((S,s)=>`<span class="chip ${s===ts.s&&!ts.done?'now':ts.res[s]?'done':''}">${S.g==='X'?'ボス':'S'+(s+1)} ${ts.res[s]?'★'.repeat(starN(ts.res[s]))||'×':''}</span>`).join(''):'';
  $('count').textContent=ts.no&&ts.stages?'出席番号 '+ts.no:'';
  $('bar').style.width=ts.stages?(ts.res.filter(Boolean).length/ts.stages.length*100)+'%':'0';
}
function tRender(){
  tChrome();
  if(ts.done)return tFinal();
  if(!ts.stages||ts.s<0)return tStart();
  if(sending)return tSending();
  if(ts.phase==='submit')return tSubmit();
  if(ts.phase==='play'){if(Date.now()>=ts.dl)return tEnd(true);return tPlay()}
  if(ts.phase==='result')return tStageRes();
  tIntro();
}
function mapHTML(){return `<div class="map">${ts.stages.map((S,s)=>`<div class="node ${s===ts.s?'now':''} ${S.g==='X'?'boss':''} ${starN(ts.res[s])?'clear':''}"><b>${S.g==='X'?'BOSS':'STAGE '+(s+1)}</b><span>${esc(S.name)}</span><span class="st">${ts.res[s]?starHTML(starN(ts.res[s]))+` <small>${ts.res[s].ok}/${ts.res[s].n}</small>`:'　'}</span></div>`).join('')}</div>`}
function demoBar(skip){
  if(!DEMO)return '';
  return `<div class="demo">先生用デモ：何度でも受け直せます。生徒の記録とは別に保存します。${skip?'<button id="dSkip">このステージをとばす</button>':''}<button id="dReset">最初からやり直す</button></div>`}
function demoBind(){
  if(!DEMO)return;
  const r=$('dReset');if(r)r.onclick=()=>{ts=Object.assign(tblank(),{no:ts.no});sending=false;tSave();render()};
  const k=$('dSkip');if(k)k.onclick=()=>{if(ts.phase!=='play'){ts.phase='play';ts.dl=Date.now()+ts.stages[ts.s].sec*1000;tAns(ts.s)}tEnd(false)};
}
function tStart(){
  $('card').innerHTML=demoBar()+`<div class="q">小テスト（${TALL()}点満点・語群）</div>
   <table class="plan">
    <tr><td>ステージ</td><td>${TPLAN.length-1}ステージ（分野ごと8問・制限4分）＋ ボス（場面の問題10問・制限5分）</td></tr>
    <tr><td>答え方</td><td>問題を読み、語群から言葉を選びます。語群の言葉は1回ずつ使います。使わない言葉もあります</td></tr>
    <tr><td>制限時間</td><td>時間になると、そこまでの答えで採点されます。ページを開き直しても時間は止まりません</td></tr>
    <tr><td>クリア</td><td>半分以上正解でクリア。正解の数で ★ が1〜3個つきます</td></tr>
    <tr><td>提出</td><td>${TALL()}問、1問1点。最後に「提出する」を押します。<b>受けられるのは1回だけです</b></td></tr></table>
   <div class="nobox"><label for="no">出席番号（4けた）</label><br><input id="no" inputmode="numeric" maxlength="4" autocomplete="off" value="${esc(ts.no)}" placeholder="0000"></div>
   <div class="warn" id="nomsg"></div>
   <div class="row"><button class="btn ghost" id="tomenu">メニューへ</button><button class="btn" id="go">はじめる</button></div>`;
  const no=$('no');
  const go=()=>{const v=fixNo(no.value);
    if(!/^\d{4}$/.test(v)){$('nomsg').textContent='出席番号は4けたの数字で入れます（例 2105）。';no.focus();return}
    ts.no=v;ts.stages=tMake();ts.s=0;ts.phase='intro';ts.ans={};ts.res=[];tSave();render()};
  $('go').onclick=go;no.onkeydown=e=>{if(e.key==='Enter')go()};demoBind();
  $('tomenu').onclick=()=>setMode('menu');
}
function tIntro(){
  const S=ts.stages[ts.s],boss=S.g==='X';
  $('card').innerHTML=demoBar(true)+mapHTML()+`<div class="big pop">${boss?'BOSS STAGE':'STAGE '+(ts.s+1)}</div>
   <div class="q">${esc(S.name)}</div>
   <table class="plan"><tr><td>問題</td><td>${S.qs.length}問（${boss?'場面や使いどころから、ふさわしい言葉を選ぶ':'説明を読んで、その用語を選ぶ'}）</td></tr>
   <tr><td>語群</td><td>${S.bank.length}語（使わない言葉が${S.bank.length-S.qs.length}つあります）</td></tr>
   <tr><td>制限時間</td><td><b>${S.sec/60}分</b>　「スタート」を押すと時間が動きます</td></tr></table>
   <div class="row"><button class="btn" id="play">スタート</button></div>`;
  $('play').onclick=()=>{ts.phase='play';ts.i=0;ts.dl=Date.now()+S.sec*1000;tAns(ts.s);tSave();render()};demoBind();
}
let finArmed=false;
function tPlay(){
  const s=ts.s,S=ts.stages[s],k=ts.i,q=QID[S.qs[k]],A=tAns(s),n=S.qs.length;
  const left=S.qs.map((_,j)=>j).filter(j=>A[j]==null);
  const owner=w=>{for(const j in A)if(A[j]===w)return +j;return -1};
  $('card').innerHTML=demoBar(true)+`<div class="tbar" id="tbar"><span class="tm" id="tm">${mmss(ts.dl-Date.now())}</span><div class="ttrack"><div id="tfill"></div></div></div>
   <div class="dots">${S.qs.map((_,j)=>`<button data-j="${j}" class="${A[j]!=null?'fill':''} ${j===k?'now':''}" aria-label="第${j+1}問">${j+1}</button>`).join('')}</div>
   <div class="sec"><span class="lbl">第${k+1}問 / ${n}</span><span class="nm">${S.g==='X'?'BOSS':'STAGE '+(s+1)}　${esc(S.name)}</span></div>
   <div class="q">${esc(q.q)}</div>
   <div class="hint">語群から選びなさい。語群の言葉は1回ずつ使います。選び直すときは、別の言葉を押します。</div>
   <div class="bank">${S.bank.map(w=>{const o=owner(w);return `<button class="opt ${o===k?'pick':o>=0?'used':''}" data-w="${esc(w)}">${o>=0&&o!==k?`<span class="no">第${o+1}問</span>`:''}${esc(w)}</button>`}).join('')}</div>
   <div class="row"><button class="btn ghost" id="back" ${k===0?'disabled':''}>もどる</button><button class="btn ghost" id="next" ${k===n-1?'disabled':''}>次へ</button><button class="btn ${left.length?'ghost':''}" id="fin">${finArmed?`まだ${left.length}問あります。もう一度押すと採点します`:left.length?'このステージを終える':'採点する'}</button></div>`;
  onTick();if(ts.phase!=='play')return;
  tick=setInterval(onTick,250);
  document.querySelectorAll('.bank .opt').forEach(b=>b.onclick=()=>{const w=b.dataset.w;
    if(A[k]===w)delete A[k];else{const o=owner(w);if(o>=0)delete A[o];A[k]=w;
      const nx=S.qs.map((_,j)=>(k+1+j)%n).find(j=>A[j]==null);if(nx!=null)ts.i=nx}
    finArmed=false;tSave();render()});
  document.querySelectorAll('.dots button').forEach(b=>b.onclick=()=>{ts.i=+b.dataset.j;finArmed=false;tSave();render()});
  $('back').onclick=()=>{ts.i--;finArmed=false;tSave();render()};
  $('next').onclick=()=>{ts.i++;finArmed=false;tSave();render()};
  $('fin').onclick=()=>{if(left.length&&!finArmed){finArmed=true;render();return}finArmed=false;tEnd(false)};
  demoBind();
}
function tEnd(timeup){
  stopTick();
  const s=ts.s,S=ts.stages[s];
  const ok=S.qs.filter((_,k)=>tOK(s,k)).length;
  ts.res[s]={ok,n:S.qs.length,timeup,left:timeup?0:Math.max(0,Math.ceil((ts.dl-Date.now())/1000))};
  ts.phase='result';tSave();render();
}
function tStageRes(){
  const s=ts.s,S=ts.stages[s],r=ts.res[s],A=tAns(s),sn=starN(r),last=s===ts.stages.length-1;
  const head=r.ok===r.n?'PERFECT!':sn?(S.g==='X'?'BOSS CLEAR!':'STAGE CLEAR!'):'もう一歩…';
  $('card').innerHTML=demoBar()+`${r.timeup?'<div class="warn">TIME UP！　時間切れになったので、そこまでの答えで採点しました。</div>':''}
   <div class="big pop ${sn?'ok':'ng'}">${head}</div>
   <div class="stars pop">${starHTML(sn)}</div>
   <div><span class="res-total">${r.ok}</span><span style="font-size:20px"> / ${r.n} 問 正解</span>${r.timeup?'':`<span class="hint">　残り時間 ${mmss(r.left*1000)}</span>`}　<span class="hint">ここまで ${tScore()} 点</span></div>
   <div class="row" style="position:static"><button class="btn" id="nextS">${last?'提出へ':'次のステージへ'}</button></div>
   <div class="hint">答え合わせ</div>
   ${S.qs.map((id,k)=>{const q=QID[id],c=tOK(s,k);return `<div class="rv"><div class="h"><span class="mark ${c?'o':'x'}">${c?'○':'×'}</span><span>${esc(q.q)}</span></div>
     <div>あなたの答え：${A[k]==null?'未回答':esc(A[k])}　／　正解：<b>${esc(q.o[0])}</b></div></div>`}).join('')}`;
  $('nextS').onclick=()=>{if(last)ts.phase='submit';else{ts.s++;ts.phase='intro'}tSave();render()};demoBind();
}
function tSubmit(){
  $('card').innerHTML=demoBar()+mapHTML()+`<div class="q">全ステージが終わりました。提出します</div>
   <table class="plan"><tr><td>出席番号</td><td style="font-size:22px;font-weight:700;letter-spacing:.1em">${esc(ts.no)}</td></tr>
   <tr><td>点数</td><td>${tScore()} / ${tMax()} 点</td></tr></table>
   <div class="hint">提出すると、受け直すことはできません。</div>
   <div class="row"><button class="btn" id="send">提出する</button></div>`;
  // ダミーの提出：どこにも送らず、送信しているような表示のあと「提出しました」にする
  demoBind();
  $('send').onclick=()=>{sending=true;render();
    setTimeout(()=>{sending=false;ts.done=stamp();tSave();render()},1500)};
}
function tSending(){$('card').innerHTML=`<div class="q">送信しています…</div><div class="prog"><div style="width:70%"></div></div><div class="hint">画面を閉じずに待ちます。</div>`}
function tFinal(){
  const sc=tScore(),mx=tMax(),stars=ts.res.reduce((a,r)=>a+starN(r),0);
  $('card').innerHTML=demoBar()+`<div class="cert">
    <div class="big ok pop">提出しました</div>
    <div class="who">出席番号 <b>${esc(ts.no)}</b>　　受付 ${esc(ts.done)}</div>
    <div><span class="score pop">${sc}</span><span style="font-size:24px;font-weight:700"> / ${mx} 点</span>　<span class="hint">★ ${stars} / ${ts.stages.length*3}</span></div>
    <div class="bars">${ts.stages.map((S,s)=>{const r=ts.res[s];return `<div class="bar"><span>${S.g==='X'?'ボス':'S'+(s+1)+' '+esc(S.name)}</span><div class="track"><div class="fill" style="width:${r.ok/r.n*100}%"></div></div><span class="num">${r.ok}/${r.n}${r.timeup?' ⏱':''}</span></div>`}).join('')}</div>
    ${ts.res.some(r=>r.timeup)?'<div class="hint">⏱ は時間切れのステージです。</div>':''}
   </div>
   <div class="row"><button class="btn" id="tomenu">メニューへ</button></div>`;
  $('tomenu').onclick=()=>setMode('menu');demoBind();
}
render();
</script>

</body>
</html>
