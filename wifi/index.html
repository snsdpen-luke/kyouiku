<style>

.slide.cover{background:var(--navy);color:#f6f7f4;border:none;justify-content:center;align-items:flex-start;padding:40px 56px;gap:18px}.cover .kicker{color:#8fb8e8;letter-spacing:.2em;font-size:.85rem}.cover h2{font-size:2.6rem;color:#fff}.cover p{margin:0;font-size:1.05rem;color:#bfd8d5;max-width:36em}.cover input{font-size:1.1rem;padding:10px 14px;width:16em}.cover .btn{font-size:1.1rem;padding:12px 28px}

.gloss.open{display:flex}.gloss h3{margin:0;font-size:.85rem;color:var(--mute);letter-spacing:.08em;display:flex;justify-content:space-between;align-items:center}.gloss .g b{display:block;font-size:.95rem}.gloss .g small{color:var(--mute);font-size:.85rem;line-height:1.5}
.halves{display:flex;flex-direction:column;gap:4px}.halves .hb2{display:flex;align-items:center;gap:8px;font-size:.85rem}.halves i{display:block;height:14px;background:var(--accent);border-radius:3px}
.simwrap{display:flex;flex-direction:column;gap:6px}

.floor{display:flex;flex-direction:column;gap:3px;min-width:0;align-items:center}.floor canvas{max-height:172px;width:auto}.floor .t{font-size:.9rem;font-weight:700;align-self:flex-start}
.scale{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--mute);flex-wrap:wrap}.scale .bar{flex:1;min-width:120px;max-width:320px;height:12px;border-radius:6px;background:linear-gradient(90deg,#d9dee3 0%,#8fb8e8 8%,#2f6fb8 35%,#f2c14e 65%,#e0392b 100%)}

.missions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mission{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:.82rem;display:flex;flex-direction:column;gap:2px}.mission.done{border-color:var(--good);background:#eaf5ee}.mission .v{font-size:.82rem;color:var(--mute)}.mission.done .v{color:var(--good)}
.fb{min-height:1.4em;font-size:.92rem}.fb.ok{color:var(--good);font-weight:600}.fb.ng{color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.lvbar{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;background:var(--soft);border-radius:8px;padding:8px 12px}.lvtitle{font-weight:700;font-size:1rem}.lvgoal{font-size:.9rem;flex:1;min-width:200px}.lvprog{display:flex;align-items:center;gap:8px;font-size:.85rem}.pbar{width:140px;height:10px;border-radius:5px;background:#fff;border:1px solid var(--line);overflow:hidden}.pbar i{display:block;height:100%;background:var(--good);width:0;transition:width .2s}
.room{grid-template-columns:auto auto 1fr 5.5em}.room .who{font-size:.78rem;color:var(--mute);white-space:nowrap}
.room .m{min-width:40px}.room.ok{border-color:var(--good)}.room.ng{border-color:var(--line);opacity:.75}
.stsel{display:flex;gap:6px;flex-wrap:wrap}.st{display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 12px;font-weight:700;line-height:1.1}.st small{font-weight:400;font-size:.65rem;color:var(--mute)}.st.done{border-color:var(--good);color:var(--good)}
.clearbox{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:#eaf5ee;border:1px solid var(--good);border-radius:10px;padding:10px 14px}.termcard{flex:1;min-width:220px;display:flex;flex-direction:column;gap:2px;background:#fff;border-radius:8px;padding:8px 12px;font-size:.9rem}.termcard .k{font-size:.75rem;color:var(--accent)}.termcard b{font-size:1rem}
@media (max-width:700px){.floors{grid-template-columns:1fr}.rooms{grid-template-columns:1fr}.missions{grid-template-columns:1fr}.two{grid-template-columns:1fr}}

<body>


<div class="app">
<header><h1>電波はどこまで届くか <span id="hname"></span></h1><div class="hb"><div class="tabs" id="tabs"></div><div class="dots" id="dots"></div><button id="gbtn">用語</button></div></header>
<div class="stage"><section class="slide" id="slide"></section><aside class="gloss" id="gloss"></aside></div>
<div class="nav"><button id="prev">← 前</button><span class="hint">← → キーでも進めます</span><button id="next" class="pri">次 →</button></div>
</div>

<script>
const fmt=n=>n.toLocaleString('ja-JP',{maximumFractionDigits:1});
const G={
 wave:['電波','空間を伝わる電気の波。Wi-Fi・スマホ・テレビ・ラジオはすべて電波で通信しています'],
 freq:['周波数（Hz）','1秒に波が何回ふれるか。Wi-Fi の 2.4GHz は1秒に24億回です'],
 lambda:['波長','波1つぶんの長さ。周波数が高いほど短くなります'],
 half:['半分が何回','ルーターのそばの強さを100として、離れる・壁を通るたびに 100→50→25→12.5… と半分になる、その回数。壁1枚で1〜4回、床で6回以上。10回で約1/1000（電気の言葉では −30dB）'],
 dbm:['dBm','スマホが受け取っている電波の強さ。−30 がとても強く、−90 でほぼ圏外です'],
 atten:['減衰','電波が進むうちに弱くなること。距離・壁・床・水などで減ります'],
 band:['2.4GHz帯 / 5GHz帯','Wi-Fi が使う2つの周波数のグループ。2.4 は太鼓（遠くまで届く・遅い）、5 は笛（速い・壁に弱い）'],
 router:['Wi-Fiルーター','家の機器をまとめてインターネットにつなぐ機械。電波を出す本体です'],
 repeater:['中継器（メッシュ）','ルーターの電波を受け取って、別の場所から出し直す機械'],
 interf:['干渉','同じ周波数の電波がぶつかって、通信が乱れること'],
 micro:['電子レンジ','2.45GHz の電波で水を温める機械。Wi-Fi の 2.4GHz帯と同じ周波数です'],
 rssi:['電波強度','受け取っている電波の強さ。スマホの扇マークの本数がこれです'],
 mbps:['Mbps','通信の速さ。動画（1080p）には約 8Mbps 必要です'],
};
const WALL={wood:{n:'木・石膏',l:[4,6],c:'#8a7a5a',w:3},ext:{n:'外壁',l:[8,12],c:'#3b3b3b',w:5},conc:{n:'コンクリート',l:[12,18],c:'#555',w:6},glass:{n:'窓ガラス',l:[2,3],c:'#6fb4d6',w:3},tile:{n:'タイル（風呂）',l:[6,9],c:'#5b8a9a',w:4}};
const FLOORLOSS={wood:[12,16],rc:[20,26]};
const WALLS=[
 [0,0,0,12,0,'ext'],[0,0,8,12,8,'ext'],[0,0,0,0,8,'ext'],[0,12,0,12,8,'ext'],[0,4,0,7,0,'glass'],[0,9.5,8,11.5,8,'glass'],
 [0,3,0,3,2,'wood'],[0,3,3,3,5,'wood'],[0,9,0,9,4,'wood'],[0,0,5,2,5,'wood'],[0,3,5,8,5,'wood'],[0,9,5,12,5,'wood'],[0,5,5,5,8,'wood'],[0,9,5,9,8,'tile'],[0,9,5,12,5,'tile'],
 [1,0,0,12,0,'ext'],[1,0,8,12,8,'ext'],[1,0,0,0,8,'ext'],[1,12,0,12,8,'ext'],[1,1.5,0,4.5,0,'glass'],[1,7.5,0,10.5,0,'glass'],[1,1.5,8,4.5,8,'glass'],[1,7.5,8,10.5,8,'glass'],
 [1,6,0,6,4,'wood'],[1,6,5.5,6,8,'wood'],[1,0,4,2,4,'wood'],[1,3,4,9,4,'wood'],[1,10,4,12,4,'wood'],[1,0,5.5,2,5.5,'wood'],[1,3,5.5,9,5.5,'wood'],[1,10,5.5,12,5.5,'wood'],
];
const ROOMS=[
 {f:0,n:'玄関',x:1.5,y:2.5},{f:0,n:'リビング',x:6,y:2.5},{f:0,n:'キッチン',x:10.5,y:2.5},{f:0,n:'和室',x:2.5,y:6.5},{f:0,n:'洗面',x:7,y:6.5},{f:0,n:'風呂',x:10.5,y:6.5},
 {f:1,n:'寝室',x:3,y:2},{f:1,n:'子ども部屋A',x:9,y:2},{f:1,n:'廊下',x:6,y:4.75},{f:1,n:'子ども部屋B',x:3,y:6.8},{f:1,n:'書斎',x:9,y:6.8},
];
const MICRO={f:0,x:11.2,y:0.8};
const ST={router:{f:0,x:1.2,y:1.2},reps:[],maxRep:1,band:1,house:'wood',inner:'wood',micro:false,mode:'router'};
const P={name:'',stages:[],terms:[],quiz:null,seen:[]}; try{Object.assign(P,JSON.parse(localStorage.getItem('wifi-house-p')||'{}'));}catch(e){}
function saveP(){ try{localStorage.setItem('wifi-house-p',JSON.stringify(P));}catch(e){} }
function segX(ax,ay,bx,by,cx,cy,dx,dy){ const d=(bx-ax)*(dy-cy)-(by-ay)*(dx-cx); if(Math.abs(d)<1e-9)return false; const t=((cx-ax)*(dy-cy)-(cy-ay)*(dx-cx))/d, u=((cx-ax)*(by-ay)-(cy-ay)*(bx-ax))/d; return t>0&&t<1&&u>0&&u<1; }
function rssiFrom(src,ptx,f,x,y){ const b=ST.band; const dx=x-src.x, dy=y-src.y, dz=(f-src.f)*3; const d=Math.max(0.5,Math.hypot(dx,dy,dz)); let p=ptx-10*2.8*Math.log10(d)-(b?8:0); for(const w of WALLS){ if(w[0]!==src.f&&w[0]!==f)continue; if(segX(src.x,src.y,x,y,w[1],w[2],w[3],w[4])) p-=WALL[w[5]==='wood'?ST.inner:w[5]].l[b]*(src.f===f?1:0.7); } if(f!==src.f) p-=FLOORLOSS[ST.house][b]*Math.abs(f-src.f); if(ST.micro&&!b&&f===MICRO.f){ const dm=Math.hypot(x-MICRO.x,y-MICRO.y); if(dm<3.5) p-=50; else if(dm<5) p-=50*(5-dm)/1.5; } return p; }
function repOk(r){ return rssiFrom(ST.router,-30,r.f,r.x,r.y)>=-78; }
function rssiAt(f,x,y){ let p=rssiFrom(ST.router,-30,f,x,y); for(const r of ST.reps){ if(repOk(r)) p=Math.max(p,rssiFrom(r,-33,f,x,y)); } return p; }
function mbps(r){ const b=ST.band; const T=b?[[-50,500],[-60,300],[-67,150],[-75,40],[-82,8],[-90,1],[-100,0]]:[[-50,150],[-60,100],[-67,50],[-75,20],[-82,5],[-90,1],[-100,0]]; if(r>=T[0][0])return T[0][1]; for(let i=0;i<T.length-1;i++){ if(r<=T[i][0]&&r>=T[i+1][0]){ const t=(r-T[i+1][0])/(T[i][0]-T[i+1][0]); return T[i+1][1]+t*(T[i][1]-T[i+1][1]); } } return 0; }
// 色：サーモグラフィと同じ。弱い＝青、強い＝赤。圏外＝灰色
const STOPS=[[0,[217,222,227]],[0.08,[143,184,232]],[0.35,[47,111,184]],[0.65,[242,193,78]],[1,[224,57,43]]];
function color(r){ const t=Math.max(0,Math.min(1,(r+92)/55)); let a=STOPS[0],b=STOPS[STOPS.length-1]; for(let i=0;i<STOPS.length-1;i++){ if(t>=STOPS[i][0]&&t<=STOPS[i+1][0]){a=STOPS[i];b=STOPS[i+1];break;} } const u=(t-a[0])/((b[0]-a[0])||1); const c=a[1].map((v,i)=>Math.round(v+(b[1][i]-v)*u)); return `rgb(${c[0]},${c[1]},${c[2]})`; }
function bars(r){ return r>=-60?'▂▄▆█':r>=-70?'▂▄▆':r>=-80?'▂▄':r>=-88?'▂':'—'; }
const PX=30;
function drawFloor(cv,f){ const g=cv.getContext('2d'); if(!g)return; const W=12,H=8; cv.width=W*PX; cv.height=H*PX; const res=0.5;
  for(let y=0;y<H;y+=res)for(let x=0;x<W;x+=res){ g.fillStyle=color(rssiAt(f,x+res/2,y+res/2)); g.fillRect(x*PX,y*PX,res*PX+0.5,res*PX+0.5); }
  for(const w of WALLS){ if(w[0]!==f)continue; const m=WALL[w[5]==='wood'?ST.inner:w[5]]; g.strokeStyle=m.c; g.lineWidth=m.w; g.beginPath(); g.moveTo(w[1]*PX,w[2]*PX); g.lineTo(w[3]*PX,w[4]*PX); g.stroke(); }
  g.textAlign='center'; for(const r of ROOMS){ if(r.f!==f)continue; const v=rssiAt(f,r.x,r.y); g.fillStyle='rgba(255,255,255,.82)'; g.fillRect(r.x*PX-30,r.y*PX-19,60,30); g.fillStyle='#1f2a2e'; g.font='11px "Noto Sans JP",sans-serif'; g.fillText(r.n,r.x*PX,r.y*PX-6); g.font='bold 11px "IBM Plex Mono",monospace'; g.fillText(bars(v)+' '+Math.round(v),r.x*PX,r.y*PX+7); }
  if(MICRO.f===f){ g.fillStyle=ST.micro?'#c7641b':'#999'; g.fillRect(MICRO.x*PX-11,MICRO.y*PX-7,22,14); g.fillStyle='#fff'; g.font='9px sans-serif'; g.fillText('レンジ',MICRO.x*PX,MICRO.y*PX+3); }
  const icon=(p,label,col)=>{ if(!p||p.f!==f)return; g.beginPath(); g.arc(p.x*PX,p.y*PX,10,0,Math.PI*2); g.fillStyle=col; g.fill(); g.strokeStyle='#fff'; g.lineWidth=2; g.stroke(); g.fillStyle='#fff'; g.font='bold 10px sans-serif'; g.fillText(label,p.x*PX,p.y*PX+4); };
  icon(ST.router,'R','#1f2a2e'); ST.reps.forEach(r=>icon(r,'中',repOk(r)?'#1f6fb2':'#b63a3a')); }
function roomStats(){ return ROOMS.filter(r=>r.n!=='廊下').map(r=>{const v=rssiAt(r.f,r.x,r.y); return {n:r.n,f:r.f,r:v,m:mbps(v)};}); }
const halves=(n,label)=>`<div class="halves">${Array.from({length:n+1},(_,k)=>`<div class="hb2"><i style="width:${Math.max(4,200/Math.pow(2,k))}px"></i><span>${k===0?'最初':'半分 '+k+'回目'}${k===n?'　← '+label:''}</span></div>`).join('')}</div>`;

const S=[
{ ch:"", cover:true, title:"電波はどこまで届くか", terms:[],
  sim:()=>`<div class="kicker">コンピュータシステム技術　ネットワーク③</div><h2>電波はどこまで届くか</h2><p>同じ家なのに、部屋によって Wi-Fi の速さが違うのはなぜでしょうか。家の間取りの上でルーターを動かしながら、電波のしくみを自分の手で確かめます。</p><div class="row"><input type="text" id="pname" placeholder="名前（例：2-6 ○○）" value="${P.name}"><button class="pri btn" id="start">はじめる →</button></div><div class="hint" style="color:#8fb8e8">導入 → しくみ → ゲーム → たしかめ（小テスト） → まとめ　の順に進みます。右上の「用語」でいつでも用語の説明が見られます。</div>`,
  wire:()=>{ const go=()=>{P.name=document.getElementById('pname').value.trim();saveP();document.getElementById('hname').textContent=P.name;i=1;render();}; document.getElementById('start').addEventListener('click',go); document.getElementById('pname').addEventListener('keydown',e=>{if(e.key==='Enter')go();}); },
  naru:"", memo:"表紙。名前を入れさせる。名前は小テストと修了画面に出る。" },

{ ch:"導入", eyebrow:"導入", title:"同じ家、同じ Wi-Fi なのに、部屋で速さが違います", terms:["router","rssi","mbps"],
  sim:()=>`<div class="two"><svg viewBox="0 0 520 300" style="width:100%;max-width:520px;height:auto" aria-label="家の断面図"><rect x="20" y="150" width="480" height="130" fill="#fbf7ee" stroke="#8a7a5a" stroke-width="3"/><rect x="20" y="40" width="480" height="110" fill="#fbf7ee" stroke="#8a7a5a" stroke-width="3"/><polygon points="10,40 260,5 510,40" fill="#6b5b45"/><line x1="340" y1="150" x2="340" y2="280" stroke="#8a7a5a" stroke-width="3"/><line x1="200" y1="40" x2="200" y2="150" stroke="#8a7a5a" stroke-width="3"/><rect x="345" y="155" width="150" height="120" fill="#dbeaf0"/><text x="420" y="270" font-size="13" text-anchor="middle" fill="#64737a">風呂（タイル）</text><text x="110" y="270" font-size="13" text-anchor="middle" fill="#64737a">リビング</text><text x="350" y="140" font-size="13" text-anchor="middle" fill="#64737a">2階 自分の部屋</text><circle cx="90" cy="230" r="10" fill="#1f2a2e"/><text x="90" y="234" font-size="10" fill="#fff" text-anchor="middle" font-weight="700">R</text><g stroke="#e0392b" fill="none" stroke-width="2" opacity=".7"><circle cx="90" cy="230" r="25"/><circle cx="90" cy="230" r="45"/><circle cx="90" cy="230" r="65"/></g><g stroke="#f2c14e" fill="none" stroke-width="2" opacity=".6"><circle cx="90" cy="230" r="90"/><circle cx="90" cy="230" r="115"/></g><g stroke="#2f6fb8" fill="none" stroke-width="2" opacity=".45"><circle cx="90" cy="230" r="145"/><circle cx="90" cy="230" r="180"/></g><g font-family="monospace" font-size="12" font-weight="700"><rect x="150" y="195" width="60" height="40" rx="6" fill="#fff" stroke="#e0392b" stroke-width="2"/><text x="180" y="212" text-anchor="middle" fill="#1f2a2e">▂▄▆█</text><text x="180" y="228" text-anchor="middle" fill="#e0392b">320M</text><rect x="320" y="80" width="60" height="40" rx="6" fill="#fff" stroke="#2f6fb8" stroke-width="2"/><text x="350" y="97" text-anchor="middle" fill="#1f2a2e">▂▄</text><text x="350" y="113" text-anchor="middle" fill="#2f6fb8">18M</text><rect x="410" y="195" width="60" height="40" rx="6" fill="#fff" stroke="#8fb8e8" stroke-width="2"/><text x="440" y="212" text-anchor="middle" fill="#1f2a2e">▂</text><text x="440" y="228" text-anchor="middle" fill="#2f6fb8">2M</text></g></svg><div class="col"><div class="tile"><div class="k">リビング（ルーターのそば）</div><div class="big">320 Mbps</div><div class="k">4K もさくさく</div></div><div class="tile"><div class="k">2階の自分の部屋</div><div class="big">18 Mbps</div><div class="k">動画がときどき止まる</div></div><div class="tile"><div class="k">風呂</div><div class="big">2 Mbps</div><div class="k">読み込み中のまま</div></div></div></div><div class="row"><span class="hint">何が電波を弱くしていると思いますか（いくつでも）：</span><span class="chips" id="q1">${["距離","壁","床（階が違う）","電子レンジ","水（風呂）","家族が使っている"].map(x=>`<span class="chip">${x}</span>`).join('')}</span></div>`,
  wire:()=>{ document.querySelectorAll('#q1 .chip').forEach(c=>c.addEventListener('click',()=>c.classList.toggle('on'))); },
  naru:"ルーターは1台、契約も1つ。速さを決めているのは<b>電波がどれだけ届いているか</b>です。今日の答えは「全部」ですが、効き方が違います。それを間取りの上で確かめます。",
  memo:"「自分の家もこうなる？」と聞いて、2階や風呂で遅い経験を言わせる。選んだ原因は板書しておき、最後のまとめで戻る。" },

{ ch:"導入", eyebrow:"導入", title:"電子レンジを使うと、動画が止まることがあります", terms:["micro","interf","freq"],
  sim:()=>`<div class="row"><button class="pri" id="mw">レンジを動かす</button><span class="hint" id="mwh">キッチンのレンジと、リビングのルーター。どちらも 2.4GHz の波を出しています</span></div><canvas id="mwc" width="760" height="260"></canvas>`,
  wire:()=>{ const cv=document.getElementById('mwc'),g=cv.getContext('2d'); if(!g)return; let on=false,t=0; const btn=document.getElementById('mw'); btn.addEventListener('click',()=>{on=!on;btn.textContent=on?'レンジを止める':'レンジを動かす';btn.classList.toggle('pri',!on);document.getElementById('mwh').textContent=on?'同じ高さの波がぶつかって、スマホの波が乱れます':'キッチンのレンジと、リビングのルーター。どちらも 2.4GHz の波を出しています';});
    const draw=()=>{ t+=1; g.clearRect(0,0,760,260); g.fillStyle='#fbf7ee'; g.fillRect(0,0,760,260); g.strokeStyle='#8a7a5a'; g.lineWidth=3; g.strokeRect(1,1,758,258); g.beginPath(); g.moveTo(380,0); g.lineTo(380,260); g.stroke(); g.fillStyle='#64737a'; g.font='13px sans-serif'; g.textAlign='center'; g.fillText('リビング',190,22); g.fillText('キッチン',570,22);
      // router
      g.fillStyle='#1f2a2e'; g.fillRect(60,200,50,22); g.fillStyle='#fff'; g.font='bold 11px sans-serif'; g.fillText('ルーター',85,215);
      // microwave
      g.fillStyle=on?'#c7641b':'#9a9a9a'; g.fillRect(650,185,70,45); g.fillStyle='#fff'; g.fillText('レンジ',685,211); if(on){ g.fillStyle='#ffe08a'; g.fillRect(658,192,40,30); }
      // ripples
      const rip=(x,y,col,phase,maxR,alpha)=>{ for(let k=0;k<6;k++){ const r=((t*2+phase+k*40)%(maxR)); g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.strokeStyle=col; g.globalAlpha=alpha*(1-r/maxR); g.lineWidth=2; g.stroke(); } g.globalAlpha=1; };
      rip(85,211,'#2f6fb8',0,420,.9); if(on) rip(685,211,'#e0392b',20,380,.9);
      // phone
      const px=380,py=120; g.fillStyle='#1f2a2e'; g.fillRect(px-22,py-40,44,80); g.fillStyle='#fff'; g.fillRect(px-18,py-34,36,62);
      if(on){ const a=t/6; g.strokeStyle='#64737a'; g.lineWidth=3; g.beginPath(); g.arc(px,py,10,a,a+4.5); g.stroke(); g.fillStyle='#b63a3a'; g.font='bold 11px sans-serif'; g.fillText('読み込み中',px,py+58); const n=Math.floor(t/8)%2; g.fillStyle='#e0392b'; g.font='12px sans-serif'; g.fillText(n?'波がぶつかる':'乱れる',px,py-50); }
      else { g.fillStyle='#2f8f5b'; g.beginPath(); g.moveTo(px-6,py-8); g.lineTo(px+8,py); g.lineTo(px-6,py+8); g.closePath(); g.fill(); g.fillStyle='#2f8f5b'; g.font='bold 11px sans-serif'; g.fillText('再生中',px,py+58); }
      ANIM=requestAnimationFrame(draw); }; draw(); },
  naru:"レンジは電波を外に漏らさない作りですが、少しだけ漏れます。Wi-Fi と<b>同じ高さの波</b>なので、ぶつかって乱れます。これを<b>干渉</b>といいます。隣で同じ高さの声で話されると聞き取れないのと同じです。",
  memo:"なぜ 2.4GHz が水を温める波で、かつ Wi-Fi に使われるか：水に吸われやすい周波数で、免許なしで使える帯だから。人間は水でできているので満員電車で落ちる、につなげる。" },

{ ch:"しくみ", eyebrow:"説明①", title:"低い音は壁をすり抜け、高い音は壁で止まります。電波も同じです", terms:["wave","freq","lambda","band"],
  sim:()=>`<div class="row"><button class="pri" id="snd">鳴らす</button><span class="chips" id="mode"><span class="chip on" data-m="0">音で見る</span><span class="chip" data-m="1">電波で見る</span></span><span class="hint" id="sndh">隣の部屋から聞こえるのは、どちらでしょうか</span><button id="why">なぜ？</button></div><canvas id="wave" width="760" height="300"></canvas><div id="whybox" style="display:none" class="col"><div class="two"><div class="col"><b>理由1　長い波は、物を回り込む</b><span style="font-size:.92rem">波は、自分の波1つの長さと同じくらいの隙間や角に当たると、その先で<b>扇のように広がります</b>。太鼓の波（12cm）はドアの隙間や家具を回り込みますが、笛の波（1cm〜6cm）はまっすぐ抜けて、<b>影</b>ができます。防波堤の裏でも大きなうねりは揺れるのと同じです。</span></div><div class="col"><b>理由2　短い波ほど、壁の中で熱になりやすい</b><span style="font-size:.92rem">電波が壁を通るとき、壁の中の小さな粒を揺さぶります。1秒に揺さぶる回数が多い（高い）ほど、同じ厚さを通る間に力を奪われて熱になります。だから同じ壁でも笛のほうが減ります。電子レンジが水を温めるのも、この力です。</span></div></div><canvas id="dif" width="760" height="230"></canvas><div class="hint">ドアの隙間を通ったあと。左：太鼓の波は広がって隅まで届く　右：笛の波はまっすぐ抜けて、隅に影ができる</div></div>`,
  wire:()=>{ const cv=document.getElementById('wave'),g=cv.getContext('2d'); if(!g)return; let t=0,playing=false,mode=0;
    const ROWS=[{y:80,k:2,loss:0.25,icon:'🥁',a:'太鼓（低い音）',b:'2.4GHz（波が長い）',ok:'ドンドン…聞こえる',okb:'届く',col:'#1f6fb2',len:'波1つ 約12cm'},{y:215,k:9,loss:0.85,icon:'🎵',a:'笛（高い音）',b:'5GHz（波が短い）',ok:'…ほとんど聞こえない',okb:'ほぼ届かない',col:'#c7641b',len:'波1つ 約6cm'}];
    document.getElementById('snd').addEventListener('click',()=>{playing=true;t=0;});
    document.querySelectorAll('#mode .chip').forEach(c=>c.addEventListener('click',()=>{document.querySelectorAll('#mode .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');mode=+c.dataset.m;document.getElementById('sndh').textContent=mode?'隣の部屋まで届くのは、どちらでしょうか':'隣の部屋から聞こえるのは、どちらでしょうか';}));
    let why=false; document.getElementById('why').addEventListener('click',()=>{why=!why;document.getElementById('whybox').style.display=why?'':'none';document.getElementById('why').textContent=why?'なぜ？を閉じる':'なぜ？';});
    const dcv=document.getElementById('dif'),dg=dcv.getContext('2d');
    const drawDif=()=>{ if(!dg||!why)return; dg.clearRect(0,0,760,230); dg.fillStyle='#fbf7ee'; dg.fillRect(0,0,760,230);
      [[0,'太鼓（長い波）',2.2,1.1,'😀 届く'],[380,'笛（短い波）',9,0.18,'😫 影']].forEach(([ox,label,k,spread,res])=>{ dg.save(); dg.beginPath(); dg.rect(ox,0,380,230); dg.clip();
        // wall with gap
        dg.fillStyle='#8a7a5a'; dg.fillRect(ox+150,10,12,80); dg.fillRect(ox+150,140,12,80); dg.fillStyle='#64737a'; dg.font='12px sans-serif'; dg.textAlign='center'; dg.fillText('ドアの隙間',ox+156,228); dg.fillStyle='#1f2a2e'; dg.font='bold 13px sans-serif'; dg.textAlign='left'; dg.fillText(label,ox+8,22);
        // incoming plane waves (left)
        dg.strokeStyle='#1f6fb2'; dg.lineWidth=2; const L=760/(k*2)/2; for(let x=ox+20;x<ox+150;x+=L){ const xx=x+((t*18)%L); if(xx<ox+150){ dg.beginPath(); dg.moveTo(xx,20); dg.lineTo(xx,210); dg.stroke(); } }
        // outgoing arcs from gap center, limited to angle spread
        const cx=ox+156, cy=115; for(let r=((t*18)%L); r<260; r+=L){ dg.beginPath(); dg.arc(cx,cy,r,-spread,spread); dg.globalAlpha=Math.max(0.15,1-r/300); dg.stroke(); } dg.globalAlpha=1;
        // shadow region hint for short waves
        if(spread<0.5){ dg.fillStyle='rgba(31,42,46,.08)'; dg.beginPath(); dg.moveTo(ox+162,10); dg.lineTo(ox+380,10); dg.lineTo(ox+380,80); dg.lineTo(ox+162,95); dg.closePath(); dg.fill(); dg.beginPath(); dg.moveTo(ox+162,135); dg.lineTo(ox+380,150); dg.lineTo(ox+380,220); dg.lineTo(ox+162,220); dg.closePath(); dg.fill(); }
        // person at corner
        dg.font='26px sans-serif'; dg.textAlign='center'; dg.fillText('🧑',ox+340,52); dg.font='bold 13px sans-serif'; dg.fillStyle=spread<0.5?'#b63a3a':'#2f8f5b'; dg.fillText(res,ox+340,80);
        dg.restore(); }); dg.strokeStyle='#d9dee3'; dg.beginPath(); dg.moveTo(380,0); dg.lineTo(380,230); dg.stroke(); };
    const draw=()=>{ if(playing)t+=0.09; if(why)t+=0.03; drawDif(); g.clearRect(0,0,760,300); g.fillStyle='#fbf7ee'; g.fillRect(0,0,760,300);
      // rooms + wall
      g.fillStyle='#8a7a5a'; g.fillRect(440,10,18,280); g.fillStyle='#64737a'; g.font='13px sans-serif'; g.textAlign='center'; g.fillText('自分の部屋',220,24); g.fillText('隣の部屋',610,24); g.fillText('壁',449,297);
      const front=playing?Math.min(760,60+t*60):0; // wave front position
      ROWS.forEach(r=>{ g.font='28px sans-serif'; g.textAlign='center'; g.fillText(mode?'📶':r.icon,40,r.y+10); g.font='bold 13px sans-serif'; g.fillStyle='#1f2a2e'; g.textAlign='left'; g.fillText(mode?r.b:r.a,70,r.y-38);
        g.strokeStyle=r.col; g.lineWidth=3; g.beginPath(); let started=false; for(let x=70;x<Math.min(440,front);x++){ const y=r.y-30*Math.sin((x/760)*Math.PI*2*r.k*2-t*2); started?g.lineTo(x,y):g.moveTo(x,y); started=true;} g.stroke();
        if(front>458){ g.beginPath(); started=false; for(let x=458;x<Math.min(760,front);x++){ const y=r.y-30*(1-r.loss)*Math.sin((x/760)*Math.PI*2*r.k*2-t*2); started?g.lineTo(x,y):g.moveTo(x,y); started=true;} g.globalAlpha=1-r.loss*0.6; g.stroke(); g.globalAlpha=1; }
        // wavelength bracket
        if(front>200){ const L=760/(r.k*2); g.strokeStyle='#64737a'; g.lineWidth=1; g.beginPath(); g.moveTo(120,r.y+42); g.lineTo(120+L,r.y+42); g.moveTo(120,r.y+37); g.lineTo(120,r.y+47); g.moveTo(120+L,r.y+37); g.lineTo(120+L,r.y+47); g.stroke(); g.fillStyle='#64737a'; g.font='11px sans-serif'; g.textAlign='left'; g.fillText((mode?r.len:'波1つ'),124+L,r.y+46); }
        // listener
        g.font='28px sans-serif'; g.textAlign='center'; g.fillText(mode?'📱':'🧑',720,r.y+10);
        if(front>=760){ g.font='bold 13px sans-serif'; g.fillStyle=r.loss>0.5?'#b63a3a':'#2f8f5b'; g.textAlign='right'; g.fillText(mode?r.okb:r.ok,700,r.y-38); g.fillStyle='#1f2a2e'; g.font='12px sans-serif'; g.fillText('壁の向こうに残る強さ '+Math.round((1-r.loss)*100)+'%',700,r.y+60); } });
      if(!playing){ g.fillStyle='#64737a'; g.font='14px sans-serif'; g.textAlign='center'; g.fillText('「鳴らす」を押してください',380,160); }
      ANIM=requestAnimationFrame(draw); }; draw(); },
  naru:"隣の部屋のテレビは、<b>低い音（ドンドン）</b>だけ聞こえます。電波も同じで、<b>波が長い 2.4GHz は回り込んで遠くまで届き、波が短い 5GHz は速いが壁で止まります</b>。理由は「なぜ？」を押すと出ます。",
  memo:"「鳴らす」で2本同時に波が出る。「なぜ？」で理由2つ：①回折（波長と同じくらいの隙間で広がる。防波堤のうねり）②吸収（高いほど壁の中で熱になる。レンジと同じ力）。電気科向けの3つ目（受信アンテナの実効面積は波長の2乗に比例。空間自体が高い電波を余計に弱めるわけではない）は生徒には出さない。" },

{ ch:"しくみ", eyebrow:"説明②", title:"遠ざかると弱くなります。懐中電灯と同じです", terms:["atten","half","dbm"],
  sim:()=>`<div class="naru" style="font-size:.92rem">「半分が何回」とは：ルーターのすぐそばで受け取る電波の強さを <b>100</b> とします。離れたり壁を通ったりするたびに、強さは <b>100 → 50 → 25 → 12.5…</b> と半分になっていきます。この<b>「半分になった回数」</b>で、電波の弱まり方を数えます。</div><div class="row"><label class="f">ルーターからの距離 <input type="range" id="ds" min="1" max="8" value="2"> <span class="v" id="dsv"></span></label><div class="big" id="dsb" style="font-size:1.3rem"></div></div><div class="two"><canvas id="torch" width="520" height="230"></canvas><div class="col"><div id="dsh"></div><div class="tile"><div class="k">スマホの数字では</div><div class="big" id="dsr"></div><div class="k">−30 がとても強い、−90 でほぼ圏外</div></div></div></div>`,
  wire:()=>{ const r=document.getElementById('ds'); const cv=document.getElementById('torch'),g=cv.getContext('2d'); const d=()=>{const m=+r.value; const n=Math.round(2*Math.log2(m)); const p=-30-3*n; document.getElementById('dsv').textContent=m+' m'; document.getElementById('dsr').textContent=Math.round(p)+' dBm'; document.getElementById('dsb').textContent='同じ光が '+(m*m)+' 倍の広さに広がる → 明るさ 1/'+(m*m)+'（半分が '+n+' 回）'; document.getElementById('dsh').innerHTML=halves(Math.min(n,8),m+'m のとき');
      if(!g)return; g.clearRect(0,0,520,230); g.fillStyle='#fbf7ee'; g.fillRect(0,0,520,230); // torch
      g.fillStyle='#1f2a2e'; g.fillRect(10,100,40,30); g.fillStyle='#f2c14e'; g.beginPath(); g.moveTo(50,100); g.lineTo(50,130); g.lineTo(500,230); g.lineTo(500,0); g.closePath(); g.globalAlpha=.18; g.fill(); g.globalAlpha=1;
      for(let k=1;k<=8;k++){ const x=50+k*55; const h=30*k*0.75; const a=Math.min(1,1/(k*k)); g.fillStyle=`rgba(242,193,78,${0.15+0.85*a})`; g.fillRect(x,115-h/2,8,h); g.fillStyle='#64737a'; g.font='11px sans-serif'; g.textAlign='center'; g.fillText(k+'m',x+4,115+h/2+14); if(k===+r.value){ g.strokeStyle='#e0392b'; g.lineWidth=2; g.strokeRect(x-3,115-h/2-3,14,h+6); g.fillStyle='#e0392b'; g.font='bold 12px sans-serif'; g.fillText('明るさ 1/'+(k*k),x+4,115-h/2-10);} } };
    r.addEventListener('input',d); d(); },
  naru:"電波は四方八方に広がります。<b>2倍離れると、同じ光が4倍の広さに薄く広がる</b>ので、明るさは 1/4（半分が2回）。電波の強さは<b>「半分が何回」</b>で数えると分かりやすいです。",
  memo:"半分1回＝−3dB。dB は用語欄に置くだけ。実際の家は反射があるので、きれいな逆二乗にはならない。" },

{ ch:"しくみ", eyebrow:"説明③", title:"壁1枚で、半分が何回でしょうか", terms:["atten","half","band"],
  sim:()=>`<div class="chips" id="wm">${Object.entries(WALL).map(([k,w],i)=>`<span class="chip ${i===0?'on':''}" data-k="${k}">${w.n}</span>`).join('')}</div><canvas id="wallc" width="760" height="200"></canvas><div class="hint">上：2.4GHz（太鼓）　下：5GHz（笛）。数字は材質と厚さで大きく変わります。目安です</div>`,
  wire:()=>{ let key='wood',t=0; const cv=document.getElementById('wallc'),g=cv.getContext('2d'); if(!g)return;
    const draw=()=>{ t+=0.08; const w=WALL[key]; g.clearRect(0,0,760,200); g.fillStyle='#fbf7ee'; g.fillRect(0,0,760,200); g.fillStyle=w.c; g.fillRect(372,10,w.w*3,180); g.fillStyle='#64737a'; g.font='12px sans-serif'; g.textAlign='center'; g.fillText(w.n,380+w.w*1.5,198);
      [[0.5,3,60,'太鼓 2.4GHz'],[1.5,6,140,'笛 5GHz']].forEach(([bi,k,y,label])=>{ const n=Math.round(w.l[bi===0.5?0:1]/3); const rem=Math.pow(0.5,n); g.fillStyle='#1f2a2e'; g.font='bold 12px sans-serif'; g.textAlign='left'; g.fillText(label,10,y-32); g.strokeStyle='#1f6fb2'; g.lineWidth=3; g.beginPath(); for(let x=10;x<372;x++){ const yy=y-26*Math.sin((x/760)*Math.PI*2*k*2-t); x===10?g.moveTo(x,yy):g.lineTo(x,yy);} g.stroke(); g.beginPath(); for(let x=372+w.w*3+2;x<760;x++){ const yy=y-26*rem*Math.sin((x/760)*Math.PI*2*k*2-t); g.lineTo(x,yy);} g.strokeStyle=rem<0.3?'#8fb8e8':'#1f6fb2'; g.stroke(); g.fillStyle='#1f2a2e'; g.textAlign='right'; g.fillText('半分 '+n+' 回 → 1/'+Math.pow(2,n),750,y-32); });
      ANIM=requestAnimationFrame(draw); };
    document.querySelectorAll('#wm .chip').forEach(c=>c.addEventListener('click',()=>{document.querySelectorAll('#wm .chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');key=c.dataset.k;})); draw(); },
  naru:"コンクリートの壁1枚で<b>半分が4回（1/16）</b>です。同じ壁でも <b>笛（5GHz）のほうが多く減ります</b>。床は壁より厚いので、1階と2階の間ではさらに減ります。",
  memo:"鉄筋コンクリートの床は半分6〜8回（−20dB以上）。木造住宅と RC マンションで届き方がまるで違う理由。" },

{ ch:"ゲーム", eyebrow:"ゲーム", title:"家族みんなが動画を見られるようにしよう", terms:["router","repeater","band","rssi","micro","mbps"],
  sim:()=>`<div class="simwrap">
  <div class="stsel" id="stsel"></div>
  <div class="lvbar"><div class="lvtitle" id="lvt"></div><div class="lvgoal" id="lvg"></div><div class="lvprog"><div class="pbar"><i id="pfill"></i></div><span class="v" id="ptxt"></span></div></div>
  <div class="ctrl" id="ctrl"><span class="hint">置くもの：</span><button class="sel" id="mRouter">ルーター</button><button id="mRep">中継器</button><button id="mRepOff">中継器を外す</button><label id="lBand">電波 <select id="band"><option value="0">太鼓 2.4GHz</option><option value="1" selected>笛 5GHz</option></select></label><label id="lHouse">家 <select id="house"><option value="wood">木造</option><option value="rc">鉄筋コンクリート</option></select></label><label id="lInner">部屋の壁 <select id="inner"><option value="wood">石膏ボード</option><option value="conc">コンクリート</option></select></label><label id="lMicro">電子レンジ <select id="micro"><option value="0">停止</option><option value="1">使用中</option></select></label><label id="lMax">中継器 <select id="maxrep"><option value="0">なし</option><option value="1">1台</option><option value="2">2台</option></select></label><span class="hint" id="tapHint">間取りをタップして置きます</span></div>
  <div class="floors"><div class="floor"><div class="t">1階</div><canvas id="f0"></canvas></div><div class="floor"><div class="t">2階</div><canvas id="f1"></canvas></div></div>
  <div class="scale"><span>弱い</span><div class="bar"></div><span>強い</span><span style="margin-left:10px">😀 動画OK　😐 文字だけ　😫 圏外</span></div>
  <div class="rooms" id="rooms"></div>
  <div class="clear" id="clear"></div></div>`,
  wire:()=>{ const c0=document.getElementById('f0'),c1=document.getElementById('f1');
    const FAM={'リビング':'👨 お父さん','キッチン':'👩 お母さん','和室':'👴 おじいちゃん','風呂':'👦 弟','玄関':'🐶 ルーク','洗面':'👧 姉','寝室':'👵 おばあちゃん','子ども部屋A':'🧑 自分','子ども部屋B':'👧 妹','書斎':'💻 仕事部屋'};
    const LV=[
      {t:"ステージ1　ルーターを動かす",d:"★",g:"ルーターの場所だけで、😀 を 8 部屋以上にする",setup:()=>{ST.band=1;ST.house='wood';ST.inner='wood';ST.micro=false;ST.reps=[];ST.maxRep=0;ST.router={f:1,x:11,y:7.3};},show:{},ok:rs=>rs.filter(r=>r.m>=20).length>=8,term:["ルーター","電波を出す本体。端に置くと半分が外に逃げます。家の真ん中・高い場所に置きましょう"]},
      {t:"ステージ2　太鼓と笛",d:"★",g:"電波を切り替えて、全部屋を 😀 にする",setup:()=>{ST.house='wood';ST.inner='wood';ST.micro=false;ST.reps=[];ST.maxRep=0;},show:{band:1},ok:rs=>rs.every(r=>r.m>=20),term:["2.4GHz と 5GHz","太鼓（2.4GHz）は遠くまで届くが遅い。笛（5GHz）は速いが壁に弱い。遠い部屋や別の階は太鼓"]},
      {t:"ステージ3　電子レンジ",d:"★★",g:"お母さんがレンジを使い始めた。キッチンとリビングを 😀 のまま保つ",setup:()=>{ST.house='wood';ST.inner='wood';ST.micro=true;ST.band=0;ST.reps=[];ST.maxRep=0;ST.router={f:0,x:8.5,y:2};},show:{band:1,micro:1},ok:rs=>ST.micro&&['キッチン','リビング'].every(n=>rs.find(r=>r.n===n).m>=20),term:["干渉","同じ高さの波がぶつかって乱れること。レンジは太鼓（2.4GHz）とぶつかる。笛（5GHz）に逃げるか、離す"]},
      {t:"ステージ4　鉄筋コンクリートに引っ越し",d:"★★",g:"中継器を1台使って、全部屋を 😀 にする",setup:()=>{ST.house='rc';ST.inner='wood';ST.micro=false;ST.reps=[];ST.maxRep=1;ST.band=1;ST.router={f:0,x:6,y:2.5};},show:{band:1,rep:1},ok:rs=>ST.reps.length>0&&rs.every(r=>r.m>=20),term:["中継器","ルーターの電波を受け取って出し直す機械。ルーターの電波が届く場所に置かないと働かない（赤い印）。階段や廊下が定石"]},
      {t:"ステージ5　壁もコンクリート",d:"★★★",g:"部屋の壁までコンクリートの家。中継器2台で全部屋を 😀 にする",setup:()=>{ST.house='rc';ST.inner='conc';ST.micro=false;ST.reps=[];ST.maxRep=2;ST.band=0;ST.router={f:0,x:1.2,y:1.2};},show:{band:1,rep:1},ok:rs=>rs.every(r=>r.m>=20),term:["減衰","電波が壁や床で弱くなること。コンクリートは半分4回。壁が厚い家ほど中継器を増やすか、ルーターを真ん中に"]},
      {t:"ステージ6　自由に試す",d:"自由",g:"家の構造・壁・電波・レンジ・中継器を自由に変えて、いちばん速い家を作る",setup:()=>{ST.maxRep=2;},show:{band:1,house:1,inner:1,micro:1,rep:1,max:1},ok:()=>false,term:null},
    ];
    let lv=0, cleared=false;
    const face=m=>m>=20?'😀':m>=1?'😐':'😫';
    const drawSel=()=>{ document.getElementById('stsel').innerHTML=LV.map((L,k)=>`<button class="st ${k===lv?'sel':''} ${P.stages.includes(k+1)?'done':''}" data-k="${k}">${P.stages.includes(k+1)?'✓ ':''}${k+1}<small>${L.d}</small></button>`).join(''); document.querySelectorAll('#stsel .st').forEach(b=>b.addEventListener('click',()=>{lv=+b.dataset.k;start();})); };
    const redraw=()=>{ drawFloor(c0,0); drawFloor(c1,1); const rs=roomStats(); const L=LV[lv];
      document.getElementById('rooms').innerHTML=rs.map(r=>`<div class="room ${r.m>=20?'ok':r.m>=1?'mid':'ng'}"><b>${face(r.m)} ${r.f?'2F ':'1F '}${r.n}</b><span class="who">${FAM[r.n]||''}</span><div class="m"><i style="width:${Math.max(2,Math.min(100,r.m/(ST.band?500:150)*100))}%;background:${color(r.r)}"></i></div><span class="s">${r.m>=1?fmt(r.m)+' Mbps':'圏外'}</span></div>`).join('');
      const okN=rs.filter(r=>r.m>=20).length; document.getElementById('pfill').style.width=(okN/rs.length*100)+'%'; document.getElementById('ptxt').textContent=`😀 ${okN} / ${rs.length} 部屋`;
      if(!cleared&&L.ok(rs)){ cleared=true; if(!P.stages.includes(lv+1))P.stages.push(lv+1); if(L.term&&!P.terms.includes(L.term[0]))P.terms.push(L.term[0]); saveP(); drawSel(); const nxt=lv<LV.length-1; document.getElementById('clear').innerHTML=`<div class="clearbox"><div class="big" style="font-size:1.3rem">🎉 ステージ${lv+1} クリア</div>${L.term?`<div class="termcard"><div class="k">覚えよう</div><b>${L.term[0]}</b><span>${L.term[1]}</span></div>`:''}${nxt?`<button class="pri" id="nextlv">次のステージへ →</button>`:''}</div>`; if(nxt)document.getElementById('nextlv').addEventListener('click',()=>{lv++;start();}); } };
    const start=()=>{ const L=LV[lv]; cleared=false; L.setup(); drawSel(); document.getElementById('lvt').textContent=L.t; document.getElementById('lvg').textContent='目標：'+L.g; document.getElementById('clear').innerHTML=''; ST.mode='router';
      const sh=L.show; const vis=(id,on)=>document.getElementById(id).style.display=on?'':'none'; vis('lBand',!!sh.band); vis('lHouse',!!sh.house); vis('lInner',!!sh.inner); vis('lMicro',!!sh.micro); vis('lMax',!!sh.max); vis('mRep',!!sh.rep); vis('mRepOff',!!sh.rep); vis('mRouter',!!sh.rep);
      document.getElementById('tapHint').textContent=sh.rep?'間取りをタップして置きます（中継器は '+ST.maxRep+' 台まで）':'間取りをタップしてルーターを置きます';
      document.getElementById('mRouter').classList.add('sel'); document.getElementById('mRep').classList.remove('sel');
      document.getElementById('band').value=ST.band; document.getElementById('house').value=ST.house; document.getElementById('inner').value=ST.inner; document.getElementById('micro').value=ST.micro?'1':'0'; document.getElementById('maxrep').value=ST.maxRep; redraw(); };
    const place=(f,e,cv)=>{ const b=cv.getBoundingClientRect(); const x=(e.clientX-b.left)/b.width*12, y=(e.clientY-b.top)/b.height*8; const p={f,x:Math.max(0.3,Math.min(11.7,x)),y:Math.max(0.3,Math.min(7.7,y))}; if(ST.mode==='router')ST.router=p; else { if(ST.maxRep===0)return; if(ST.reps.length>=ST.maxRep)ST.reps.shift(); ST.reps.push(p); } redraw(); };
    c0.addEventListener('click',e=>place(0,e,c0)); c1.addEventListener('click',e=>place(1,e,c1));
    document.getElementById('mRouter').addEventListener('click',()=>{ST.mode='router';document.getElementById('mRouter').classList.add('sel');document.getElementById('mRep').classList.remove('sel');});
    document.getElementById('mRep').addEventListener('click',()=>{ST.mode='rep';document.getElementById('mRep').classList.add('sel');document.getElementById('mRouter').classList.remove('sel');});
    document.getElementById('mRepOff').addEventListener('click',()=>{ST.reps=[];redraw();});
    document.getElementById('band').addEventListener('change',e=>{ST.band=+e.target.value;redraw();}); document.getElementById('house').addEventListener('change',e=>{ST.house=e.target.value;redraw();}); document.getElementById('inner').addEventListener('change',e=>{ST.inner=e.target.value;redraw();}); document.getElementById('micro').addEventListener('change',e=>{ST.micro=e.target.value==='1';redraw();}); document.getElementById('maxrep').addEventListener('change',e=>{ST.maxRep=+e.target.value;ST.reps=ST.reps.slice(-ST.maxRep||0);if(ST.maxRep===0)ST.reps=[];document.getElementById('tapHint').textContent='間取りをタップして置きます（中継器は '+ST.maxRep+' 台まで）';redraw();});
    start(); },
  naru:"上の番号でステージを選べます。★が多いほど難しい。色は<b>サーモグラフィ</b>と同じで、赤いほど強く、青いほど弱い。😀 が動画の見られる部屋。クリアするごとに用語が1つ増えます。",
  memo:"ステージは自由に選べる（順番強制なし）。答え：1＝1階中央。2＝太鼓＋1階中央。3＝笛に切替（レンジは太鼓とだけぶつかる）。4＝1階中央にルーター、2階廊下に中継器、太鼓。5＝壁もコンクリート。太鼓・ルーター1階中央・中継器を2階廊下と1階風呂側あたり。6＝自由。" },

{ ch:"たしかめ", eyebrow:"小テスト", title:"小テスト（8問・採点は1回）", terms:[],
  sim:()=>`<label class="row">名前 <input type="text" id="qn" style="width:12em" value="${P.name}"></label><div id="qs" style="display:flex;flex-direction:column;gap:12px"></div><div class="row"><button class="pri" id="qgrade">採点する</button><div class="big" id="qres"></div></div><div class="fb" id="qfb"></div>`,
  wire:()=>{ const Q=[
      {q:"電子レンジを使うと Wi-Fi が乱れることがあります。理由として正しいものはどれですか。",o:["レンジの電波と Wi-Fi の 2.4GHz帯が同じ周波数だから","レンジが電気をたくさん使って電圧が下がるから","レンジの熱で電波が溶けるから"],a:0,pts:1,why:"同じ 2.4GHz帯なので干渉します。"},
      {q:"「笛」のような高い電波（5GHz・ミリ波）の特徴として正しいものはどれですか。",o:["壁に弱いが、速い","壁をすり抜けて遠くまで届く","高さと届き方は関係ない"],a:0,pts:1,why:"高い（波が短い）電波は壁で減りますが、多くの情報を乗せられます。"},
      {q:"電波の強さが「半分 10 回」ぶん減りました。何分の1になりましたか。",o:["1/10","1/100","約 1/1000"],a:2,pts:1,why:"2 の 10 乗 ＝ 1024。約 1/1000（−30dB）です。"},
      {q:"ルーターから 3m の場所と 6m の場所。壁がなければ、6m の強さはおよそ何分の1ですか。",o:["1/2","1/4","1/16"],a:1,pts:1,why:"距離2倍で広がる面積が4倍。半分が2回で 1/4 です。"},
      {q:"ルーターと同じ部屋でスマホを使います。速いのはどちらですか。",o:["2.4GHz（太鼓）","5GHz（笛）","同じ"],a:1,pts:1,why:"同じ部屋なら 5GHz。遠い部屋なら 2.4GHz。"},
      {q:"中継器が働かない置き方はどれですか。",o:["ルーターの電波がほとんど届かない部屋に置く","ルーターと届かない部屋の中間に置く","ルーターから見える廊下に置く"],a:0,pts:1,why:"中継器はルーターの電波を受け取って出し直すので、届かない場所では働きません。"},
      {q:"鉄筋コンクリートのマンションで、別の階の部屋に Wi-Fi が届きません。理由と対策を1つずつ、授業の言葉を使って説明してください。",t:1,pts:2,kw:[["コンクリート","床","半分","減"],["中継器","メッシュ","2.4","太鼓","置き","真ん中","中央"]],need:2,model:"コンクリートの床は電波を大きく減らす（半分が6回以上）。対策は、中継器を階段や廊下に置く、ルーターを家の中央・高い場所に置く、遠い部屋は 2.4GHz（太鼓）につなぐ、など。"},
      {q:"「高い電波ほど速いが、届きにくい」のはなぜですか。太鼓と笛のたとえを使って説明してください。",t:1,pts:2,kw:[["太鼓","低"],["笛","高"],["壁","障害","すり抜","回り込"],["速","情報","データ","波の数","多"]],need:3,model:"低い電波（太鼓）は波が長く、壁をすり抜けて遠くまで届く。高い電波（笛）は波が短く壁で止まるが、同じ時間に多くの波を送れるので速い。"},
    ];
    const box=document.getElementById('qs'); box.innerHTML=Q.map((x,i)=>`<div class="col" style="border-top:1px solid var(--line);padding-top:8px"><b>問${i+1}　<span class="hint">${x.pts}点${x.t?'・記述':''}</span></b><span>${x.q}</span>${x.t?`<textarea data-q="${i}"></textarea>`:`<div class="opts">${x.o.map((o,j)=>`<label class="ck"><input type="radio" name="q${i}" value="${j}"><span>${o}</span></label>`).join('')}</div>`}<div class="fb" data-fb="${i}"></div></div>`).join('');
    const norm=t=>(t||'').toLowerCase().replace(/\s/g,'');
    document.getElementById('qgrade').addEventListener('click',()=>{ let total=0,max=0,blank=[]; Q.forEach((x,i)=>{ max+=x.pts; let pts=0,msg=''; if(x.t){ const v=document.querySelector(`[data-q="${i}"]`).value; if(!v.trim()){blank.push(i+1);return;} const n=norm(v); const hits=x.kw.filter(g=>g.some(k=>n.includes(k.toLowerCase()))).length; pts=hits>=x.need?2:hits>0?1:0; msg=`キーワード ${hits}/${x.kw.length}（仮採点）。模範解答：${x.model}`; } else { const s=document.querySelector(`input[name="q${i}"]:checked`); if(!s){blank.push(i+1);return;} pts=+s.value===x.a?x.pts:0; msg=(pts?'○ ':'× 正解は「'+x.o[x.a]+'」。')+x.why; } total+=pts; const fb=document.querySelector(`[data-fb="${i}"]`); fb.className='fb '+(pts===x.pts?'ok':'ng'); fb.textContent=`${pts}/${x.pts}点　${msg}`; });
      if(blank.length){ document.getElementById('qfb').className='fb ng'; document.getElementById('qfb').textContent=`問${blank.join('・')} が未回答です。`; return; }
      document.getElementById('qres').textContent=`${total} / ${max} 点`; P.quiz={score:total,max}; saveP(); document.getElementById('qgrade').disabled=true; document.getElementById('qfb').className='fb'; document.getElementById('qfb').textContent=`${document.getElementById('qn').value||'名前なし'}　記述は仮採点です。先生が確認します。`; }); },
  naru:"記述は、授業の言葉（太鼓・笛・半分が何回・中継器）を使って文で書きます。採点は1回だけです。",
  memo:"客観6問×1点＋記述2問×2点＝10点。記述はキーワードで仮採点。" },

{ ch:"まとめ", eyebrow:"まとめ", title:"ルーターの置き方、3つの原則", terms:["router","band","repeater"],
  sim:()=>`<div class="grid"><div class="tile"><div class="k">原則1</div><div class="big" style="font-size:1.2rem">家の真ん中に</div><div class="k">電波は四方八方に広がる。端に置くと半分が外に出ていく</div></div><div class="tile"><div class="k">原則2</div><div class="big" style="font-size:1.2rem">高く、障害物から離す</div><div class="k">床・金属・水槽・電子レンジの近くは避ける</div></div><div class="tile"><div class="k">原則3</div><div class="big" style="font-size:1.2rem">部屋で太鼓と笛を使い分ける</div><div class="k">同じ部屋は 5GHz（笛）、遠い部屋・別の階は 2.4GHz（太鼓）。届かなければ中継器</div></div></div><div class="hint">家に帰ったら、自分の家のルーターがどこにあるか見てみましょう。</div>`,

  memo:"最初の導入「家で一番弱いのはどこ」に戻って、自分の予想と比べさせて終わる。" },
{ ch:"まとめ", eyebrow:"修了", title:"今日の記録", terms:[],
  sim:()=>`<div class="cert"><div class="box"><h3>名前</h3><div class="big" style="font-size:1.3rem">${P.name||'（名前なし）'}</div></div><div class="box"><h3>小テスト</h3><div class="big">${P.quiz?P.quiz.score+' / '+P.quiz.max+' 点':'未受験'}</div></div><div class="box"><h3>クリアしたステージ</h3><div class="big" style="font-size:1.3rem">${P.stages.length} / 4</div><div class="hint">${P.stages.map(n=>'ステージ'+n).join('・')||'—'}</div></div><div class="box terms"><h3>覚えた用語</h3>${P.terms.length?P.terms.map(t=>'<b>'+t+'</b>').join(''):'<span class="hint">ゲームのステージをクリアすると増えます</span>'}</div></div><div class="row"><span class="hint">この画面を先生に見せてください。</span><button id="resetp">記録を消して最初から</button></div>`,
  wire:()=>{ document.getElementById('resetp').addEventListener('click',()=>{Object.assign(P,{name:'',stages:[],terms:[],quiz:null,seen:[]});saveP();i=0;render();}); },
  naru:"今日の数字は<b>「半分が何回」</b>で考えました。距離2倍で2回、木の壁で1回、コンクリートの床で6回以上。足し算で、家のどこに届くかが予想できます。",
  memo:"修了画面。名前・小テストの点・クリアしたステージ・覚えた用語が1画面に出る。端末に残るので次の時間も見られる。" },
];

let ANIM=null; let i=0,memoOn=false; const slide=document.getElementById('slide'), gl=document.getElementById('gloss');
const CH=["導入","しくみ","ゲーム","たしかめ","まとめ"];
function render(){ if(ANIM){cancelAnimationFrame(ANIM);ANIM=null;} const s=S[i]; slide.className='slide'+(s.cover?' cover':''); slide.style.animation='none'; void slide.offsetWidth; slide.style.animation='';
  if(s.cover){ slide.innerHTML=s.sim(); } else { slide.innerHTML=`<div class="eyebrow"><span class="num">${i}</span>${s.eyebrow}</div><h2>${s.title}</h2><div class="sim">${s.sim()}</div>${s.naru?`<div class="naru">${s.naru}</div>`:''}<div class="memo ${memoOn?'show':''}" id="memo">先生用メモ：${s.memo}</div>`; }
  try{s.wire();}catch(e){console.error(e);}
  if(!P.seen.includes(i)){P.seen.push(i);saveP();}
  gl.innerHTML=`<h3>用語の説明 <button id="gclose">閉じる</button></h3>`+((s.terms||[]).map(k=>`<div class="g"><b>${G[k][0]}</b><small>${G[k][1]}</small></div>`).join('')||'<div class="hint">この画面に用語はありません</div>'); document.getElementById('gclose').addEventListener('click',()=>gl.classList.remove('open'));
  document.getElementById('hname').textContent=P.name;
  document.getElementById('tabs').innerHTML=CH.map(c=>{const idx=S.map((x,k)=>x.ch===c?k:-1).filter(k=>k>=0); const allSeen=idx.every(k=>P.seen.includes(k)); return `<span class="tab ${s.ch===c?'on':allSeen?'done':''}" data-ch="${c}">${c}</span>`;}).join('');
  document.querySelectorAll('#tabs .tab').forEach(t=>t.addEventListener('click',()=>{const k=S.findIndex(x=>x.ch===t.dataset.ch); if(k>=0){i=k;render();}}));
  const sib=S.map((x,k)=>x.ch===s.ch?k:-1).filter(k=>k>=0); document.getElementById('dots').innerHTML=s.cover?'':sib.map(k=>`<i class="${k<i?'done':k===i?'cur':''}"></i>`).join('');
  document.getElementById('prev').disabled=i===0; document.getElementById('next').disabled=i===S.length-1; document.getElementById('next').textContent=i===S.length-1?'おわり':(S[i+1].ch!==s.ch&&S[i+1].ch?S[i+1].ch+' へ →':'次 →'); slide.scrollTop=0; }
document.getElementById('gbtn').addEventListener('click',()=>gl.classList.toggle('open'));
document.getElementById('prev').addEventListener('click',()=>{if(i>0){i--;render();}});
document.getElementById('next').addEventListener('click',()=>{if(i<S.length-1){i++;render();}});
document.addEventListener('keydown',e=>{ const t=e.target.tagName; if(t==='INPUT'||t==='SELECT'||t==='TEXTAREA')return; if(e.key==='ArrowRight'&&i<S.length-1){i++;render();} if(e.key==='ArrowLeft'&&i>0){i--;render();} if(e.key==='n'||e.key==='N'){memoOn=!memoOn;document.getElementById('memo').classList.toggle('show',memoOn);} });
render();
</script>
