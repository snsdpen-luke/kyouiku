<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>[hidden]{display:none!important}</style>
<title>キャッシュレス商店</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=DotGothic16&display=swap">
<style>
/* 4:3 stage (1024x768) scaled to the visible screen. Top: money / reviews / clock / goal. Left: shop floor on one canvas. Right: tabs for tools, business data, reviews, log. Light only; casual tycoon palette (lawn, warm floor, coin gold). */
[hidden]{display:none!important}
:root{
  color-scheme:light;
  --paper:#eef3e6; --panel:#ffffff; --ink:#1d2330; --sub:#5d6574; --line:#d8dccf;
  --head:#24303f; --coin:#f3b31b; --star:#f59e0b; --accent:#1677c9; --accent-soft:#e0eefb;
  --ok:#1f8a57; --oks:#e0f3e8; --ng:#d23c1e; --ngs:#fbe3dc; --mark:#ffd84a;
  --f-body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-led:"DotGothic16","BIZ UDPGothic",monospace;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);overflow:hidden;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
#fit{position:fixed;inset:0;overflow:hidden;background:var(--paper)}
.stage{position:absolute;left:0;top:0;width:1024px;height:768px;transform-origin:0 0;background:var(--paper);display:grid;grid-template-rows:56px 1fr;overflow:hidden}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.top{display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.pill{display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:20px;padding:5px 12px 5px 6px;font-family:var(--f-led);font-size:19px;white-space:nowrap}
.pill i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700;color:#fff}
.pill .cn{background:var(--coin)}.pill .st{background:var(--star)}
.pill small{font-family:var(--f-body);font-size:11px;color:var(--sub)}
.stars{color:var(--star);font-size:14px;letter-spacing:1px;font-family:var(--f-body)}
.goal{margin-left:auto;font-size:11.5px;line-height:1.45;text-align:right;color:var(--sub);white-space:nowrap}
.goal b{color:var(--ink)}
.main{display:grid;grid-template-columns:1fr 344px;gap:10px;padding:10px;min-height:0}
.floor{position:relative;border-radius:14px;overflow:hidden;background:#bfe3a6}
canvas{display:block;width:100%;height:100%}
.toast{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(36,48,63,.93);color:#fff;border-radius:12px;padding:9px 14px;font-size:14px;line-height:1.55;transition:opacity .3s}
.toast b{color:var(--mark)}
.toast.hide{opacity:0;pointer-events:none}
.speed{position:absolute;top:10px;right:10px;z-index:2;display:flex;gap:4px}
.speed button{border:0;border-radius:8px;background:rgba(255,255,255,.92);padding:4px 10px;font-size:13px;font-weight:700}
.speed button.on{background:var(--head);color:#fff}
.revs{position:absolute;top:44px;right:10px;width:200px;display:flex;flex-direction:column;gap:5px;pointer-events:none}
.rv{background:rgba(255,255,255,.95);border-radius:9px;padding:5px 8px;font-size:12px;line-height:1.4;box-shadow:0 2px 6px rgba(0,0,0,.12);animation:rin .4s}
.rv b{color:var(--star);font-size:11px}
.rv.bad{border-left:4px solid var(--ng)}.rv.good{border-left:4px solid var(--ok)}
@keyframes rin{from{transform:translateX(20px);opacity:0}}
.side{display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:3px}
.tabs button{flex:1;border:0;border-radius:10px 10px 0 0;background:#dfe6d6;padding:7px 2px;font-size:13px;font-weight:700;color:var(--sub);position:relative}
.tabs button.on{background:var(--panel);color:var(--ink)}
.tabs button.new::after{content:"NEW";position:absolute;top:-6px;right:2px;background:var(--ng);color:#fff;font-size:9px;border-radius:6px;padding:1px 4px}
.tabs button:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--panel);border-radius:0 0 12px 12px;flex:1;min-height:0;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
.sec{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.06em;margin-top:2px}
.slots{display:flex;gap:5px}
.slot{flex:1;height:44px;border:2px dashed var(--line);border-radius:9px;display:grid;place-items:center;font-size:11px;color:var(--sub);text-align:center;line-height:1.2}
.slot.f{border-style:solid;color:#fff;font-weight:700;font-size:13px}
.item{display:grid;grid-template-columns:40px 1fr auto;gap:2px 8px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:5px 8px}
.item .ic{grid-row:1/3;width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:11.5px;color:#fff;text-align:center;line-height:1.1}
.item .nm{font-weight:700;font-size:13.5px}
.item .ds{font-size:11px;color:var(--sub);line-height:1.4;grid-column:2/4}
.item button{border:0;border-radius:8px;font-weight:700;font-size:12.5px;padding:5px 8px;white-space:nowrap}
.item button.buy{background:var(--coin);color:#3a2a00;font-family:var(--f-led)}
.item button.on{background:var(--ok);color:#fff}
.item button.off{background:#e8ebe4;color:var(--ink)}
.item button:disabled{background:#e4e4de;color:#9a9a92;cursor:not-allowed}
.item.placed{border-color:var(--ok);background:var(--oks)}
.note{font-size:11.5px;color:var(--sub);line-height:1.5}
/* data */
.dcard{border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.dcard h4{margin:0 0 4px;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.dcard h4 span{font-weight:400;font-size:11px;color:var(--sub)}
.dcard svg{width:100%;height:auto;display:block}
.dcard svg text{font-family:var(--f-body)}
.wt{border-collapse:collapse;width:100%;font-size:11.5px}
.wt td,.wt th{padding:2px 3px;border-bottom:1px dashed var(--line);text-align:left;vertical-align:top}
.wt th{font-size:11px;color:var(--sub);font-weight:400}
.chip{display:inline-block;border-radius:8px;padding:0 5px;margin:1px 2px 1px 0;color:#fff;font-size:11px;font-weight:700}
.chip.miss{outline:2px solid var(--ng);outline-offset:-1px}
.roi td.n{text-align:right;font-family:var(--f-led);font-size:12.5px}
.roi td.o{color:var(--ok);font-weight:700}.roi td.x{color:var(--ng);font-weight:700}
.stock td,.stock th{font-size:12.5px;padding:4px 5px}.stock td.n{text-align:center;font-family:var(--f-led);font-size:14px}
.st{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:3px 6px;font-size:12px;margin:0 1px;font-weight:700}
.ord{display:inline-block;min-width:30px;text-align:center;font-family:var(--f-led);font-size:16px}
.big:disabled{opacity:.45;cursor:not-allowed}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 4px;font-size:12px;line-height:1.5}.pc>div{border-radius:8px;padding:5px 8px}.pc b{display:block;font-size:12.5px}.pro{background:var(--oks,#e6f6ec);border:1.5px solid var(--ok,#1e9e5a)}.con{background:var(--ngs,#fde8e3);border:1.5px solid var(--ng,#d23c1e)}
.recs{display:flex;gap:4px;flex-wrap:wrap}.recs button{border:2px solid var(--line);background:var(--paper);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700}.recs button.on{border-color:var(--c,var(--ink));background:var(--c,var(--ink));color:#fff}
.keyhint{background:#fffbe6;border:2px solid var(--mark);border-radius:10px;padding:6px 9px;font-size:12px;line-height:1.55}
.logl{font-size:12.5px;line-height:1.55;color:var(--sub)}
.logl div:first-child{color:var(--ink)}
.rvl .rv{animation:none;box-shadow:none;border:1px solid var(--line)}
/* overlays */
.ov{position:absolute;inset:0;background:rgba(20,26,36,.62);display:grid;place-items:center;z-index:5}
.card{background:var(--panel);border-radius:18px;padding:18px 24px;width:720px;max-height:720px;overflow:auto;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.card h1{margin:0;font-size:34px}
.card h2{margin:0;font-size:25px}
.card p{margin:0;font-size:15.5px;line-height:1.7}
.card ul{margin:0;padding-left:20px;font-size:15px;line-height:1.7}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.kp div{background:var(--paper);border-radius:10px;padding:6px}
.kp b{display:block;font-family:var(--f-led);font-weight:400;font-size:21px}
.kp small{font-size:11.5px;color:var(--sub)}
.big{border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:18px;font-weight:700;padding:12px}
.ghost{border:2px solid var(--accent);border-radius:12px;background:#fff;color:var(--accent);font-size:15px;font-weight:700;padding:9px}
</style>
</head>
<body>


<div id="fit"><div class="stage" id="stage">
  <div class="top">
    <div class="pill"><i class="cn">¥</i><span id="coins">0</span></div>
    <div class="pill"><i class="st">★</i><span id="rate">3.0</span><span class="stars" id="rstars"></span><small>口コミ</small></div>
    <div class="pill" style="font-size:16px"><span id="day">1日目</span><span id="clock">7:00</span><small id="block">朝</small></div>
    <b id="shopname" style="font-size:14px;white-space:nowrap"></b>
    <div class="goal" id="goal"></div>
  </div>
  <div class="main">
    <div class="floor">
      <canvas id="cv" width="650" height="680"></canvas>
      <div class="speed"><button data-s="0">止める</button><button data-s="1" class="on">×1</button><button data-s="2">×2</button><button data-s="4">×4</button></div>
      <div class="revs" id="revs"></div>
      <div class="toast hide" id="toast"></div>
    </div>
    <div class="side">
      <div class="tabs" id="tabs"><button data-t="tools" class="on">道具</button><button data-t="data" disabled>経営データ</button><button data-t="rev">口コミ</button><button data-t="log">できごと</button></div>
      <div class="panel" id="panel"></div>
    </div>
  </div>
  <div class="ov" id="ov"><div class="card" id="ovCard"></div></div>
</div></div>

<script>
/* キャッシュレス商店 v3 — ゲームの中身（画面なし）。仕入れ・在庫・廃棄つき */
const PAY={
 cash:{n:'現金',ask:'現金で',fee:0,t:2.2,net:false,col:'#7a8a5a'},
 qr:{n:'QR',ask:'QRある？',fee:0.02,t:1.3,net:true,col:'#e0457b',buy:4000,up:0,limit:50000},
 gqr:{n:'海外QR',ask:'Alipay OK?',fee:0.03,t:1.3,net:true,col:'#d9480f',buy:8000,up:300},
 ic:{n:'IC',ask:'ICで！',fee:0.03,t:0.3,net:false,col:'#1677c9',limit:20000,buy:8000,up:500},
 card:{n:'カード',ask:'カードで',fee:0.033,t:0.7,net:true,col:'#6b4fc8',buy:6000,up:300},
 face:{n:'顔',ask:'顔で払う',fee:0.03,t:0.3,net:true,col:'#0f9488',buy:25000,up:1500}};
const DEVICES=['qr','ic','card','gqr','face'];
const FAC={
 reg2:{n:'レジ2台目',buy:12000,up:4000,d:'同時に2人会計できる。店員さんの給料が毎日かかる'},
 changer:{n:'自動つり銭機',buy:4000,up:200,d:'現金の会計が2.2秒→0.9秒になる'},
 backup:{n:'予備の回線',buy:6000,up:400,d:'ネット障害でも、ネットを使う決済が止まらない'},
 ad:{n:'チラシで宣伝',buy:0,up:1500,d:'来るお客が1.25倍。毎日チラシ代がかかる'}};
const TYPES={
 worker:{n:'会社員',pref:['ic','card','qr','cash'],cash:0.45,col:'#3b6fb6'},
 student:{n:'高校生',pref:['qr','ic','cash'],cash:0.55,col:'#2f9e6b'},
 elder:{n:'お年寄り',pref:['cash','ic','card'],cash:0.97,col:'#a06a35'},
 family:{n:'家族づれ',pref:['qr','card','cash'],cash:0.7,col:'#c2559b'},
 asia:{n:'アジアの旅行者',pref:['gqr','card','cash'],cash:0.3,cardP:0.35,qty:3,col:'#e07b16',inb:true},
 west:{n:'欧米の旅行者',pref:['card','cash'],cash:0.3,qty:2,col:'#c0392b',inb:true}};
/* goods: id -> {n, price, cost, keep(false = thrown away at closing)} ; blocks.goods: [id, weight] */
const SHOPS=[
 {n:'駅前のコンビニ',open:7,close:23,scan:0.4,maxQ:6,start:25000,goal:5000,rateGoal:4.5,taskT:'行列で帰ったお客が0人（1日中）',
  intro:'駅の前のコンビニ。朝7時から夜11時まで開いている。',
  goods:{bread:{n:'パンとコーヒー',price:400,cost:250,keep:false},bento:{n:'お弁当',price:600,cost:400,keep:false},daily:{n:'日用品',price:1500,cost:1050,keep:true},snack:{n:'お菓子・飲み物',price:250,cost:150,keep:true}},
  blocks:[
   {n:'朝',from:7,to:10,gap:1.3,mix:{worker:55,student:40,elder:5},goods:[['bread',8],['snack',2]]},
   {n:'昼',from:10,to:15,gap:2.1,mix:{elder:45,family:35,worker:20},goods:[['bento',5],['daily',4],['snack',1]]},
   {n:'夕方',from:15,to:19,gap:1.3,mix:{student:70,family:20,worker:10},goods:[['snack',8],['bread',2]]},
   {n:'夜',from:19,to:23,gap:1.7,mix:{worker:65,student:15,elder:20},goods:[['bento',6],['snack',4]]}]},
 {n:'家電店',open:10,close:20,scan:2.6,maxQ:5,start:300000,goal:80000,rateGoal:4.6,stockCap:300000,taskT:'2万円以上の買い物で、逃したお客が0人',
  intro:'電池から大型テレビ・パソコンまで売る家電の店。',
  goods:{batt:{n:'電池・電球',price:800,cost:500,keep:true},dryer:{n:'ドライヤー',price:6000,cost:4500,keep:true},phones:{n:'イヤホン',price:8000,cost:6000,keep:true},game:{n:'ゲーム機',price:40000,cost:33000,keep:true},tv:{n:'テレビ',price:100000,cost:84000,keep:true},pc:{n:'パソコン',price:120000,cost:100000,keep:true}},
  blocks:[
   {n:'午前',from:10,to:13,gap:4.2,mix:{elder:45,family:25,worker:30},goods:[['batt',6],['dryer',3],['tv',1]]},
   {n:'昼すぎ',from:13,to:17,gap:3.0,mix:{family:65,worker:35},goods:[['game',4],['tv',3],['batt',2],['phones',1]]},
   {n:'夕方',from:17,to:20,gap:3.6,mix:{worker:70,family:30},goods:[['phones',5],['pc',3],['batt',2]]}]},
 {n:'熊本城前のおみやげ店',open:9,close:18,scan:0.9,maxQ:7,start:45000,goal:22000,rateGoal:4.5,taskT:'海外からのお客で、帰った人が0人',alwaysOutage:true,outLen:15,
  intro:'熊本城の前のおみやげ店。観光バスが着く。',
  goods:{kuma:{n:'くまモングッズ',price:1500,cost:900,keep:true},sweets:{n:'お菓子の箱',price:1600,cost:1000,keep:true},key:{n:'キーホルダー',price:500,cost:250,keep:true},renkon:{n:'からしれんこん',price:2500,cost:1600,keep:false}},
  blocks:[
   {n:'朝',from:9,to:11,gap:1.8,mix:{asia:45,west:30,elder:25},goods:[['kuma',6],['sweets',4]]},
   {n:'昼',from:11,to:14,gap:2.0,mix:{student:55,family:30,asia:15},goods:[['key',7],['kuma',3]]},
   {n:'午後',from:14,to:18,gap:2.3,mix:{family:45,elder:40,west:15},goods:[['sweets',5],['renkon',5]]}]}];
const DAY=72;
const RECPEN=(typeof process!=='undefined'&&process.env&&process.env.RECPEN)?+process.env.RECPEN:0.5;
function mkRng(seed){let s=seed>>>0||1;return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

class Day{
 /* inv: {id: count} — this object is changed by the day (sales, waste) */
 constructor(shopIdx,cfg,review,inv,rng,dayNo){this.S=SHOPS[shopIdx];this.cfg=cfg;this.inv=inv;
  this.rng=rng||Math.random;this.review=review;this.dayNo=dayNo||1;this.t=0;this.cust=[];this.spawnT=0.5;this.idc=0;this.outage=0;this.out={from:-1,to:-1};this.pend={};
  const S0=this.S;if(this.dayNo>=2&&(S0.alwaysOutage||this.rng()<0.7)){const f=DAY*(0.3+this.rng()*0.4);this.out={from:f,to:f+(S0.outLen||8)}}
  this.events=[];this.st=this.newStats();this.done=false}
 newStats(){const b=this.S.blocks.map(x=>({n:x.n,came:{},served:0,leftQ:0,leftP:0,leftD:0,leftS:0,want:{},wantMiss:{}}));const g={};for(const k in this.S.goods)g[k]={sold:0,out:0,waste:0,demand:0};
  return{blocks:b,goods:g,sales:0,gross:0,fee:0,cogs:0,waste:0,wasteN:0,served:0,came:0,left:0,byPay:{},paySales:{},inc:{},devFee:{},reviews:[],maxQ:0,hiMiss:0,inbMiss:0,leftDown:0,outageHit:false}}
 has(k){return k==='cash'||this.cfg.dev.includes(k)}
 fac(k){return this.cfg.fac.includes(k)}
 regs(){return this.fac('reg2')?2:1}
 hour(){return this.S.open+(this.S.close-this.S.open)*Math.min(1,this.t/DAY)}
 blockIdx(){const h=this.hour();const i=this.S.blocks.findIndex(b=>h>=b.from&&h<b.to);return i<0?this.S.blocks.length-1:i}
 down(){return this.t>=this.out.from&&this.t<this.out.to&&!this.fac('backup')}
 rating(){const r=this.review;return r.length?r.reduce((a,b)=>a+b,0)/r.length:3}
 rate(stars,text,ty,p){if(this.rng()<p){this.review.push(stars);const rv={stars,text,ty,h:this.hour()};this.st.reviews.push(rv);this.events.push({k:'review',rv})}else this.review.push(stars);if(this.review.length>30)this.review.shift()}
 pick(arr){const tot=arr.reduce((a,b)=>a+b[1],0);let x=this.rng()*tot;for(const [k,w] of arr){if(x<w)return k;x-=w}return arr[0][0]}
 pickObj(obj){return this.pick(Object.entries(obj))}
 choose(c,ex){const dn=this.down();const rec=this.cfg.rec;
  if(rec&&rec!==ex&&c.prefs.includes(rec)&&this.has(rec)&&!(dn&&PAY[rec].net))return rec;
  for(const k of c.prefs){if(k===ex)continue;if(!this.has(k))continue;if(dn&&PAY[k].net)continue;return k}return null}
 natural(c){const dn=this.down();for(const k of c.prefs){if(!this.has(k))continue;if(dn&&PAY[k].net)continue;return k}return null}
 spawn(){const bi=this.blockIdx(),B=this.S.blocks[bi],r=this.rng;const ty=this.pickObj(B.mix),T=TYPES[ty];
  const gid=this.pick(B.goods);const G=this.S.goods[gid];const avail=(this.inv[gid]||0)-(this.pend[gid]||0);const q=Math.max(1,Math.min(T.qty||1,avail));const amt=G.price*q;
  const hasCash=r()<T.cash&&!(amt>=30000&&r()<0.75);const face=!T.inb&&r()<0.15;
  const hasCard=!T.cardP||r()<T.cardP;
  let prefs=T.pref.filter(k=>!(k==='cash'&&!hasCash)&&!(k==='card'&&!hasCard)&&!(PAY[k].limit&&amt>PAY[k].limit));if(face)prefs=['face',...prefs];
  const want=prefs.find(k=>k!=='face')||prefs[0]||'cash';
  const c={id:++this.idc,ty,amt,q,gid,prefs,want,bi,st:'walk',stT:0,wait:0,reg:-1,pay:null};
  const st=this.st,bs=st.blocks[bi];st.came++;bs.came[ty]=(bs.came[ty]||0)+1;bs.want[want]=(bs.want[want]||0)+1;st.goods[gid].demand+=(T.qty||1);
  if(avail<=0){st.goods[gid].out+=(T.qty||1);this.leave(c,'soldout');return}
  const m=this.choose(c);
  if(!m){const dn=this.down()&&c.prefs.some(k=>this.has(k));this.leave(c,dn?'down':'pay');return}
  if(this.queueLen()>=this.S.maxQ){this.leave(c,'queue');return}
  this.pend[gid]=(this.pend[gid]||0)+q;c.inStore=true;c.pay=m;this.cust.push(c);this.events.push({k:'enter',c})}
 queueLen(){return this.cust.filter(c=>c.st==='walk'||c.st==='queue').length}

function dataHTML(){const L=G.last;if(!L||L.shop!==G.shop)return'<div class="note">この店で1日が終わると、ここにデータが出ます。</div>';
 const S=SHOPS[L.shop],st=L.st;const B=st.blocks;
 /* A: customers by time block */
 const maxC=Math.max(1,...B.map(b=>Object.values(b.came).reduce((a,c)=>a+c,0)));
 let a=`<svg viewBox="0 0 320 ${B.length*26+6}">`;B.forEach((b,i)=>{let x=56;const y=4+i*26;a+=`<text x="0" y="${y+15}" font-size="11.5" fill="var(--ink)">${b.n}</text>`;
  for(const [t,n] of Object.entries(b.came)){const w=n/maxC*250;a+=`<rect x="${x}" y="${y}" width="${w}" height="20" fill="${TYPES[t].col}"/>`;if(w>18)a+=`<text x="${x+w/2}" y="${y+14}" font-size="10" fill="#fff" text-anchor="middle">${n}</text>`;x+=w}});a+='</svg>';
 /* B: wanted payment per block */
 let bt=`<table class="wt"><tr><th></th><th>使いたかった払い方（赤わく＝断った）</th></tr>${B.map(b=>`<tr><td>${b.n}</td><td>${Object.entries(b.want).sort((x,y)=>y[1]-x[1]).map(([k,n])=>`<span class="chip ${b.wantMiss[k]?'miss':''}" style="background:${PAY[k].col}">${PAY[k].n} ${n}${b.wantMiss[k]?`（断${b.wantMiss[k]}）`:''}</span>`).join('')}</td></tr>`).join('')}</table>`;
 /* C: outcome per block */
 const maxO=Math.max(1,...B.map(b=>b.served+b.leftQ+b.leftP+b.leftS+b.leftD));
 let c=`<svg viewBox="0 0 320 ${B.length*26+6}">`;B.forEach((b,i)=>{let x=56;const y=4+i*26;c+=`<text x="0" y="${y+15}" font-size="11.5" fill="var(--ink)">${b.n}</text>`;
  for(const [n,col] of [[b.served,'#1f8a57'],[b.leftQ,'#e08a1f'],[b.leftP,'#d23c1e'],[b.leftS,'#8c7a5a'],[b.leftD,'#7b3fa0']]){const w=n/maxO*250;if(n){c+=`<rect x="${x}" y="${y}" width="${w}" height="20" fill="${col}"/>`;if(w>16)c+=`<text x="${x+w/2}" y="${y+14}" font-size="10" fill="#fff" text-anchor="middle">${n}</text>`}x+=w}});c+='</svg>';
 /* D: return on each tool */
 const rows=['cash',...L.cfg.dev].map(k=>{const used=st.byPay[k]||0,fee=st.devFee[k]||0,up=st.upkeep[k]||0,sal=st.paySales&&st.paySales[k]||0;return`<tr><td><span class="chip" style="background:${PAY[k].col}">${PAY[k].n}</span></td><td class="n">${used}人</td><td class="n">${yen(sal)}</td><td class="n">${yen(fee)}</td><td class="n">${yen(up)}</td></tr>`}).join('');
 const frows=L.cfg.fac.map(k=>`<tr><td><span class="chip" style="background:${FCOL[k]}">${FAC[k].n}</span></td><td class="n">—</td><td class="n">—</td><td class="n">—</td><td class="n">${yen(st.upkeep[k]||0)}</td></tr>`).join('');
 const totLQ=B.reduce((a,b)=>a+b.leftQ,0),totLP=B.reduce((a,b)=>a+b.leftP,0);
 return `<div class="note">${L.day}日目（${S.n}）のデータ</div>
 <div class="dcard"><h4>① 時間帯別の客層<span>色＝お客の種類</span></h4>${a}</div>
 <div class="dcard"><h4>② 使いたかった払い方<span>お客の希望の1位</span></h4>${bt}</div>
 <div class="dcard"><h4>③ 時間帯別の結果<span><b style="color:#1f8a57">買った</b> <b style="color:#e08a1f">行列で帰った</b> <b style="color:#d23c1e">払い方がない</b> <b style="color:#8c7a5a">売り切れ</b> <b style="color:#7b3fa0">障害</b></span></h4>${c}</div>
 <div class="dcard"><h4>④ 払い方ごとの数字<span>1日分</span></h4><table class="wt roi"><tr><th></th><th>使った人</th><th>売上</th><th>手数料</th><th>維持費</th></tr>${rows}${frows}</table></div>
 <div class="dcard"><h4>⑤ 商品ごとの売れ行き<span>売り切れ・捨てた数は赤</span></h4><table class="wt roi"><tr><th>商品</th><th>ほしかった人</th><th>売れた</th><th>売り切れで帰った</th><th>捨てた</th></tr>${Object.entries(st.goods).map(([k,g])=>`<tr><td>${S.goods[k].n}</td><td class="n">${g.demand}</td><td class="n">${g.sold}</td><td class="n" style="color:${g.out?'var(--ng)':''}">${g.out}</td><td class="n" style="color:${g.waste?'var(--ng)':''}">${g.waste}</td></tr>`).join('')}</table></div>
 `}

/* ---------- loop ---------- */
function setSpeed(s){speed=s;$$('.speed button').forEach(x=>x.classList.toggle('on',+x.dataset.s===s))}
$$('.speed button').forEach(b=>b.onclick=()=>setSpeed(+b.dataset.s));
function showOv(h){$('#ovCard').innerHTML=h;$('#ov').hidden=false}
function hideOv(){$('#ov').hidden=true}
let hudT=0;
function loop(ts){const dt=Math.min(0.05,(ts-(lastTs||ts))/1000);lastTs=ts;
 if(D&&speed>0&&$('#ov').hidden&&!D.done){for(let i=0;i<speed;i++){D.step(dt);handleEvents();if(D.done)break}
  if(D.done)endDay()}
 pops.forEach(p=>{p.t-=dt;p.y-=30*dt});pops=pops.filter(p=>p.t>0);for(let i=ghosts.length-1;i>=0;i--){ghosts[i].age+=dt*speed/2;if(ghosts[i].age>1)ghosts.splice(i,1)}
 if(toastT>0){toastT-=dt;if(toastT<=0)$('#toast').classList.add('hide')}
 if(D){const bi=D.blockIdx();if(bi!==prevBlock){prevBlock=bi}}
 draw();hudT-=dt;if(hudT<=0){hud();hudT=0.25;if(tab==='tools')$$('[data-buy]').forEach(b=>{const k=b.dataset.buy;b.disabled=G.coins<(PAY[k]||FAC[k]).buy})}
 requestAnimationFrame(loop)}

/* ---------- start ---------- */
const cont=G.day>1;
showOv(`<h1>キャッシュレス商店</h1><p>きみは店のオーナー。お客は、頭の上に<b>使いたい払い方</b>を出して入ってきます。</p>
<ul><li>払い方がないと買わずに帰り、<b>口コミ</b>で悪く書かれる。口コミが悪いとお客がへる</li><li>決済の端末は<b>レジ横に3つまで</b>。手数料と毎日の維持費がかかる</li><li>時間帯で、来るお客も買う物もかわる</li><li>1日目が終わると<b>経営データ</b>が見られる</li><li>レジに「◯◯がおすすめ」と<b>掲示</b>すると、お客の払い方を変えられる</li><li>商品は<b>前の日に仕入れる</b>。売り切れるとお客は帰り、売れ残った生ものは捨てる</li><li>店ごとに5つのクリア条件。<b>3つ以上</b>を同じ日にそろえると次の店へ。<b>14日</b>でできないと経営破綻</li></ul>
${cont?`<p style="font-size:14px;color:var(--sub)">前回のつづき：${SHOPS[G.shop].n}・${G.day}日目</p>`:''}
<button class="big" id="ovGo">${cont?'つづきから':'開店する'}</button>${cont?'<button class="ghost" id="ovNew">最初から</button>':''}`);
$('#ovGo').onclick=()=>{if(!cont){resetShop(0);toast(`<b>${SHOPS[0].n}</b>　${SHOPS[0].intro}　最初は現金だけ。`,9)}renderAll();openStock(!cont||!G.last)};
const nw=$('#ovNew');if(nw)nw.onclick=()=>{try{localStorage.removeItem('cashless-shop-v5')}catch(e){}G=fresh();resetShop(0);renderAll();openStock(true)};
/* ---------- teacher mode (hidden): tap the shop name 5 times, or type "teacher" ---------- */
let tapN=0,tapT=0,keyBuf='';
function teacher(){setSpeed(0);
 showOv(`<h2>教師モード</h2><p style="font-size:13px;color:var(--sub)">授業の準備用。生徒には見せない画面です。</p>
 <div class="sec">店を選んで、1日目から始める</div>
 <div style="display:flex;flex-direction:column;gap:6px">${SHOPS.map((S,i)=>`<button class="big" data-tj="${i}" style="margin:0">${i+1}. ${S.n}</button>`).join('')}</div>
 <div class="sec">いまの店で</div>
 <div style="display:flex;gap:6px;flex-wrap:wrap">
  <button class="ghost" id="tMoney">お金 +¥100,000</button>
  <button class="ghost" id="tOwn">端末と設備をすべて持たせる</button>
  <button class="ghost" id="tSkip">今日を一気に終える</button>
 </div>
 <button class="ghost" id="tClose" style="margin-top:12px">閉じる</button>`);
 $$('[data-tj]').forEach(b=>b.onclick=()=>{const i=+b.dataset.tj;resetShop(i);renderAll();save();toast(`<b>教師モード</b>　${SHOPS[i].n}　${SHOPS[i].intro}`,6);openStock(true)});
 $('#tMoney').onclick=()=>{G.coins+=100000;save();renderAll();toast('お金を ¥100,000 ふやしました',3)};
 $('#tOwn').onclick=()=>{const o=G.owned[G.shop];for(const k of [...DEVICES,...Object.keys(FAC)])if(!o.includes(k))o.push(k);save();renderAll();toast('端末と設備をすべて持たせました（置く・使うは道具タブで）',4)};
 $('#tSkip').onclick=()=>{$('#ov').hidden=true;if(!D||D.done){toast('いまは営業中ではありません',3);return}let g=0;while(!D.done&&g++<20000){D.step(0.05);handleEvents()}endDay()};
 $('#tClose').onclick=()=>{$('#ov').hidden=true}}
$('#shopname').addEventListener('click',()=>{const now=performance.now();tapN=now-tapT<700?tapN+1:1;tapT=now;if(tapN>=5){tapN=0;teacher()}});
window.addEventListener('keydown',e=>{if(e.key.length!==1)return;keyBuf=(keyBuf+e.key.toLowerCase()).slice(-7);if(keyBuf==='teacher'){keyBuf='';teacher()}});
renderAll();requestAnimationFrame(loop);
</script>

</body>
</html>
