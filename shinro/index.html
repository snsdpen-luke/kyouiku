<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>進路設計工房 くらしの費用から求人票へ｜進路学習</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#e2ded3;--face:#f2efe7;--face2:#e2ded3;--panel:#fdfcf8;--panel2:#f3f0e8;--ink:#ffffff;
  --line:#c7c0ae;--line-lo:#e3ddcf;--edge:#b0a894;--shade:#00000014;
  --txt:#242219;--dim:#6b6455;--dim2:#948d7b;
  --ok:#0f7d5e;--ok-dk:#0a5f47;--ok-lo:#d9f2e9;
  --warn:#b4700a;--warn-lo:#fdf0d8;
  --ng:#c23b2b;--ng-lo:#fbe4e0;
  --blue:#25599b;--blue-lo:#e4edfa;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding:10px;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  font-size:14px;color:var(--txt);min-height:100vh;line-height:1.6;
  background:var(--bg) radial-gradient(1200px 600px at 50% -10%,#f0ece1 0%,rgba(226,222,211,0) 72%) no-repeat}
.app{max-width:1400px;margin:0 auto}

/* ===== ヘッダ ===== */
.face{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  background:linear-gradient(#f6f3ea,#e4e0d2);border:1px solid var(--line);
  border-radius:12px 12px 6px 6px;padding:8px 14px;margin-bottom:7px;
  box-shadow:inset 0 1px 0 #fffdf8,0 2px 6px #00000018}
.brand{display:flex;align-items:center;gap:11px;flex:1 1 auto;min-width:210px}
.mark{width:38px;height:38px;flex:0 0 38px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.04em;color:#f2efe6;
  background:linear-gradient(#4b5a53,#2f3a35);border:1px solid #26302c;
  box-shadow:inset 0 1px 0 #ffffff30,0 1px 2px #00000030}
h1{font-size:17px;margin:0;letter-spacing:.02em}
.sub{font-size:10.5px;color:var(--dim);margin-top:3px;font-family:var(--mono);letter-spacing:.05em}

/* ===== ステータス帯 ===== */
.statusbar{display:flex;flex-wrap:wrap;align-items:stretch;overflow:hidden;
  background:var(--ink);border:1px solid var(--line);border-radius:6px;margin-bottom:10px;
  font-family:var(--mono);font-size:11.5px;color:var(--dim);box-shadow:0 1px 2px #0000000f}
.st{padding:7px 14px;border-right:1px solid var(--line-lo);display:flex;gap:8px;align-items:center}
.st .k{font-size:8.5px;letter-spacing:.14em;color:var(--dim2)}
.st .v{color:var(--txt);font-weight:600}
.st.live{background:#e9f7f1}
.st.live .v{color:var(--ok-dk)}

/* ===== ステップタブ ===== */
.tabs{margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px}
.tab{min-height:44px;padding:6px 13px;border:1px solid var(--line);border-radius:7px;
  background:linear-gradient(#fdfcf8,#eeeade);color:var(--dim);cursor:pointer;
  font:inherit;font-size:12.5px;display:flex;align-items:center;gap:7px;
  box-shadow:0 1px 2px #0000000f}
.tab .no{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--dim2);
  border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:var(--ink)}
.tab:hover{background:linear-gradient(#ffffff,#f4f1e7)}
.tab.on{background:linear-gradient(#0f7d5e,#0a6249);color:#fff;border-color:#084b38;font-weight:600}
.tab.on .no{color:#d9f2e9;border-color:#ffffff55;background:#ffffff1f}
.tab.done .no::after{content:" ✓";color:var(--ok)}
.tab.on.done .no::after{color:#b8f0dc}

/* ===== 版組み ===== */
.cols{display:grid;grid-template-columns:1fr 330px;gap:12px;align-items:start}
.cols>*{min-width:0}   /* これが無いと、中の広い表が列を押し広げて画面から溢れる */
@media(max-width:1040px){.cols{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:14px 16px;margin-bottom:11px;box-shadow:0 1px 3px #00000010}
.card>h2{font-size:15px;margin:0 0 4px;letter-spacing:.02em}
.card>h2 .n{font-family:var(--mono);font-size:10.5px;color:var(--dim2);letter-spacing:.1em;
  border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin-right:8px;background:var(--ink)}
.lead{color:var(--dim);font-size:13px;margin:0 0 12px}
.note{background:var(--panel2);border-left:4px solid var(--line);border-radius:0 6px 6px 0;
  padding:9px 12px;font-size:12.5px;color:var(--dim);margin:11px 0}
.note b{color:var(--txt)}
.note.hi{background:var(--warn-lo);border-left-color:var(--warn)}
.note.good{background:var(--ok-lo);border-left-color:var(--ok)}
.note.bad{background:var(--ng-lo);border-left-color:var(--ng)}
.note.ask{background:var(--blue-lo);border-left-color:var(--blue)}

/* ===== 選択ボタン ===== */
.picks{display:flex;flex-wrap:wrap;gap:9px;margin:10px 0}
.pick{flex:1 1 180px;min-height:60px;padding:10px 13px;border:2px solid var(--line);border-radius:8px;
  background:var(--ink);cursor:pointer;font:inherit;text-align:left;color:var(--txt);
  display:flex;flex-direction:column;gap:2px;box-shadow:0 1px 2px #0000000d}
.pick b{font-size:13.5px}
.pick span{font-size:11.5px;color:var(--dim)}
.pick:hover{border-color:var(--edge)}
.pick.on{border-color:var(--ok);background:var(--ok-lo)}
.pick.on b{color:var(--ok-dk)}

/* ===== 費目の行 ===== */
.rows{border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--ink)}
.row{display:grid;grid-template-columns:1fr 210px 96px;gap:10px;align-items:center;
  padding:9px 12px;border-bottom:1px solid var(--line-lo)}
.row:last-child{border-bottom:0}
.row:nth-child(even){background:var(--panel2)}
.row .nm{font-size:13px}
.row .nm small{display:block;color:var(--dim);font-size:11px;line-height:1.45}
.row .amt{font-family:var(--mono);font-size:14px;font-weight:600;text-align:right;white-space:nowrap}
.step{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.step button{width:44px;height:44px;flex:0 0 44px;border:1px solid var(--line);border-radius:7px;
  background:linear-gradient(#fdfcf8,#eeeade);font:inherit;font-size:19px;line-height:1;
  color:var(--txt);cursor:pointer;box-shadow:0 1px 2px #0000000f}
.step button:hover{background:linear-gradient(#ffffff,#f4f1e7)}
.step button:active{background:var(--face2);box-shadow:inset 0 1px 3px #00000020}
.step input{width:96px;height:44px;border:1px solid var(--line);border-radius:7px;background:var(--panel);
  font-family:var(--mono);font-size:14px;text-align:right;padding:0 8px;color:var(--txt)}
.row.sum{background:var(--face);font-weight:700;border-top:2px solid var(--edge)}
.row.sum .amt{font-size:17px;color:var(--ok-dk)}
@media(max-width:620px){
  .row{grid-template-columns:1fr;gap:6px}
  .row .amt{text-align:left}
  .step{justify-content:flex-start}
}

/* ===== まとめ盤（右カラム） ===== */
.side{position:sticky;top:10px}
@media(max-width:1040px){.side{position:static}}
.gauge{border:1px solid var(--line);border-radius:8px;background:var(--ink);overflow:hidden;margin-bottom:10px}
.gauge .hd{background:var(--face);padding:6px 12px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.14em;color:var(--dim);border-bottom:1px solid var(--line)}
.gauge .bd{padding:11px 13px}
.big{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--ok-dk);line-height:1.2}
.big small{font-size:12px;color:var(--dim);font-weight:400;margin-left:3px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dotted var(--line-lo);font-size:12.5px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--dim)}
.kv .v{font-family:var(--mono);font-weight:600;white-space:nowrap}
.bar{display:flex;height:26px;border:1px solid var(--line);border-radius:5px;overflow:hidden;margin:9px 0 5px;background:var(--panel2)}
.bar i{display:block;height:100%;font-style:normal}
.bar i.net{background:repeating-linear-gradient(45deg,#0f7d5e,#0f7d5e 7px,#138866 7px,#138866 14px)}
.bar i.ins{background:#7fa8b8}
.bar i.tax{background:#c9a13f}
.bar i.res{background:#b46f5e}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:var(--dim)}
.legend b{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:4px}

/* ===== 求人票 ===== */
.kyujin{border:2px solid var(--txt);background:#fff;font-size:12.5px;margin:12px 0}
.kyujin .khd{background:var(--txt);color:#fff;padding:5px 10px;font-size:12px;
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-family:var(--mono)}
.kg{display:grid;grid-template-columns:132px 1fr;border-top:1px solid #8d887a}
.kg:first-of-type{border-top:0}
.kg>.kk{background:var(--panel2);padding:7px 9px;border-right:1px solid #8d887a;
  font-size:11.5px;color:var(--dim);display:flex;align-items:center;line-height:1.4}
.kg>.kv2{padding:7px 10px;line-height:1.55}
.kg>.kv2 .mono{font-family:var(--mono);font-weight:600}
.kg>.kv2 .sm{font-size:11.5px;color:var(--dim)}
.kbox{border:1px dashed var(--edge);border-radius:5px;padding:6px 9px;margin:5px 0;background:var(--panel2)}
@media(max-width:620px){.kg{grid-template-columns:1fr}.kg>.kk{border-right:0;border-bottom:1px solid #b9b3a3}}

/* ===== クイズ ===== */
.q{border:1px solid var(--line);border-radius:8px;background:var(--ink);padding:12px 14px;margin:11px 0}
.q .qt{font-weight:600;font-size:13.5px;margin-bottom:9px}
.q .qt i{font-style:normal;font-family:var(--mono);font-size:11px;color:#fff;background:var(--blue);
  border-radius:4px;padding:2px 7px;margin-right:8px;letter-spacing:.06em}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{min-height:44px;text-align:left;padding:9px 13px;border:1px solid var(--line);border-radius:7px;
  background:var(--panel);font:inherit;font-size:13px;color:var(--txt);cursor:pointer;line-height:1.5}
.opt:hover{background:#fff;border-color:var(--edge)}
.opt.ok{background:var(--ok-lo);border-color:var(--ok);font-weight:600}
.opt.ng{background:var(--ng-lo);border-color:var(--ng);text-decoration:line-through;color:var(--dim)}
.ans{margin-top:10px;padding:10px 12px;border-radius:6px;font-size:12.5px;display:none;line-height:1.65}
.ans.show{display:block}
.ans.good{background:var(--ok-lo);border-left:4px solid var(--ok)}
.ans.bad{background:var(--warn-lo);border-left:4px solid var(--warn)}

/* ===== 求人カード比較 ===== */
.jobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:11px;margin:12px 0}
.job{border:1px solid var(--line);border-radius:8px;background:var(--ink);overflow:hidden;
  box-shadow:0 1px 3px #00000012;display:flex;flex-direction:column}
.job .jh{padding:8px 11px;background:var(--face);border-bottom:1px solid var(--line)}
.job .jh b{font-size:13.5px;display:block}
.job .jh span{font-size:11.5px;color:var(--dim)}
.job .jb{padding:9px 11px;flex:1 1 auto}
.job .verdict{padding:9px 11px;font-size:12.5px;font-weight:600;text-align:center;border-top:1px solid var(--line)}
.job .verdict.ok{background:var(--ok-lo);color:var(--ok-dk)}
.job .verdict.warn{background:var(--warn-lo);color:var(--warn)}
.job .verdict.ng{background:var(--ng-lo);color:var(--ng)}
.job .verdict small{display:block;font-weight:400;color:var(--dim);margin-top:2px}

/* ===== 一般部品 ===== */
.btn{min-height:44px;padding:8px 18px;border:1px solid var(--line);border-radius:7px;
  background:linear-gradient(#fdfcf8,#eeeade);font:inherit;font-size:13px;color:var(--txt);
  cursor:pointer;box-shadow:0 1px 2px #0000000f}
.btn:hover{background:linear-gradient(#ffffff,#f4f1e7)}
.btn.go{background:linear-gradient(#12946f,#0a6249);color:#fff;border-color:#084b38;font-weight:600}
.btn.go:hover{background:linear-gradient(#15a77d,#0c7355)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:12px}
table.plain{width:100%;border-collapse:collapse;font-size:12.5px;margin:9px 0}
table.plain.wide{display:block;max-width:100%;overflow-x:auto;white-space:nowrap}
table.plain th,table.plain td{border:1px solid var(--line-lo);padding:6px 9px;text-align:left}
table.plain th{background:var(--panel2);color:var(--dim);font-weight:600;font-size:11.5px}
table.plain td.n{font-family:var(--mono);text-align:right;white-space:nowrap}
.hide{display:none!important}
.mono{font-family:var(--mono)}
.tagline{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  border:1px solid var(--line);border-radius:4px;padding:1px 6px;background:var(--ink);color:var(--dim)}

/* ===== ポップアップ（confirm/alert の代わり） ===== */
.veil{position:fixed;inset:0;background:#241f1799;display:none;align-items:center;justify-content:center;
  z-index:50;padding:16px}
.veil.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--edge);border-radius:10px;max-width:460px;width:100%;
  padding:18px 20px;box-shadow:0 10px 30px #00000040}
.modal p{margin:0 0 14px;font-size:13.5px;line-height:1.7}
.modal .mbtns{display:flex;gap:9px;justify-content:flex-end}
</style>
</head>
<body>
<div class="app">

  <div class="face">
    <div class="brand">
      <div class="mark">￥→</div>
      <div>
        <h1>進路設計工房</h1>
        <div class="sub">くらしの費用から必要な手取りを出し、求人票を読む</div>
      </div>
    </div>
    <span class="tagline" id="ver">VER</span>
  </div>

  <div class="statusbar" id="status"></div>

  <div class="tabs" id="tabs"></div>

  <div class="cols">
    <div id="stage"></div>
    <aside class="side" id="side"></aside>
  </div>

</div>

<div class="veil" id="veil"><div class="modal">
  <p id="mMsg"></p>
  <div class="mbtns"><button class="btn" id="mNo">とじる</button><button class="btn go" id="mYes">はい</button></div>
</div></div>

<script>
"use strict";
const VER="2026-09-18a";

/* ============================================================
   1. 税と社会保険の概算モデル
   ------------------------------------------------------------
   前提: 18〜19歳・独身・扶養なし・介護保険なし（40歳未満）・協会けんぽ。
   目的は「額面と手取りは違う」「2年目に住民税が来る」を体感させること。
   1円単位の正確さは目的ではない。率は毎年変わるので、年度が変わったら
   RATE の数字だけを差し替えれば全体が追従する。
   ============================================================ */
const RATE={
  kenko:0.0500,   // 健康保険 本人負担（協会けんぽ 約10%の労使折半）
  nenkin:0.0915,  // 厚生年金 本人負担（18.3%の労使折半）
  koyo:0.0055,    // 雇用保険 本人負担（一般の事業）
  fukko:1.021,    // 復興特別所得税
  shotoku:0.05,   // 所得税率（課税所得195万円以下）
  jumin:0.10,     // 住民税 所得割
  juminFlat:5000, // 住民税 均等割＋森林環境税
  juminKiso:430000// 住民税の基礎控除
};
const SHAHO=RATE.kenko+RATE.nenkin+RATE.koyo;   // 約14.7%

// 給与所得控除（年収→給与所得）。最低保障は65万円で、190万円までは一律
function kyuyoKoujo(a){
  if(a<=1900000) return 650000;
  if(a<=3600000) return Math.floor(a*0.3+80000);
  if(a<=6600000) return Math.floor(a*0.2+440000);
  if(a<=8500000) return Math.floor(a*0.1+1100000);
  return 1950000;
}
// 所得税の基礎控除（合計所得に応じて変わる）
function kisoKoujo(shotoku){
  if(shotoku<=1320000) return 950000;
  if(shotoku<=3360000) return 880000;
  if(shotoku<=4890000) return 680000;
  if(shotoku<=6550000) return 630000;
  return 580000;
}
/* 年収（額面）から手取りを出す。year2=true で住民税ありの2年目以降 */
function tedori(gross,year2){
  const g=Math.max(0,Math.round(gross));
  const kenko=Math.round(g*RATE.kenko), nenkin=Math.round(g*RATE.nenkin), koyo=Math.round(g*RATE.koyo);
  const shaho=kenko+nenkin+koyo;
  const sho=Math.max(0,g-kyuyoKoujo(g));                       // 給与所得
  const ka1=Math.max(0,sho-shaho-kisoKoujo(sho));              // 所得税の課税所得
  const zei=Math.floor(ka1*RATE.shotoku*RATE.fukko);
  const ka2=Math.max(0,sho-shaho-RATE.juminKiso);              // 住民税の課税所得
  const jumin=year2 ? (ka2>0 ? Math.floor(ka2*RATE.jumin)+RATE.juminFlat : 0) : 0;
  return {gross:g,kenko:kenko,nenkin:nenkin,koyo:koyo,shaho:shaho,zei:zei,jumin:jumin,
          hiku:shaho+zei+jumin, net:g-shaho-zei-jumin};
}
/* 手取りから額面を逆算する。単調増加なので二分探索でよい */
function gakumen(netWant,year2){
  if(!(netWant>0)) return 0;
  let lo=0, hi=Math.max(2000000,netWant*2+1000000);
  for(let i=0;i<60;i++){
    const mid=(lo+hi)/2;
    if(tedori(mid,year2).net < netWant) lo=mid; else hi=mid;
  }
  return Math.ceil(hi/1000)*1000;
}

/* ============================================================
   2. 費目
   ============================================================ */
const LIVES=[
  {id:"alone",nm:"ひとり暮らし",sub:"アパートを借りて住む",shoki:450000,
   shokiNote:"敷金・礼金・仲介手数料で約30万円、家具・家電・カーテンで約15万円。<b>働き始める前に要る</b>"},
  {id:"home", nm:"実家から通う", sub:"家にお金を入れる",  shoki:50000,
   shokiNote:"スーツ・靴・カバン・作業着などの準備で約5万円"},
  {id:"dorm", nm:"会社の寮に入る",sub:"寮費を引かれて住む",shoki:100000,
   shokiNote:"布団・家電・生活用品で約10万円。敷金・礼金は要らないことが多い"}
];
// g:"m"=毎月 / "y"=年に数回   per:何か月に一度（yのみ）   car:車が要るとき only:暮らし方
const ITEMS=[
 {id:"rent", g:"m",nm:"家賃・共益費",         tip:"地方のワンルームで4〜6万円。駐車場が別料金のことも多い", step:5000,only:["alone"],   def:{alone:55000}},
 {id:"dormf",g:"m",nm:"寮費（給料から引かれる）",tip:"食事つきで1〜3万円。ただし退職すると住む所がなくなる",   step:1000,only:["dorm"],    def:{dorm:15000}},
 {id:"ineie",g:"m",nm:"家に入れるお金",        tip:"食費・光熱費の分担。金額は家庭による",                 step:5000,only:["home"],    def:{home:30000}},
 {id:"food", g:"m",nm:"食費",                 tip:"1日1000円で月3万円。自炊すると下がるが時間は要る",     step:1000,def:{alone:32000,home:12000,dorm:20000}},
 {id:"util", g:"m",nm:"水道・電気・ガス",      tip:"夏と冬は倍近くになる月がある",                       step:1000,only:["alone","dorm"],def:{alone:11000,dorm:5000}},
 {id:"phone",g:"m",nm:"スマホ・通信",          tip:"大手キャリアで8千円前後、格安なら3千円前後",           step:1000,def:{alone:8000,home:8000,dorm:8000}},
 {id:"daily",g:"m",nm:"日用品・洗剤など",      tip:"トイレットペーパー、シャンプー、ゴミ袋。地味に効く",    step:1000,def:{alone:4000,home:2000,dorm:4000}},
 {id:"cloth",g:"m",nm:"服・散髪",             tip:"散髪だけで月2千円前後",                             step:1000,def:{alone:7000,home:7000,dorm:7000}},
 {id:"med",  g:"m",nm:"医療費・薬",           tip:"3割負担。歯医者に通うと月数千円",                    step:500, def:{alone:2000,home:2000,dorm:2000}},

/* ============================================================
   3. 状態と道具
   ============================================================ */
const S={life:"alone",car:true,step:0,v:{},edited:{},bonus:4.0,quiz:{},seen:{}};
const $=id=>document.getElementById(id);
const yen=n=>Math.round(n).toLocaleString("ja-JP")+"円";
const man=n=>(Math.round(n/1000)/10).toFixed(1)+"万円";
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function shown(it){
  if(it.only && it.only.indexOf(S.life)<0) return false;
  if(it.car && !S.car) return false;
  if(it.nocar && S.car) return false;
  return true;
}
function defOf(it){ const d=it.def&&it.def[S.life]; return typeof d==="number"?d:0; }
function applyDefaults(force){
  ITEMS.forEach(it=>{ if(force||!S.edited[it.id]) S.v[it.id]=defOf(it); });
}
function monthOf(it){ return it.g==="m" ? (S.v[it.id]||0) : (S.v[it.id]||0)/(it.per||12); }
function sumOf(g){ let t=0; ITEMS.forEach(it=>{ if(it.g===g&&shown(it)) t+=monthOf(it); }); return t; }
function outMonth(){ return sumOf("m")+sumOf("y"); }
function needNetYear(){ return outMonth()*12; }
function needGross(year2){ return gakumen(needNetYear(),year2); }
function needMonthly(year2){ return needGross(year2)/(12+S.bonus); }

/* 保存（使えない環境もあるので必ず try で包む） */
function save(){ try{ localStorage.setItem("shinro1",JSON.stringify(
  {life:S.life,car:S.car,v:S.v,edited:S.edited,bonus:S.bonus,quiz:S.quiz,seen:S.seen,step:S.step})); }catch(e){} }
function load(){ try{ const t=localStorage.getItem("shinro1"); if(!t) return false;
  const o=JSON.parse(t); if(!o||typeof o!=="object") return false;
  if(o.life) S.life=o.life; if(typeof o.car==="boolean") S.car=o.car;
  if(o.v) S.v=o.v; if(o.edited) S.edited=o.edited; if(typeof o.bonus==="number") S.bonus=o.bonus;
  if(o.quiz) S.quiz=o.quiz; if(o.seen) S.seen=o.seen;
  if(typeof o.step==="number") S.step=o.step;
  return true; }catch(e){ return false; } }

/* ポップアップ。ブラウザの confirm / alert は使わない（環境によって無言で失敗する） */
let onYes=null;
function ask(msg,fn,label){ $("mMsg").innerHTML=msg; $("mYes").textContent=label||"はい";
  $("mYes").classList.remove("hide"); $("mNo").textContent="やめる"; onYes=fn; $("veil").classList.add("on"); }
function tell(msg){ $("mMsg").innerHTML=msg; $("mYes").classList.add("hide");
  $("mNo").textContent="とじる"; onYes=null; $("veil").classList.add("on"); }
function closeModal(){ $("veil").classList.remove("on"); }

const STEPS=[
  {nm:"くらし方を決める",  draw:drawLife},
  {nm:"毎月かかるお金",    draw:drawMonth},
  {nm:"年に数回かかるお金",draw:drawYear},
  {nm:"手取りから額面へ",  draw:drawPay},
  {nm:"求人票を読む",      draw:drawKyujin},

];
function drawTabs(){
  $("tabs").innerHTML=STEPS.map((s,i)=>
    '<button class="tab'+(i===S.step?" on":"")+(S.seen[i]?" done":"")+'" data-i="'+i+'">'+
    '<span class="no">'+(i+1)+'</span>'+esc(s.nm)+'</button>').join("");
  Array.prototype.forEach.call($("tabs").children,b=>b.onclick=()=>go(+b.dataset.i));
}
function go(i){ S.step=Math.max(0,Math.min(STEPS.length-1,i)); S.seen[S.step]=1; save(); render(); window.scrollTo(0,0); }
function navHTML(){
  return '<div class="nav">'+
    (S.step>0?'<button class="btn" id="prevBtn">← '+esc(STEPS[S.step-1].nm)+'</button>':'<span></span>')+
    (S.step<STEPS.length-1?'<button class="btn go" id="nextBtn">'+esc(STEPS[S.step+1].nm)+' →</button>':'<span></span>')+
    '</div>';
}
function bindNav(){
  const p=$("prevBtn"), n=$("nextBtn");
  if(p) p.onclick=()=>go(S.step-1);

}

function render(){ drawTabs(); drawStatus(); STEPS[S.step].draw(); drawSide(); bindNav(); }

function rowsHTML(g){
  const list=ITEMS.filter(it=>it.g===g&&shown(it));
  let h='<div class="rows">';
  list.forEach(it=>{
    const v=S.v[it.id]||0;
    h+='<div class="row"><div class="nm">'+esc(it.nm)+
       (it.g==="y"?' <span class="tagline">'+(it.per===24?"2年に一度":"年に一度")+'</span>':'')+
       '<small>'+it.tip+'</small></div>'+
       '<div class="step"><button data-d="-1" data-id="'+it.id+'">−</button>'+
       '<input type="text" inputmode="numeric" data-id="'+it.id+'" value="'+v+'">'+
       '<button data-d="1" data-id="'+it.id+'">＋</button></div>'+
       '<div class="amt">'+(it.g==="y"?"月 "+yen(monthOf(it)):yen(v))+'</div></div>';
  });
  const t=sumOf(g);
  h+='<div class="row sum"><div class="nm">'+(g==="m"?"毎月かかるお金の合計":"年に数回のもの（1か月あたり）")+
     '</div><div></div><div class="amt">'+yen(t)+'</div></div></div>';
  return h;
}
function bindRows(){
  Array.prototype.forEach.call(document.querySelectorAll(".step button"),b=>{
    b.onclick=()=>{
      const it=ITEMS.filter(x=>x.id===b.dataset.id)[0]; if(!it) return;
      S.v[it.id]=Math.max(0,(S.v[it.id]||0)+(+b.dataset.d)*it.step);
      S.edited[it.id]=1; save(); render();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll(".step input"),inp=>{
    inp.onchange=()=>{
      const n=parseInt(String(inp.value).replace(/[^0-9]/g,""),10);
      S.v[inp.dataset.id]=isNaN(n)?0:n; S.edited[inp.dataset.id]=1; save(); render();
    };
  });
}

/* 求人票1件から数字を出す */
function calcJob(j){
  const teateSum=j.teate.reduce((s,t)=>s+t.v,0);
  const month=j.kihon+teateSum;                 // 毎月必ず支払われる額（a＋b）
  const bonusYen=Math.round(j.kihon*j.bonus);   // 賞与は基本給にかけるのが普通
  const year=month*12+bonusYen;
  const t1=tedori(year,false), t2=tedori(year,true);
  const shoteiY=(365-j.nenkyu)*j.jitsudo;       // 年間の所定労働時間
  const otY=j.ot*12;                            // 年間の時間外労働
  const hours=shoteiY+otY;
  const gas=S.car?(S.v.gas||0):(S.v.teiki||0);  // 通勤にかかる自分の費用
  const tsukin=Math.min(gas,j.tsukinMax);       // 戻ってくる分（非課税・月）
  return {teateSum:teateSum,month:month,bonusYen:bonusYen,year:year,t1:t1,t2:t2,
          hours:hours,shoteiY:shoteiY,otY:otY,
          jikyu:hours?year/hours:0, tsukin:tsukin, jikoFutan:Math.max(0,gas-j.tsukinMax),
          net1:t1.net/12+tsukin, net2:t2.net/12+tsukin};
}
function verdictOf(j){
  const c=calcJob(j), need=outMonth(), d=c.net2-need;
  let cls="ng",txt="足りない";
  if(d>=20000){cls="ok";txt="余裕がある";}
  else if(d>=0){cls="warn";txt="ぎりぎり";}
  return {cls:cls,txt:txt,diff:d,c:c};
}

  $("stage").innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll(".opt"),b=>{
    b.onclick=()=>{ S.quiz[+b.dataset.q]=+b.dataset.k; save(); render(); };
  });
  $("qReset").onclick=()=>{ S.quiz={}; save(); render(); };
}

/* ============================================================
   10. 段階6 3件を比べる
   ============================================================ */
function drawCompare(){
  const need=outMonth();
  const V=JOBS.map(j=>verdictOf(j));
  const best=JOBS.map((j,i)=>({i:i,h:V[i].c.jikyu})).sort((a,b)=>b.h-a.h)[0].i;
  const rich=JOBS.map((j,i)=>({i:i,m:V[i].c.month})).sort((a,b)=>b.m-a.m)[0].i;

  let h='<div class="card"><h2><span class="n">STEP 6</span>3件を比べて、暮らせるかを判定する</h2>'+
  '<p class="lead">同じ高卒求人を3件並べた。<b>判定の基準は「必要な手取り 月 '+yen(need)+'」</b>。'+
  '君がSTEP1〜3で積み上げた数字だ。くらし方を変えれば、この判定も変わる。</p>'+
  '<div class="jobs">'+JOBS.map((j,i)=>{
    const v=V[i], c=v.c;
    return '<div class="job"><div class="jh"><b>'+j.id+'　'+esc(j.co)+'</b><span>'+esc(j.job)+'</span></div>'+
    '<div class="jb">'+
    '<div class="kv"><span class="k">毎月の額（a＋b）</span><span class="v">'+yen(c.month)+'</span></div>'+
    '<div class="kv"><span class="k">うち固定残業代</span><span class="v">'+(j.fixedOT?yen(j.fixedOT.v)+' / '+j.fixedOT.h+'h':'なし')+'</span></div>'+
    '<div class="kv"><span class="k">基本給</span><span class="v">'+yen(j.kihon)+'</span></div>'+
    '<div class="kv"><span class="k">賞与（基本給×'+j.bonus.toFixed(1)+'）</span><span class="v">'+yen(c.bonusYen)+'</span></div>'+
    '<div class="kv"><span class="k">年収（額面）</span><span class="v">'+yen(c.year)+'</span></div>'+
    '<div class="kv"><span class="k">手取り 月（1年目）</span><span class="v">'+yen(c.t1.net/12)+'</span></div>'+
    '<div class="kv"><span class="k">手取り 月（2年目〜）</span><span class="v">'+yen(c.t2.net/12)+'</span></div>'+
    '<div class="kv"><span class="k">通勤手当で戻る分</span><span class="v">＋'+yen(c.tsukin)+'</span></div>'+
    '<div class="kv"><span class="k">年間休日</span><span class="v">'+j.nenkyu+'日</span></div>'+
    '<div class="kv"><span class="k">月平均の残業</span><span class="v">'+j.ot+'時間</span></div>'+
    '<div class="kv"><span class="k">年間の労働時間</span><span class="v">'+Math.round(c.hours)+'時間</span></div>'+
    '<div class="kv"><span class="k"><b>1時間あたり</b></span><span class="v">'+yen(c.jikyu)+'</span></div>'+
    '<div class="kv"><span class="k">寮</span><span class="v">'+(j.ryouV?yen(j.ryouV)+'/月':'なし')+'</span></div>'+
    '<div class="kv"><span class="k">1年以内の離職</span><span class="v">'+
      esc(j.jisseki.replace(/^.*／\s*/,""))+'</span></div>'+
    '</div><div class="verdict '+v.cls+'">2年目に使える額 '+yen(c.net2)+'<br>'+v.txt+
    '<small>必要な '+yen(need)+' との差 '+(v.diff>=0?"＋":"−")+yen(Math.abs(v.diff))+'</small></div></div>';
  }).join("")+'</div>'+

  '<div class="note"><b>「使える額」の出し方</b><br>'+
  '手取り（月）＋ 通勤手当で戻る分。通勤手当は給料とは別に支払われ、上限まで実費が戻るので、'+
  'ガソリン代・定期代の分を打ち消す。上限を超えた分は自己負担のまま残る。<br>'+
  'STEP2のガソリン代を 15,000円 に上げてみること。'+
  '<b>Aだけ上限10,000円を超えて、月5,000円が自分の財布から出る</b>のが見える。'+
  '同じ月給でも、通勤手当の上限が違えば手元に残る額は変わる。</div>'+

  '<h2 style="font-size:14px;margin-top:18px">数字を並べ替えて見る</h2>'+
  '<table class="plain wide"><tr><th>並べ方</th><th>1位</th><th>2位</th><th>3位</th></tr>'+
  ['month','year','jikyu','nenkyu'].map(key=>{
    const label={month:"毎月の額（a＋b）",year:"年収（額面）",jikyu:"1時間あたり",nenkyu:"年間休日"}[key];
    const arr=JOBS.map((j,i)=>({id:j.id,v:key==="nenkyu"?j.nenkyu:V[i].c[key]}))
                  .sort((a,b)=>b.v-a.v);
    return '<tr><td>'+label+'</td>'+arr.map(a=>'<td class="n">'+a.id+'　'+
      (key==="nenkyu"?a.v+"日":yen(a.v))+'</td>').join("")+'</tr>';}).join("")+'</table>'+

  '<div class="note hi"><b>順位が入れ替わる</b><br>'+
  '毎月の額がいちばん多いのは <b>'+JOBS[rich].id+'</b>。'+
  'ところが1時間あたりでいちばん高いのは <b>'+JOBS[best].id+'</b>。<br>'+
  '理由は二つ。<b>年間休日</b>と<b>残業時間</b>。働く時間が長ければ、同じ給料でも1時間の値段は下がる。'+
  '求人票の「年間休日数」と「時間外労働 月平均」は、賃金欄と<b>セットで読む</b>。</div>'+

  '<h2 style="font-size:14px;margin-top:18px">届かないとき、何をどれだけ動かせば届くか</h2>'+
  '<table class="plain wide"><tr><th>暮らし方</th><th style="text-align:right">月の支出</th>'+
  '<th style="text-align:right">いまとの差</th><th>成り立つ求人</th></tr>'+
  [["いま（"+LIVES.filter(l=>l.id===S.life)[0].nm+"・車"+(S.car?"あり":"なし")+"）",S.life,S.car],
   ["ひとり暮らし・車なし","alone",false],
   ["実家から通う・車あり","home",true],
   ["実家から通う・車なし","home",false],
   ["会社の寮・車あり","dorm",true]].map(r=>{
     const m=whatIf(r[1],r[2]), diff=m-need;
     const pass=JOBS.map((j,i)=>V[i].c.net2>=m?j.id:null).filter(x=>x).join("・")||"なし";
     const cur=(r[1]===S.life&&r[2]===S.car);
     return '<tr'+(cur?' style="background:var(--ok-lo)"':'')+'><td>'+esc(r[0])+'</td>'+
       '<td class="n">'+yen(m)+'</td><td class="n">'+(diff===0?"—":(diff>0?"＋":"−")+yen(Math.abs(diff)))+
       '</td><td>'+pass+'</td></tr>';}).join("")+'</table>'+
  '<div class="note'+(V.filter(v=>v.cls==="ng").length===3?" bad":"")+'">'+
  (V.filter(v=>v.cls==="ng").length===3
   ? '<b>3件とも足りない。これは失敗ではない。</b><br>'+
     '高卒の初任給で<b>ひとり暮らしをして車も持つ</b>のは、実際にかなり厳しい。'+
     'だから多くの人が、最初の数年は実家や寮から通って貯め、そのあとで動く。'+
     '上の表で、どの一手がいくら効くかを見ること。<b>支出を削るか、収入の高い求人を狙うか、その両方か。</b>'
   : '<b>成り立つ組み合わせが見つかった。</b>次は、その暮らしを<b>10年続けられるか</b>を考える。'+
     '車は買い替えが来る。給料は昇給で上がるが、住民税も社会保険料も一緒に上がる。')+'</div>'+
  '<div class="note ask"><b>確かめてみる</b><br>'+
  '① STEP1 に戻って「実家から通う」に変えると、判定はどう変わるか。<br>'+
  '② 「車を持たない」にすると月いくら浮くか。そのとき通える会社は減らないか。<br>'+
  '③ 求人Bの寮（月 '+yen(JOBS[1].ryouV)+'）に入ると、家賃はいくら下がるか。'+
  'STEP2の家賃欄を書き換えて、もう一度ここを見ること。</div>'+

  '<div class="note bad"><b>金額以外にも、求人票は多くを語る</b><br>'+
  '・<b>1年以内の離職者数</b>… 採用5名のうち3名が1年以内に辞めた職場では、何が起きているか<br>'+
  '・<b>退職金制度なし</b>… 長く勤めても、辞めるときに出るものがない<br>'+
  '・<b>転勤あり</b>… 住む場所を自分で選べない年がある<br>'+
  '・<b>加入保険</b>… 雇用・労災・健康・厚生の4つが揃っているか。欠けている求人は理由を必ず聞く</div>'+
  navHTML()+'</div>';
  $("stage").innerHTML=h;
}

/* ============================================================
   11. 段階7 まとめ
   ============================================================ */
function drawSum(){
  const out=outMonth(), g2=needGross(true), m2=g2/(12+S.bonus);
  const life=LIVES.filter(l=>l.id===S.life)[0];
  const V=JOBS.map(j=>verdictOf(j));
  const ok=V.filter(v=>v.cls!=="ng").length;
  $("stage").innerHTML=
  '<div class="card"><h2><span class="n">STEP 7</span>まとめ</h2>'+
  '<p class="lead">ここまでで出した数字を並べる。<b>この紙面を書き写すか、画面を保存しておくこと。</b>'+
  '進路の面談で、根拠のある話ができる。</p>'+
  '<table class="plain">'+
  '<tr><th>項目</th><th style="text-align:right">自分の数字</th></tr>'+
  '<tr><td>くらし方</td><td class="n">'+esc(life.nm)+'　／　車 '+(S.car?"あり":"なし")+'</td></tr>'+
  '<tr><td>毎月かかるお金</td><td class="n">'+yen(sumOf("m"))+'</td></tr>'+
  '<tr><td>年に数回かかるお金（月割り）</td><td class="n">'+yen(sumOf("y"))+'</td></tr>'+
  '<tr><td><b>必要な手取り</b></td><td class="n"><b>'+yen(out)+' ／月</b></td></tr>'+
  '<tr><td>必要な年収（額面・2年目の条件）</td><td class="n">'+yen(g2)+'</td></tr>'+
  '<tr><td><b>求人票で見るべき下限（a＋b）</b></td><td class="n"><b>'+yen(m2)+' ／月</b></td></tr>'+
  '<tr><td>働き始める前に要るお金</td><td class="n">約 '+yen(life.shoki)+'</td></tr>'+
  '</table>'+
  '<div class="note '+(ok?"good":"bad")+'"><b>3件のうち、いまの暮らし方で成り立つのは '+ok+' 件</b><br>'+
  JOBS.map((j,i)=>j.id+'（'+esc(j.co)+'）… <b>'+V[i].txt+'</b>　差 '+
    (V[i].diff>=0?"＋":"−")+yen(Math.abs(V[i].diff))).join("<br>")+'</div>'+

  '<h2 style="font-size:14px;margin-top:18px">求人票を渡されたら、必ず見る欄</h2>'+
  '<table class="plain"><tr><th>欄</th><th>何を確かめるか</th></tr>'+
  '<tr><td>基本給（a）</td><td>賞与と昇給の土台。ここが低いと、月給が高く見えても後で効いてくる</td></tr>'+
  '<tr><td>定額の手当（b）</td><td><b>固定残業代が入っていないか</b>。何時間分でいくらか</td></tr>'+
  '<tr><td>時間外労働</td><td>月平均の時間。固定残業の時間数を超えていないか</td></tr>'+
  '<tr><td>年間休日数</td><td>105日と125日では、1年で20日ちがう。1時間あたりの給料が変わる</td></tr>'+
  '<tr><td>賞与</td><td>「前年度実績」は約束ではない。基本給の何か月分か</td></tr>'+
  '<tr><td>昇給</td><td>前年度実績が「0円〜」なら、上がらない年もあるということ</td></tr>'+
  '<tr><td>通勤手当</td><td>上限額。自分の通勤費が上限を超えないか</td></tr>'+
  '<tr><td>加入保険</td><td>雇用・労災・健康・厚生の4つ揃っているか</td></tr>'+
  '<tr><td>退職金制度</td><td>あり／なし。勤続何年からか</td></tr>'+
  '<tr><td>採用・離職の実績</td><td>採用人数に対して、何人が1年以内に辞めたか</td></tr>'+
  '<tr><td>就業場所・転勤</td><td>通える場所か。マイカー通勤の可否と駐車場代</td></tr>'+
  '</table>'+

  '<div class="note ask"><b>次にやること</b><br>'+
  '① 進路指導室にある<b>本物の求人票</b>を1枚見せてもらい、この画面と同じ欄を順に指でたどる。<br>'+
  '② その求人の a＋b と、自分の「見るべき下限 '+yen(m2)+'」を比べる。<br>'+
  '③ 分からない欄があったら、先生かハローワークに<b>質問する</b>。'+
  '求人票は質問されることを前提に作られている。聞くのは失礼ではない。</div>'+

  '<div class="note"><b>この計算は概算</b>。税率・保険料率は毎年変わり、住んでいる市町村でも少し違う。'+
  '目的は1円まで当てることではなく、<b>「額面と手取りは違う」「2年目に住民税が来る」'+
  '「休日と残業まで見ないと給料は比べられない」</b>を身体で分かっておくこと。</div>'+

  '<div style="margin-top:12px"><button class="btn" id="allReset">最初からやり直す</button></div>'+
  navHTML()+'</div>';
  $("allReset").onclick=()=>ask("入力・答えをすべて消して最初からやり直す。よいか？",()=>{
    S.edited={}; S.quiz={}; S.seen={}; applyDefaults(true); closeModal(); go(0); },"やり直す");
}

/* ============================================================
   12. 起動
   ============================================================ */
$("mNo").onclick=closeModal;
$("mYes").onclick=()=>{ const f=onYes; onYes=null; if(f) f(); else closeModal(); };
$("veil").onclick=e=>{ if(e.target===$("veil")) closeModal(); };
$("ver").textContent="版 "+VER;
load();
ITEMS.forEach(it=>{ if(typeof S.v[it.id]!=="number") S.v[it.id]=defOf(it); });
S.seen[S.step]=1;
render();
</script>
