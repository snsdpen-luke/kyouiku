<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>距離センサ 第1時</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-screen 4:3 slide deck — each slide = moving picture (left) + one question or one idea (right); glossary column far right. Single light look on purpose (school tablets). Same engine as 車輪速センサ 1・2. */
:root{
  color-scheme:light;
  --paper:#eef0ee; --sheet:#fbfbf8; --ink:#1d2b3a; --mute:#5d6b78; --line:#c5ccd1;
  --metal:#c9d1d6; --tire:#2a333c; --road:#d9dedb; --amber:#c96a00; --amber-soft:#fbe7cf;
  --teal:#1f7a6d; --teal-soft:#d5ece7; --blue:#2f6db5; --blue-soft:#dde8f6;
  --good:#1f7a4d; --good-soft:#d9efe2; --bad:#b3261e; --bad-soft:#f7dcd9;
  --f-disp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;padding-inline:12px;padding-block:10px;box-sizing:border-box;overflow:hidden}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.app{height:100%;max-width:1180px;margin:0 auto;display:grid;grid-template-rows:auto 1fr;gap:8px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{margin:0;font-family:var(--f-disp);font-weight:900;font-size:1.15rem;line-height:1.2;white-space:nowrap}
header h1 small{font-family:var(--f-body);font-weight:700;font-size:.8rem;color:var(--mute);margin-left:8px}
.prog{flex:1;max-width:420px;display:flex;align-items:center;gap:10px}
.bar{flex:1;height:8px;background:var(--sheet);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--teal);transition:width .3s}
.pn{font-family:var(--f-mono);font-size:.8rem;color:var(--mute);white-space:nowrap}
.body{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:10px;min-height:0}
.slide{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;grid-template-rows:auto 1fr auto;gap:10px;min-height:0;min-width:0}
.sec{margin:0;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;color:var(--amber)}
.slide h2{margin:0;font-family:var(--f-disp);font-weight:900;font-size:1.45rem;line-height:1.3;text-wrap:balance}
.work{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;min-height:0}
.work.solo{grid-template-columns:1fr}
.lab{display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0}
.cv{position:relative;flex:1;min-height:200px;background:var(--paper);border-radius:8px;overflow:hidden}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ctrl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.88rem;min-height:38px}
.ctrl label{display:flex;align-items:center;gap:6px}
.ctrl input[type=range]{width:150px;accent-color:var(--amber)}
.btn{border:1.5px solid var(--ink);background:var(--sheet);border-radius:6px;padding:4px 14px;min-height:40px;font-weight:700;font-size:.9rem}
.btn.dark{background:var(--ink);color:var(--sheet)}
.btn[aria-pressed="true"]{background:var(--amber-soft);border-color:var(--amber)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.read{font-family:var(--f-mono);font-variant-numeric:tabular-nums;background:var(--ink);color:var(--sheet);border-radius:4px;padding:2px 8px;font-size:.88rem}
.side{display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:0;padding-right:4px}
.txt{margin:0;font-size:1rem}
.txt.big{font-size:1.15rem}
.note{margin:0;background:var(--paper);border-radius:6px;padding:8px 12px;font-size:.92rem}
.qt{margin:0;font-weight:700;font-size:1.02rem;border-left:4px solid var(--amber);padding-left:10px}
.qrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qrow input{width:7em;border:1.5px solid var(--line);border-radius:6px;padding:6px 10px;font-family:var(--f-mono);font-size:1.05rem;background:var(--paper)}
.unit{font-size:1rem}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:6px;padding:8px 12px;text-align:left;font-size:.95rem;min-height:44px}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ng{border-color:var(--bad);background:var(--bad-soft)}
textarea{width:100%;border:1.5px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--paper);resize:vertical;min-height:4.5em;font-size:.95rem}
.fb{margin:0;border-radius:6px;padding:8px 12px;font-size:.92rem}
.fb.ok{background:var(--good-soft)}
.fb.ng{background:var(--bad-soft)}
.fb.ex{background:var(--blue-soft)}
.fb b{display:block}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nav .hint{font-size:.85rem;color:var(--mute)}
.nav .btn{min-width:110px;min-height:44px}
.hero{display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap}
.hero .num{font-family:var(--f-disp);font-weight:900;font-size:7rem;line-height:1;color:var(--amber)}
.hero .num small{font-size:2.4rem;color:var(--mute)}
aside{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:0;overflow-y:auto}
aside h3{margin:0;font-family:var(--f-disp);font-weight:900;font-size:1rem}
.term{border-top:1px solid var(--line);padding-top:6px}
.term b{display:block;font-size:.92rem}
.term span{font-size:.82rem;color:var(--mute)}
.term.new{background:var(--amber-soft);margin-inline:-6px;padding-inline:6px;border-radius:4px}
.term.new b::after{content:"NEW";margin-left:6px;font-family:var(--f-mono);font-size:.62rem;color:var(--sheet);background:var(--amber);border-radius:3px;padding:0 4px;vertical-align:2px}
@media (max-width:820px){
  body{overflow:auto}
  .app{height:auto}
  .body{grid-template-columns:1fr}
  .work{grid-template-columns:1fr}
  .cv{min-height:240px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>距離センサ<small>第1時　距離を「時間」で測る</small></h1>
    <div class="prog"><div class="bar"><b id="bar"></b></div><span class="pn" id="pn"></span></div>
  </header>
  <div class="body">
    <section class="slide" id="slide" aria-live="polite"></section>
    <aside id="gloss" aria-label="用語"></aside>
  </div>
</div>

<script>
(function(){
const $=s=>document.querySelector(s);
const TERMS={
  echo:["反射（はんしゃ）","音や光が、物に当たってはね返ることです。山びこは、声が山に反射して返ってきたものです。"],
  rt:["往復時間（おうふくじかん）","音を出してから、物に当たって返ってくるまでの時間です。「行き」と「帰り」の両方が入っています。"],
  vs:["音速（おんそく）","音が進む速さです。空気の中では、1秒に約340m進みます。この教材では340m/sで計算します。"],
  us:["超音波（ちょうおんぱ）","人の耳には聞こえない、とても高い音です。車の駐車センサやコウモリが使っています。"],
  psen:["超音波センサ","超音波を出して、返ってくるまでの時間から距離を測る部品です。車ではバンパーの丸い部分です。"],
  vt:["音速と気温","音速は気温が高いほど速くなります。音速 ≒ 331.5 ＋ 0.6 × 気温（m/s）。0℃で約331m/s、30℃で約350m/s です。"],
  ring:["残響（ざんきょう）","音を出したあと、振動板がしばらく震え続けることです。この間は返ってきた音を聞き分けられません。"],
  tof:["飛行時間（TOF）","Time of Flight。音や電波が出てから返ってくるまでの時間のことです。往復時間と同じ意味で、センサの説明書ではこう書かれます。"],
  trig:["トリガー（Trig）","「今、音を出せ」という合図の信号です。Arduino の超音波センサでは Trig ピンに 10µs の信号を入れると、超音波が出ます。"],
  echo2:["エコー（Echo）","センサが「音を出してから返ってくるまで」ON にする信号です。この ON の長さ（パルス幅）がそのまま往復時間です。"],
  pw:["パルス幅","信号が ON になっている時間の長さです。Echo のパルス幅 ＝ 往復時間。Arduino では pulseIn() で µs 単位で測れます。"],
  txrx:["送信・受信（送受一体）","音を出す部品が送信（Tx）、聞く部品が受信（Rx）です。車の駐車センサは 1 枚の板で両方をするので「送受一体」です。"],
  dir:["指向性","音や電波が、どのくらい狭い方向にまとまって出るかです。高い音ほど指向性が強く、まっすぐ飛びます。"],
  att:["減衰（げんすい）","音や電波が進むうちに弱くなることです。広がる分と、空気に吸われる分があります。高い音ほど空気に吸われやすいです。"],
  ms:["ミリ秒（ms）","1000分の1秒です。1ms＝0.001秒。6ms＝0.006秒です。"]
};
const VS=340; /* この教材での音速 m/s */
const MAXR=5; /* この教材では：5mより遠いと返りが弱くて読めない */

/* ---------- canvas ---------- */
let raf=0, ctx=null, cv=null, W=0, H=0, onFrame=null, last=0;
function mountCanvas(host){ cv=document.createElement("canvas"); host.appendChild(cv); ctx=cv.getContext("2d"); fit(); }
function fit(){ if(!cv) return; const r=cv.getBoundingClientRect(), d=window.devicePixelRatio||1; W=r.width; H=r.height; cv.width=Math.round(W*d); cv.height=Math.round(H*d); ctx.setTransform(d,0,0,d,0,0); }
window.addEventListener("resize",fit);
function loop(t){ const dt=Math.min(.05,(t-last)/1000||0); last=t; if(onFrame&&ctx){ ctx.clearRect(0,0,W,H); onFrame(dt);} raf=requestAnimationFrame(loop); }
function stopAnim(){ cancelAnimationFrame(raf); onFrame=null; cv=null; ctx=null; }
function startAnim(fn){ onFrame=fn; last=performance.now(); raf=requestAnimationFrame(loop); }
const C=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function txt(s,x,y,size,color,align,mono){ ctx.font=mono?`700 ${size}px "JetBrains Mono", monospace`:`700 ${size}px "BIZ UDPGothic", sans-serif`; ctx.fillStyle=color; ctx.textAlign=align||"left"; ctx.textBaseline="middle"; ctx.fillText(s,x,y); }

/* beep (only after the student turns it on) */
let actx=null, sound=false;
function beep(f,len){ if(!sound) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=f||1200; g.gain.setValueAtTime(.2,actx.currentTime); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+(len||.08)); o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+(len||.08)+.01);}catch(e){} }
function soundBtn(){ return `<button class="btn" id="snd" aria-pressed="${sound}">音 ${sound?"ON":"OFF"}</button>`; }
function wireSound(){ const b=$("#snd"); if(!b) return; b.addEventListener("click",()=>{ sound=!sound; b.setAttribute("aria-pressed",sound); b.textContent=`音 ${sound?"ON":"OFF"}`; if(sound) beep(); }); }

/* ---------- drawing helpers ---------- */
function wall(x,y0,y1,label){ ctx.fillStyle=C("--ink"); ctx.fillRect(x,y0,10,y1-y0); ctx.strokeStyle=C("--line"); ctx.lineWidth=1; for(let y=y0;y<y1;y+=14){ ctx.beginPath(); ctx.moveTo(x+10,y); ctx.lineTo(x+22,y+7); ctx.stroke(); } if(label) txt(label,x+5,y0-12,12,C("--mute"),"center"); }
function sensorBox(x,y,lit,label){ ctx.fillStyle=C("--metal"); ctx.fillRect(x-14,y-22,28,44); ctx.fillStyle=lit?C("--amber"):C("--mute"); ctx.beginPath(); ctx.arc(x+8,y,7,0,Math.PI*2); ctx.fill(); if(label) txt(label,x,y+36,12,C("--mute"),"center"); }
function bat(x,y,flap){ ctx.save(); ctx.translate(x,y); ctx.fillStyle=C("--ink");
  ctx.beginPath(); ctx.ellipse(0,0,10,14,0,0,Math.PI*2); ctx.fill();
  const w=18+flap*10; ctx.beginPath(); ctx.moveTo(-6,-4); ctx.quadraticCurveTo(-40,-w,-52,6); ctx.quadraticCurveTo(-30,8,-6,8); ctx.fill();
  ctx.beginPath(); ctx.moveTo(6,-4); ctx.quadraticCurveTo(40,-w,52,6); ctx.quadraticCurveTo(30,8,6,8); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-6,-12); ctx.lineTo(-9,-22); ctx.lineTo(-2,-14); ctx.fill(); ctx.beginPath(); ctx.moveTo(6,-12); ctx.lineTo(9,-22); ctx.lineTo(2,-14); ctx.fill();
  ctx.restore(); }
function car(x,y,w,h){ ctx.fillStyle=C("--blue"); ctx.beginPath(); ctx.roundRect(x,y,w,h,8); ctx.fill(); ctx.fillStyle=C("--blue-soft"); ctx.beginPath(); ctx.roundRect(x+w*.18,y+6,w*.5,h*.45,5); ctx.fill(); ctx.fillStyle=C("--tire"); [x+w*.2,x+w*.8].forEach(cx=>{ ctx.beginPath(); ctx.arc(cx,y+h,h*.28,0,Math.PI*2); ctx.fill(); }); }
/* one ping: amber arc going out, teal arc coming back */
function pingArc(cx,cy,r,dir,color,alpha){ ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(cx,cy,r,dir>0?-Math.PI/3:Math.PI-Math.PI/3,dir>0?Math.PI/3:Math.PI+Math.PI/3); ctx.stroke(); ctx.restore(); }

/* ---------- echo lab (shared by 3 slides) ---------- */
/* opt.timer: show stopwatch; opt.weak: ping fades with distance (max MAXR) ; opt.auto: keep pinging */
function echoLab(ctrl,opt){
  opt=opt||{};
  const maxD=opt.maxD||4;
  ctrl.innerHTML=`<label>壁までの距離 <input type="range" id="ds" min="0.5" max="${maxD}" step="0.1" value="${opt.init||2}"></label><span class="read" id="dv"></span><button class="btn dark" id="go">音を出す</button><button class="btn" id="slo" aria-pressed="true">スロー再生（1/300）</button>${soundBtn()}`;
  let d=opt.init||2, slow=true, t=-1, flap=0;
  const upd=()=>{ $("#dv").textContent=`${d.toFixed(1)} m`; };
  $("#ds").addEventListener("input",e=>{d=+e.target.value;upd();});
  $("#slo").addEventListener("click",e=>{slow=!slow;e.currentTarget.setAttribute("aria-pressed",slow);e.currentTarget.textContent=slow?"スロー再生（1/300）":"本当の速さ";});
  $("#go").addEventListener("click",()=>{ t=0; beep(1600,.06); });
  wireSound(); upd();
  startAnim(dt=>{
    const rt=2*d/VS; /* 往復時間 s */
    if(t>=0){ t+=slow?dt/300:dt; }
    const back=t>=rt;
    const sx=W*.12, cy=H*.56, wx=W*.12+(W*.76)*(d/maxD);
    /* ground + scale */
    ctx.fillStyle=C("--road"); ctx.fillRect(0,cy+40,W,H-cy-40);
    for(let m=0;m<=maxD;m+=.5){ const x=W*.12+(W*.76)*(m/maxD); ctx.strokeStyle=C("--line"); ctx.beginPath(); ctx.moveTo(x,cy+40); ctx.lineTo(x,cy+48); ctx.stroke(); if(m%1===0) txt(`${m}m`,x,cy+60,11,C("--mute"),"center"); }
    if(opt.bat){ flap=(flap+dt*8)%(Math.PI*2); bat(sx,cy,Math.sin(flap)); txt("コウモリ",sx,cy+34,12,C("--mute"),"center"); }
    else sensorBox(sx,cy,t>=0&&t<rt*.08,"センサ");
    wall(wx,cy-60,cy+40,"壁");
    /* ping position */
    if(t>=0){
      const half=d/VS; let xpos, dir, col, alpha=1;
      if(t<half){ xpos=sx+ (wx-sx)*(t/half); dir=1; col=C("--amber"); }
      else if(t<rt){ xpos=wx-(wx-sx)*((t-half)/half); dir=-1; col=C("--teal"); if(opt.weak) alpha=Math.max(0,1-(d/MAXR)*(d/MAXR)); }
      else { xpos=sx; dir=-1; col=C("--teal"); }
      if(t<rt){ for(let k=0;k<3;k++) pingArc(xpos,cy,14+k*12,dir,col,alpha*(1-k*.3)); }
      if(back&&opt.weak&&d>MAXR-.01){ txt("返ってきた音が小さすぎて、読めません",W/2,cy-80,14,C("--bad"),"center"); }
      else if(back){ sensorBox(sx,cy,true,""); if(!opt.bat) txt("返ってきた！",sx,cy-40,14,C("--teal"),"center"); if(!echoLab._b){ echoLab._b=true; beep(900,.08);} }
      if(t>=0&&t<rt) echoLab._b=false;
    }
    /* stopwatch */
    if(opt.timer){
      const shown=t<0?0:Math.min(t,rt);
      const hide=opt.weak&&d>MAXR-.01&&back;
      ctx.fillStyle=C("--sheet"); ctx.fillRect(W*.6,12,W*.37,58); ctx.strokeStyle=C("--line"); ctx.strokeRect(W*.6,12,W*.37,58);
      txt("往復時間",W*.62,26,12,C("--mute"),"left");
      txt(hide?"--":`${(shown*1000).toFixed(1)} ms`,W*.95,44,22,back?C("--ink"):C("--amber"),"right",true);
      txt(hide?"":`（${shown.toFixed(4)} 秒）`,W*.95,62,11,C("--mute"),"right",true);
    }
    if(t<0) txt("「音を出す」を押してください",W/2,22,13,C("--mute"),"center");
  });
}

/* ---------- parking lab ---------- */
function parkingLab(ctrl){
  ctrl.innerHTML=`<label>車を後ろへ <input type="range" id="ds" min="0.2" max="3" step="0.05" value="3"></label><span class="read" id="dv"></span>${soundBtn()}`;
  let d=3, bt=0;
  const upd=()=>{ $("#dv").textContent=`壁まで ${d.toFixed(2)} m`; };
  $("#ds").addEventListener("input",e=>{d=+e.target.value;upd();}); wireSound(); upd();
  startAnim(dt=>{
    const iv=d<=.3?0:Math.min(1.2,d*.4); /* 鳴る間隔 s */
    bt+=dt; let lit=false;
    if(iv===0){ lit=true; if(bt>.09){ bt=0; beep(1400,.05);} } else if(bt>=iv){ bt=0; beep(1400,.06); } lit=lit||bt<.1;
    const cy=H*.55, wx=W*.88, cw=W*.3, carX=wx-10-(W*.5)*(d/3)-cw;
    ctx.fillStyle=C("--road"); ctx.fillRect(0,cy+36,W,H-cy-36);
    wall(wx,cy-70,cy+36,"壁");
    car(carX,cy-20,cw,44);
    /* 4 sensors on rear bumper */
    for(let i=0;i<4;i++){ const y=cy-10+i*12; ctx.fillStyle=lit?C("--amber"):C("--mute"); ctx.beginPath(); ctx.arc(carX+cw+4,y,3.5,0,Math.PI*2); ctx.fill(); }
    txt("超音波センサ×4",carX+cw+4,cy+50,11,C("--mute"),"center");
    if(lit){ for(let k=0;k<3;k++) pingArc(carX+cw+10+k*10,cy+8,12+k*10,1,C("--amber"),1-k*.3); }
    /* meter */
    const bx=W*.08, by=H*.86, bw=W*.6;
    ctx.fillStyle=C("--line"); ctx.fillRect(bx,by,bw,12);
    const g=ctx.createLinearGradient(bx,0,bx+bw,0); g.addColorStop(0,"#c0392b"); g.addColorStop(.5,"#e8c64a"); g.addColorStop(1,"#2f6db5");
    ctx.save(); ctx.beginPath(); ctx.rect(bx,by,bw*(d/3),12); ctx.clip(); ctx.fillStyle=g; ctx.fillRect(bx,by,bw,12); ctx.restore();
    txt("近い",bx,by-12,11,C("--bad"),"left"); txt("遠い",bx+bw,by-12,11,C("--blue"),"right");
    txt(iv===0?"ピーーー（連続）":iv<.3?"ピッピッピッ":iv<.7?"ピッ　ピッ　ピッ":"ピッ　　　ピッ",W*.84,by+6,14,C("--ink"),"center");
  });
}

/* ---------- 温度と音速のラボ ---------- */
function tempLab(ctrl){
  ctrl.innerHTML=`<label>気温 <input type="range" id="tp" min="-10" max="40" step="1" value="15"></label><span class="read" id="tv"></span>`;
  let T=15; const RT=0.006; /* 往復時間は固定 */
  const upd=()=>{ $("#tv").textContent=`${T} ℃`; };
  $("#tp").addEventListener("input",e=>{T=+e.target.value;upd();}); upd();
  startAnim(dt=>{
    const v=331.5+0.6*T, real=v*RT/2, shown=VS*RT/2;
    /* thermometer */
    const tx=W*.12, ty=H*.18, th=H*.6;
    ctx.fillStyle=C("--sheet"); ctx.beginPath(); ctx.roundRect(tx-12,ty,24,th,12); ctx.fill(); ctx.strokeStyle=C("--line"); ctx.stroke();
    const frac=(T+10)/50; const hot=Math.round(47+ (192-47)*frac), cold=Math.round(181-(181-57)*frac);
    ctx.fillStyle=`rgb(${hot},${Math.round(109-(109-57)*frac)},${cold})`; ctx.beginPath(); ctx.roundRect(tx-6,ty+th*(1-frac),12,th*frac,6); ctx.fill(); ctx.beginPath(); ctx.arc(tx,ty+th+10,18,0,Math.PI*2); ctx.fill();
    txt("気温",tx,ty-14,12,C("--mute"),"center");
    /* speed bar */
    const bx=W*.3, bw=W*.62;
    txt("音速（1秒に進む道のり）",bx,H*.2,13,C("--mute"),"left");
    ctx.fillStyle=C("--line"); ctx.fillRect(bx,H*.26,bw,14);
    ctx.fillStyle=C("--amber"); ctx.fillRect(bx,H*.26,bw*((v-320)/40),14);
    txt(`${v.toFixed(1)} m/s`,bx+bw,H*.2,16,C("--amber"),"right",true);
    ctx.strokeStyle=C("--ink"); ctx.setLineDash([3,3]); ctx.beginPath(); const x340=bx+bw*(20/40); ctx.moveTo(x340,H*.24); ctx.lineTo(x340,H*.42); ctx.stroke(); ctx.setLineDash([]);
    txt("340 m/s（センサが計算に使う数）",x340,H*.46,11,C("--ink"),"center");
    /* two distances */
    box(bx,H*.56,bw,56,"本当の距離（往復 0.006秒）",`${real.toFixed(3)} m`,"",C("--ink"));
    box(bx,H*.56+66,bw,56,"センサの表示（340m/s で計算）",`${shown.toFixed(3)} m`,`ずれ ${((shown-real)*100).toFixed(1)} cm`,Math.abs(shown-real)>0.02?C("--bad"):C("--good"));
  });
}
function box(x,y,w,h,label,big,small,color){ ctx.fillStyle=C("--sheet"); ctx.fillRect(x,y,w,h); ctx.strokeStyle=C("--line"); ctx.strokeRect(x,y,w,h); txt(label,x+10,y+14,12,C("--mute"),"left"); txt(big,x+w-10,y+h*.55,20,color||C("--ink"),"right",true); if(small) txt(small,x+w-10,y+h-11,11,C("--mute"),"right",true); }

/* ---------- Trig / Echo タイミング図 ---------- */
function timingLab(ctrl){
  ctrl.innerHTML=`<label>壁までの距離 <input type="range" id="ds" min="0.05" max="0.5" step="0.01" value="0.1"></label><span class="read" id="dv"></span>`;
  let d=0.1, t=0;
  const upd=()=>{ $("#dv").textContent=`${Math.round(d*100)} cm`; };
  $("#ds").addEventListener("input",e=>{d=+e.target.value;upd();}); upd();
  startAnim(dt=>{
    const rt=2*d/VS*1e6; /* µs */
    const span=3500; /* µs shown */
    t=(t+dt*600)%(span+800); /* sweeping cursor, µs */
    const gx=W*.16, gw=W*.8, rows=[["Trig",H*.2],["超音波",H*.43],["Echo",H*.66]], rh=H*.15;
    const X=us=>gx+gw*us/span;
    rows.forEach(([n,y])=>{ txt(n,gx-10,y+rh/2,13,C("--ink"),"right"); ctx.strokeStyle=C("--line"); ctx.beginPath(); ctx.moveTo(gx,y+rh); ctx.lineTo(gx+gw,y+rh); ctx.stroke(); });
    const t0=200, pulse=10, burst=200; /* µs */
    const b0=t0+pulse, e0=b0+burst, e1=e0+rt;
    const vis=us=>us<=t;
    function sq(y,a,b,color){ const x1=X(a), x2=X(Math.min(b,t)); if(!vis(a)) return; ctx.strokeStyle=color; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(gx,y+rh); ctx.lineTo(x1,y+rh); ctx.lineTo(x1,y+rh*.2); ctx.lineTo(x2,y+rh*.2); if(t>=b){ ctx.lineTo(x2,y+rh); ctx.lineTo(X(Math.min(t,span)),y+rh);} ctx.stroke(); }
    function flat(y,color,upto){ ctx.strokeStyle=color; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(gx,y+rh); ctx.lineTo(X(Math.min(t,upto)),y+rh); ctx.stroke(); }
    /* Trig */
    if(t<t0) flat(rows[0][1],C("--amber"),t0); else sq(rows[0][1],t0,t0+pulse,C("--amber"));
    txt("10µs",X(t0+pulse)+6,rows[0][1]+rh*.2,11,C("--amber"),"left",true);
    /* burst out */
    if(t<b0) flat(rows[1][1],C("--ink"),b0); else { ctx.strokeStyle=C("--ink"); ctx.lineWidth=1.5; ctx.beginPath(); for(let u=0;u<=Math.min(t,span)-0;u+=4){ const on=u>=b0&&u<b0+burst; const back=u>=e0+rt&&u<e0+rt+burst; const amp=on?rh*.4:back?rh*.18:0; const y=rows[1][1]+rh*.55+(amp?Math.sin(u*1.2)*amp:0); if(u===0) ctx.moveTo(X(u),y); else ctx.lineTo(X(u),y);} ctx.stroke(); }
    txt("出した音（8回）",X(b0),rows[1][1]-4,11,C("--mute"),"left"); if(t>e0+rt) txt("返ってきた音",X(e0+rt),rows[1][1]-4,11,C("--teal"),"left");
    /* Echo */
    if(t<e0) flat(rows[2][1],C("--teal"),e0); else sq(rows[2][1],e0,Math.max(e1,e0+1),C("--teal"));
    if(t>e0){ ctx.strokeStyle=C("--bad"); ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(X(e0),rows[2][1]+rh*.2-6); ctx.lineTo(X(Math.min(t,e1)),rows[2][1]+rh*.2-6); ctx.stroke(); ctx.setLineDash([]); }
    box(W*.52,8,W*.44,52,"Echo のパルス幅（往復時間）",t>=e1?`${Math.round(e1-e0)} µs`:`${Math.max(0,Math.round(Math.min(t,e1)-e0))} µs`,"",t>=e1?C("--teal"):C("--amber"));
    /* cursor */
    ctx.strokeStyle=C("--mute"); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(X(Math.min(t,span)),H*.17); ctx.lineTo(X(Math.min(t,span)),H*.84); ctx.stroke();
    txt("時間 →（µs）",gx+gw,H*.9,11,C("--mute"),"right");
  });
}

    if(a) h+=`<p class="fb ${a.ok?"ok":"ng"}"><b>${a.ok?"正解です。":`正解は ${q.ans} ${q.unit} です。`}</b>${q.why}</p>`;
  } else if(q.type==="choice"){
    h+=`<div class="opts">${q.o.map((o,k)=>{ let c=""; if(a){ if(k===q.ans) c="ok"; else if(k===a.v) c="ng"; } return `<button class="opt ${c}" data-k="${k}" ${a?"disabled":""}>${o}</button>`; }).join("")}</div>`;
    if(a) h+=`<p class="fb ${a.ok?"ok":"ng"}"><b>${a.ok?"正解です。":"正解は緑の答えです。"}</b>${q.why}</p>`;
  } else {
    h+=`<textarea id="inp" rows="3" ${a?"disabled":""} aria-label="答え">${a?esc(a.v):""}</textarea>`;
    h+=a?`<p class="fb ex"><b>答えの例</b>${q.ex}</p>`:`<div class="qrow"><button class="btn dark" id="chk">書けた</button></div>`;
  }
  return h;
}
function render(){
  stopAnim();
  const s=SL[S.i], n=SL.length, el=$("#slide");
  $("#bar").style.width=(S.i/(n-1)*100)+"%"; $("#pn").textContent=`${S.i+1} / ${n}`;
  renderGloss();
  const answered=!s.q||!!S.ans[S.i];
  let main="";
  if(s.end){
    const qs=SL.map((x,i)=>[x,i]).filter(([x])=>x.q&&x.q.type!=="text"), ok=qs.filter(([,i])=>S.ans[i]&&S.ans[i].ok).length;
    main=`<div class="side"><p class="txt big">距離は、音の<b>往復時間</b>から計算できました。</p>
      <p class="txt"><b>距離 ＝ 音速（340m/s） × 往復時間 ÷ 2</b></p>
      <p class="txt">音速は決まっているので、時間を測るだけで距離がわかります。「÷2」は行きと帰りの分です。</p>
      <p class="txt">音速は気温で変わるので、センサの表示は少しずれます。近すぎる物（約17cm未満）と斜めの物は測れません。遠くまで測ろうとすると、1秒に測れる回数が減ります。</p>
      <p class="txt">車の<b>超音波センサ</b>は数mまで。次の時間は、50m先の車を測る方法を調べます。</p>
      <p class="note">答えのある問題 ${qs.length}問のうち、<b>${ok}問</b> 正解しました。</p>
      <div class="qrow"><button class="btn" id="again">最初からやり直す</button><span id="againc"></span></div></div>`;
  } else if(s.hero){
    main=`<div class="side" style="justify-content:center;gap:18px"><div class="hero"><span class="num">${s.hero.big}<small>${s.hero.small}</small></span></div><p class="txt big">${s.text}</p></div>`;
  } else {
    const right=(s.text?`<p class="txt">${s.text}</p>`:"")+(s.q?qHTML(s.q,S.i):"");
    main=s.lab?`<div class="work"><div class="lab"><div class="cv" id="cvh"></div><div class="ctrl" id="ctrl"></div></div><div class="side" id="side">${right}</div></div>`
              :`<div class="work solo"><div class="side" id="side" style="max-width:40em">${right}</div></div>`;
  }
  el.innerHTML=`<div><p class="sec">${s.sec}</p><h2>${s.title}</h2></div>${main}
    <div class="nav"><button class="btn" id="prev" ${S.i===0?"disabled":""}>← もどる</button><span class="hint"></span>${s.end?"<span></span>":`<button class="btn ${answered?"dark":""}" id="next">次へ →</button>`}</div>`;
  if(s.lab){ mountCanvas($("#cvh")); LABS[s.lab]($("#ctrl")); }
  wire(s);
  $("#prev").addEventListener("click",()=>go(S.i-1));
  if(!s.end) $("#next").addEventListener("click",()=>go(S.i+1));
  if(s.end) $("#again").addEventListener("click",()=>{ $("#againc").innerHTML=`<button class="btn dark" id="ay">消して最初から</button> <button class="btn" id="an">やめる</button>`; $("#ay").addEventListener("click",()=>{S={i:0,ans:{}};save();render();}); $("#an").addEventListener("click",()=>{$("#againc").innerHTML="";}); });
}
function rerenderQ(s){ $("#side").innerHTML=(s.text?`<p class="txt">${s.text}</p>`:"")+qHTML(s.q,S.i); $("#next").disabled=false; document.querySelector(".nav .hint").textContent=""; }
function wire(s){
  if(!s.q||S.ans[S.i]) return;
  const q=s.q;
  if(q.type==="num"){
    const inp=$("#inp"); const run=()=>{ const raw=inp.value.trim().replace(/[０-９．]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)); if(raw===""||isNaN(+raw)){ inp.focus(); return; } S.ans[S.i]={v:raw,ok:near(+raw,q)}; save(); rerenderQ(s); };
    $("#chk").addEventListener("click",run); inp.addEventListener("keydown",e=>{ if(e.key==="Enter") run(); });
  } else if(q.type==="choice"){
    document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{ const k=+b.dataset.k; S.ans[S.i]={v:k,ok:k===q.ans}; save(); rerenderQ(s); }));
  } else {
    $("#chk").addEventListener("click",()=>{ const v=$("#inp").value.trim(); if(!v){ $("#inp").focus(); return; } S.ans[S.i]={v,ok:true}; save(); rerenderQ(s); });
  }
}
function go(i){ S.i=Math.max(0,Math.min(SL.length-1,i)); save(); render(); }
document.addEventListener("keydown",e=>{ if(e.target.closest("input,textarea")) return; const nx=$("#next"); if(e.key==="ArrowRight"&&nx&&!nx.disabled) go(S.i+1); if(e.key==="ArrowLeft"&&S.i>0) go(S.i-1); });
render();
})();
</script>
</body>
</html>
