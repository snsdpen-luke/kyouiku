<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>自動運転への階段</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 4:3 固定ステージ（1024x768）。上：駐車場の地図、下：モードごとのパネル。ライト固定 */
:root{color-scheme:light;
  --bg:#e9edf1; --paper:#fbfcfd; --ink:#18212b; --sub:#5a6672; --line:#cfd6dd;
  --copper:#b8642a; --copper-soft:#f3e2d4; --steel:#3d5a73; --steel-soft:#cdd8e2;
  --lot:#e3e7ea; --mark:#fbfcfd; --good:#2c8a4f; --danger:#d23c32; --panel:#f1f4f7; --sens:#2f8fd8;
  --f-disp:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
[hidden]{display:none!important}
#vp{position:relative;width:100%;height:100%}
#stage{position:absolute;left:50%;top:50%;width:1024px;height:768px;background:var(--paper);border-radius:6px;box-shadow:0 2px 18px rgba(0,0,0,.12);overflow:hidden;display:flex;flex-direction:column;padding:10px 28px 12px;box-sizing:border-box;gap:8px}
header{display:flex;align-items:center;gap:12px}
header h1{margin:0;font-family:var(--f-disp);font-weight:400;font-size:22px;white-space:nowrap}
.grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-size:15px;border:2px solid var(--steel);background:var(--paper);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;user-select:none;-webkit-user-select:none}
button:hover{background:var(--panel)}
button.sel{background:var(--steel);color:var(--paper)}
button.go{background:var(--copper);border-color:var(--copper);color:#fff;font-weight:700}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--copper);outline-offset:2px}
.modes button{font-size:14px;padding:5px 10px}
.sp{flex:1}
canvas{display:block;border-radius:6px;background:var(--lot);touch-action:none}
.cvwrap{position:relative}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);border-radius:6px}
.ovbox{background:var(--paper);border-radius:10px;padding:18px 28px;display:flex;flex-direction:column;gap:10px;align-items:center;min-width:300px}
.ovt{font-family:var(--f-disp);font-size:32px}
.overlay.win .ovt{color:var(--good)}.overlay.lose .ovt{color:var(--danger)}
.ovs{font-size:16px;color:var(--sub);text-align:center}
.panel{flex:1;min-height:0;display:flex;gap:20px;align-items:stretch}
.big{font-size:18px;font-weight:700}
.note{font-size:13px;color:var(--sub)}
.side{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0;justify-content:center}
.gate{display:flex;flex-direction:column;gap:4px;background:var(--ink);padding:8px;border-radius:10px;align-self:center}
.gate button{width:54px;padding:3px 0;font-family:var(--f-num);font-size:19px;font-weight:700;background:transparent;border:2px solid transparent;color:var(--line)}
.gate button.sel{background:var(--copper);border-color:var(--copper);color:#fff}
.gate .gk{color:var(--line);text-align:center;font-family:var(--f-num);font-size:12px}
.wcol{display:flex;flex-direction:column;align-items:center;gap:6px;align-self:center}
.wheelbox{position:relative;width:200px;height:200px}
#cvWheel{background:transparent;cursor:grab;border-radius:50%}
.wv{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-family:var(--f-num);font-size:15px;font-weight:700;pointer-events:none}
.pedals{display:flex;gap:10px}
.pedal{width:100px;height:44px;padding:0;border-radius:10px;font-weight:700;background:var(--panel);touch-action:none}
.pedal.acc{width:92px;height:48px}
.pedal.sel:not(.acc){background:var(--danger);border-color:var(--danger);color:#fff}
.pedal.acc.sel{background:var(--good);border-color:var(--good);color:#fff}
.pedal.auto{border-style:dashed;color:var(--sub)}
.sensors{display:grid;grid-template-columns:auto auto;gap:2px 10px;font-size:14px}
.sensors .k{color:var(--sub)}
.sensors .v{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.sensors .on{color:var(--sens);font-weight:700}
.sl{display:grid;grid-template-columns:7.5em 1fr 5.2em;gap:4px 8px;align-items:center;font-size:14px}
.sl input{width:100%;accent-color:var(--copper)}
.sl .val{font-family:var(--f-num);text-align:right}
/* 分析 */
.runs{width:200px;flex:none;display:flex;flex-direction:column;gap:6px;overflow:auto}
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
th,td{padding:4px 5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);font-size:12px;color:var(--sub);text-align:center}
tr.avg td{font-weight:700;background:var(--copper-soft)}
tr.sel td{background:#fff3b0}
tr.click{cursor:pointer}
.acol{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.steps{display:flex;align-items:center;gap:6px}
.steps button{font-size:14px;line-height:1.3;padding:5px 12px;text-align:left;min-height:46px}
.steps button b{font-size:16px;color:var(--copper)}
.steps button.sel b{color:#fff}
.steps button small{font-size:12px}
.steps .ar{color:var(--sub);font-size:18px}
.lvs{display:flex;align-items:center;gap:4px}
.lvs .lvlab{font-size:12px;color:var(--sub);margin-right:2px}
.lvs i{font-style:normal;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:13px;background:var(--panel);color:var(--sub);border:1px solid var(--line)}
.lvs i.on{background:var(--sens);color:#fff;border-color:var(--sens)}
.roles{display:flex;gap:4px;align-items:stretch}
.gcol{display:flex;flex-direction:column;gap:8px;justify-content:center;width:250px;flex:none}
.roles .rt{font-size:12px;color:var(--sub);align-self:center;margin-right:2px;line-height:1.2}
.role{min-width:62px;border-radius:6px;padding:2px 6px;text-align:center;font-size:12px;background:var(--panel);border:2px solid var(--line)}
.role b{display:block;font-size:14px}
.role.car{border-color:var(--sens);background:#e3f0fb}.role.car b{color:var(--sens)}
.role.you b{color:var(--copper)}
.lvsel{display:flex;gap:4px;flex-wrap:wrap}
.lvsel button{font-size:12px;padding:3px 8px;border-width:1.5px}
.lvsel button b{font-family:var(--f-num)}
.role.both{border-color:var(--sens);background:linear-gradient(90deg,#e3f0fb 55%,#f8ebe0 55%)}.role.both b{color:var(--sens)}
.sensors .hit{color:var(--danger);font-weight:700}
.sl{grid-template-columns:9.5em 1fr 4.6em!important}
.slh{font-size:13px;font-weight:700;color:var(--sens);margin-top:2px}
.slh.you{color:var(--copper)}
.accm{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.accm b{color:var(--sens);font-size:14px}
.accbar{width:22px;height:48px;border:2px solid var(--sens);border-radius:6px;position:relative;overflow:hidden;background:var(--paper)}
.accbar i{position:absolute;left:0;right:0;bottom:0;background:var(--sens);height:0}
.teach{width:300px;flex:none;display:flex;flex-direction:column;gap:8px}
.big-btn{font-size:17px;padding:10px 14px}
.learned{background:#e3f0fb;border:2px solid var(--sens);border-radius:8px;padding:8px 12px;font-size:14px;line-height:1.6}
.learned h4{margin:0 0 2px;font-size:13px;color:var(--sens)}
.learned .row{display:flex;justify-content:space-between;gap:8px}
.learned .row b{font-family:var(--f-num)}
.learned.none{background:var(--panel);border-color:var(--line);color:var(--sub)}
</style>
</head>
<body>
<div id="vp"><div id="stage">
  <header>
    <h1>自動運転への階段</h1>
    <div class="grp" id="stgs"></div>
    <span class="sp"></span>
    <button id="snd">音：ON</button>
  </header>
  <div class="steps" id="modes">
    <button data-m="drive" class="sel"><b>①</b> 手動で運転して<br>データを集める</button><span class="ar">→</span>
    <button data-m="anal"><b>②</b> 自分の運転を<br>車に教える</button><span class="ar">→</span>
    <button data-m="auto"><b>③</b> 自動運転<br><small id="lvName"></small></button>
    <span class="sp"></span>
    <div class="roles" id="roles"></div>
  </div>
  <div class="cvwrap"><canvas id="cv" data-w="968" data-h="330"></canvas>
    <div class="overlay" id="ov" hidden><div class="ovbox"><div class="ovt" id="ovT"></div><div class="ovs" id="ovS"></div><div class="grp"><button id="ovOk" class="go">OK</button></div></div></div>
  </div>

  <!-- 運転（手動・段階1 共通） -->
  <div class="panel" id="pDrive">
    <div class="side">
      <div class="lvsel" id="lvsel" hidden></div>
      <div class="big" id="dStatus"></div>
      <div id="s1box" hidden>
        <div class="slh">車が覚えた数字 <span class="note" id="fromNote"></span></div>
        <div class="sl">
          <label for="pS">ブレーキ（前・うしろ）</label><input id="pS" type="range" min="0.1" max="1.5" step="0.05" value="0.3"><span class="val" id="pSV"></span>
          <label for="pC">ブレーキ（四すみ）</label><input id="pC" type="range" min="0.05" max="0.8" step="0.01" value="0.3"><span class="val" id="pCV"></span>
          <div class="lv2" style="display:contents"><label for="pF">前進の速さ</label><input id="pF" type="range" min="0.5" max="9" step="0.1" value="4"><span class="val" id="pFV"></span>
          <label for="pV">バックの速さ</label><input id="pV" type="range" min="0.5" max="5" step="0.1" value="2"><span class="val" id="pVV"></span></div>
        </div>
        <div class="slh you lv2">あなたが決める数字</div>
        <div class="sl lv2">
          <label for="pK">直す強さ</label><input id="pK" type="range" min="0" max="20" step="0.5" value="1"><span class="val" id="pKV"></span>
        </div>
      </div>
      <div class="grp"><button id="dReset">はじめから</button><span class="note" id="dCount"></span></div>
    </div>
    <div class="gcol"><canvas id="cvGraph" data-w="250" data-h="170" hidden style="background:var(--panel)"></canvas><div class="sensors" id="sens"></div></div>
    <div class="gate" id="gate"><button data-g="P" class="sel">P</button><button data-g="R">R</button><button data-g="N">N</button><button data-g="D">D</button><small class="gk">↑↓</small></div>
    <div class="wcol">
      <div class="wheelbox"><canvas id="cvWheel" data-w="200" data-h="200" tabindex="0" aria-label="ハンドル"></canvas><div class="wv" id="wheelV">まっすぐ</div></div>
      <div class="pedals"><button id="brake" class="pedal">ブレーキ <small>Z</small></button><button id="accel" class="pedal acc">アクセル <small>X</small></button><div class="accm" id="accMeter" hidden><div class="accbar"><i id="accFill"></i></div><span>アクセル<br><b>車</b></span></div></div>
    </div>
  </div>

  <!-- 車に教える -->
  <div class="panel" id="pAnal" hidden>
    <div class="acol">
      <div class="grp"><span class="big">あなたの運転の記録</span><span class="note">（成功した運転だけ）</span><span class="sp"></span><button id="demoBtn">見本データを入れる</button></div>
      <div class="tblwrap" style="flex:1"><table id="atbl"></table></div>
    </div>
    <div class="teach">
      <button id="teachBtn" class="go big-btn">自分の運転を車に教える</button>
      <div class="learned" id="learned"></div>
      <div class="note" id="gTitle"></div>
      <canvas id="cvA" data-w="300" data-h="120" style="background:var(--panel)"></canvas>
    </div>
  </div>
</div></div>

<script>
/* ===== 車と駐車場のモデル（単位 m） ===== */
const L=2.6,DMAX=35*Math.PI/180,RO=0.9,FO=3.5,HW=0.875;
const WALL=0.3,SX=1.0,ENTRY=5.8,AB=10.8,BSW=2.7,BUMP1=5.4,BUMP2=5.75,NSLOT=9;
const STAGES=[
 {id:'E',name:'イージー',sw:2.6,y0:8.3,empties:[2,3,4],tol:0.45,ang:0.10},
 {id:'N',name:'ノーマル',sw:2.3,y0:9.6,empties:[4,5,6],tol:0.30,ang:0.07},
 {id:'H',name:'ハード',  sw:2.2,y0:9.6,empties:[4,5,6],tol:0.20,ang:0.05,pillar:true}];
function makeWorld(st,empty){const sw=st.sw,o=[];
 for(let k=0;k<NSLOT;k++){if(k===empty)continue;const cx=SX+sw*k+sw/2;o.push([cx-HW,0.8,cx+HW,5.2,0]);}
 for(let k=-2;k<NSLOT+3;k++){const cx=SX+BSW*k+BSW/2;o.push([cx-HW,AB,cx+HW,AB+4.4,1]);}
 const sl=SX+sw*empty;if(st.pillar)o.push([sl-0.4,BUMP2+0.05,sl+0.08,BUMP2+0.6,2]);
 return {st,obs:o,empty,sw,gc:sl+sw/2};}
function corners(s){const c=Math.cos(s.th),n=Math.sin(s.th);return [[-RO,-HW],[FO,-HW],[FO,HW],[-RO,HW]].map(([a,b])=>[s.x+a*c-b*n,s.y+a*n+b*c]);}
function hit(W,s){const Cs=corners(s);for(let i=0;i<4;i++){const a=Cs[i],b=Cs[(i+1)%4];for(let t=0;t<1;t+=0.1){const x=a[0]+(b[0]-a[0])*t,y=a[1]+(b[1]-a[1])*t;
 if(y<WALL||x<-4.6||x>27||y>13.5)return true;for(const o of W.obs)if(x>o[0]&&x<o[2]&&y>o[1]&&y<o[3])return true;}}return false;}
function move(s,v,dt){s.x+=v*Math.cos(s.th)*dt;s.y+=v*Math.sin(s.th)*dt;s.th+=v*Math.tan(s.d)/L*dt;}
function rearDist(s){return s.y-RO*Math.sin(s.th)-WALL;}
function judge(W,s){const cx=s.x+1.3*Math.cos(s.th),front=s.y+FO*Math.sin(s.th);
 if(s.y>ENTRY)return {ok:false,t:'まだ枠に入っていません'};
 if(Math.abs(cx-W.gc)>W.st.tol)return {ok:false,t:'枠からずれています'};
 if(front>ENTRY+0.05)return {ok:false,t:'枠からはみ出しています'};
 if(Math.abs(s.th-Math.PI/2)>W.st.ang)return {ok:false,t:'ななめに止まっています'};return {ok:true,t:'駐車成功！'};}
function onBump(W,s){const c=Math.cos(s.th),n=Math.sin(s.th);let k=0;[0,L].forEach(a=>{const y=s.y+a*n,x=s.x+a*c;if(y>BUMP1&&y<BUMP2&&x>SX&&x<SX+W.sw*NSLOT)k++;});return k;}

/* ===== 記録と学習 ===== */
// 記録の1行：[時刻, 枠の真ん中からの前後(m), y, 向き(rad), ハンドル(-1左〜1右), 速さ(m/s), シフト, ペダル]
const DT=0.05,AHEAD=2,AHEADV=8,K=3;
function rowFeat(r){return [r[1]/3,(r[2]-7)/1.5,r[3]/0.6,r[4]*0.6,r[5]*0.2];}
function stateFeat(W,s){return [(s.x+1.3*Math.cos(s.th)-W.gc)/3,(s.y-7)/1.5,s.th/0.6,s.wh*0.6,s.v*0.2];}
// 学習：記録した全部の行を「状況 → そのあとの操作」の組にして覚える
function learn(runs){const mem=[];runs.forEach((run,ri)=>{const R=run.rows;for(let i=0;i<R.length;i++){const j=Math.min(R.length-1,i+AHEAD),jv=Math.min(R.length-1,i+AHEADV);
  if(Math.abs(R[i][5])<0.02&&Math.abs(R[jv][5])<0.02&&Math.abs(R[j][4]-R[i][4])<0.02&&i<R.length-1)continue; // 止まっているだけの行は使わない
  mem.push({f:rowFeat(R[i]),w:R[j][4],v:R[jv][5],ri,i});}});return mem;}
// 自動運転：今の状況にいちばん近い記録を K 個さがして、その操作をまねる
function decide(mem,f){const best=[];for(const m of mem){let d=0;for(let i=0;i<5;i++){const q=f[i]-m.f[i];d+=q*q;}
 if(best.length<K||d<best[best.length-1].d){best.push({d,m});best.sort((a,b)=>a.d-b.d);if(best.length>K)best.pop();}}
 if(!best.length)return {w:0,v:0,near:null};const w=best.reduce((a,b)=>a+b.m.w,0)/best.length,v=best.reduce((a,b)=>a+b.m.v,0)/best.length;return {w,v,near:best[0].m,dist:Math.sqrt(best[0].d)};}
function autoStep(s,c){s.wh+=Math.max(-DT*5,Math.min(DT*5,c.w-s.wh));s.d=s.wh*DMAX;s.v+=(c.v-s.v)*Math.min(1,DT*3);move(s,s.v,DT);}

/* ===== 前後の動き（段階1） ===== */
// アクセル u(0〜1)・ブレーキ b(0〜1)。クリープは手動のときだけ。モーターの力は少し遅れて出る。車輪速センサは0.1秒ごとに測る。
const LON={amax:3.0,drag:1.2,creep:0.72,bump:1.6,brake:5.0,lag:0.25,sample:0.1};
function lonStep(c,u,b,creep,bump,dt){c.F+=((u*LON.amax)-c.F)*Math.min(1,dt/LON.lag);
 let a=c.F+(creep&&b===0?LON.creep:0)-LON.drag*c.v-(bump?LON.bump:0)-b*LON.brake;
 if(c.v<=0&&a<0)c.v=0;else c.v=Math.max(0,c.v+a*dt);
 c.mt+=dt;if(c.mt>=LON.sample){c.mt=0;c.meas=c.v;}}
function pctl(meas,target,kp){const o=kp*(target-meas);return o>=0?{u:Math.min(1,o),b:0}:{u:0,b:Math.min(1,-o)};}
// 超音波センサ（前・うしろ）：いちばん近い物までの距離。2.5mより遠いと測れない
function rectDist(x,y,o){const dx=Math.max(o[0]-x,0,x-o[2]),dy=Math.max(o[1]-y,0,y-o[3]);return Math.hypot(dx,dy);}
function sonar(W,s){const c=Math.cos(s.th),n=Math.sin(s.th);
 // 前・うしろの真ん中から、その向き（左右 約30°）にある物だけを測る
 const one=(a,dirSign)=>{const px=s.x+a*c,py=s.y+a*n;let best=null;
  const cand=[];W.obs.forEach(o=>{const qx=Math.max(o[0],Math.min(px,o[2])),qy=Math.max(o[1],Math.min(py,o[3]));cand.push([qx,qy]);
   for(let k=0;k<=8;k++){cand.push([o[0]+(o[2]-o[0])*k/8,o[3]],[o[0]+(o[2]-o[0])*k/8,o[1]],[o[0],o[1]+(o[3]-o[1])*k/8],[o[2],o[1]+(o[3]-o[1])*k/8]);}});
  for(let k=-6;k<=6;k++)cand.push([px+k*0.2,WALL]);
  cand.forEach(([qx,qy])=>{const dx=qx-px,dy=qy-py;const fwd=(dx*c+dy*n)*dirSign,side=-dx*n+dy*c;if(fwd<=0)return;if(Math.abs(side)>HW+fwd*0.58)return;const d=Math.hypot(dx,dy);if(best===null||d<best)best=d;});
  return best!==null&&best<=2.5?best:null;};
 return {f:one(FO,1),r:one(-RO,-1)};}

/* ===== 6つの超音波センサ（前・うしろ・四すみ） ===== */
// a:前後の位置, b:左右(負=左), dir:向き(進む向きからの角度), half:見える範囲(左右), range:測れる距離
const SENSORS=[
 {id:'f', name:'前',       a:FO, b:0,        dir:0,            half:0.5, range:2.5,face:1},
 {id:'fl',name:'前の左すみ',a:FO, b:-HW+0.1, dir:-0.75,        half:0.6, range:1.0,face:1},
 {id:'fr',name:'前の右すみ',a:FO, b:HW-0.1,  dir:0.75,         half:0.6, range:1.0,face:1},
 {id:'r', name:'うしろ',     a:-RO,b:0,       dir:Math.PI,      half:0.5, range:2.5,face:-1},
 {id:'rl',name:'うしろの左すみ',a:-RO,b:-HW+0.1,dir:-Math.PI+0.75,half:0.6,range:1.0,face:-1},
 {id:'rr',name:'うしろの右すみ',a:-RO,b:HW-0.1, dir:Math.PI-0.75, half:0.6,range:1.0,face:-1}];
function obstaclePoints(W){if(W._pts)return W._pts;const P=[];W.obs.forEach(o=>{for(let k=0;k<=10;k++){const tx=o[0]+(o[2]-o[0])*k/10,ty=o[1]+(o[3]-o[1])*k/10;P.push([tx,o[1]],[tx,o[3]],[o[0],ty],[o[2],ty]);}});

function senseAll(W,s,extra){const c=Math.cos(s.th),n=Math.sin(s.th);const pts=obstaclePoints(W).concat(extra||[]);const out={};

  for(const [qx,qy] of pts){const dx=qx-px,dy=qy-py;const d=Math.hypot(dx,dy);if(d>S.range||(best!==null&&d>=best))continue;let da=Math.atan2(dy,dx)-ang;da=Math.atan2(Math.sin(da),Math.cos(da));if(Math.abs(da)<=S.half)best=d;}

const WMAX=540;

function physStep(m,W,dt){const s=m.s;s.d=m.wheel/WMAX*DMAX;const dir=gearDir(m.gear);const bump=onBump(W,s)>0;let u=0,b=0,creep=false,auto=null,trig=null;

 const lv=m.mode==='lv1'?1:m.mode==='lv2'?2:0;
 if(m.gear==='P'){b=1;}
 else{
  if(lv>=2&&dir){const ctl=pctl(m.c.meas,dir>0?(m.p.vf||m.p.vt):m.p.vt,m.p.kp);u=ctl.u;b=ctl.b;}
  else{u=m.acc&&dir?1:0;creep=dir!==0;}
  if(lv>=1&&dir){ // レベル1：進む向きのセンサが、決めた距離より近い物を見つけたらブレーキ
   const ids=dir>0?['f','fl','fr']:['r','rl','rr'];
   for(const id of ids){const d=sens[id];if(d===null)continue;const lim=(id==='f'||id==='r')?m.p.stop:m.p.corner;if(d<=lim){m.hold=true;m.trig=id;break;}}
   if(m.hold){u=0;b=1;creep=false;}}
  if(m.brake){u=0;b=1;}
  if(lv)auto={u,b};}

 let crash=false;if(m.c.v>0){const n=6;for(let i=0;i<n;i++){move(s,v,dt/n);if(hit(W,s)){crash=true;m.c.v=0;m.c.F=0;break;}}}
 return {crash,bump,son,sens,auto,v,dir};}

 const ty=7.75+rnd()*0.2,A=4.75+rnd()*0.1,stopD=0.35+rnd()*0.25;const rows=[];let ph=0,t=0,accT=0,wait=0;const DTD=0.05;
 const turnTo=(w,rate)=>{m.wheel+=Math.max(-rate*DTD,Math.min(rate*DTD,w-m.wheel));};
 while(t<120){const s=m.s,cx=s.x+1.3*Math.cos(s.th);
  if(ph===0){turnTo(Math.max(-1,Math.min(1,-(s.y-ty)*1.4-s.th*4))*WMAX,900);m.acc=cx<W.gc+A-2;if(cx>=W.gc+A){ph=1;m.acc=false;m.brake=true;}}
  else if(ph===1){turnTo(0,900);if(m.c.v===0){wait+=DTD;if(wait>0.4){m.gear='R';m.brake=false;ph=2;wait=0;}}}
  else if(ph===2){turnTo(-WMAX,900);if(m.wheel<=-WMAX+1)ph=3;else m.brake=true;if(ph===3)m.brake=false;}
  else if(ph===3){if(m.c.v<0.08&&!m.acc){accT=0.5;}m.acc=accT>0;accT-=DTD;if(s.th>=Math.PI/2-0.03)ph=4;}

 Wd.obs.forEach(o=>{const [a,b]=P(o[0],o[1]),[cc,d]=P(o[2],o[3]);if(o[4]===2){c.fillStyle=C.ink;c.fillRect(a,b,cc-a,d-b);c.strokeStyle=C.danger;c.lineWidth=2;c.strokeRect(a+1,b+1,cc-a-2,d-b-2);return;}
  c.fillStyle=C['steel-soft'];c.beginPath();c.roundRect?c.roundRect(a,b,cc-a,d-b,6):c.rect(a,b,cc-a,d-b);c.fill();c.fillStyle=C.line;c.fillRect(a+6,o[4]?b+24:d-38,cc-a-12,14);});}
function drawCar(c,s,crash){const Cs=corners(s).map(p=>P(...p));c.fillStyle=crash?C.danger:C.copper;c.beginPath();Cs.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.closePath();c.fill();
 const ct=Math.cos(s.th),sn=Math.sin(s.th);const wp=[[2.2,-0.7],[2.9,-0.6],[2.9,0.6],[2.2,0.7]].map(([a,b])=>P(s.x+a*ct-b*sn,s.y+a*sn+b*ct));c.fillStyle=C.paper;c.globalAlpha=.8;c.beginPath();wp.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.closePath();c.fill();c.globalAlpha=1;
 const glow=m.mode==='lv2'&&m.c.v>0.02;
 [[L,-HW+0.15,1],[L,HW-0.15,1],[0,-HW+0.15,0],[0,HW-0.15,0]].forEach(([a,b,f])=>{const [x,y]=P(s.x+a*ct-b*sn,s.y+a*sn+b*ct);c.save();c.translate(x,y);c.rotate(s.th+(f?s.d:0));c.fillStyle=glow&&!f?C.sens:C.ink;c.fillRect(-11,-4,22,8);c.restore();});}
function drawSonar(c,s,r){const dir=gearDir(m.gear);const auto=m.mode!=='manual';const ct=Math.cos(s.th),sn=Math.sin(s.th);
 SENSORS.forEach(S=>{const face=(dir>0&&S.face>0)||(dir<0&&S.face<0);if(!face)return;
  const px=s.x+S.a*ct-S.b*sn,py=s.y+S.a*sn+S.b*ct;const [X0,Y0]=P(px,py);const ang=s.th+S.dir,R=S.range*SC;const d=r.sens?r.sens[S.id]:null;
  const lim=(S.id==='f'||S.id==='r')?P1.stop:P1.corner;
  c.fillStyle=auto?'rgba(47,143,216,.13)':'rgba(90,102,114,.08)';c.beginPath();c.moveTo(X0,Y0);c.arc(X0,Y0,R,ang-S.half,ang+S.half);c.closePath();c.fill();
  if(auto){c.strokeStyle='rgba(47,143,216,.6)';c.setLineDash([3,3]);c.lineWidth=1;c.beginPath();c.arc(X0,Y0,lim*SC,ang-S.half,ang+S.half);c.stroke();c.setLineDash([]);}
  if(d!==null){const close=auto&&d<=lim;c.strokeStyle=close?C.danger:C.sens;c.lineWidth=2.5;c.beginPath();c.arc(X0,Y0,d*SC,ang-S.half,ang+S.half);c.stroke();
   if(S.id==='f'||S.id==='r'||close){c.fillStyle=close?C.danger:C.ink;c.font='bold 12px '+FN();c.textAlign='center';c.fillText(fmt(d*100)+'cm',X0+Math.cos(ang)*(d*SC+14),Y0+Math.sin(ang)*(d*SC+14)+4);}}});}

function drawGraph(){const {c,w,h}=X.cvGraph;c.clearRect(0,0,w,h);const x0=34,y0=18,gw=w-42,gh=h-44,vmax=Math.max(6,kmh(P1.vt)*1.8);

/* ===== データ分析 ===== */
// 1回の記録から、大事な数字を拾い出す
function minC(A){const c=A.map(x=>x.corner).filter(x=>x!==null);return c.length?Math.min(...c):null;}
function analyze(r){const R=r.rows;const sp=g=>{const a=R.filter(x=>x[6]===g&&Math.abs(x[5])>0.05).map(x=>Math.abs(x[5]));return a.length?a.reduce((p,q)=>p+q,0)/a.length:null;};
 const bumpA=R.filter(x=>x[10]&&x[7]==='A').length*0.05;const bumpT=R.filter(x=>x[10]).length*0.05;
 let brakeD=null;for(let i=R.length-1;i>0;i--){if(R[i][6]==='R'&&R[i][7]==='B'&&R[i-1][7]!=='B'){brakeD=R[i][8];break;}}
 const stuck=R.filter(x=>x[10]&&Math.abs(x[5])<0.01&&x[6]!=='P').length*0.05;const cs=R.map(x=>x[11]).filter(x=>x!==null&&x!==undefined);
 return {fw:sp('D'),bk:sp('R'),bumpA,bumpT,stuck,brakeD,corner:cs.length?Math.min(...cs):null,time:R[R.length-1][0]};}
function buildAnal(){const list=stageRuns();const t=$('atbl');
 let h=`<tr><th></th><th>前進の速さ<br>（平均）</th><th>バックの速さ<br>（平均）</th><th>段差で<br>止まった</th><th>段差で<br>アクセル</th><th>ブレーキを<br>踏んだ距離</th><th>となりに一番<br>近づいた</th><th>時間</th></tr>`;
 renderLearned();$('teachBtn').disabled=!list.length;if(!list.length){t.innerHTML=h+`<tr><td colspan="8" style="text-align:left;padding:14px">まだ記録がありません。「手動で運転」で駐車に成功すると、ここに増えます。</td></tr>`;drawA();return;}
 const A=list.map(analyze);const avg=k=>{const a=A.map(x=>x[k]).filter(x=>x!==null);return a.length?a.reduce((p,q)=>p+q,0)/a.length:null;};
 const f=(v,u,d=1,mul=1)=>v===null?'—':fmt(v*mul,d)+u;
 list.forEach((r,i)=>{const a=A[i];h+=`<tr class="click${r.id===selRun?' sel':''}" data-id="${r.id}"><td style="text-align:left"><span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:${r.color}"></span> 記録${i+1}${r.demo?'<small style="color:var(--sub)"> 見本</small>':''}</td><td>${f(a.fw,' km/h',1,3.6)}</td><td>${f(a.bk,' km/h',1,3.6)}</td><td>${f(a.stuck,' 秒')}</td><td>${f(a.bumpA,' 秒')}</td><td>${f(a.brakeD,' cm',0,100)}</td><td>${f(a.corner,' cm',0,100)}</td><td>${f(a.time,' 秒')}</td></tr>`;});
 h+=`<tr class="avg"><td style="text-align:left">平均</td><td>${f(avg('fw'),' km/h',1,3.6)}</td><td>${f(avg('bk'),' km/h',1,3.6)}</td><td>${f(avg('stuck'),' 秒')}</td><td>${f(avg('bumpA'),' 秒')}</td><td>${f(avg('brakeD'),' cm',0,100)}</td><td>${f(minC(A),' cm（最小）',0,100)}</td><td>${f(avg('time'),' 秒')}</td></tr>`;
 t.innerHTML=h;(t.children||[]).forEach?.(()=>{});
 t.onclick=e=>{const tr=e.target.closest&&e.target.closest('tr[data-id]');if(!tr)return;selRun=+tr.dataset.id;buildAnal();};
 const teach=()=>{if(!list.length){say('');return;}const fw=avg('fw'),bk=avg('bk'),bd=avg('brakeD');if(fw!==null)$('pF').value=+(fw*3.6).toFixed(1);if(bk!==null)$('pV').value=+(bk*3.6).toFixed(1);if(bd!==null)$('pS').value=+bd.toFixed(2);
  const mc=minC(A);if(mc!==null){$('pC').value=+Math.max(0.05,Math.min(0.8,mc*0.8)).toFixed(2);P1.cornerMin=mc;}
  P1.from=list.length;P1.fromStage=ST.name;pUI();renderLearned();};

function renderLearned(){const el=$('learned');if(!P1.from){el.className='learned none';el.innerHTML='車はまだ何も覚えていません。<br>左の記録を見て、ボタンを押すと、あなたの運転が車に伝わります。';return;}

 `<div class="row"><span>前進するときの速さ</span><b>${fmt(P1.vf*3.6,1)} km/h</b></div><div class="row"><span>バックするときの速さ</span><b>${fmt(P1.vt*3.6,1)} km/h</b></div><div class="row"><span>ブレーキを踏むタイミング</span><b>うしろ ${fmt(P1.stop*100)} cm</b></div>`+`<div class="row"><span>となりに近づいたら止まる</span><b>${fmt(P1.corner*100)} cm</b></div>`+(P1.cornerMin?`<div class="note">あなたが一番近づいたのは ${fmt(P1.cornerMin*100)} cm。それより少し手前で止めます。</div>`:'');}

 $('gTitle').textContent='速さの変わり方（上：前進／下：バック）';const R=r.rows,T=R[R.length-1][0],x0=34,y0=10,gw=w-44,gh=h-40,vm=2.6,ym=y0+gh/2;
