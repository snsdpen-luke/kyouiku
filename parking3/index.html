<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>自動運転への階段</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 4:3 固定ステージ（1024x768）。上：駐車場の地図、下：モードごとのパネル。ライト固定 */
:root{color-scheme:light;
  --bg:#e9edf1; --paper:#fbfcfd; --ink:#18212b; --sub:#5a6672; --line:#cfd6dd;
  --copper:#b8642a; --copper-soft:#f3e2d4; --steel:#3d5a73; --steel-soft:#cdd8e2;
  --lot:#e3e7ea; --mark:#fbfcfd; --good:#2c8a4f; --danger:#d23c32; --panel:#f1f4f7; --sens:#2f8fd8;
  --f-disp:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
[hidden]{display:none!important}
#vp{position:relative;width:100%;height:100%}
#stage{position:absolute;left:50%;top:50%;width:1024px;height:768px;background:var(--paper);border-radius:6px;box-shadow:0 2px 18px rgba(0,0,0,.12);overflow:hidden;display:flex;flex-direction:column;padding:10px 28px 12px;box-sizing:border-box;gap:8px}
header{display:flex;align-items:center;gap:12px}
header h1{margin:0;font-family:var(--f-disp);font-weight:400;font-size:22px;white-space:nowrap}
.grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-size:15px;border:2px solid var(--steel);background:var(--paper);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;user-select:none;-webkit-user-select:none}
button:hover{background:var(--panel)}
button.sel{background:var(--steel);color:var(--paper)}
button.go{background:var(--copper);border-color:var(--copper);color:#fff;font-weight:700}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--copper);outline-offset:2px}
.modes button{font-size:14px;padding:5px 10px}
.sp{flex:1}
canvas{display:block;border-radius:6px;background:var(--lot);touch-action:none}
.cvwrap{position:relative}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);border-radius:6px}
.ovbox{background:var(--paper);border-radius:10px;padding:18px 28px;display:flex;flex-direction:column;gap:10px;align-items:center;min-width:300px}
.ovt{font-family:var(--f-disp);font-size:32px}
.overlay.win .ovt{color:var(--good)}.overlay.lose .ovt{color:var(--danger)}
.ovs{font-size:16px;color:var(--sub);text-align:center}
.ovx{display:flex;flex-direction:column;align-items:center;gap:6px}
.scr{display:flex;align-items:center;gap:18px}
.rank{font-family:var(--f-disp);font-size:64px;line-height:1;width:70px;text-align:center}
.rank.S{color:#d4a017}.rank.A{color:var(--good)}.rank.B{color:var(--sens)}.rank.C{color:var(--sub)}.rank.X{color:var(--danger)}
.pts{font-family:var(--f-num);font-size:44px;font-weight:700;color:var(--ink)}.pts small{font-size:18px;color:var(--sub)}
.sub3{display:grid;grid-template-columns:auto auto;gap:0 10px;font-size:14px;color:var(--ink)}.sub3 b{font-family:var(--f-num);text-align:right}
.best{font-size:18px;font-weight:700;color:#d4a017}.best.n{color:var(--sub);font-weight:400;font-size:14px}
.used{font-size:14px;background:var(--panel);border-radius:6px;padding:4px 10px}
@keyframes fl{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 4px var(--copper)}}
#s1box.flash{animation:fl .5s 3;border-radius:6px}
.logt{border-collapse:collapse;font-size:12px;width:100%}
.logt th{color:var(--sub);font-weight:400;text-align:left;padding:1px 6px;border-bottom:1px solid var(--line)}
.logt td{padding:1px 6px;font-family:var(--f-num)}
.logt .bar{display:inline-block;height:9px;background:var(--copper);border-radius:3px;vertical-align:middle;margin-right:4px}
.logt tr.last td{background:#fff3e6}
.panel{flex:1;min-height:0;display:flex;gap:20px;align-items:stretch}
.big{font-size:18px;font-weight:700}
.note{font-size:13px;color:var(--sub)}
.side{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0;justify-content:center}
.gate{display:flex;flex-direction:column;gap:4px;background:var(--ink);padding:8px;border-radius:10px;align-self:center}
.gate button{width:54px;padding:3px 0;font-family:var(--f-num);font-size:19px;font-weight:700;background:transparent;border:2px solid transparent;color:var(--line)}
.gate button.sel{background:var(--copper);border-color:var(--copper);color:#fff}
.gate .gk{color:var(--line);text-align:center;font-family:var(--f-num);font-size:12px}
.wcol{display:flex;flex-direction:column;align-items:center;gap:6px;align-self:center}
.wheelbox{position:relative;width:200px;height:200px}
#cvWheel{background:transparent;cursor:grab;border-radius:50%}
.wv{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-family:var(--f-num);font-size:15px;font-weight:700;pointer-events:none}
.pedals{display:flex;gap:10px}
.pedal{width:100px;height:44px;padding:0;border-radius:10px;font-weight:700;background:var(--panel);touch-action:none}
.pedal.acc{width:92px;height:48px}
.pedal.sel:not(.acc){background:var(--danger);border-color:var(--danger);color:#fff}
.pedal.acc.sel{background:var(--good);border-color:var(--good);color:#fff}
.pedal.auto{border-style:dashed;color:var(--sub)}
.sensors{display:grid;grid-template-columns:auto auto;gap:2px 10px;font-size:14px}
.sensors .k{color:var(--sub)}
.sensors .v{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.sensors .on{color:var(--sens);font-weight:700}
.sl{display:grid;grid-template-columns:7.5em 1fr 5.2em;gap:4px 8px;align-items:center;font-size:14px}
.sl input{width:100%;accent-color:var(--copper)}
.sl .val{font-family:var(--f-num);text-align:right}
/* 分析 */
.runs{width:200px;flex:none;display:flex;flex-direction:column;gap:6px;overflow:auto}
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
th,td{padding:4px 5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);font-size:12px;color:var(--sub);text-align:center}
tr.avg td{font-weight:700;background:var(--copper-soft)}
tr.sel td{background:#fff3b0}
tr.click{cursor:pointer}
.acol{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.steps{display:flex;align-items:center;gap:6px}
.steps button{font-size:13px;line-height:1.3;padding:4px 9px;white-space:nowrap;text-align:left;min-height:46px}
.steps button b{font-size:16px;color:var(--copper)}
.steps button.sel b{color:#fff}
.steps button small{font-size:12px}
.steps .ar{color:var(--sub);font-size:18px}
.lvs{display:flex;align-items:center;gap:4px}
.lvs .lvlab{font-size:12px;color:var(--sub);margin-right:2px}
.lvs i{font-style:normal;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:13px;background:var(--panel);color:var(--sub);border:1px solid var(--line)}
.lvs i.on{background:var(--sens);color:#fff;border-color:var(--sens)}
.roles{display:flex;gap:4px;align-items:stretch}
.gcol{display:flex;flex-direction:column;gap:8px;justify-content:center;width:250px;flex:none}
.roles .rt{font-size:12px;color:var(--sub);align-self:center;margin-right:2px;line-height:1.2}
.role{min-width:62px;border-radius:6px;padding:2px 6px;text-align:center;font-size:12px;background:var(--panel);border:2px solid var(--line)}
.role b{display:block;font-size:14px}
.role.car{border-color:var(--sens);background:#e3f0fb}.role.car b{color:var(--sens)}
.role.you b{color:var(--copper)}
.lvsel{display:flex;gap:4px;flex-wrap:wrap}
.lvsel button{font-size:12px;padding:3px 8px;border-width:1.5px}
.lvsel button b{font-family:var(--f-num)}
.role.both{border-color:var(--sens);background:linear-gradient(90deg,#e3f0fb 55%,#f8ebe0 55%)}.role.both b{color:var(--sens)}
.sensors .hit{color:var(--danger);font-weight:700}
.sl{grid-template-columns:6.2em 1fr 7.6em!important}
.sl .val{white-space:nowrap;font-size:13px}
.sl small{color:var(--sub);font-size:11px}
.rv{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.rv #rSlider{flex:1;accent-color:var(--sens)}
.rrun{display:flex;flex-direction:column;background:var(--panel);border-radius:6px;padding:5px 8px;border:2px solid transparent;cursor:pointer;font-size:13px}
.rrun.sel{border-color:var(--sens)}
.rrun .ok{color:var(--good);font-weight:700}.rrun .ng{color:var(--danger);font-weight:700}
.why{display:flex;flex-direction:column;gap:6px}
.toast{position:absolute;left:50%;top:118px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:10px;font-size:16px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;white-space:nowrap}.toast.on{opacity:1}
.steps button.lock{opacity:.45}
#pRev .rv{min-height:0;overflow-y:auto;padding-right:4px}
.acc2 table{border-collapse:collapse;font-size:13px}.acc2 th,.acc2 td{border:1px solid var(--line);padding:3px 8px;text-align:right}.acc2 th{font-weight:600;color:var(--sub)}.acc2 td:first-child{text-align:left}
.acc2 .hint{font-size:14px;line-height:1.7;margin:2px 0}.acc2 .hint b{color:var(--copper)}
.chain{display:flex;align-items:stretch;gap:4px}
.chain .bx{flex:1;background:var(--panel);border-radius:8px;padding:6px 8px;font-size:13px;line-height:1.45;border-top:4px solid var(--line)}
.chain .bx h5{margin:0 0 2px;font-size:12px;color:var(--sub)}
.chain .bx.s{border-top-color:var(--sens)}.chain .bx.j{border-top-color:var(--copper)}.chain .bx.a{border-top-color:var(--good)}.chain .bx.x{border-top-color:var(--danger)}
.chain .ar2{align-self:center;color:var(--sub);font-size:18px}
.src{background:#fff8e1;border:2px dashed #e0b000;border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.5}
.src b{font-family:var(--f-num)}
.cond{font-size:14px;background:var(--panel);border-radius:6px;padding:4px 10px}
.cond b{color:var(--copper)}
.cond .same{margin-left:8px;background:var(--copper);color:#fff;border-radius:10px;padding:1px 9px;font-size:13px;font-weight:700}
.slh{font-size:13px;font-weight:700;color:var(--sens);margin-top:2px}
.slh.you{color:var(--copper)}
.accm{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.accm b{color:var(--sens);font-size:14px}
.accbar{width:22px;height:48px;border:2px solid var(--sens);border-radius:6px;position:relative;overflow:hidden;background:var(--paper)}
.accbar i{position:absolute;left:0;right:0;bottom:0;background:var(--sens);height:0}
.teach{width:300px;flex:none;display:flex;flex-direction:column;gap:8px}
.big-btn{font-size:17px;padding:10px 14px}
.learned{background:#e3f0fb;border:2px solid var(--sens);border-radius:8px;padding:8px 12px;font-size:14px;line-height:1.6}
.learned h4{margin:0 0 2px;font-size:13px;color:var(--sens)}
.learned .row{display:flex;justify-content:space-between;gap:8px}
.learned .row b{font-family:var(--f-num)}
.learned.none{background:var(--panel);border-color:var(--line);color:var(--sub)}
</style>
</head>
<body>
<div id="vp"><div id="stage">
  <header>
    <h1>自動運転への階段</h1>
    <div class="cond" id="condTxt"></div>
    <span class="sp"></span>
    <button id="snd">音：ON</button>
  </header>
  <div class="steps" id="modes">
    <button data-m="drive" class="sel"><b>①</b> 手動で運転<br><small>データを集める</small></button><span class="ar">→</span>
    <button data-m="anal"><b>②</b> コンピュータに反映<br><small>運転の記録を</small></button><span class="ar">→</span>
    <button data-m="auto"><b>③</b> 自動運転<br><small id="lvName"></small></button><span class="ar">→</span>
    <button data-m="review"><b>④</b> ふりかえり<br><small>止まった理由</small></button>
    <span class="sp"></span>
    <div class="roles" id="roles"></div>
  </div>
  <div class="cvwrap"><canvas id="cv" data-w="968" data-h="330"></canvas>
    <div class="overlay" id="ov" hidden><div class="ovbox"><div class="ovt" id="ovT"></div><div class="ovs" id="ovS"></div><div class="ovx" id="ovX"></div><div class="grp"><button id="ovSame" class="go" hidden>同じ条件でもう一回</button><button id="ovOk">OK</button><button id="ovRev" hidden>④ ふりかえりへ</button></div></div></div>
  </div>

  <!-- 運転（手動・段階1 共通） -->
  <div class="panel" id="pDrive">
    <div class="side">
      <div class="lvsel" id="lvsel" hidden></div>
      <div class="big" id="dStatus"></div>
      <div id="s1box" hidden>
        <div class="slh">コンピュータに入った数字 <span class="note" id="fromNote"></span></div>
        <div class="note" id="baseBox" style="font-size:13px;color:var(--ink)"></div>
        <div class="slh you">あなたが決める余裕 <span class="note">（ぎりぎり ← → 手前で止める）</span></div>
        <div class="sl">
          <label for="pS">前・うしろ <small id="pSB"></small></label><input id="pS" type="range" min="-0.3" max="0.8" step="0.01" value="0"><span class="val" id="pSV"></span>
          <label for="pC">四すみ <small id="pCB"></small></label><input id="pC" type="range" min="-0.3" max="0.4" step="0.01" value="0"><span class="val" id="pCV"></span>
          <div class="lv2" style="display:contents"><label for="pF">前進の速さ</label><input id="pF" type="range" min="0.5" max="9" step="0.1" value="4"><span class="val" id="pFV"></span>
          <label for="pV">バックの速さ</label><input id="pV" type="range" min="0.5" max="5" step="0.1" value="2"><span class="val" id="pVV"></span></div>
        </div>
        <div class="slh you lv2">あなたが決める直す強さ</div>
        <div class="sl lv2">
          <label for="pK">直す強さ</label><input id="pK" type="range" min="0" max="20" step="0.5" value="1"><span class="val" id="pKV"></span>
        </div>
      </div>
      <div class="grp"><button id="dReset">はじめから</button><span class="note" id="dCount"></span></div>
    </div>
    <div class="gcol"><canvas id="cvGraph" data-w="250" data-h="150" hidden style="background:var(--panel)"></canvas><div class="sensors" id="sens"></div></div>
    <div class="gate" id="gate"><button data-g="P" class="sel">P</button><button data-g="R">R</button><button data-g="N">N</button><button data-g="D">D</button><small class="gk">↑↓</small></div>
    <div class="wcol">
      <div class="wheelbox"><canvas id="cvWheel" data-w="200" data-h="200" tabindex="0" aria-label="ハンドル"></canvas><div class="wv" id="wheelV">まっすぐ</div></div>
      <div class="pedals"><button id="brake" class="pedal">ブレーキ <small>Z</small></button><button id="accel" class="pedal acc">アクセル <small>X</small></button><div class="accm" id="accMeter" hidden><div class="accbar"><i id="accFill"></i></div><span>アクセル<br><b>車</b></span></div></div>
    </div>
  </div>

  <!-- ふりかえり -->
  <div class="panel" id="pRev" hidden>
    <div class="runs" id="rlist"></div>
    <div class="rv">
      <div class="grp"><button id="rPlay">▶ 再生</button><input id="rSlider" type="range" min="0" max="0" value="0" aria-label="時間"><span class="count" id="rTime"></span><span class="sp"></span><button id="rTune" class="go">余裕を直して 同じ条件で ③へ →</button></div>
      <canvas id="cvT" data-w="720" data-h="30" style="background:var(--panel);cursor:pointer"></canvas>
      <div class="why" id="why"></div>
    </div>
  </div>
  <!-- 車に教える -->
  <div class="panel" id="pAnal" hidden>
    <div class="acol">
      <div class="grp"><span class="big">あなたの運転の記録</span><span class="note">（成功した運転だけ）</span><span class="sp"></span><button id="demoBtn">見本データを入れる</button></div>
      <div class="tblwrap" style="flex:1"><table id="atbl"></table></div>
    </div>
    <div class="teach">
      <button id="teachBtn" class="go big-btn">運転の記録を<br>車のコンピュータに反映する</button>
      <div class="learned" id="learned"></div>
      <div class="note" id="gTitle"></div>
      <canvas id="cvA" data-w="300" data-h="120" style="background:var(--panel)"></canvas>
    </div>
  </div>
</div></div>

<script>
/* ===== 車と駐車場のモデル（単位 m） ===== */
const L=2.6,DMAX=35*Math.PI/180,RO=0.9,FO=3.5,HW=0.875;
const WALL=0.3,SX=1.0,ENTRY=5.8,AB=10.8,BSW=2.7,BUMP1=5.4,BUMP2=5.75,NSLOT=9;
const STAGES=[
 {id:'E',name:'イージー',sw:2.6,y0:8.3,empties:[2,3,4],tol:0.45,ang:0.10},
 {id:'N',name:'ノーマル',sw:2.3,y0:9.6,empties:[4,5,6],tol:0.30,ang:0.07},
 {id:'H',name:'ハード',  sw:2.2,y0:9.6,empties:[4,5,6],tol:0.20,ang:0.05,pillar:true}];
function makeWorld(st,empty){const sw=st.sw,o=[];
 for(let k=0;k<NSLOT;k++){if(k===empty)continue;const cx=SX+sw*k+sw/2;o.push([cx-HW,0.8,cx+HW,5.2,0]);}
 for(let k=-2;k<NSLOT+3;k++){const cx=SX+BSW*k+BSW/2;o.push([cx-HW,AB,cx+HW,AB+4.4,1]);}
 const sl=SX+sw*empty;if(st.pillar)o.push([sl-0.4,BUMP2+0.05,sl+0.08,BUMP2+0.6,2]);
 return {st,obs:o,empty,sw,gc:sl+sw/2};}
function corners(s){const c=Math.cos(s.th),n=Math.sin(s.th);return [[-RO,-HW],[FO,-HW],[FO,HW],[-RO,HW]].map(([a,b])=>[s.x+a*c-b*n,s.y+a*n+b*c]);}
function hit(W,s){const Cs=corners(s);for(let i=0;i<4;i++){const a=Cs[i],b=Cs[(i+1)%4];for(let t=0;t<1;t+=0.1){const x=a[0]+(b[0]-a[0])*t,y=a[1]+(b[1]-a[1])*t;
 if(y<WALL||x<-4.6||x>27||y>13.5)return true;for(const o of W.obs)if(x>o[0]&&x<o[2]&&y>o[1]&&y<o[3])return true;if(W.dyn)for(const o of W.dyn)if(x>o[0]&&x<o[2]&&y>o[1]&&y<o[3])return true;}}return false;}
function move(s,v,dt){s.x+=v*Math.cos(s.th)*dt;s.y+=v*Math.sin(s.th)*dt;s.th+=v*Math.tan(s.d)/L*dt;}
function rearDist(s){return s.y-RO*Math.sin(s.th)-WALL;}
function judge(W,s){const cx=s.x+1.3*Math.cos(s.th),front=s.y+FO*Math.sin(s.th);
 if(s.y>ENTRY)return {ok:false,t:'まだ枠に入っていません'};
 if(Math.abs(cx-W.gc)>W.st.tol)return {ok:false,t:'枠からずれています'};
 if(front>ENTRY+0.05)return {ok:false,t:'枠からはみ出しています'};
 if(Math.abs(s.th-Math.PI/2)>W.st.ang)return {ok:false,t:'ななめに止まっています'};return {ok:true,t:'駐車成功！'};}
const USE_BUMP=false; // 段差なし
function onBump(W,s){if(!USE_BUMP)return 0;const c=Math.cos(s.th),n=Math.sin(s.th);let k=0;[0,L].forEach(a=>{const y=s.y+a*n,x=s.x+a*c;if(y>BUMP1&&y<BUMP2&&x>SX&&x<SX+W.sw*NSLOT)k++;});return k;}

/* ===== 記録と学習 ===== */
// 記録の1行：[時刻, 枠の真ん中からの前後(m), y, 向き(rad), ハンドル(-1左〜1右), 速さ(m/s), シフト, ペダル]
const DT=0.05,AHEAD=2,AHEADV=8,K=3;
function rowFeat(r){return [r[1]/3,(r[2]-7)/1.5,r[3]/0.6,r[4]*0.6,r[5]*0.2];}
function stateFeat(W,s){return [(s.x+1.3*Math.cos(s.th)-W.gc)/3,(s.y-7)/1.5,s.th/0.6,s.wh*0.6,s.v*0.2];}
// 学習：記録した全部の行を「状況 → そのあとの操作」の組にして覚える
function learn(runs){const mem=[];runs.forEach((run,ri)=>{const R=run.rows;for(let i=0;i<R.length;i++){const j=Math.min(R.length-1,i+AHEAD),jv=Math.min(R.length-1,i+AHEADV);
  if(Math.abs(R[i][5])<0.02&&Math.abs(R[jv][5])<0.02&&Math.abs(R[j][4]-R[i][4])<0.02&&i<R.length-1)continue; // 止まっているだけの行は使わない
  mem.push({f:rowFeat(R[i]),w:R[j][4],v:R[jv][5],ri,i});}});return mem;}
// 自動運転：今の状況にいちばん近い記録を K 個さがして、その操作をまねる
function decide(mem,f){const best=[];for(const m of mem){let d=0;for(let i=0;i<5;i++){const q=f[i]-m.f[i];d+=q*q;}
 if(best.length<K||d<best[best.length-1].d){best.push({d,m});best.sort((a,b)=>a.d-b.d);if(best.length>K)best.pop();}}
 if(!best.length)return {w:0,v:0,near:null};const w=best.reduce((a,b)=>a+b.m.w,0)/best.length,v=best.reduce((a,b)=>a+b.m.v,0)/best.length;return {w,v,near:best[0].m,dist:Math.sqrt(best[0].d)};}
function autoStep(s,c){s.wh+=Math.max(-DT*5,Math.min(DT*5,c.w-s.wh));s.d=s.wh*DMAX;s.v+=(c.v-s.v)*Math.min(1,DT*3);move(s,s.v,DT);}

/* ===== 前後の動き（段階1） ===== */
// アクセル u(0〜1)・ブレーキ b(0〜1)。クリープは手動のときだけ。モーターの力は少し遅れて出る。車輪速センサは0.1秒ごとに測る。
const LON={amax:3.0,drag:1.2,creep:0.72,bump:1.6,brake:5.0,lag:0.25,sample:0.1};
function lonStep(c,u,b,creep,bump,dt){c.F+=((u*LON.amax)-c.F)*Math.min(1,dt/LON.lag);
 let a=c.F+(creep&&b===0?LON.creep:0)-LON.drag*c.v-(bump?LON.bump:0)-b*LON.brake;
 if(c.v<=0&&a<0)c.v=0;else c.v=Math.max(0,c.v+a*dt);
 c.mt+=dt;if(c.mt>=LON.sample){c.mt=0;c.meas=c.v;}}
function pctl(meas,target,kp){const o=kp*(target-meas);return o>=0?{u:Math.min(1,o),b:0}:{u:0,b:Math.min(1,-o)};}
// 超音波センサ（前・うしろ）：いちばん近い物までの距離。2.5mより遠いと測れない
function rectDist(x,y,o){const dx=Math.max(o[0]-x,0,x-o[2]),dy=Math.max(o[1]-y,0,y-o[3]);return Math.hypot(dx,dy);}
function sonar(W,s){const c=Math.cos(s.th),n=Math.sin(s.th);
 // 前・うしろの真ん中から、その向き（左右 約30°）にある物だけを測る
 const one=(a,dirSign)=>{const px=s.x+a*c,py=s.y+a*n;let best=null;
  const cand=[];W.obs.forEach(o=>{const qx=Math.max(o[0],Math.min(px,o[2])),qy=Math.max(o[1],Math.min(py,o[3]));cand.push([qx,qy]);
   for(let k=0;k<=8;k++){cand.push([o[0]+(o[2]-o[0])*k/8,o[3]],[o[0]+(o[2]-o[0])*k/8,o[1]],[o[0],o[1]+(o[3]-o[1])*k/8],[o[2],o[1]+(o[3]-o[1])*k/8]);}});
  for(let k=-6;k<=6;k++)cand.push([px+k*0.2,WALL]);
  cand.forEach(([qx,qy])=>{const dx=qx-px,dy=qy-py;const fwd=(dx*c+dy*n)*dirSign,side=-dx*n+dy*c;if(fwd<=0)return;if(Math.abs(side)>HW+fwd*0.58)return;const d=Math.hypot(dx,dy);if(best===null||d<best)best=d;});
  return best!==null&&best<=2.5?best:null;};
 return {f:one(FO,1),r:one(-RO,-1)};}

/* ===== 6つの超音波センサ（前・うしろ・四すみ） ===== */
// a:前後の位置, b:左右(負=左), dir:向き(進む向きからの角度), half:見える範囲(左右), range:測れる距離
const SENSORS=[
 {id:'f', name:'前',       a:FO, b:0,        dir:0,            half:0.5, range:2.5,face:1},
 {id:'fl',name:'前の左すみ',a:FO, b:-HW+0.1, dir:-0.75,        half:0.6, range:1.0,face:1},
 {id:'fr',name:'前の右すみ',a:FO, b:HW-0.1,  dir:0.75,         half:0.6, range:1.0,face:1},
 {id:'r', name:'うしろ',     a:-RO,b:0,       dir:Math.PI,      half:0.5, range:2.5,face:-1},
 {id:'rl',name:'うしろの左すみ',a:-RO,b:-HW+0.1,dir:-Math.PI+0.75,half:0.6,range:1.0,face:-1},
 {id:'rr',name:'うしろの右すみ',a:-RO,b:HW-0.1, dir:Math.PI-0.75, half:0.6,range:1.0,face:-1}];
function obstaclePoints(W){if(W._pts)return W._pts;const P=[];W.obs.forEach(o=>{for(let k=0;k<=10;k++){const tx=o[0]+(o[2]-o[0])*k/10,ty=o[1]+(o[3]-o[1])*k/10;P.push([tx,o[1]],[tx,o[3]],[o[0],ty],[o[2],ty]);}});
 for(let x=-5;x<=28;x+=0.2)P.push([x,WALL]);W._pts=P;return P;}
function dynPoints(W){const P=[];(W.peds||[]).forEach(p=>{for(let k=0;k<8;k++)P.push([p.x+0.25*Math.cos(k*Math.PI/4),p.y+0.25*Math.sin(k*Math.PI/4)]);});(W.dyn||[]).forEach(o=>{for(let k=0;k<=8;k++){const tx=o[0]+(o[2]-o[0])*k/8,ty=o[1]+(o[3]-o[1])*k/8;P.push([tx,o[1]],[tx,o[3]],[o[0],ty],[o[2],ty]);}});return P;}
function senseAll(W,s,extra){const c=Math.cos(s.th),n=Math.sin(s.th);const pts=obstaclePoints(W).concat(dynPoints(W),extra||[]);const out={};
 SENSORS.forEach(S=>{const px=s.x+S.a*c-S.b*n,py=s.y+S.a*n+S.b*c,ang=s.th+S.dir;let best=null;
  for(const [qx,qy] of pts){const dx=qx-px,dy=qy-py;const d=Math.hypot(dx,dy);if(d>S.range||(best!==null&&d>=best))continue;let da=Math.atan2(dy,dx)-ang;da=Math.atan2(Math.sin(da),Math.cos(da));if(Math.abs(da)<=S.half)best=d;}
  out[S.id]=best;});return out;}

/* ===== ランダムな条件 ===== */
// 入れることを確かめた範囲だけで組み合わせる
const LEVEL_ST={tol:0.3,ang:0.07};
function randomCond(rnd){rnd=rnd||Math.random;const pick=a=>a[Math.floor(rnd()*a.length)];
 const sw=pick([2.6,2.5,2.4,2.3]);const pillar=rnd()<0.3;const side=rnd()<0.5?'L':'R';const off=rnd()<0.4?pick([0.06,0.1,0.12]):0;
 return {sw,empty:2+Math.floor(rnd()*5),pillar,offL:side==='L'?off:0,offR:side==='R'?off:0,y0:8.2+rnd()*1.5,
  night:rnd()<0.35,cars:pick([0,1,2,3]),peds:pick([0,1,2,3]),seed:Math.floor(rnd()*1e9)};}
function makeWorldC(cd){const sw=cd.sw,o=[];
 for(let k=0;k<NSLOT;k++){if(k===cd.empty)continue;let cx=SX+sw*k+sw/2;if(k===cd.empty-1)cx+=cd.offL||0;if(k===cd.empty+1)cx-=cd.offR||0;o.push([cx-HW,0.8,cx+HW,5.2,0]);}
 for(let k=-2;k<NSLOT+3;k++){const cx=SX+BSW*k+BSW/2;o.push([cx-HW,AB,cx+HW,AB+4.4,1]);}
 const sl=SX+sw*cd.empty;if(cd.pillar)o.push([sl-0.4,BUMP2+0.05,sl+0.08,BUMP2+0.6,2]);
 return {st:LEVEL_ST,cd,obs:o,empty:cd.empty,sw,gc:sl+sw/2,night:cd.night};}

/* ===== 運転の1コマ分（手動・段階1 共通） ===== */
// m: {s:{x,y,th,d}, c:{v,F,meas,mt}, gear, wheel(-540〜540), brake, acc, mode:'manual'|'s1', p:{vt(m/s),kp,stop(m)}, hold}
const WMAX=540;
const BRAKE_DELAY=0.3,BRAKE_RAMP=0.3; // 自動ブレーキ：センサで気づいてから効き始めるまでの時間・強くなるまでの時間
function gearDir(g){return g==='D'?1:g==='R'?-1:0;}
function physStep(m,W,dt){const s=m.s;s.d=m.wheel/WMAX*DMAX;const dir=gearDir(m.gear);const bump=onBump(W,s)>0;let u=0,b=0,creep=false,auto=null,trig=null;
 const sens=senseAll(W,s);const son={f:sens.f,r:sens.r};
 const lv=m.mode==='lv1'?1:m.mode==='lv2'?2:0;
 if(m.gear==='P'){b=1;}
 else{
  if(lv>=2&&dir){const ctl=pctl(m.c.meas,dir>0?(m.p.vf||m.p.vt):m.p.vt,m.p.kp);u=ctl.u;b=ctl.b;}
  else{u=m.acc&&dir?1:0;creep=dir!==0;}
  if(lv>=1&&dir){ // レベル1：進む向きのセンサが、決めた距離より近い物を見つけたらブレーキ
   const ids=dir>0?['f','fl','fr']:['r','rl','rr'];
   if(!m.hold)for(const id of ids){const d=sens[id];if(d===null)continue;const lim=(id==='f'||id==='r')?m.p.stop:m.p.corner;if(d<=lim){trig={id,d,lim,v:m.c.v};m.hold=true;m.holdT=0;m.trig=id;break;}}
   if(m.hold){ // 気づいてから効くまで BRAKE_DELAY 秒。効き始めたら BRAKE_RAMP 秒かけて強くなる（いちばん強くて 4 m/s² で減速）
    m.holdT=(m.holdT||0)+dt;if(m.holdT>=BRAKE_DELAY){u=0;creep=false;b=Math.max(b,Math.min(1,(m.holdT-BRAKE_DELAY)/BRAKE_RAMP)*0.8);}}}
  if(m.brake){u=0;b=1;}
  if(lv)auto={u,b};}
 lonStep(m.c,u,b,creep,bump&&dir!==0,dt);
 const v=m.c.v*(dir||m.lastDir||1);if(dir)m.lastDir=dir;
 let crash=false;if(m.c.v>0){const n=6;for(let i=0;i<n;i++){move(s,v,dt/n);if(hit(W,s)){crash=true;m.c.v=0;m.c.F=0;break;}}}
 return {crash,bump,son,sens,auto,v,dir,trig};}

/* ===== 記録の1行 ===== */
// [時刻, 枠の真ん中から前後, y, 向き, ハンドル(-1〜1), 速さ(向きつき m/s), シフト, ペダル, うしろの距離(m or null), 前の距離, 段差]
function makeRow(t,m,W,r){const s=m.s;return [+t.toFixed(2),+(s.x+1.3*Math.cos(s.th)-W.gc).toFixed(2),+s.y.toFixed(2),+s.th.toFixed(3),+(m.wheel/WMAX).toFixed(2),+r.v.toFixed(2),m.gear,m.brake?'B':m.acc?'A':'-',r.son.r===null?null:+r.son.r.toFixed(2),r.son.f===null?null:+r.son.f.toFixed(2),r.bump?1:0,cornerMin(r),m.hold?1:0,m.waiting||0];}
function cornerMin(r){const ids=r.v>0.01?['fl','fr']:r.v<-0.01?['rl','rr']:[];let d=null;ids.forEach(id=>{const x=r.sens[id];if(x!==null&&(d===null||x<d))d=x;});return d===null?null:+d.toFixed(2);}

/* ===== 見本の運転（ボクが手で運転したのと同じ操作を、決まった手順で行う） ===== */
function demoDrive(st,empty,y0,rnd){const W=makeWorld(st,empty);const m={s:{x:0,y:y0,th:0,d:0},c:{v:0,F:0,meas:0,mt:0},gear:'D',wheel:0,brake:false,acc:true,mode:'manual'};
 const ty=7.75+rnd()*0.2,A=4.75+rnd()*0.1,stopD=0.35+rnd()*0.25;const rows=[];let ph=0,t=0,accT=0,wait=0;const DTD=0.05;
 const turnTo=(w,rate)=>{m.wheel+=Math.max(-rate*DTD,Math.min(rate*DTD,w-m.wheel));};
 while(t<120){const s=m.s,cx=s.x+1.3*Math.cos(s.th);
  if(ph===0){turnTo(Math.max(-1,Math.min(1,-(s.y-ty)*1.4-s.th*4))*WMAX,900);m.acc=cx<W.gc+A-2;if(cx>=W.gc+A){ph=1;m.acc=false;m.brake=true;}}
  else if(ph===1){turnTo(0,900);if(m.c.v===0){wait+=DTD;if(wait>0.4){m.gear='R';m.brake=false;ph=2;wait=0;}}}
  else if(ph===2){turnTo(-WMAX,900);if(m.wheel<=-WMAX+1)ph=3;else m.brake=true;if(ph===3)m.brake=false;}
  else if(ph===3){if(m.c.v<0.08&&!m.acc){accT=0.5;}m.acc=accT>0;accT-=DTD;if(s.th>=Math.PI/2-0.03)ph=4;}
  else if(ph===4){turnTo(0,900);if(m.c.v<0.08&&!m.acc)accT=0.5;m.acc=accT>0;accT-=DTD;const r=senseAll(W,s).r;if(r!==null&&r<=stopD){m.acc=false;m.brake=true;ph=5;}}
  else if(ph===5){if(m.c.v===0){m.gear='P';m.brake=false;}}
  const r=physStep(m,W,DTD);if(r.crash)return null;rows.push(makeRow(t,m,W,r));t+=DTD;
  if(ph===5&&m.gear==='P')break;}
 const j=judge(W,m.s);return j.ok?{empty,rows}:null;}

function demoDriveC(cd,rnd){const W=makeWorldC(cd);const m={s:{x:0,y:cd.y0,th:0,d:0},c:{v:0,F:0,meas:0,mt:0},gear:'D',wheel:0,brake:false,acc:true,mode:'manual'};
 const ty=7.75+rnd()*0.2,A=4.75+rnd()*0.1,stopD=0.35+rnd()*0.25;const rows=[];let ph=0,t=0,accT=0,wait=0;const DTD=0.05;
 const turnTo=(w,rate)=>{m.wheel+=Math.max(-rate*DTD,Math.min(rate*DTD,w-m.wheel));};
 while(t<120){const s=m.s,cx=s.x+1.3*Math.cos(s.th);
  if(ph===0){turnTo(Math.max(-1,Math.min(1,-(s.y-ty)*1.4-s.th*4))*WMAX,900);m.acc=cx<W.gc+A-2;if(cx>=W.gc+A){ph=1;m.acc=false;m.brake=true;}}
  else if(ph===1){turnTo(0,900);if(m.c.v===0){wait+=DTD;if(wait>0.4){m.gear='R';m.brake=false;ph=2;wait=0;}}}
  else if(ph===2){turnTo(-WMAX,900);if(m.wheel<=-WMAX+1)ph=3;else m.brake=true;if(ph===3)m.brake=false;}
  else if(ph===3){m.acc=m.c.v<0.08;if(s.th>=Math.PI/2-0.03)ph=4;}
  else if(ph===4){turnTo(0,900);m.acc=false;const r=senseAll(W,s).r;if(r!==null&&r<=stopD){m.brake=true;ph=5;}}
  else if(ph===5){if(m.c.v===0){m.gear='P';m.brake=false;}}
  const r=physStep(m,W,DTD);if(r.crash)return null;rows.push(makeRow(t,m,W,r));t+=DTD;
  if(ph===5&&m.gear==='P')break;}
 const j=judge(W,m.s);return j.ok?{cond:cd,rows}:null;}

const TCFG=[null,{first:25,every:20,onc:null,wait:90},{first:15,every:12,onc:35,wait:75},{first:10,every:8,onc:20,wait:60}];
const LANE_B=9.55,LANE_O=7.35;

function seedRnd(a){a=a>>>0;return ()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;};}
function resetTR(){const tm=TCFG[W.cd.cars];TR.rnd=seedRnd(W.cd.seed||1);const pt=[];for(let k=0;k<W.cd.peds*2;k++)pt.push(4+TR.rnd()*50);pt.sort((a,b)=>a-b);
 Object.assign(TR,{list:[],peds:[],pedT:pt,t:0,irr:0,over:false,started:false,nb:tm?tm.first:1e9,no:tm&&tm.onc!==null?tm.onc:1e9,honkT:0});W.dyn=[];W.peds=TR.peds;}
function inCar(s,x,y,pad){const c=Math.cos(s.th),n=Math.sin(s.th),dx=x-s.x,dy=y-s.y;const a=dx*c+dy*n,b=-dx*n+dy*c;return a>-RO-pad&&a<FO+pad&&b>-HW-pad&&b<HW+pad;}
function spawnPed(){const R=TR.rnd||Math.random;const k=1+Math.floor(R()*(NSLOT-1));const down=R()<0.6;const x=(k===W.empty||k===W.empty+1)&&R()<0.5?W.gc:SX+W.sw*k;

const honk=long=>tone([392,494],long?0.6:0.22,0.09,'square');
function carRim(s){const Cs=corners(s),P2=[];for(let i=0;i<4;i++){const a=Cs[i],b=Cs[(i+1)%4];for(let t=0;t<1;t+=0.125)P2.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);}return P2;}
function tickTraffic(dt){const tm=TCFG[W.cd.cars]||{every:1e9,wait:90};const s=m.s;const live=TR.started&&!TR.over&&!m.crash&&!m.done;
 if(!TR.started&&(m.gear!=='P'||m.c.v>0))TR.started=true;
 if(live){TR.t+=dt;
  if(TR.t>=TR.nb){const back=TR.list.filter(c=>c.dir>0);const last=back.length?Math.min(...back.map(c=>c.x)):99;if(back.length<5)TR.list.push({x:Math.min(-9,last-5.6),y:LANE_B,dir:1,v:2.5,wait:false,bub:0});TR.nb+=tm.every;}
  while(TR.pedT.length&&TR.t>=TR.pedT[0]){TR.pedT.shift();spawnPed();}
  if(TR.t>=TR.no){const fw=TR.list.filter(c=>c.dir<0);const last=fw.length?Math.max(...fw.map(c=>c.x)):-99;if(fw.length<3)TR.list.push({x:Math.max(31,last+5.6),y:LANE_O,dir:-1,v:2.5,wait:false,bub:0});TR.no+=25;}}
 const rim=carRim(s);
 TR.list.forEach(c=>{const front=c.x+c.dir*2.2;let room=Infinity;
  if(!m.done)rim.forEach(([x,y])=>{if(Math.abs(y-c.y)<HW+0.25&&(x-front)*c.dir>-0.5)room=Math.min(room,(x-front)*c.dir-4.5);});
  TR.list.forEach(o=>{if(o===c)return;if(Math.abs(o.y-c.y)<HW*2+0.2&&(o.x-c.x)*c.dir>0)room=Math.min(room,Math.abs(o.x-c.x)-4.4-3.0);});
  TR.peds.forEach(p=>{if(Math.abs(p.y-c.y)<HW+0.8&&(p.x-front)*c.dir>-0.3)room=Math.min(room,(p.x-front)*c.dir-2.0);});
  const want=room<=0?0:Math.min(2.5,Math.sqrt(2*0.8*room));c.v+=(want-c.v)*Math.min(1,dt*(want<c.v?3:1.2));if(room<=0.05&&c.v<0.3)c.v=0;
  c.wait=c.v<0.05&&room<1.5&&!m.done;c.x+=c.dir*c.v*dt;c.bub=Math.max(0,c.bub-dt);});
 TR.list=TR.list.filter(c=>(c.dir>0?c.x<36:c.x>-12));
 TR.peds.forEach(p=>{const nx=p.x,ny=p.y+p.dir*0.6;let block=inCar(s,nx,ny,0.35);TR.list.forEach(c=>{if(Math.abs(nx-c.x)<2.6&&Math.abs(ny-c.y)<HW+0.4)block=true;});p.wait=block;if(!block)p.y+=p.dir*1.1*dt;p.ph+=dt*(block?0:8);});
 for(let i=TR.peds.length-1;i>=0;i--){const p=TR.peds[i];if((p.to-p.y)*p.dir<=0)TR.peds.splice(i,1);}
 W.dyn=TR.list.map(c=>[c.x-2.2,c.y-HW,c.x+2.2,c.y+HW]);
 const waiting=TR.list.filter(c=>c.wait);m.waiting=waiting.length;
 if(live&&waiting.length){TR.irr=Math.min(100,TR.irr+dt*100/tm.wait*Math.min(1.4,waiting.length**0.5));TR.honkT-=dt;
  if(TR.honkT<=0){const w0=waiting[Math.floor(Math.random()*waiting.length)];w0.bub=0.7;honk(TR.irr>70);TR.honkT=3.5-2.8*TR.irr/100;}
  if(TR.irr>=100){TR.over=true;honk(true);}}}
function anger(c,x,y,k,t){const r=11*k*(1+0.08*Math.sin(t*10));c.save();c.translate(x,y);c.strokeStyle=C.danger;c.lineWidth=4*k;c.lineCap='round';

function drawPeds(c){TR.peds.forEach(p=>{const [x,y]=P(p.x,p.y);const sw=Math.sin(p.ph)*4;c.fillStyle=C.good;c.beginPath();c.arc(x,y,8,0,Math.PI*2);c.fill();

let nightCv=null;
function drawNight(c,w,h,s){if(!nightCv){nightCv=document.createElement('canvas');nightCv.width=w*2;nightCv.height=h*2;}const n=nightCv.getContext('2d');n.setTransform(2,0,0,2,0,0);

 const cone=(x,y,th,len,spread,a)=>{const [px,py]=P(x,y);const g=n.createRadialGradient(px,py,4,px,py,len*SC);g.addColorStop(0,`rgba(0,0,0,${a})`);g.addColorStop(1,'rgba(0,0,0,0)');n.fillStyle=g;n.beginPath();n.moveTo(px,py);n.arc(px,py,len*SC,th-spread,th+spread);n.closePath();n.fill();};

 [[6,6.6],[13,6.6],[20,6.6]].forEach(([x,y])=>glow(x,y,2.2,0.45));
 n.globalCompositeOperation='source-over';c.drawImage(nightCv,0,0,w,h);}
function drawTraffic(c){TR.list.forEach(t=>{const [x1,y1]=P(t.x-2.2,t.y-HW),[x2,y2]=P(t.x+2.2,t.y+HW);c.fillStyle=C.sub;c.beginPath();c.roundRect?c.roundRect(x1,y1,x2-x1,y2-y1,6):c.rect(x1,y1,x2-x1,y2-y1);c.fill();

  const hot=ev&&ev.type==='brake'&&ev.id===S.id;c.fillStyle=hot?'rgba(210,60,50,.22)':'rgba(47,143,216,.13)';c.beginPath();c.moveTo(X0,Y0);c.arc(X0,Y0,S.range*SC,ang-S.half,ang+S.half);c.closePath();c.fill();

  const px=s.x+S.a*ct-S.b*sn,py=s.y+S.a*sn+S.b*ct;const [X0,Y0]=P(px,py);const ang=s.th+S.dir,R=S.range*SC;const d=r.sens?r.sens[S.id]:null;

// 1回の記録から、大事な数字を拾い出す
function minC(A){const c=A.map(x=>x.corner).filter(x=>x!==null);return c.length?Math.min(...c):null;}
function analyze(r){const R=r.rows;const sp=g=>{const a=R.filter(x=>x[6]===g&&Math.abs(x[5])>0.05).map(x=>Math.abs(x[5]));return a.length?a.reduce((p,q)=>p+q,0)/a.length:null;};
 const bumpA=R.filter(x=>x[10]&&x[7]==='A').length*0.05;const bumpT=R.filter(x=>x[10]).length*0.05;
 let brakeD=null;for(let i=R.length-1;i>0;i--){if(R[i][6]==='R'&&R[i][7]==='B'&&R[i-1][7]!=='B'){brakeD=R[i][8];break;}}
 const stuck=R.filter(x=>x[10]&&Math.abs(x[5])<0.01&&x[6]!=='P').length*0.05;const cs=R.map(x=>x[11]).filter(x=>x!==null&&x!==undefined);

 return {fw:sp('D'),bk:sp('R'),bumpA,bumpT,stuck,brakeD,corner:cs.length?Math.min(...cs):null,waitT,time:R[R.length-1][0]};}
function buildAnal(){const list=stageRuns();const t=$('atbl');
 let h=`<tr><th></th><th>条件</th><th>前進の速さ<br>（平均）</th><th>バックの速さ<br>（平均）</th><th>ブレーキを<br>踏んだ距離</th><th>となりに一番<br>近づいた</th><th>まわりを<br>待たせた</th><th>時間</th></tr>`;
 renderLearned();$('teachBtn').disabled=!list.length;if(!list.length){t.innerHTML=h+`<tr><td colspan="8" style="text-align:left;padding:14px">まだ記録がありません。「手動で運転」で駐車に成功すると、ここに増えます。</td></tr>`;drawA();return;}
 const A=list.map(analyze);const avg=k=>{const a=A.map(x=>x[k]).filter(x=>x!==null);return a.length?a.reduce((p,q)=>p+q,0)/a.length:null;};

 list.forEach((r,i)=>{const a=A[i];h+=`<tr class="click${r.id===selRun?' sel':''}" data-id="${r.id}"><td style="text-align:left"><span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:${r.color}"></span> 記録${i+1}${r.demo?'<small style="color:var(--sub)"> 見本</small>':''}</td><td style="text-align:left;font-size:11px">${r.cond.night?'夜':'昼'}・${fmt(r.cond.sw,1)}m${r.cond.pillar?'・柱':''}<br>人${r.cond.peds}・車${r.cond.cars}</td><td>${f(a.fw,' km/h',1,3.6)}</td><td>${f(a.bk,' km/h',1,3.6)}</td><td>${f(a.brakeD,' cm',0,100)}</td><td>${f(a.corner,' cm',0,100)}</td><td>${f(a.waitT,' 秒')}</td><td>${f(a.time,' 秒')}</td></tr>`;});
 h+=`<tr class="avg"><td style="text-align:left">平均</td><td style="text-align:left;font-size:11px">昼 ${list.filter(r=>!r.cond.night).length}・夜 ${list.filter(r=>r.cond.night).length}</td><td>${f(avg('fw'),' km/h',1,3.6)}</td><td>${f(avg('bk'),' km/h',1,3.6)}</td><td>${f(avg('brakeD'),' cm',0,100)}</td><td>${f(minC(A),' cm（最小）',0,100)}</td><td>${f(avg('waitT'),' 秒')}</td><td>${f(avg('time'),' 秒')}</td></tr>`;
