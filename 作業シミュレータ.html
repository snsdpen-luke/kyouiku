<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>技能試験 作業シミュレータ</title>
<style>
  :root {
    --bg: #f3f5f4; --card: #fff; --ink: #151a18; --muted: #5d6763; --line: #d9dfdc;
    --accent: #0f6b4f; --bad: #b91c1c; --warn: #b45309; --sel: #2563eb;
  }
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14.5px/1.6 "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif; }
  .wrap { max-width: 1360px; margin: 0 auto; padding: 12px 16px 32px; }
  h1 { font-size: 20px; margin: 0; display: inline-block; }
  h2 { font-size: 16px; margin: 0 0 6px; }
  h3 { font-size: 14.5px; margin: 10px 0 4px; }
  .ver { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 8px; }
  .sub { color: var(--muted); font-size: 12.5px; margin-left: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .note { font-size: 12.5px; color: var(--muted); }
  button { font: inherit; color: var(--ink); border: 1px solid var(--line); background: var(--card);
           border-radius: 6px; padding: 5px 11px; cursor: pointer; touch-action: manipulation; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 700; }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
  .probs button { min-width: 48px; padding: 4px 7px; }
  .modes button { font-weight: 700; padding: 6px 14px; }
  .main { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 12px; align-items: start; margin-top: 8px; }
  @media (max-width: 900px) { .main { grid-template-columns: 1fr; } }
  .list button { display: block; width: 100%; text-align: left; margin: 0 0 4px; padding: 6px 9px; }
  .list button.on { background: #e6f2ec; color: var(--ink); border-color: var(--accent); }
  .cutsides .ctl { margin: 2px 0; }
  .list h3 { font-size: 12.5px; color: var(--muted); margin: 10px 0 4px; }
  .list .st { float: right; font-size: 12px; font-weight: 700; }
  .st.ok { color: var(--accent); } .st.ng { color: var(--bad); } .st.todo { color: var(--muted); }
  .src { font-size: 11.5px; color: var(--muted); }
  .src a { color: inherit; }
  /* 順番 */
  .pool, .seq { display: flex; flex-wrap: wrap; gap: 6px; min-height: 46px; padding: 6px; border: 1px dashed var(--line); border-radius: 8px; background: #fafbfa; }
  .seq { background: #fff; border-style: solid; flex-direction: column; flex-wrap: nowrap; }
  .cardbtn { text-align: left; padding: 7px 10px; background: #fff; border: 1.5px solid #c9d2cd; border-radius: 8px; }
  .seq .cardbtn { border-color: var(--accent); background: #f0f8f4; cursor: default; }
  .seq .cardbtn b { color: var(--accent); margin-right: 6px; }
  .shake { animation: shake .35s; border-color: var(--bad) !important; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .msg { min-height: 1.6em; margin: 6px 0; font-size: 14px; }
  .msg.err { color: var(--bad); font-weight: 600; } .msg.ok { color: var(--accent); font-weight: 700; }
  /* 作業 */
  .ctl { display: grid; grid-template-columns: 170px 1fr 70px; gap: 6px 10px; align-items: center; margin: 4px 0; }
  .ctl input[type=range] { width: 100%; }
  .ctl .val { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .seg { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .seg button { padding: 4px 10px; }
  .sect { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }
  svg.side { width: 100%; height: auto; display: block; background: #fcfcfa; border: 1px solid var(--line); border-radius: 6px; margin: 6px 0; }
  table.wires { border-collapse: collapse; font-size: 13.5px; margin: 4px 0; }
  table.wires td, table.wires th { border: 1px solid var(--line); padding: 3px 7px; text-align: left; }
  .chip { display: inline-block; width: 14px; height: 14px; border-radius: 3px; border: 1px solid #888; vertical-align: -2px; margin-right: 4px; }
  .issue { border-left: 4px solid var(--bad); background: #fef2f2; border-radius: 4px; padding: 5px 8px; margin: 5px 0; font-size: 13.5px; }
  .issue.tip { border-color: var(--warn); background: #fffbeb; }
  .issue.good { border-color: var(--accent); background: #ecfdf5; color: var(--accent); font-weight: 700; }
  .issue .rule { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .verdict { font-size: 18px; font-weight: 800; margin: 4px 0 8px; }
  .verdict.ok { color: var(--accent); } .verdict.ng { color: var(--bad); }
  svg text { font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif; }
</style>
</head>
<body>
<div class="wrap">
  <h1>技能試験 作業シミュレータ<span class="ver" id="ver"></span></h1><span class="sub">第二種電気工事士 ― 作業の順番・作り方・欠陥の確認</span>
  <div class="bar probs" id="probs"></div>
  <div class="bar modes" id="modes">
    <button data-m="order">① 作業の順番</button>
    <button data-m="work">② 作業をする</button>
    <button data-m="check">③ 点検（欠陥の確認）</button>
  </div>
  <div class="main">
    <div class="card"><div id="side"></div></div>
    <div class="card"><div id="body"></div></div>
  </div>
  <p class="src">欠陥の基準は 一般財団法人 電気技術者試験センター「技能試験の欠陥の判断基準」（<a href="https://www.shiken.or.jp/construction/upload/handankizyun2017.pdf" target="_blank" rel="noopener">PDF</a>・<a href="https://www.shiken.or.jp/construction/second/defect/" target="_blank" rel="noopener">案内</a>）。
    数値の決まりが無い寸法は HOZAN「第二種電工試験の虎」などの目安で、「目安」と書いて欠陥とは区別する。
    問題（配線・施工条件）は「複線図れんしゅう」と同じもの。No.1（★）は先生の配布資料の施工条件・切る長さ・はぐ長さ・作業の順番に合わせてある。ほかの問題の施工条件は仮。</p>
</div>

/* ============================================================
   リングスリーブ（JIS C 2806）。1.6mm×2本だけが刻印「○」
   ============================================================ */
function sleeveFor(n16, n20) {
  const a = n16, b = n20;
  if (b === 0) return a === 2 ? { size: "小", mark: "○" } : a >= 3 && a <= 4 ? { size: "小", mark: "小" } : a >= 5 && a <= 6 ? { size: "中", mark: "中" } : null;
  if (b === 1) return a >= 1 && a <= 2 ? { size: "小", mark: "小" } : a >= 3 && a <= 5 ? { size: "中", mark: "中" } : null;
  if (b === 2) return a === 0 ? { size: "小", mark: "小" } : a <= 3 ? { size: "中", mark: "中" } : null;
  if (b === 3 || b === 4) return a === 0 ? { size: "中", mark: "中" } : null;
  return null;
}

/* ============================================================

function boxName(id) { const m = BOXNAME[P.id]; return m && m[id] ? m[id] + "（" + id + "）" : id; }

/* ケーブルの1本1本（VVF 2C×2 は2本に分ける）。wires はその1本に入っている線 */
function pieces() {
  const t = teach(), out = [];
  P.cables.forEach(c => {
    const m = /×(\d)/.exec(c.spec), n = m ? +m[1] : 1, per = c.colors.length / n;
    const left = P.wires.map((w, i) => ({ w, i })).filter(x => x.w.cable === c.id);
    for (let k = 0; k < n; k++) {
      const ws = [];
      c.colors.slice(k * per, (k + 1) * per).forEach(col => { const j = left.findIndex(x => x.w.color === col); if (j >= 0) ws.push(left.splice(j, 1)[0]); });
      const cut = t && t.cut ? t.cut.filter(x => x.cable === c.id)[k] : null;
      const spec = c.spec.replace(/×\d$/, "");
      out.push({ id: c.id + "#" + (k + 1), c, k, n, spec, wires: ws, a: c.a, b: c.b, cut,
        name: cut ? cut.n + ". " + cut.seg : endName(c.a) + " 〜 " + endName(c.b) + (n > 1 ? "（" + (k + 1) + "本目）" : ""),
        len: cut ? cut.len : 300 });

}
/* ケーブルの端の作業の種類: joint（リングスリーブ）/ conn（差込形コネクタ）/ ring・push・ceil・block（器具）/ none（電源・施工省略。はがない） */

  const ks = pc.wires.map(x => [x.w.a, x.w.b].find(e => e.kind === "term" && (P.places.find(p => p.id === pl) || { parts: [] }).parts.includes(e.part)))
    .filter(Boolean).map(e => partOf(e.part)).filter(p => !p.omit && WORK[p.type]).map(p => WORK[p.type]);
  return ks[0] || "none";
}
const ENDWORK = { joint: "リングスリーブ", conn: "差込形コネクタ", ring: "のの字", push: "差込（ゲージ）", ceil: "差込（ゲージ）", block: "端子台", none: "はがない" };
function units() {

  pieces().forEach(pc => out.push({ id: "pc:" + pc.id, kind: "piece", group: "③ 外装・被覆をはがす", piece: pc, name: pc.name + "（" + pc.spec + "）" }));
  P.places.forEach(pl => {
    const ps = pl.parts.map(partOf), kinds = [...new Set(ps.filter(p => !p.omit && WORK[p.type]).map(p => WORK[p.type]))];
    if (!kinds.length) return;

    out.push({ id: "pl:" + pl.id, kind: "dev", group: "④⑤ 器具につける", place: pl.id, name: ps.map(p => p.name).join("・"), work: kinds, frame: pushes.map(p => p.id) });

let orderState = { set: null, done: [], miss: 0, pool: [] };
function orderDef(set) {                      // 資料があれば「全体の流れ」は資料の8つ

  });
  /* わたり線 */
  P.places.forEach(pl => { jumpersAt(pl.id).forEach(({ w, i }) => { const r = dev(pl.id), a = r.conn && term[r.conn[i + ":a"]], b = r.conn && term[r.conn[i + ":b"]]; if (a && b) g += wire(a, b, w.color, { x: -26, y: 0 }); }); });
  /* 接続点: スリーブ（刻印）か差込形コネクタ */
  P.boxes.forEach(b => { const r = boxR(b.id), conn = b.join === "conn";
    P.joints.filter(j => j.box === b.id).forEach(j => { const p = jpos[j.id], x = r.j && r.j[j.id], ang = p.a * 180 / Math.PI;
      if (conn) { const col = x && x.conn ? CONNCOL[x.conn] || "#64748b" : "#cbd5e1";
        g += `<g transform="rotate(${ang + 90} ${p.x} ${p.y})"><rect x="${p.x - 4 * j.n - 2}" y="${p.y - 10}" width="${8 * j.n + 4}" height="14" fill="#fff7ed" stroke="#9a3412"/><rect x="${p.x - 4 * j.n - 2}" y="${p.y + 2}" width="${8 * j.n + 4}" height="8" fill="${col}"/></g>`;
        if (x && x.conn && !x.deep) top += `<text x="${p.x}" y="${p.y - 14}" font-size="10" text-anchor="middle" fill="#b91c1c">浅い</text>`;
      } else { const cr = x && x.crimped, mark = cr ? x.mark : "", tipL = x && x.tip != null ? Math.max(0, x.tip) : 0;
        g += `<g transform="rotate(${ang + 90} ${p.x} ${p.y})">` + (cr && tipL ? `<rect x="${p.x - 3 * j.n}" y="${p.y - 10 - tipL * 2}" width="${6 * j.n}" height="${tipL * 2}" fill="#c27a3a"/>` : "")
          + `<rect x="${p.x - 3 * j.n - 3}" y="${p.y - 10}" width="${6 * j.n + 6}" height="18" rx="2" fill="${cr ? "#d1d5db" : "#f3f4f6"}" stroke="#6b7280" ${cr ? "" : 'stroke-dasharray="3 2"'}/>`
          + `<text x="${p.x}" y="${p.y + 3}" font-size="10" font-weight="700" text-anchor="middle" fill="#111">${esc(mark)}</text></g>`; }
    });
    top += `<text x="${b.x + 16}" y="${b.y - 12}" font-size="13" font-weight="700" fill="#6b7280">${esc(BOXNAME[P.id] && BOXNAME[P.id][b.id] || b.id)}</text>`; });
  const xs = [...P.parts.map(p => p.x), ...P.boxes.map(b => b.x)], ys = [...P.parts.map(p => p.y), ...P.boxes.map(b => b.y)];
  const x0 = Math.min(...xs) - 110, y0 = Math.min(...ys) - 90, W = Math.max(...xs) - x0 + 110, H = Math.max(...ys) - y0 + 110;
  return `<svg class="side" id="asm" viewBox="${x0} ${y0} ${W} ${H}" style="max-height:78vh">${g}${top}</svg>`;
}
function TYPES_SHORT(t) { return { sw1: "スイッチ", swH: "スイッチ", sw3: "3路", sw4: "4路", outlet: "コンセント", outlet2: "2口", outletE: "E付", outletET: "ET", outletEET: "EET", outlet200: "250V" }[t] || ""; }

/* ============================================================
   ③ 点検（全体）
   ============================================================ */
function drawCheck() {
  const us = units(), t = teach(), keys = new Set();
  let total = 0, todo = 0, h = "";
  us.forEach(u => { const r = store[P.id][u.id];
    if (!r || !r.done) { todo++; h += `<div class="issue"><b>${esc(u.name)}</b>：まだ作業していない<span class="rule">欠陥：未完成</span></div>`; total++; return; }
    const res = evalUnit(u, r); total += res.defects.length; res.defects.forEach(d => keys.add(d.key));
    h += res.defects.map(d => `<div class="issue"><b>${esc(u.name)}</b>：${esc(d.where)}<span class="rule">欠陥：${esc(d.def.cat)} ―「${esc(d.def.text)}」</span></div>`).join("");
    h += res.tips.map(x => `<div class="issue tip"><b>${esc(u.name)}</b>：目安より ${esc(x)}</div>`).join(""); });
  $("side").innerHTML = `<h2>No.${P.no} の点検</h2><p class="note">技能試験は、欠陥が1つでもあれば不合格。</p><div class="bar"><button id="goWork">② 作業へ戻る</button><button id="clearAll">この問題の作業を全部消す</button></div>`
    + (t && t.check ? `<h3>⑧ 見直す（資料のチェック）</h3><div id="chk">` + t.check.map(c => { const ng = c.keys.some(k => keys.has(k));
        return `<div class="issue ${todo ? "tip" : ng ? "" : "good"}" style="font-weight:400">${todo ? "□" : ng ? "✗" : "☑"} ${esc(c.t)}</div>`; }).join("") + `</div>` + (todo ? `<p class="note">全部の作業を終えると、チェックが付く。</p>` : "") : "");
  $("body").innerHTML = `<div class="verdict ${total ? "ng" : "ok"}">${total ? "欠陥 " + total + " か所 ― 不合格" : "欠陥なし ― 合格"}</div>`
    + `<h3>完成図（上から見た図。作業の結果をそのまま描く）</h3>` + assemblySVG()
    + (todo ? `<p class="note">まだ作業していない所が ${todo} つある。</p>` : "") + (h || `<div class="issue good">すべての作業で欠陥なし</div>`);
  $("goWork").onclick = () => setMode("work");
  $("clearAll").onclick = () => { store[P.id] = {}; save(); drawCheck(); };
}

/* ---------- 始める ---------- */
$("ver").textContent = "版 " + VER;
openProb(KIT[0].id);
setMode("order");
</script>
