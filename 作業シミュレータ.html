<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>技能試験 作業シミュレータ</title>
<style>
  :root {
    --bg: #f3f5f4; --card: #fff; --ink: #151a18; --muted: #5d6763; --line: #d9dfdc;
    --accent: #0f6b4f; --bad: #b91c1c; --warn: #b45309; --sel: #2563eb;
  }
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14.5px/1.6 "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif; }
  .wrap { max-width: 1360px; margin: 0 auto; padding: 12px 16px 32px; }
  h1 { font-size: 20px; margin: 0; display: inline-block; }
  h2 { font-size: 16px; margin: 0 0 6px; }
  h3 { font-size: 14.5px; margin: 10px 0 4px; }
  .ver { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 8px; }
  .sub { color: var(--muted); font-size: 12.5px; margin-left: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .note { font-size: 12.5px; color: var(--muted); }
  button { font: inherit; color: var(--ink); border: 1px solid var(--line); background: var(--card);
           border-radius: 6px; padding: 5px 11px; cursor: pointer; touch-action: manipulation; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 700; }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
  .probs button { min-width: 48px; padding: 4px 7px; }
  .modes button { font-weight: 700; padding: 6px 14px; }
  .main { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 12px; align-items: start; margin-top: 8px; }
  @media (max-width: 900px) { .main { grid-template-columns: 1fr; } }
  .list button { display: block; width: 100%; text-align: left; margin: 0 0 4px; padding: 6px 9px; }
  .list button.on { background: #e6f2ec; color: var(--ink); border-color: var(--accent); }
  .list .st { float: right; font-size: 12px; font-weight: 700; }
  .st.ok { color: var(--accent); } .st.ng { color: var(--bad); } .st.todo { color: var(--muted); }
  .src { font-size: 11.5px; color: var(--muted); }
  .src a { color: inherit; }
  /* 順番 */
  .pool, .seq { display: flex; flex-wrap: wrap; gap: 6px; min-height: 46px; padding: 6px; border: 1px dashed var(--line); border-radius: 8px; background: #fafbfa; }
  .seq { background: #fff; border-style: solid; flex-direction: column; flex-wrap: nowrap; }
  .cardbtn { text-align: left; padding: 7px 10px; background: #fff; border: 1.5px solid #c9d2cd; border-radius: 8px; }
  .seq .cardbtn { border-color: var(--accent); background: #f0f8f4; cursor: default; }
  .seq .cardbtn b { color: var(--accent); margin-right: 6px; }
  .shake { animation: shake .35s; border-color: var(--bad) !important; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .msg { min-height: 1.6em; margin: 6px 0; font-size: 14px; }
  .msg.err { color: var(--bad); font-weight: 600; } .msg.ok { color: var(--accent); font-weight: 700; }
  /* 作業 */
  .ctl { display: grid; grid-template-columns: 170px 1fr 70px; gap: 6px 10px; align-items: center; margin: 4px 0; }
  .ctl input[type=range] { width: 100%; }
  .ctl .val { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .seg { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .seg button { padding: 4px 10px; }
  .sect { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }
  svg.side { width: 100%; height: auto; display: block; background: #fcfcfa; border: 1px solid var(--line); border-radius: 6px; margin: 6px 0; }
  table.wires { border-collapse: collapse; font-size: 13.5px; margin: 4px 0; }
  table.wires td, table.wires th { border: 1px solid var(--line); padding: 3px 7px; text-align: left; }
  .chip { display: inline-block; width: 14px; height: 14px; border-radius: 3px; border: 1px solid #888; vertical-align: -2px; margin-right: 4px; }
  .issue { border-left: 4px solid var(--bad); background: #fef2f2; border-radius: 4px; padding: 5px 8px; margin: 5px 0; font-size: 13.5px; }
  .issue.tip { border-color: var(--warn); background: #fffbeb; }
  .issue.good { border-color: var(--accent); background: #ecfdf5; color: var(--accent); font-weight: 700; }
  .issue .rule { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .verdict { font-size: 18px; font-weight: 800; margin: 4px 0 8px; }
  .verdict.ok { color: var(--accent); } .verdict.ng { color: var(--bad); }
  svg text { font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif; }
</style>
</head>
<body>
<div class="wrap">
  <h1>技能試験 作業シミュレータ<span class="ver" id="ver"></span></h1><span class="sub">第二種電気工事士 ― 作業の順番・作り方・欠陥の確認</span>
  <div class="bar probs" id="probs"></div>
  <div class="bar modes" id="modes">
    <button data-m="order">① 作業の順番</button>
    <button data-m="work">② 作業をする</button>
    <button data-m="check">③ 点検（欠陥の確認）</button>
  </div>
  <div class="main">
    <div class="card"><div id="side"></div></div>
    <div class="card"><div id="body"></div></div>
  </div>
  <p class="src">欠陥の基準は 一般財団法人 電気技術者試験センター「技能試験の欠陥の判断基準」（<a href="https://www.shiken.or.jp/construction/upload/handankizyun2017.pdf" target="_blank" rel="noopener">PDF</a>・<a href="https://www.shiken.or.jp/construction/second/defect/" target="_blank" rel="noopener">案内</a>）。
    数値の決まりが無い寸法は HOZAN「第二種電工試験の虎」などの目安で、「目安」と書いて欠陥とは区別する。
    問題（配線・施工条件）は「複線図れんしゅう」と同じもの。No.1（★）は先生の配布資料の施工条件・切る長さ・はぐ長さ・作業の順番に合わせてある。ほかの問題の施工条件は仮。</p>
</div>

/* ============================================================
   リングスリーブ（JIS C 2806）。1.6mm×2本だけが刻印「○」
   ============================================================ */
function sleeveFor(n16, n20) {
  const a = n16, b = n20;
  if (b === 0) return a === 2 ? { size: "小", mark: "○" } : a >= 3 && a <= 4 ? { size: "小", mark: "小" } : a >= 5 && a <= 6 ? { size: "中", mark: "中" } : null;
  if (b === 1) return a >= 1 && a <= 2 ? { size: "小", mark: "小" } : a >= 3 && a <= 5 ? { size: "中", mark: "中" } : null;
  if (b === 2) return a === 0 ? { size: "小", mark: "小" } : a <= 3 ? { size: "中", mark: "中" } : null;
  if (b === 3 || b === 4) return a === 0 ? { size: "中", mark: "中" } : null;
  return null;
}

    { id: "k6", t: "先から心線の先が見えるか、根元で心線が見えていないか確かめ、軽く引く", after: { k5: "差し込んでから確かめる。" } },

/* ============================================================
   問題から作業の単位を作る
   器具の場所ごと（同じ取付枠の器具はまとめて）と、ボックスごと。資料に切る長さがあれば「ケーブルを切る」も
   ============================================================ */
let P = null, mode = "order", unitId = null, orderSet = "flow";
const store = {};                          // 問題ごとの作業の結果 { [unitId]: params }
function prob(id) { return KIT.find(p => p.id === id); }

function placeName(pl) { const ps = (P.places.find(x => x.id === pl) || { parts: [] }).parts.map(partOf); return ps.map(p => p.name).join("・"); }
const BOXNAME = { k1: { B1: "A", B2: "B" } };                       // 先生の資料のボックスの呼び名
function boxName(id) { const m = BOXNAME[P.id]; return m && m[id] ? m[id] + "（" + id + "）" : id; }
const isConnBox = id => (boxOf(id) || {}).join === "conn";
function units() {
  const out = [];
  const t = teach();
  if (t && t.cut) out.push({ id: "cut", kind: "cut", name: "ケーブルを切る（" + t.cut.length + "本）" });
  P.places.forEach(pl => {
    const ps = pl.parts.map(partOf), kinds = [...new Set(ps.filter(p => !p.omit && WORK[p.type]).map(p => WORK[p.type]))];
    if (!kinds.length) return;
    const pushes = ps.filter(p => !p.omit && WORK[p.type] === "push");
    out.push({ id: "pl:" + pl.id, kind: "dev", place: pl.id, name: ps.map(p => p.name).join("・"), work: kinds, frame: pushes.map(p => p.id) });
  });
  P.boxes.forEach(b => {
    const js = P.joints.filter(j => j.box === b.id);
    if (!js.length) return;
    out.push({ id: "bx:" + b.id, kind: "box", box: b.id, conn: b.join === "conn", name: "ボックス " + boxName(b.id) + " の接続", joints: js });
  });
  return out;
}
function unitWork(u) { return u.kind === "cut" ? "長さを決めて切る" : u.kind === "box" ? (u.conn ? "差込形コネクタ" : "リングスリーブで圧着") : u.work.map(k => WORKNAME[k]).join("・"); }
function cablesAt(place) {
  const cs = P.cables.filter(c => c.a === place || c.b === place);
  return cs.map(c => ({ c, wires: P.wires.map((w, i) => ({ w, i })).filter(x => x.w.cable === c.id) }));
}
function jumpersAt(place) {                  // 渡り線（同じ取付枠の中の器具どうし）
  return P.wires.map((w, i) => ({ w, i })).filter(x => !x.w.cable && x.w.a.kind === "term" && x.w.b.kind === "term"
    && [x.w.a.part, x.w.b.part].every(id => (P.places.find(p => p.id === place) || { parts: [] }).parts.includes(id)));
}
function endAt(w, place) {
  const pl = (P.places.find(p => p.id === place) || { parts: [] }).parts;
  return [w.a, w.b].find(e => e.kind === "term" && pl.includes(e.part));
}
function otherEnd(w, place) { const e = endAt(w, place); return e === w.a ? w.b : w.a; }
function endText(e) {

}
function termText(part, k) { const p = partOf(part), t = p.terms.find(x => x.k === k); return p.name + " の端子" + (t && t.lab ? "「" + t.lab + "」" : "（" + k + "）") + (t && t.desc ? "（" + t.desc + "）" : ""); }

/* ============================================================
   画面の骨組み
   ============================================================ */
function drawProbs() {
  const host = $("probs"); host.innerHTML = "";
  KIT.forEach(p => { const b = document.createElement("button"); b.textContent = "No." + p.no + (TEACH[p.id] ? "★" : ""); b.classList.toggle("on", P && P.id === p.id);
    if (TEACH[p.id]) b.title = "先生の資料あり";

}
function setMode(m) { mode = m; document.querySelectorAll("#modes button").forEach(b => b.classList.toggle("on", b.dataset.m === m)); draw(); }
document.querySelectorAll("#modes button").forEach(b => { b.onclick = () => setMode(b.dataset.m); });
function openProb(id) {

}
function draw() { if (mode === "order") drawOrder(); else if (mode === "work") drawWork(); else drawCheck(); }
const KEY = "sagyou:";
function save() { try { localStorage.setItem(KEY + P.id, JSON.stringify(store[P.id])); } catch (e) {} }
function load(id) { try { return JSON.parse(localStorage.getItem(KEY + id) || "null"); } catch (e) { return null; } }
function teachNote() { const t = teach(); return t ? `<p class="note">★ ${esc(t.src)} に合わせてある。</p>` : ""; }

/* ============================================================
   ① 作業の順番
   ============================================================ */
let orderState = { set: null, done: [], miss: 0, pool: [] };
function orderDef(set) {                      // 資料があれば「全体の流れ」は資料の8つ

  const kinds = new Set(); units().forEach(u => { if (u.kind === "dev") u.work.forEach(k => kinds.add(k)); else if (u.kind === "box") kinds.add(u.conn ? "conn" : "sleeve"); });
  return ["flow", ...["ring", "push", "ceil", "block", "sleeve", "conn"].filter(k => kinds.has(k))];
}
function startOrder(set) {
  orderSet = set; const cards = orderDef(set).cards.slice();
  for (let i = cards.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [cards[i], cards[j]] = [cards[j], cards[i]]; }
  orderState = { set, pid: P.id, done: [], miss: 0, pool: cards.map(c => c.id) };
}
let seed = 12345; function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
function drawOrder() {
  const sets = orderSetsFor();

  $("side").innerHTML = `<h2>どの作業の順番？</h2><div class="list">` + sets.map(s => `<button data-s="${s}" class="${s === orderSet ? "on" : ""}">${esc(orderDef(s).name)}</button>`).join("") + `</div>
    <p class="note">No.${P.no} の作業に出てくるものだけを並べている。</p>` + teachNote();
  $("side").querySelectorAll("button[data-s]").forEach(b => { b.onclick = () => { startOrder(b.dataset.s); drawOrder(); }; });
  const O = orderDef(orderSet), byId = id => O.cards.find(c => c.id === id), fin = !orderState.pool.length;
  const mins = O.cards.some(c => c.min) ? O.cards.reduce((n, c) => n + (c.min || 0), 0) : 0;
  const ct = c => esc(c.t) + (c.min ? `<span class="note">（目安 ${c.min}分）</span>` : "");
  $("body").innerHTML = `<h2>${esc(O.name)}：正しい順にカードを押す</h2>
    <div class="msg" id="omsg"></div>
    <h3>やった順</h3><div class="seq" id="seq">${orderState.done.map((id, i) => `<div class="cardbtn"><b>${i + 1}</b>${ct(byId(id))}</div>`).join("") || '<span class="note">ここに並ぶ</span>'}</div>
    <h3>カード</h3><div class="pool" id="pool">${orderState.pool.map(id => `<button class="cardbtn" data-c="${id}">${esc(byId(id).t)}</button>`).join("") || '<span class="note">全部並べた</span>'}</div>
    <div class="bar"><button id="oAgain">もう一度（並べ直す）</button></div>
    ${fin ? `<div class="issue ${orderState.miss ? "tip" : "good"}">${orderState.miss ? "できた。順番の間違いは " + orderState.miss + " 回。もう一度やってみよう。" : "間違えずに並べられた！"}${mins ? `<span class="rule">目安の時間は合わせて ${mins} 分。</span>` : ""}${O.note ? `<span class="rule">${esc(O.note)}</span>` : ""}</div>` : ""}`;

/* ============================================================
   ② 作業をする
   ============================================================ */
function sideList() {

  $("side").innerHTML = `<h2>No.${P.no} の作業</h2><div class="list">` + us.map(u => {
    const r = store[P.id][u.id], res = r && r.done ? evalUnit(u, r) : null;

  const r = store[P.id][u.id] = store[P.id][u.id] || defaults(u);

let binds = [], rid = 0;                                             // 画面を書いたあとに、スライダーをつなぐ

  return `<div class="ctl"><label for="${id}">${esc(label)}</label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><span class="val" id="${id}v">${val}${unit || ""}</span></div>`;

/* ---------- ケーブルを切る（資料に長さがある問題） ---------- */
function drawCutWork(u, r) {

/* ---------- 器具の結線 ---------- */

      + rangeRow("心線の被覆をはぐ長さ", r.core[c.id], 0, 30, 1, v => { r.core[c.id] = v; }, "mm") + `</div>`;

    g += `<text x="${(x0 + sx) / 2}" y="54" font-size="12" text-anchor="middle" fill="#5d6763">シース</text>`;
    if (sh) g += `<text x="${sx + 4}" y="50" font-size="12" fill="#0f6b4f">← ${sh}mm →</text>`;
  }
  if (ring) {

    g += `<circle cx="${cx}" cy="${cy}" r="9" fill="#e5e7eb" stroke="#6b7280"/><text x="${cx}" y="${cy - 34}" font-size="12" text-anchor="middle" fill="#5d6763">ねじ（上から）</text>`;
    if (turn) { const a0 = Math.PI / 2, a1 = a0 - dir * turn * 2 * Math.PI, n = 40; let d = "";
      for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n, rr = R - (turn > 1 && i > n * 0.8 ? 3 : 0); d += (i ? "L" : "M") + (cx + rr * Math.cos(a)).toFixed(1) + " " + (cy + rr * Math.sin(a)).toFixed(1); }
      g += `<path d="M${cx} ${cy + R + 30} L${cx} ${cy + R}" stroke="#b87333" stroke-width="4" fill="none"/><path d="${d}" stroke="#b87333" stroke-width="4" fill="none"/>`;
      g += `<text x="${cx}" y="${cy + R + 46}" font-size="12" text-anchor="middle" fill="#5d6763">${r.dir ? r.dir + "巻き" : "向き未定"}・${turn}周</text>`; }
  }
  s.innerHTML = g;
}

/* ---------- ボックス内の接続 ---------- */
function drawBoxWork(u, r) {
  const cs = P.cables.filter(c => c.a === u.box || c.b === u.box), g = guideOf(u.conn ? "conn" : "joint"), t = teach();
  const tip = t ? t.guide.tip : [1, 3];
  let h = `<h2>${esc(u.name)}</h2><p class="note">${u.conn ? "差込形コネクタで接続。" + esc(g.why) + "（目安）。奥まで差し込み、先から心線の先が見えるか、根元で心線が見えていないか確かめる。"
    : "リングスリーブで圧着。" + esc(g.why) + "（目安）。被覆がスリーブのすぐ下にくる位置で持ち（約2mm）、先端は " + tip.join("〜") + "mm 残して切る。"}</p>`;
  h += `<div class="sect"><h3>ボックスに入るケーブルのシース</h3>` + cs.map(c => { r.sheath[c.id] = r.sheath[c.id] || 0;
    return rangeRow(c.spec + "（" + (c.a === u.box ? endName(c.b) : endName(c.a)) + " へ）", r.sheath[c.id], 0, 150, 5, v => { r.sheath[c.id] = v; }, "mm"); }).join("")
    + rangeRow("心線の被覆をはぐ長さ（全部）", r.core, 0, 30, 1, v => { r.core = v; }, "mm") + `</div>`;
  u.joints.forEach((j, n) => {
    const x = r.j[j.id] = r.j[j.id] || (u.conn ? { conn: "", deep: false } : { size: "", mark: "", align: false, gap: 0, tip: -1 });
    const ws = P.wires.filter(w => [w.a, w.b].some(e => e.kind === "joint" && e.joint === j.id))
      .map(w => { const o = w.a.kind === "joint" && w.a.joint === j.id ? w.b : w.a; return `<span class="chip" style="background:${COLORS[w.color] || "#888"}"></span>${esc(w.color)}：${esc(endText(o))}`; });
    h += `<div class="sect"><h3>接続点 ${n + 1}（${wireText(j)}）</h3><p class="note">つなぐ線：${ws.join("　")}</p>`;
    if (u.conn) h += `<div class="ctl"><span>差込形コネクタ</span><span class="seg" data-j="${j.id}" data-k="conn">${["2", "3", "4"].map(v => `<button data-v="${v}" class="${x.conn === v ? "on" : ""}">${v}本用</button>`).join("")}</span><span></span></div>
      <div class="ctl"><span>差し込み</span><span class="seg" data-j="${j.id}" data-k="deep"><button data-v="1" class="${x.deep ? "on" : ""}">奥まで差し込んだ</button><button data-v="0" class="${x.deep ? "" : "on"}">途中まで</button></span><span></span></div></div>`;
    else h += `<div class="ctl"><span>心線の先</span><span class="seg" data-j="${j.id}" data-k="align"><button data-v="1" class="${x.align ? "on" : ""}">そろえた</button><button data-v="0" class="${x.align ? "" : "on"}">そろえていない</button></span><span></span></div>
      <div class="ctl"><span>スリーブの大きさ</span><span class="seg" data-j="${j.id}" data-k="size">${["小", "中", "大"].map(v => `<button data-v="${v}" class="${x.size === v ? "on" : ""}">${v}</button>`).join("")}</span><span></span></div>
      <div class="ctl"><span>圧着工具のダイス（刻印）</span><span class="seg" data-j="${j.id}" data-k="mark">${["○", "小", "中", "大"].map(v => `<button data-v="${v}" class="${x.mark === v ? "on" : ""}">${v}</button>`).join("")}</span><span></span></div>`
      + rangeRow("被覆とスリーブの間", x.gap, 0, 15, 1, v => { x.gap = v; }, "mm")
      + rangeRow("切ったあとの先端の長さ", x.tip, -1, 10, 1, v => { x.tip = v; }, "mm") + `<p class="note">先端 −1mm は「切りすぎて、スリーブの中に先端が隠れた」。</p></div>`;
  });
  h += finishBar();
  $("body").innerHTML = h; bindAll();
  $("body").querySelectorAll(".seg[data-j]").forEach(sg => sg.querySelectorAll("button").forEach(b => { b.onclick = () => {
    const x = r.j[sg.dataset.j], k = sg.dataset.k; x[k] = (k === "align" || k === "deep") ? b.dataset.v === "1" : b.dataset.v; save(); drawBoxWork(u, r); }; }));
  redrawPreview = () => {}; wireFinish(u, r);
}
function endName(pl) { return P.boxes.some(b => b.id === pl) ? "ボックス " + boxName(pl) : placeName(pl); }
function wireText(j) { return [j.n16 ? "1.6mm×" + j.n16 + "本" : "", j.n20 ? "2.0mm×" + j.n20 + "本" : ""].filter(Boolean).join("＋"); }

/* ============================================================
   評価: 欠陥（判断基準）と目安
   ============================================================ */
function evalUnit(u, r) {
  const defects = [], tips = [];
  const D = (key, where) => defects.push({ def: DEF[key], key, where });
  const T = (text) => tips.push(text);
  if (u.kind === "cut") {
    teach().cut.forEach(c => { const v = r.len[c.n] || 0, at = c.n + ". " + c.seg;
      if (!v) { D("unfinished", at + "：長さを決めていない"); return; }
      const fig = v - c.box - c.dev;                                  // 仕上がりの図の寸法
      if (fig <= c.fig * 0.5) D("dimShort", at + "：" + v + "mm で切ると、図の " + c.fig + "mm の所が " + fig + "mm になる");
      else if (Math.abs(v - c.len) > 10) T(at + "：" + v + "mm（資料は " + c.len + "mm" + (c.asis ? "。切らずにそのまま使う" : "") + "）"); });
    return { defects, tips };
  }
  if (u.kind === "box") {
    const cs = P.cables.filter(c => c.a === u.box || c.b === u.box), g = guideOf(u.conn ? "conn" : "joint"), t = teach(), tip = t ? t.guide.tip : [1, 3];
    cs.forEach(c => { const sh = r.sheath[c.id] || 0, name = c.spec;
      if (!sh) D("unfinished", name + " のシースをはいでいない");
      else if (!u.conn && sh - r.core <= 20) D("sheathShort", name + "：シース " + sh + "mm − 被覆 " + r.core + "mm ＝ 被覆が " + (sh - r.core) + "mm");
      else if (sh < g.sheath[0] || sh > g.sheath[1] + 20) T(name + " のシース " + sh + "mm（目安 約100mm）"); });
    if (!r.core) D("unfinished", "心線の被覆をはいでいない");
    u.joints.forEach((j, n) => {
      const x = r.j[j.id] || {}, at = "接続点 " + (n + 1) + "（" + wireText(j) + "）";
      if (u.conn) {
        if (!x.conn) { D("unfinished", at + "：コネクタを選んでいない"); return; }
        if (+x.conn !== j.n) D("connPick", at + "：" + j.n + "本の線に " + x.conn + "本用");
        const gg = gaugeOf("conn");
        if (!x.deep) D("connTip", at + "：奥まで差し込んでいない");
        else if (r.core && r.core <= gg - 2) D("connTip", at + "：被覆を " + r.core + "mm しかはいでいない（ゲージ " + gg + "mm）。心線の先がコネクタの先まで届かない");
        if (r.core >= gg + 2) D("connBottom", at + "：被覆 " + r.core + "mm − ゲージ " + gg + "mm ＝ 根元で心線が " + (r.core - gg) + "mm 見える");
        else if (r.core && r.core !== gg) T(at + "：被覆 " + r.core + "mm（ゲージ " + gg + "mm に合わせる）");
        return;
      }
      const need = sleeveFor(j.n16, j.n20);
      if (!x.size || !x.mark) { D("unfinished", at + "：スリーブかダイスを選んでいない"); return; }
      if (need && x.size !== need.size) D("sleevePick", at + "：「" + x.size + "」を選んだ");
      if (need && x.mark !== need.mark) D("sleeveMark", at + "：ダイス「" + x.mark + "」で圧着した");
      if (!x.align) D("tipHidden", at + "：心線の先をそろえていないので、短い1本の先端が見えない");
      if (x.tip < 0) D("tipHidden", at + "：切りすぎて先端がスリーブの中に隠れた");
      if (x.tip >= 5) D("tipLong", at + "：先端 " + x.tip + "mm");
      else if (x.tip > tip[1]) T(at + "：先端 " + x.tip + "mm（目安 " + tip.join("〜") + "mm）");
      if (x.gap <= 0) D("onInsul", at + "：被覆がスリーブに入った");
      if (x.gap >= 10) D("overStrip", at + "：被覆とスリーブの間 " + x.gap + "mm");
      else if (x.gap > 4) T(at + "：被覆とスリーブの間 " + x.gap + "mm（目安 約2mm）");
      if (r.core && r.core < 12) D("onInsul", at + "：被覆を " + r.core + "mm しかはいでいないので、スリーブの中に被覆が入る");
    });
    return { defects, tips };
  }
  const cs = cablesAt(u.place).filter(x => x.wires.some(y => endAt(y.w, u.place)));
  const kinds = u.work, kind = kinds[0];
  cs.forEach(({ c }) => {
    const sh = r.sheath[c.id] || 0, co = r.core[c.id] || 0, g = guideOf(kind);
    if (!sh || !co) { D("unfinished", c.spec + "：シースか被覆をはいでいない"); return; }
    if (kind === "ring" && sh >= MODEL.lampBase) D("noBase", c.spec + "：シース " + sh + "mm（このアプリでは " + MODEL.lampBase + "mm 以上で台座に入らないと見なす）");
    else if (sh < g.sheath[0] || sh > g.sheath[1]) T(c.spec + " のシース " + sh + "mm（目安 " + (g.sheath[0] === g.sheath[1] ? g.sheath[0] : g.sheath.join("〜")) + "mm）");
    if (sh - co < 5) D("unfinished", c.spec + "：シースより被覆を長くはいだ（被覆が残っていない）");
    checkCore(kind, co, c.spec, D, T);
    if (kind === "ceil" && sh - co - MODEL.ceilBase >= 5) D("ceilInsul", c.spec + "：被覆が台座から " + (sh - co - MODEL.ceilBase) + "mm 出ている（台座の中は " + MODEL.ceilBase + "mm と見なす）");
  });
  if (jumpersAt(u.place).length) { if (!r.core.jump) D("unfinished", "渡り線の被覆をはいでいない"); else checkCore(kind, r.core.jump, "渡り線", D, T); }
  if (kinds.includes("ring")) {
    if (!r.dir || !r.wrap) D("unfinished", "輪を作っていない");
    else {
      if (r.dir === "左") D("leftWrap", "左巻き（ねじを締めると輪が開く）");
      if (r.wrap < 0.75) D("wrapBad", "巻き付けが " + r.wrap + "周（不足）");
      if (r.wrap > 1) D("wrapBad", "重ね巻き");
      if (r.wrap === 0.75) T("巻き付けが 3/4周。解説では 3/4周以下を不足とするものがある。ほぼ1周に");
    }
    if (r.bend >= 5) D("ringExpose", "被覆の端から " + r.bend + "mm の所で曲げたので、ねじの端から心線が " + r.bend + "mm 出る");
    else if (r.bend > 3) T("曲げる所 " + r.bend + "mm（目安 約3mm）");
  }
  if (u.frame.length) evalFrame(u, r, D);
  connRows(u).forEach(x => {
    const got = r.conn[x.key]; if (!got) { D("unfinished", x.w.color + "の線（" + x.other + "）をつないでいない"); return; }
    const want = x.e.part + "." + x.e.term;
    if (got === want || same(got, want)) return;
    const [gp, gk] = got.split("."), gt = partOf(gp).terms.find(t => t.k === gk);
    if (gt && gt.w && x.w.color !== "白") D("polarity", termText(gp, gk) + " に" + x.w.color + "の線（W・接地側は白）");
    else D("wrongTerm", x.w.color + "の線（" + x.other + "）を " + termText(gp, gk) + " につないだ");
  });
  return { defects, tips };
}
function evalFrame(u, r, D) {
  const n = u.frame.length, t = teach();
  if (!r.face) { D("unfinished", "取付枠の向きを決めていない"); return; }
  if (r.face === "裏") D("frameFlip", "取付枠を裏返しに付けた");
  if (r.face === "逆") D("frameFlip", "取付枠を上下さかさまに付けた（「上」の文字が読めない向き）");
  if (u.frame.some(id => !r.pos[id])) { D("unfinished", "器具を付ける位置を決めていない"); return; }
  const pos = u.frame.map(id => r.pos[id]);
  if (new Set(pos).size !== pos.length) { D("frameCenter", "同じ位置に2つの器具を付けた"); return; }
  if (n === 1 && pos[0] !== "中央") D("frameCenter", "器具が1個なのに「" + pos[0] + "」に付けた（1個は中央）");
  if (n === 2 && pos.includes("中央")) D("frameCenter", "器具が2個なのに中央に付けた（2個は上と下）");
  if (t && t.frame && u.frame.includes(t.frame.center) && r.pos[t.frame.center] !== "中央") D("frameCenter", partOf(t.frame.center).name + " を「" + r.pos[t.frame.center] + "」に付けた（施工条件で中央）");
  else if (t && t.frame && t.frame.order.every(id => u.frame.includes(id))) {
    const want = ["上", "中央", "下"]; if (t.frame.order.some((id, i) => r.pos[id] !== want[i])) D("frameOrder", "上から " + t.frame.order.map(id => partOf(id).name).join("・") + " の順でない");
  }
}
const SWAP = { sw1: [["1", "2"]], swH: [["1", "2"]], pl: [["1", "2"]], rly: [["1", "2"]], sw3: [["1", "3"]], sw4: [["1", "3"], ["2", "4"]], outlet200: [["X", "Y"]] };
function same(got, want) {
  const [gp, gk] = got.split("."), [wp, wk] = want.split("."); if (gp !== wp) return false;
  const p = partOf(gp); return (SWAP[p.type] || []).some(g => g.includes(gk) && g.includes(wk));
}
function checkCore(kind, co, name, D, T) {
  if (kind === "push" || kind === "ceil") {
    const gauge = gaugeOf(kind), lim = kind === "ceil" ? 1 : 2, ex = co - gauge;
    if (ex >= lim) D("pushExpose", name + "：被覆 " + co + "mm − 差込の深さ " + gauge + "mm ＝ 心線が " + ex + "mm 見える");
    else if (co < gauge - 3) D("pullOut", name + "：被覆を " + co + "mm しかはいでいない（差込の深さ " + gauge + "mm）。奥まで入らず、引っ張ると抜ける");
    else if (co !== gauge) T(name + "：被覆 " + co + "mm（ストリップゲージ " + gauge + "mm に合わせる）");
  } else if (kind === "block") {
    const ex = co - MODEL.blockDepth;
    if (ex >= 5) D("blockExpose", name + "：被覆 " + co + "mm − 座金の下 " + MODEL.blockDepth + "mm ＝ 心線が " + ex + "mm 出る");
    else if (co < 7) D("notScrewed", name + "：被覆を " + co + "mm しかはいでいないので、ねじが心線を締め付けない");
    else if (co < 10 || co > 12) T(name + "：被覆 " + co + "mm（目安 10〜12mm）");
  } else if (kind === "ring") {
    if (co < 12) D("unfinished", name + "：被覆を " + co + "mm しかはいでいないので、輪が作れない");
    else if (co < 18 || co > 22) T(name + "：被覆 " + co + "mm（目安 約20mm）");
  }
}
function showResult(u, r) {
  const res = evalUnit(u, r), host = $("res"); if (!host) return;
  host.innerHTML = `<div class="sect"><h3>この作業の点検</h3>` + (res.defects.length
    ? res.defects.map(d => `<div class="issue">${esc(d.where)}<span class="rule">欠陥：${esc(d.def.cat)} ―「${esc(d.def.text)}」</span></div>`).join("")
    : `<div class="issue good">欠陥なし</div>`) + res.tips.map(t => `<div class="issue tip">目安より：${esc(t)}</div>`).join("") + `</div>`;
}

/* ============================================================
   ③ 点検（全体）
   ============================================================ */
function drawCheck() {
  const us = units(), t = teach(), keys = new Set();
  let total = 0, todo = 0, h = "";
  us.forEach(u => { const r = store[P.id][u.id];
    if (!r || !r.done) { todo++; h += `<div class="issue"><b>${esc(u.name)}</b>：まだ作業していない<span class="rule">欠陥：未完成</span></div>`; total++; return; }
    const res = evalUnit(u, r); total += res.defects.length; res.defects.forEach(d => keys.add(d.key));
    h += res.defects.map(d => `<div class="issue"><b>${esc(u.name)}</b>：${esc(d.where)}<span class="rule">欠陥：${esc(d.def.cat)} ―「${esc(d.def.text)}」</span></div>`).join("");
    h += res.tips.map(x => `<div class="issue tip"><b>${esc(u.name)}</b>：目安より ${esc(x)}</div>`).join(""); });
  $("side").innerHTML = `<h2>No.${P.no} の点検</h2><p class="note">技能試験は、欠陥が1つでもあれば不合格。</p><div class="bar"><button id="goWork">② 作業へ戻る</button><button id="clearAll">この問題の作業を全部消す</button></div>`
    + (t && t.check ? `<h3>⑧ 見直す（資料のチェック）</h3><div id="chk">` + t.check.map(c => { const ng = c.keys.some(k => keys.has(k));
        return `<div class="issue ${todo ? "tip" : ng ? "" : "good"}" style="font-weight:400">${todo ? "□" : ng ? "✗" : "☑"} ${esc(c.t)}</div>`; }).join("") + `</div>` + (todo ? `<p class="note">全部の作業を終えると、チェックが付く。</p>` : "") : "");
  $("body").innerHTML = `<div class="verdict ${total ? "ng" : "ok"}">${total ? "欠陥 " + total + " か所 ― 不合格" : "欠陥なし ― 合格"}</div>`
    + (todo ? `<p class="note">まだ作業していない所が ${todo} つある。</p>` : "") + (h || `<div class="issue good">すべての作業で欠陥なし</div>`);
  $("goWork").onclick = () => setMode("work");
  $("clearAll").onclick = () => { store[P.id] = {}; save(); drawCheck(); };
}

/* ---------- 始める ---------- */
$("ver").textContent = "版 " + VER;
openProb(KIT[0].id);
setMode("order");
</script>
