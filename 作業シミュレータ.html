<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>技能試験 作業シミュレータ</title>
<style>
  :root {
    --bg: #f3f5f4; --card: #fff; --ink: #151a18; --muted: #5d6763; --line: #d9dfdc;
    --accent: #0f6b4f; --bad: #b91c1c; --warn: #b45309; --sel: #2563eb;
  }
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14.5px/1.6 "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif; }
  .wrap { max-width: 1600px; margin: 0 auto; padding: 8px 12px 16px; }
  h1 { font-size: 17px; margin: 0; }
  h2 { font-size: 16px; margin: 0 0 6px; }
  h3 { font-size: 14.5px; margin: 10px 0 4px; }
  .ver { font-size: 11px; color: var(--muted); margin-left: auto; }
  .note { font-size: 12.5px; color: var(--muted); }
  button { font: inherit; color: var(--ink); border: 1px solid var(--line); background: var(--card);
           border-radius: 6px; padding: 5px 11px; cursor: pointer; touch-action: manipulation; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  button.small { font-size: 12.5px; padding: 3px 9px; color: var(--muted); }
  .bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
  .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #prob { font: inherit; font-weight: 700; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
  .modes { display: flex; gap: 4px; flex-wrap: wrap; }
  .modes button { font-weight: 700; padding: 6px 12px; }
  .modes button small { margin-left: 6px; font-size: 11px; font-weight: 600; opacity: .75; }
  .main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 560px); gap: 10px; margin-top: 8px; height: calc(100vh - 62px); min-height: 520px; }
  .pane { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; overflow: auto; min-height: 0; }
  #leftp { position: relative; padding: 4px; overflow: hidden; display: flex; }
  #left { flex: 1; min-width: 0; min-height: 0; }
  #left svg { width: 100%; height: 100%; display: block; }
  .cap { position: absolute; left: 12px; top: 8px; font-size: 12px; color: var(--muted); pointer-events: none; }
  @media (max-width: 900px) { .main { grid-template-columns: 1fr; height: auto; } #leftp { height: 46vh; } }
  .sthead { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
  .sthead b { font-size: 15.5px; }
  .sthead button small { font-size: 11px; color: var(--muted); }
  .hint { display: block; font-size: 12.5px; color: var(--muted); }
  svg.st { width: 100%; height: auto; display: block; background: #fcfcfa; border: 1px solid var(--line); border-radius: 8px; touch-action: none; }
  .tools .row, #stepBar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .lab { font-weight: 700; font-size: 13.5px; margin-right: 2px; }
  .tools .lab { min-width: 84px; }
  .stp { display: inline-flex; align-items: center; gap: 3px; } .stp b { min-width: 46px; text-align: center; }
  .stp button { padding: 3px 10px; }
  details.tip { margin-top: 8px; font-size: 12.5px; color: var(--muted); } details.tip summary { cursor: pointer; }
  .wires { font-size: 13px; margin: 2px 0 4px; }
  [data-t], .hit { cursor: pointer; }
  button.issue { display: block; width: 100%; text-align: left; font: inherit; font-size: 13.5px; color: var(--ink); }
  .issue .num { display: inline-block; min-width: 20px; height: 20px; border-radius: 10px; background: var(--bad); color: #fff; font-size: 12px; font-weight: 700; text-align: center; line-height: 20px; margin-right: 6px; }
  .issue.todo { border-color: #f59e0b; background: #fffbeb; } .issue.todo .num { background: #f59e0b; }
  .list button { display: block; width: 100%; text-align: left; margin: 0 0 4px; padding: 6px 9px; }
  .list button.on { background: #e6f2ec; color: var(--ink); border-color: var(--accent); }
  .cutsides .ctl { margin: 2px 0; }
  .list h3 { font-size: 12.5px; color: var(--muted); margin: 10px 0 4px; }
  .list .st { float: right; font-size: 12px; font-weight: 700; }
  .st.ok { color: var(--accent); } .st.ng { color: var(--bad); } .st.todo { color: var(--muted); }
  .src { font-size: 11.5px; color: var(--muted); }
  .src a { color: inherit; }
  /* 順番 */
  .pool, .seq { display: flex; flex-wrap: wrap; gap: 6px; min-height: 46px; padding: 6px; border: 1px dashed var(--line); border-radius: 8px; background: #fafbfa; }
  .seq { background: #fff; border-style: solid; flex-direction: column; flex-wrap: nowrap; }
  .cardbtn { text-align: left; padding: 7px 10px; background: #fff; border: 1.5px solid #c9d2cd; border-radius: 8px; }
  .seq .cardbtn { border-color: var(--accent); background: #f0f8f4; cursor: default; }
  .seq .cardbtn b { color: var(--accent); margin-right: 6px; }
  .shake { animation: shake .35s; border-color: var(--bad) !important; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .msg { min-height: 1.6em; margin: 6px 0; font-size: 14px; }
  .msg.err { color: var(--bad); font-weight: 600; } .msg.ok { color: var(--accent); font-weight: 700; }
  /* 作業 */
  .ctl { display: grid; grid-template-columns: 170px 1fr 70px; gap: 6px 10px; align-items: center; margin: 4px 0; }
  .ctl input[type=range] { width: 100%; }
  .ctl .val { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .seg { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .seg button { padding: 4px 10px; }
  .sect { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }
  svg.side { width: 100%; height: auto; display: block; background: #fcfcfa; border: 1px solid var(--line); border-radius: 6px; margin: 6px 0; }
  table.wires { border-collapse: collapse; font-size: 13.5px; margin: 4px 0; }
  table.wires td, table.wires th { border: 1px solid var(--line); padding: 3px 7px; text-align: left; }
  .chip { display: inline-block; width: 14px; height: 14px; border-radius: 3px; border: 1px solid #888; vertical-align: -2px; margin-right: 4px; }
  .issue { border-left: 4px solid var(--bad); background: #fef2f2; border-radius: 4px; padding: 5px 8px; margin: 5px 0; font-size: 13.5px; }
  .issue.tip { border-color: var(--warn); background: #fffbeb; }
  .issue.good { border-color: var(--accent); background: #ecfdf5; color: var(--accent); font-weight: 700; }
  .issue .rule { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .verdict { font-size: 18px; font-weight: 800; margin: 4px 0 8px; }
  .verdict.ok { color: var(--accent); } .verdict.ng { color: var(--bad); }
  svg text { font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>作業シミュレータ</h1><select id="prob" aria-label="問題"></select><div class="modes" id="modes"></div><span class="ver" id="ver"></span></div>
  <div class="main">
    <div class="pane" id="leftp"><div class="cap" id="cap"></div><div id="left"></div></div>
    <div class="pane" id="right"></div>
  </div>
  <p class="src">欠陥の基準は 一般財団法人 電気技術者試験センター「技能試験の欠陥の判断基準」（<a href="https://www.shiken.or.jp/construction/upload/handankizyun2017.pdf" target="_blank" rel="noopener">PDF</a>・<a href="https://www.shiken.or.jp/construction/second/defect/" target="_blank" rel="noopener">案内</a>）。
    数値の決まりが無い寸法は HOZAN「第二種電工試験の虎」などの目安で、「目安」と書いて欠陥とは区別する。
    問題（配線・施工条件）は「複線図れんしゅう」と同じもの。No.1（★）は先生の配布資料の施工条件・切る長さ・はぐ長さ・作業の順番に合わせてある。ほかの問題の施工条件は仮。</p>
</div>

/* ============================================================
   リングスリーブ（JIS C 2806）。1.6mm×2本だけが刻印「○」
   ============================================================ */
function sleeveFor(n16, n20) {
  const a = n16, b = n20;
  if (b === 0) return a === 2 ? { size: "小", mark: "○" } : a >= 3 && a <= 4 ? { size: "小", mark: "小" } : a >= 5 && a <= 6 ? { size: "中", mark: "中" } : null;
  if (b === 1) return a >= 1 && a <= 2 ? { size: "小", mark: "小" } : a >= 3 && a <= 5 ? { size: "中", mark: "中" } : null;
  if (b === 2) return a === 0 ? { size: "小", mark: "小" } : a <= 3 ? { size: "中", mark: "中" } : null;
  if (b === 3 || b === 4) return a === 0 ? { size: "中", mark: "中" } : null;
  return null;
}

/* ============================================================
   問題から作業の単位を作る
   器具の場所ごと（同じ取付枠の器具はまとめて）と、ボックスごと。資料に切る長さがあれば「ケーブルを切る」も
   ============================================================ */
let P = null, mode = "order", unitId = null, orderSet = "flow";
const store = {};                          // 問題ごとの作業の結果 { [unitId]: params }
function prob(id) { return KIT.find(p => p.id === id); }
function partOf(id) { return P.parts.find(p => p.id === id); }
function cableOf(id) { return P.cables.find(c => c.id === id); }
function boxOf(id) { return P.boxes.find(b => b.id === id); }
function placeName(pl) { const ps = (P.places.find(x => x.id === pl) || { parts: [] }).parts.map(partOf); return ps.map(p => p.name).join("・"); }
const BOXNAME = { k1: { B1: "A", B2: "B" } };                       // 先生の資料のボックスの呼び名
function boxName(id) { const m = BOXNAME[P.id]; return m && m[id] ? m[id] + "（" + id + "）" : id; }
const isConnBox = id => (boxOf(id) || {}).join === "conn";
/* ケーブルの1本1本（VVF 2C×2 は2本に分ける）。wires はその1本に入っている線 */
function pieces() {
  const t = teach(), out = [];
  P.cables.forEach(c => {
    const m = /×(\d)/.exec(c.spec), n = m ? +m[1] : 1, per = c.colors.length / n;
    const left = P.wires.map((w, i) => ({ w, i })).filter(x => x.w.cable === c.id);
    for (let k = 0; k < n; k++) {
      const ws = [];
      c.colors.slice(k * per, (k + 1) * per).forEach(col => { const j = left.findIndex(x => x.w.color === col); if (j >= 0) ws.push(left.splice(j, 1)[0]); });
      const cut = t && t.cut ? t.cut.filter(x => x.cable === c.id)[k] : null;
      const spec = c.spec.replace(/×\d$/, "");
      out.push({ id: c.id + "#" + (k + 1), c, k, n, spec, wires: ws, a: c.a, b: c.b, cut,
        name: cut ? cut.n + ". " + cut.seg : endName(c.a) + " 〜 " + endName(c.b) + (n > 1 ? "（" + (k + 1) + "本目）" : ""),
        len: cut ? cut.len : 300 });
    }
  });
  return out;
}
/* ケーブルの端の作業の種類: joint（リングスリーブ）/ conn（差込形コネクタ）/ ring・push・ceil・block（器具）/ none（電源・施工省略。はがない） */
function endKind(pc, side) {
  const pl = pc[side];
  if (boxOf(pl)) return isConnBox(pl) ? "conn" : "joint";
  const ks = pc.wires.map(x => [x.w.a, x.w.b].find(e => e.kind === "term" && (P.places.find(p => p.id === pl) || { parts: [] }).parts.includes(e.part)))
    .filter(Boolean).map(e => partOf(e.part)).filter(p => !p.omit && WORK[p.type]).map(p => WORK[p.type]);
  return ks[0] || "none";
}
const ENDWORK = { joint: "リングスリーブ", conn: "差込形コネクタ", ring: "のの字", push: "差込（ゲージ）", ceil: "差込（ゲージ）", block: "端子台", none: "はがない" };
function units() {
  const out = [], t = teach();
  if (t && t.cut) out.push({ id: "cut", kind: "cut", group: "② 切る", name: "ケーブルを切る（" + t.cut.length + "本）" });
  pieces().forEach(pc => out.push({ id: "pc:" + pc.id, kind: "piece", group: "③ 外装・被覆をはがす", piece: pc, name: pc.name + "（" + pc.spec + "）" }));
  P.places.forEach(pl => {
    const ps = pl.parts.map(partOf), kinds = [...new Set(ps.filter(p => !p.omit && WORK[p.type]).map(p => WORK[p.type]))];
    if (!kinds.length) return;
    const pushes = ps.filter(p => !p.omit && WORK[p.type] === "push");
    out.push({ id: "pl:" + pl.id, kind: "dev", group: "④⑤ 器具につける", place: pl.id, name: ps.map(p => p.name).join("・"), work: kinds, frame: pushes.map(p => p.id) });
  });
  P.boxes.forEach(b => {
    const js = P.joints.filter(j => j.box === b.id);
    if (!js.length) return;
    out.push({ id: "bx:" + b.id, kind: "box", group: "⑥⑦ ボックスでつなぐ", box: b.id, conn: b.join === "conn", name: "ボックス " + boxName(b.id) + " の接続", joints: js });
  });
  return out;
}
function unitWork(u) {
  if (u.kind === "cut") return "長さを決めて切る";
  if (u.kind === "piece") return "両端：" + ENDWORK[endKind(u.piece, "a")] + " ／ " + ENDWORK[endKind(u.piece, "b")];
  return u.kind === "box" ? (u.conn ? "差込形コネクタ" : "リングスリーブで圧着") : u.work.map(k => WORKNAME[k]).join("・");
}
/* その場所に端がある、加工したケーブルの端の値（線 i → {sheath, core, piece}） */
function endVals(i, place) {
  const pc = pieces().find(p => p.wires.some(x => x.i === i)); if (!pc) return null;
  const side = pc.a === place ? "a" : pc.b === place ? "b" : null; if (!side) return null;
  const r = store[P.id]["pc:" + pc.id], e = r && r.ends && r.ends[side];
  return { sheath: e ? e.sheath : 0, core: e ? e.core : 0, piece: pc, side };
}
function cablesAt(place) {
  const cs = P.cables.filter(c => c.a === place || c.b === place);
  return cs.map(c => ({ c, wires: P.wires.map((w, i) => ({ w, i })).filter(x => x.w.cable === c.id) }));
}
function jumpersAt(place) {                  // 渡り線（同じ取付枠の中の器具どうし）
  return P.wires.map((w, i) => ({ w, i })).filter(x => !x.w.cable && x.w.a.kind === "term" && x.w.b.kind === "term"
    && [x.w.a.part, x.w.b.part].every(id => (P.places.find(p => p.id === place) || { parts: [] }).parts.includes(id)));
}
function endAt(w, place) {
  const pl = (P.places.find(p => p.id === place) || { parts: [] }).parts;
  return [w.a, w.b].find(e => e.kind === "term" && pl.includes(e.part));
}
function otherEnd(w, place) { const e = endAt(w, place); return e === w.a ? w.b : w.a; }
function endText(e) {
  if (e.kind === "joint") return "ボックス " + boxName(e.box);
  const p = partOf(e.part); return p.name + (e.lab ? " の " + e.lab : "");
}
function termText(part, k) { const p = partOf(part), t = p.terms.find(x => x.k === k); return p.name + " の端子" + (t && t.lab ? "「" + t.lab + "」" : "（" + k + "）") + (t && t.desc ? "（" + t.desc + "）" : ""); }

/* ============================================================
   画面（1画面: 左に完成図＝作業台、右にその場所の作業）
   上の段階を選び、左の図の中で作業する所（ケーブル・器具・接続点）をタップする
   ============================================================ */
const STAGES = [["order", "順番"], ["cut", "② 切る"], ["strip", "③ はぐ"], ["dev", "④⑤ 器具"], ["join", "⑥⑦ つなぐ"], ["check", "⑧ 点検"]];
const sel = {};                                   // 段階ごとに選んでいる所 { cut・strip: ケーブルの1本, dev: 器具の場所, join: 接続点 }
function drawProbs() {
  const s = $("prob");
  s.innerHTML = KIT.map(p => `<option value="${p.id}"${P && P.id === p.id ? " selected" : ""}>No.${p.no}${TEACH[p.id] ? " ★" : ""}</option>`).join("");
  s.onchange = () => openProb(s.value);
}
function drawModes() {
  $("modes").innerHTML = STAGES.map(([m, t]) => { const ts = targets(m), n = ts.filter(x => x.done).length;
    const badge = ts.length ? `<small>${n === ts.length ? "✓" : n + "/" + ts.length}</small>` : "";
    return `<button data-m="${m}" class="${m === mode ? "on" : ""}"${m === "cut" && !ts.length ? ' disabled title="先生の資料がある問題だけ"' : ""}>${t}${badge}</button>`; }).join("");
  $("modes").querySelectorAll("button").forEach(b => { b.onclick = () => setMode(b.dataset.m); });
}
function setMode(m) { mode = m; draw(); }
function openProb(id) {
  P = prob(id); store[P.id] = store[P.id] || load(P.id) || {};
  Object.keys(sel).forEach(k => delete sel[k]); orderState.set = null; selWire = selMod = null;
  drawProbs(); draw();
}
function draw() { if (mode === "cut" && !targets("cut").length) mode = "strip"; drawModes(); drawLeft(); drawRight(); }
function drawRight() { if (mode === "order") drawOrder(); else if (mode === "check") drawCheck(); else drawStation(); }
function drawLeft() {
  const marks = mode === "check" ? checkList().map((x, i) => ({ n: i + 1, todo: x.todo, ...spot(x.u, x.d) })) : [];
  $("left").innerHTML = assemblySVG(marks);
  $("cap").textContent = mode === "check" ? "番号をタップすると、その作業へ" : mode === "order" ? "完成図" : "図の中をタップして、作業する所を選ぶ";
  $("left").querySelectorAll("[data-t]").forEach(g => { g.onclick = () => pickTarget(g.dataset.t); });
}
const KEY = "sagyou:";
function save() { try { localStorage.setItem(KEY + P.id, JSON.stringify(store[P.id])); } catch (e) {} }
function load(id) { try { return JSON.parse(localStorage.getItem(KEY + id) || "null"); } catch (e) { return null; } }
function changed() { save(); drawModes(); drawLeft(); }          // 右で作業したら、左の完成図と上の進み具合を描き直す

/* 段階ごとの「作業する所」と、やったかどうか（欠陥かどうかは ⑧ 点検で見る） */
function targets(m) {
  const st = store[P.id];
  if (m === "cut") return pieces().filter(pc => pc.cut).map(pc => { const x = st.cut && st.cut.add && st.cut.add[pc.cut.n]; return { id: pc.id, done: !!x && x.a !== undefined && x.b !== undefined }; });
  if (m === "strip") return pieces().map(pc => { const r = st["pc:" + pc.id]; return { id: pc.id, done: ["a", "b"].every(sd => endKind(pc, sd) === "none" || (!!r && r.ends[sd].sheath > 0 && r.ends[sd].core > 0)) }; });

        g += `<rect x="${c.x - 20}" y="${y}" width="40" height="34" rx="2" fill="${p.type === "pl" ? "#fde68a" : "#fafaf9"}" stroke="#57534e"/>`;
        g += `<text x="${c.x}" y="${y + 22}" font-size="11" text-anchor="middle" fill="#3f3a33">${esc(p.label || (p.type === "pl" ? "表示" : TYPES_SHORT(p.type)))}</text>`;
        p.terms.forEach((t, k) => { const tx = c.x - 34 + (k % 2) * 68, ty = y + 10 + Math.floor(k / 2) * 14; term[p.id + "." + t.k] = { x: tx, y: ty }; g += `<circle cx="${tx}" cy="${ty}" r="3.5" fill="#d6d3d1" stroke="#57534e"/>`; }); });
      top += `<text x="${c.x}" y="${c.y + H / 2 + 14}" font-size="12" text-anchor="middle" fill="#3f3a33">${esc(live.map(p => p.name.replace(/位置表示灯内蔵/, "")).join("・"))}</text>`;
    } else { bb = [46, live.length * 22 + 2]; live.forEach((p, i) => { const y = c.y - (live.length - 1) * 22 + i * 44;
        g += `<rect x="${c.x - 40}" y="${y - 16}" width="80" height="32" rx="3" fill="#e7e5e4" stroke="#57534e"/>`;
        p.terms.forEach((t, k) => { const tx = c.x - 26 + k * 52 / Math.max(1, p.terms.length - 1); term[p.id + "." + t.k] = { x: tx, y }; g += `<circle cx="${tx}" cy="${y}" r="5" fill="#c9a227" stroke="#7a5c0b"/>`; });
        top += `<text x="${c.x}" y="${y - 20}" font-size="11" text-anchor="middle" fill="#3f3a33">${esc(p.name)}</text>`; }); }
    ANC["pl:" + pl.id] = c; const hb = { x: c.x - bb[0], y: c.y - bb[1], w: bb[0] * 2, h: bb[1] * 2 };
    if (isSel("dev", pl.id)) halo += `<rect x="${hb.x - 8}" y="${hb.y - 8}" width="${hb.w + 16}" height="${hb.h + 16}" rx="12" fill="#fde68a" stroke="#f59e0b" stroke-width="3"/>`;
    hits += `<rect data-t="dev|${pl.id}" x="${hb.x}" y="${hb.y}" width="${hb.w}" height="${hb.h}" fill="transparent"/>`;
    if (mode === "dev" && pl.id in tgt) badge += bdg({ x: hb.x + hb.w + 4, y: hb.y - 4 }, tgt[pl.id]);
  });
  /* ケーブルと心線 */
  const jpos = {};
  /* 接続点は、ケーブルとケーブルの間のすき間から外へ突き出す（つながる線の向きに近いすき間へ） */
  P.boxes.forEach(b => {
    const dirs = pieces().filter(pc => pc.a === b.id || pc.b === b.id).map(pc => { const o = placePos(pc.a === b.id ? pc.b : pc.a); return Math.atan2(o.y - b.y, o.x - b.x); });

/* ============================================================
   ⑧ 点検（全体）。欠陥は完成図に番号で出す。番号をタップすると、その作業へ

function checkList() {                                 // 欠陥（未完成は作業ごとに1つにまとめる）
  const bad = [], todo = [];
  units().forEach(u => { const res = evalUnit(u, store[P.id][u.id] || defaults(u)), unf = res.defects.filter(d => d.key === "unfinished");
