<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0;font-size:14px}img{max-width:100%}</style>
<title>ふりかえり演習</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
/* layout: 問題カード1枚を画面いっぱいに。4:3 横画面に収め、上に部ごとの進み具合 */
:root{
  --bg:#eef2f6; --card:#ffffff; --ink:#1c2836; --sub:#5b6876; --line:#d5dde6;
  --accent:#2a5fc4; --accent-soft:#e3ebfa; --ok:#1d7f55; --ok-soft:#e1f3ea; --ng:#b8402b; --ng-soft:#fbe7e2;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-head:"Zen Maru Gothic","BIZ UDPGothic","Hiragino Sans",sans-serif;
}
/* ライトモード固定（端末がダークモードでも白基調で表示する） */
:root{color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
.app{max-width:1040px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-family:var(--f-head);font-size:22px;margin:0;font-weight:900}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--sub);background:var(--card)}
.chip.now{border-color:var(--accent);color:var(--accent);font-weight:700}
.chip.done{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.count{font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog div{height:100%;background:var(--accent)}
.card{flex:1;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 28px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.sec{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec .lbl{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.06em}
.sec .nm{font-family:var(--f-head);font-size:17px;font-weight:700;color:var(--sub)}
.tag{font-size:13px;font-weight:700;padding:2px 10px;border-radius:6px;background:var(--ng-soft);color:var(--ng)}
.q{font-size:21px;font-weight:700;line-height:1.6;white-space:pre-line;text-wrap:pretty}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.long{grid-template-columns:1fr}
.opt{font:inherit;font-size:17px;text-align:left;padding:12px 16px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:54px;display:flex;gap:10px;align-items:flex-start}
.opt .mk{flex:none;font-weight:700;color:var(--sub)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt.pick{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.miss{border-color:var(--ok);border-style:dashed}
.opt:disabled{cursor:default}
.box{width:20px;height:20px;border:2px solid var(--sub);border-radius:4px;flex:none;margin-top:3px;display:grid;place-items:center;font-size:14px;line-height:1}
.opt.pick .box{border-color:var(--accent);background:var(--accent);color:var(--card)}
.fb{border-radius:10px;padding:12px 16px;font-size:16px}
.fb.ok{background:var(--ok-soft)} .fb.ng{background:var(--ng-soft)}
.fb strong{display:block;margin-bottom:2px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:auto;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:17px;padding:12px 22px;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:var(--card);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:6px}
.bank .opt{min-height:0;padding:6px 8px;font-size:16px;justify-content:center;text-align:center}
.tin{font:inherit;font-size:22px;width:min(420px,100%);padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
textarea{font:inherit;font-size:17px;width:100%;min-height:130px;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.model{background:var(--accent-soft);border-radius:10px;padding:12px 16px}
.self{display:flex;gap:8px;flex-wrap:wrap}
.self .opt{min-height:0}
.hint{font-size:14px;color:var(--sub)}
.res-total{font-family:var(--f-head);font-size:40px;font-weight:900;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:240px 1fr 64px;gap:10px;align-items:center;font-size:15px}
.track{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--accent)}
.num{font-variant-numeric:tabular-nums;text-align:right}
.parts{display:flex;gap:24px;flex-wrap:wrap;font-size:16px}
.parts b{font-size:22px;font-variant-numeric:tabular-nums}
table.plan{border-collapse:collapse;font-size:16px}
table.plan td{padding:4px 18px 4px 0;border-bottom:1px solid var(--line)}
table.plan td:first-child{white-space:nowrap}
ol.list{margin:4px 0 0;padding-left:1.4em;font-size:16px}
.mbtn{font:inherit;text-align:left;padding:20px 22px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:8px}
.mbtn:hover{border-color:var(--accent)}
.mbtn .t{font-family:var(--f-head);font-size:24px;font-weight:900;color:var(--accent)}
.mbtn .d{font-size:16px;line-height:1.6}
.mbtn .s{font-size:14px;color:var(--sub)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.nobox label{font-size:15px;color:var(--sub)}
.nobox input{font:inherit;font-size:28px;width:160px;padding:8px 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);letter-spacing:.15em;font-variant-numeric:tabular-nums}
.warn{color:var(--ng);font-size:15px;font-weight:700}
.jump{display:flex;gap:6px;flex-wrap:wrap}
.jump .opt{min-height:0;padding:4px 12px;font-size:15px}
.sent{font-family:var(--f-head);font-size:30px;font-weight:900;color:var(--ok)}
.rv{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:4px;font-size:15px}
.rv .h{display:flex;gap:10px;align-items:baseline;font-weight:700}
.rv .mark{flex:none;width:28px;font-size:18px}
.rv .mark.o{color:var(--ok)} .rv .mark.x{color:var(--ng)}
.rv .e{color:var(--sub)}
.hbtn{font:inherit;font-size:14px;font-weight:700;padding:4px 12px;border-radius:8px;border:2px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.menu.three{grid-template-columns:repeat(3,1fr)}
/* 小テスト第2回：ストーリー・並べ替え・組み合わせ・穴うめ・計算・シミュレーション */
.chip.sc{font-size:12px;padding:2px 8px}
.tag.k{background:var(--accent-soft);color:var(--accent)}
.q2{font-size:18px;font-weight:700;line-height:1.55;white-space:pre-line;text-wrap:pretty}
.ordl{display:flex;flex-direction:column;gap:6px}
.ordl .opt{min-height:0;padding:8px 12px;font-size:16px;align-items:center}
.badge{flex:none;width:30px;height:30px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-weight:900;color:var(--sub)}
.opt.pick .badge{border:none;background:var(--accent);color:var(--card)}
.mt{display:flex;flex-direction:column;gap:5px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:16px;border-bottom:1px solid var(--line);padding-bottom:5px}
.seg{display:flex;gap:4px}
.seg .opt{min-height:0;padding:5px 10px;font-size:15px;justify-content:center;white-space:nowrap}
.fl{display:flex;flex-direction:column;gap:8px;font-size:17px;line-height:2}
.blank{font:inherit;font-size:16px;font-weight:700;min-width:120px;padding:2px 10px;margin:0 2px;border-radius:8px;border:2px dashed var(--sub);background:var(--card);color:var(--ink);cursor:pointer}
.blank.fill{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.blank.act{outline:3px solid var(--accent);outline-offset:1px}
.words{display:flex;gap:6px;flex-wrap:wrap}
.words .opt{min-height:0;padding:6px 14px;font-size:16px}
.numin{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}
.numin input{font:inherit;font-size:28px;width:200px;padding:6px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.rule{background:#f6f8fb;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:15px;line-height:1.6}
.spots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.spot{font:inherit;text-align:left;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:6px;font-size:14px}
.spot.pick{border-color:var(--accent);background:var(--accent-soft)}
.spot .nm2{font-weight:900;font-size:16px}
.leg{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.wall{display:inline-block;width:12px;height:22px;border-radius:2px}
.wall.wd{background:#b9824b}.wall.cn{background:#8a9099}
.dev{font-size:12px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--line)}
.mail{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;background:#fbfcfe}
.mail .opt{min-height:0;padding:6px 10px;font-size:15px;border-style:dashed}
.mail .opt.pick{border-style:solid}
.mail .btnlike{color:var(--accent);font-weight:700}
.lock{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.digits{display:flex;gap:3px;flex-wrap:wrap;max-width:560px}
.digits span{width:24px;height:34px;border-radius:5px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700}
.stp{font:inherit;font-size:26px;font-weight:900;width:56px;height:56px;border-radius:12px;border:2px solid var(--accent);background:var(--card);color:var(--accent);cursor:pointer}
.big{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
.chain{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.blk{font:inherit;text-align:left;padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:13px;display:flex;flex-direction:column;gap:2px}
.blk b{font-size:16px}
.blk.bad{background:var(--ng-soft)}
.blk.pick{border-color:var(--accent);outline:3px solid var(--accent-soft)}
.blk .hx{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--sub)}
.blk .rb{font-size:12px;font-weight:700;color:var(--accent);min-height:1.2em}
.rv .pt{padding-left:38px}
.rv .pt .o{color:var(--ok);font-weight:700} .rv .pt .x{color:var(--ng);font-weight:700}
/* 電卓とヒント */
.cq{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
.cl{display:flex;flex-direction:column;gap:12px}
.hbox{background:#fff6dc;border:1px solid #e9c46a;border-radius:10px;padding:8px 14px;font-size:15px;line-height:1.6}
.calc{border:1px solid var(--line);border-radius:12px;background:#f6f8fb;padding:10px;display:flex;flex-direction:column;gap:6px}
.ctitle{font-size:12px;font-weight:700;color:var(--sub)}
.cdisp{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 10px;text-align:right;min-height:58px}
.cex{font-size:12px;color:var(--sub);min-height:1.3em;overflow-wrap:anywhere}
.cmain{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.2}
.cnums{display:flex;gap:4px;flex-wrap:wrap}
.ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.ck{font:inherit;font-size:18px;font-weight:700;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.ck.op{color:var(--accent)} .ck.eq{background:var(--accent);color:var(--card);border-color:var(--accent)}
.ck.cn{height:auto;padding:4px 8px;font-size:14px;border:2px solid var(--accent);color:var(--accent)}
.ctape{font-size:12px;color:var(--sub);min-height:1em}
/* わからないところアンケート（無記名・スプレッドシートへ送る） */
.alist{display:flex;flex-direction:column;gap:14px}
.agrp h3{margin:0 0 6px;font-size:15px;color:var(--accent);font-weight:700}
.agrp .opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.agrp .opt{min-height:0;padding:8px 12px;font-size:16px;align-items:center}
.agrp .opt .no{flex:none;font-size:13px;color:var(--sub);width:22px;text-align:right}
@media (max-width:760px){.agrp .opts{grid-template-columns:1fr}}
@media (max-width:760px){.cq{grid-template-columns:1fr}}
@media (max-width:760px){.menu{grid-template-columns:1fr}.menu.three{grid-template-columns:1fr}.spots,.chain{grid-template-columns:1fr 1fr}.opts{grid-template-columns:1fr}.bar{grid-template-columns:120px 1fr 54px}.card{padding:18px}}
@media (prefers-reduced-motion:no-preference){.fill,.prog div{transition:width .5s ease}}
/* ===== 解説（わからないところアンケートの31項目。問い・しくみ・例題・記述で確かめる） ===== */
.k-body{font-size:20px;line-height:1.6;display:flex;flex-direction:column;gap:14px}
.k-tag{color:var(--accent);font-weight:700;font-size:16px;letter-spacing:.05em}
.k-q{font-family:var(--f-head);font-size:32px;font-weight:900;line-height:1.45;margin:0}
.k-qs{font-size:20px;color:var(--sub);margin:0}
.k-ask{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:10px 6px}
.k-fig{display:flex;align-items:stretch;gap:6px}
.k-bx{flex:1;min-width:0;border:2px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:8px;text-align:center;font-weight:700;font-size:17px;line-height:1.35;display:flex;align-items:center;justify-content:center;white-space:pre-line}
.k-bx.w{border-color:#c7741f;background:#fff3e2}.k-bx.g{border-color:var(--ok);background:var(--ok-soft)}
.k-ar{align-self:center;color:var(--sub);font-weight:900;font-size:20px;flex:none}
table.k-tb{border-collapse:collapse;width:100%;font-size:18px;line-height:1.45}
table.k-tb th,table.k-tb td{border:1px solid var(--line);padding:6px 10px;vertical-align:top;text-align:left}
table.k-tb th{background:#f3f6f9}
table.k-tb td:first-child{font-weight:700;background:#fbfcfe;white-space:nowrap}
ul.k-pts{margin:0;padding-left:1.2em}ul.k-pts li{margin:0 0 6px}
.k-body b{color:var(--accent)}
.k-exq{background:#f3f6f9;border-radius:10px;padding:12px 16px;font-weight:700;white-space:pre-line}
ol.k-st{margin:0;padding-left:1.6em}ol.k-st li{margin:0 0 8px}ol.k-st li.ans{font-weight:900;color:var(--ok)}
.k-wq{border-left:6px solid var(--accent);padding:6px 0 6px 14px;font-weight:700}
.k-model{background:var(--ok-soft);border-radius:10px;padding:12px 16px}
.k-keys{background:#fff3e2;border-radius:10px;padding:10px 16px;font-size:18px}
.k-model h4,.k-keys h4{margin:0 0 4px;font-size:14px;letter-spacing:.06em;color:var(--ok)}.k-keys h4{color:#c7741f}.k-keys ul{margin:0;padding-left:1.2em}
.h-opts .opt{min-height:0;padding:9px 14px}.h-kai{margin-right:auto;font-size:15px;padding:8px 14px}
.h-secs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.h-sec{padding:12px 14px}.h-sec .t{font-size:17px}.h-sec .d,.h-sec .s{font-size:14px}
@media (max-width:760px){.h-secs{grid-template-columns:1fr 1fr}}
.k-idx{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px;font-size:15px}
.k-idx h3{margin:0 0 2px;font-size:14px;color:var(--sub)}
.k-idx button{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;border:1px solid var(--line);background:#fbfcfe;border-radius:7px;padding:3px 8px;margin:0 0 3px;font:inherit;color:inherit;cursor:pointer;line-height:1.3}
.k-idx button:hover{border-color:var(--accent);background:var(--accent-soft)}
.k-idx button b{color:var(--accent);min-width:1.6em;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:1200px){.yn{display:none}}
.ver{font-size:12px;color:var(--sub);white-space:nowrap}
.menu.three .mbtn{padding:14px 18px;gap:6px}.menu.three .mbtn .t{font-size:20px}.menu.three .mbtn .d{font-size:15px;line-height:1.5}.menu.three{gap:12px}
.k-idx button.many{border-color:#c7741f;background:#fff8ee}
.k-many{flex:none;margin-left:auto;font-size:12px;font-weight:700;color:#c7741f;white-space:nowrap}
.k-key{border:2px solid #c7741f;background:#fff3e2;border-radius:10px;padding:8px 14px;font-weight:700;line-height:1.5}
.k-key .h,.y-row .h{display:block;font-size:13px;letter-spacing:.06em;color:#c7741f}
.k-key b{color:var(--ng)}
.y-list{display:flex;flex-direction:column;gap:8px}
.y-row{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:17px;line-height:1.5;color:var(--ink);background:#fbfcfe;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.y-row:hover{border-color:var(--accent)}
.y-row.many{border:2px solid #c7741f;background:#fff8ee}
.y-row .n{flex:none;min-width:2.2em;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums}
.y-row .tx{flex:1;min-width:0}.y-row .tt{display:block;font-size:14px;color:var(--sub)}
.y-row b{color:var(--ng)}
.y-calc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.y-c{text-align:left;font:inherit;color:var(--ink);border:2px solid var(--accent);border-radius:10px;padding:8px 12px;background:#fbfcfe;font-size:15px;line-height:1.5;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.y-c:hover{background:var(--accent-soft)}
.y-c .h{font-family:var(--f-head);font-weight:900;font-size:17px;color:var(--accent)}
.y-c .f{font-weight:700;color:var(--ng)}.y-c .e{color:var(--sub);font-size:14px;white-space:pre-line}
.y-tip{background:#f3f6f9;border-radius:10px;padding:8px 14px;font-size:16px}
.y-tip b{color:var(--ng)}
@media (max-width:760px){.y-calc{grid-template-columns:1fr}}
@media (max-width:760px){.k-idx{grid-template-columns:1fr}.k-fig{flex-direction:column}.k-ar{transform:rotate(90deg)}.k-q{font-size:26px}}
</style>

</head>
<body>
<div class="app">
  <header>
    <h1 id="ttl">ふりかえり演習</h1>
    <div class="chips" id="chips"></div>
    <div class="count" id="count"></div>
    <button class="hbtn" id="menuBtn" hidden>メニュー</button>
    <div class="ver" id="ver"></div>
  </header>
  <div class="prog"><div id="bar" style="width:0"></div></div>
  <section class="card" id="card"></section>
</div>

<script>

function correct(i){const q=Q[i];

  if(q.t==='one')return st.ans[i]===q.a;
  if(q.t==='multi')return Array.isArray(st.ans[i])&&sameSet(st.ans[i],q.a);
  return false}
function answered(i){const q=Q[i];return q.t==='w'?st.self[i]!=null:q.t==='term'?st.tin[i]!=null:st.ans[i]!=null}
function order(i){const q=Q[i];if(!st.ord[i]){const a=q.o.map((_,k)=>k);for(let n=a.length-1;n>0;n--){const r=Math.floor(Math.random()*(n+1));[a[n],a[r]]=[a[r],a[n]]}st.ord[i]=a;save()}return st.ord[i]}
const partOf=q=>q.t==='term'?1:q.t==='w'?3:2;

function chrome(){
  const parts=[1,2,3].map(p=>{const idx=Q.map((q,i)=>i).filter(i=>partOf(Q[i])===p);
    const cur=st.i>=0&&st.i<Q.length&&partOf(Q[st.i])===p;const done=idx.every(answered);
    return `<span class="chip ${cur?'now':done?'done':''}">${['','第1部 用語','第2部 選択','第3部 記述'][p]}（${idx.length}）</span>`});
  $('chips').innerHTML=parts.join('');
  $('count').textContent=st.i>=0&&st.i<Q.length?`${st.i+1} / ${Q.length}`:'';
  $('bar').style.width=(Q.filter((q,i)=>answered(i)).length/Q.length*100)+'%';
}
function head(q){return `<div class="sec"><span class="lbl">${PART[q.t]}</span><span class="nm">${esc(CH[q.s])}</span>${q.t==='multi'?'<span class="tag">すべて選ぶ</span>':''}</div>`}
function nav(canNext){return `<div class="row"><button class="btn ghost" id="back" ${st.i===0?'disabled':''}>もどる</button><button class="btn" id="next" ${canNext?'':'disabled'}>次へ</button></div>`}
function bindNav(){$('back').onclick=()=>{st.i--;save();render()};const n=$('next');if(n)n.onclick=()=>{st.i++;save();render()}}

function render(){
  $('ver').textContent='版 '+VER;
  $('menuBtn').hidden=mode==='menu';
  if(mode==='menu')return menu();
  if(mode==='test')return tRender();
  if(mode==='test2')return uRender();
  if(mode==='ask')return aRender();
  if(mode==='kai')return kRender();
  if(mode==='yoten')return yRender();
  if(mode==='han')return hRender();
  $('ttl').textContent='ふりかえり演習';
  chrome();
  if(st.i<0)return start();
  if(st.i>=Q.length)return result();
  const q=Q[st.i];
  if(q.t==='term')return term(q);
  if(q.t==='w')return written(q);
  return choice(q);
}
function term(q){
  const i=st.i,done=st.tin[i]!=null,ok=done&&isTermOK(q,st.tin[i]);
  const cls=w=>!done?'':w===q.a[0]?'right':w===st.tin[i]?'wrong':'';
  $('card').innerHTML=head(q)+`<div class="q">${esc(q.q)}</div>
   <div class="hint">これを何といいますか。下の一覧から選びなさい。</div>
   ${done?`<div class="fb ${ok?'ok':'ng'}"><strong>${ok?'正解です。':'正解は「'+esc(q.a[0])+'」です。'}</strong></div>`:''}
   <div class="bank">${BANK.map(w=>`<button class="opt ${cls(w)}" data-w="${esc(w)}" ${done?'disabled':''}>${esc(w)}</button>`).join('')}</div>
   <div class="row"><button class="btn ghost" id="back" ${i===0?'disabled':''}>もどる</button><button class="btn" id="next" ${done?'':'disabled'}>次へ</button></div>`;
  if(!done)document.querySelectorAll('.bank .opt').forEach(b=>b.onclick=()=>{st.tin[i]=b.dataset.w;save();render()});
  bindNav();
}
function choice(q){
  const i=st.i,ord=order(i),multi=q.t==='multi',done=st.ans[i]!=null;
  const long=q.o.some(o=>o.length>22);
  const pick=multi?(done?st.ans[i]:(st.pick[i]||[])):null;
  const cls=k=>{
    if(!done)return multi&&pick.includes(k)?'pick':'';
    if(multi){const sel=pick.includes(k),r=q.a.includes(k);return sel&&r?'right':sel?'wrong':r?'miss':''}
    return k===q.a?'right':k===st.ans[i]?'wrong':''};
  const ok=done&&correct(i);
  const ansText=multi?q.a.map(k=>LET[ord.indexOf(k)]).sort().join('・'):LET[ord.indexOf(q.a)];
  $('card').innerHTML=head(q)+`<div class="q">${esc(q.q)}</div>
   <div class="opts ${long?'long':''}">${ord.map((k,pos)=>`<button class="opt ${cls(k)}" data-k="${k}" ${done?'disabled':''}>${multi?`<span class="box">${pick.includes(k)?'✓':''}</span>`:''}<span class="mk">${LET[pos]}</span><span>${esc(q.o[k])}</span></button>`).join('')}</div>
   ${done?`<div class="fb ${ok?'ok':'ng'}"><strong>${ok?'正解です。':'正解は「'+ansText+'」です。'}</strong>${esc(q.e)}</div>`:''}
   <div class="row"><button class="btn ghost" id="back" ${i===0?'disabled':''}>もどる</button>${done?'<button class="btn" id="next">次へ</button>':multi?`<button class="btn" id="go" ${pick.length?'':'disabled'}>答える</button>`:''}</div>`;
  if(!done)document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;
    if(multi){const p=st.pick[i]||[];st.pick[i]=p.includes(k)?p.filter(x=>x!==k):[...p,k];save();render()}
    else{st.ans[i]=k;save();render()}});
  if($('go'))$('go').onclick=()=>{st.ans[i]=[...(st.pick[i]||[])];save();render()};
  bindNav();
}
function written(q){
  const i=st.i,shown=st.shown[i],done=st.self[i]!=null;
  $('card').innerHTML=head(q)+`<div class="q">${esc(q.q)}</div>
   <textarea id="ta" placeholder="ここに書きます" ${shown?'readonly':''}>${esc(st.text[i]||'')}</textarea>
   ${shown?`<div class="model"><strong>模範解答</strong><br>${esc(q.m)}<ol class="list">${q.k.map(k=>`<li>${esc(k)}</li>`).join('')}</ol></div>
   <div class="hint">自分の答えと見比べて、えらびなさい。</div>
   <div class="self">${['できた','半分できた','できなかった'].map((t,k)=>`<button class="opt ${st.self[i]===k?'pick':''}" data-k="${k}">${t}</button>`).join('')}</div>`:''}
   <div class="row"><button class="btn ghost" id="back">もどる</button>
   ${shown?`<button class="btn" id="next" ${done?'':'disabled'}>次へ</button>`:`<button class="btn" id="show">書けたので模範解答を見る</button>`}</div><div class="warn" id="dwarn" hidden></div>`;
  const ta=$('ta');ta.oninput=()=>{st.text[i]=ta.value;save()};
  if($('show'))$('show').onclick=()=>{const n=ta.value.trim().length;if(n<10){const w=$('dwarn');w.hidden=false;w.textContent=n?`答えが短すぎます（今 ${n}文字）。10文字以上書いてから押すと、模範解答が出ます。`:'先に自分の答えを書きます（10文字以上）。書いてから押すと、模範解答が出ます。';ta.focus();return}st.shown[i]=1;save();render()};
  document.querySelectorAll('.self .opt').forEach(b=>b.onclick=()=>{st.self[i]=+b.dataset.k;save();render()});
  bindNav();
}
function start(){
  const n=p=>Q.filter(q=>partOf(q)===p).length;
  $('card').innerHTML=`<div class="q">これまでの${Object.keys(CH).length}回の授業のふりかえりです</div>
   <table class="plan"><tr><td>第1部　用語</td><td>${n(1)}問</td><td>説明を読んで、${BANK.length}個の用語の一覧から選びます</td></tr>
   <tr><td>第2部　選択</td><td>${n(2)}問</td><td>「すべて選ぶ」問題は、1つでも多い・足りないと不正解です</td></tr>
   <tr><td>第3部　記述</td><td>${n(3)}問</td><td>書いてから模範解答を見て、自分で判定します</td></tr></table>
   <p style="margin:0">答えるとすぐに正解と解説が出ます。計算問題はメモを使ってかまいません。</p>
   <div class="row"><button class="btn ghost" id="tomenu">メニューへ</button><button class="btn" id="go">はじめる</button></div>`;
  $('go').onclick=()=>{st.i=0;save();render()};$('tomenu').onclick=()=>setMode('menu');
}
function result(){
  const idx=p=>Q.map((q,i)=>i).filter(i=>partOf(Q[i])===p);
  const sc=a=>a.filter(correct).length;
  const p1=idx(1),p2=idx(2),p3=idx(3);
  $('card').innerHTML=`<div class="q">結果</div>
   <div><span class="res-total">${sc(p1)+sc(p2)}</span><span style="font-size:20px"> / ${p1.length+p2.length} 問 正解（用語＋選択）</span></div>
   <div class="parts"><span>用語 <b>${sc(p1)}</b> / ${p1.length}</span><span>選択 <b>${sc(p2)}</b> / ${p2.length}</span></div>
   <div class="bars">${Object.keys(CH).map(s=>{const a=Q.map((q,i)=>i).filter(i=>Q[i].s===s&&Q[i].t!=='w');const r=sc(a);
     return `<div class="bar"><span>${esc(CH[s])}</span><div class="track"><div class="fill" style="width:${r/a.length*100}%"></div></div><span class="num">${r}/${a.length}</span></div>`}).join('')}</div>
   <div>記述：${p3.map((i,n)=>`問${n+1} ${['できた','半分','できなかった'][st.self[i]]??'未回答'}`).join('　')}</div>
   <div class="hint">この画面を先生に見せてください。いちばん短いバーの授業を見直しましょう。</div>
   <div class="row"><button class="btn ghost" id="back">最後の問題にもどる</button></div>`;
  $('back').onclick=()=>{st.i=Q.length-1;save();render()};
}

try{const m=localStorage.getItem('fukushu-mode');if(m==='drill'||m==='test'||m==='test2'||m==='ask'||m==='kai'||m==='han'||m==='yoten')mode=m}catch(e){}

    <button class="mbtn" id="mDrill"><span class="t">ふりかえり演習</span><span class="d">全${Q.length}問（用語・選択・記述）。答えるとすぐに正解と解説が出ます。</span><span class="s">進み具合 ${dn} / ${Q.length} 問</span></button>

    <button class="mbtn" id="mKai"><span class="t">解説</span><span class="d">わからないところアンケートの${KD.length}項目ごとに、問い・しくみ・例題・記述問題で確かめます。</span></button>

  $('mDrill').onclick=()=>setMode('drill');$('mTest').onclick=()=>setMode('test');$('mTest2').onclick=()=>setMode('test2');if($('mAsk'))$('mAsk').onclick=()=>setMode('ask');$('mYoten').onclick=()=>{ys.page=0;setMode('yoten')};$('mKai').onclick=()=>{ks={item:-1,page:0,step:0};setMode('kai')};$('mHan').onclick=()=>{hs.sec=null;setMode('han')};

// ===== 小テスト（30問。提出はダミーで、どこにも送らない） =====
const TN=30;
const TPLAN={A:5,B:5,C:4,D:4,E:6,F:6}; // 章ごとの問題数（合計30）
let ts={no:'',set:null,i:-1,ans:{},ord:{},sent:null,sending:false,warn:false};
const TKEY='fukushu-test-v1';
try{const s=JSON.parse(localStorage.getItem(TKEY)||'null');if(s)ts=Object.assign(ts,s,{sending:false,warn:false})}catch(e){}
function tSave(){try{const {sending,warn,...o}=ts;localStorage.setItem(TKEY,JSON.stringify(o))}catch(e){}}
const shuffle=a=>{a=a.slice();for(let n=a.length-1;n>0;n--){const r=Math.floor(Math.random()*(n+1));[a[n],a[r]]=[a[r],a[n]]}return a};
function tMake(){ // 章ごとにくじで選び、章の順に並べる（記述は入れない）
  return Object.keys(TPLAN).flatMap(s=>shuffle(Q.map((q,i)=>i).filter(i=>Q[i].s===s&&Q[i].t!=='w')).slice(0,TPLAN[s]).sort((a,b)=>a-b))}
const tAnswered=k=>{const v=ts.ans[k];return Array.isArray(v)?v.length>0:v!=null};
function tCorrect(k){const q=Q[ts.set[k]],v=ts.ans[k];
  if(q.t==='term')return v!=null&&isTermOK(q,v);
  if(q.t==='one')return v===q.a;
  return Array.isArray(v)&&sameSet(v,q.a)}
function tOrd(k){const q=Q[ts.set[k]];if(!ts.ord[k]){ts.ord[k]=shuffle(q.o.map((_,j)=>j));tSave()}return ts.ord[k]}
const fixNo=v=>String(v).normalize('NFKC').replace(/\s/g,'');
function tChrome(){
  $('ttl').textContent='小テスト第1回';
  const on=ts.set&&ts.i>=0&&!ts.sent;
  $('chips').innerHTML=on?`<span class="chip now">出席番号 ${esc(ts.no)}</span>`:'';
  $('count').textContent=on&&ts.i<TN?`${ts.i+1} / ${TN}`:'';
  $('bar').style.width=on?(ts.set.filter((_,k)=>tAnswered(k)).length/TN*100)+'%':ts.sent?'100%':'0';
}
function tRender(){
  tChrome();
  if(ts.sending)return tSending();
  if(ts.sent)return tDone();
  if(!ts.set||ts.i<0)return tStart();
  if(ts.i>=TN)return tConfirm();
  tQuestion();
}
function tStart(){
  $('card').innerHTML=`<div class="q">小テスト（${TN}問）</div>
   <table class="plan"><tr><td>問題</td><td>用語と選択。${Object.keys(CH).length}回の授業から出ます</td></tr>
   <tr><td>答え方</td><td>答えはあとから変えられます。とばして先へ進むこともできます</td></tr>
   <tr><td>提出</td><td>最後に「提出する」を押します。答え合わせは提出のあとです</td></tr></table>
   <div class="nobox"><label for="no">出席番号（4けた）</label><br><input id="no" inputmode="numeric" maxlength="4" autocomplete="off" value="${esc(ts.no)}" placeholder="0000"></div>
   <div class="warn" id="nomsg"></div>
   <div class="row"><button class="btn ghost" id="tomenu">メニューへ</button><button class="btn" id="go">はじめる</button></div>`;
  const no=$('no');
  const go=()=>{const v=fixNo(no.value);
    if(!/^\d{4}$/.test(v)){$('nomsg').textContent='出席番号は4けたの数字で入れます（例 2105）。';no.focus();return}
    ts.no=v;if(!ts.set){ts.set=tMake();ts.ans={};ts.ord={}}ts.i=0;tSave();render()};
  $('go').onclick=go;no.onkeydown=e=>{if(e.key==='Enter')go()};
  $('tomenu').onclick=()=>setMode('menu');
}
function tHead(q,k){return `<div class="sec"><span class="lbl">第${k+1}問</span><span class="nm">${esc(CH[q.s])}</span>${q.t==='multi'?'<span class="tag">すべて選ぶ</span>':''}</div>`}
function tQuestion(){
  const k=ts.i,q=Q[ts.set[k]];let body;
  if(q.t==='term'){
    body=`<div class="q">${esc(q.q)}</div><div class="hint">これを何といいますか。下の一覧から選びなさい。</div>
     <div class="bank">${BANK.map(w=>`<button class="opt ${ts.ans[k]===w?'pick':''}" data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div>`;
  }else{
    const ord=tOrd(k),multi=q.t==='multi',v=ts.ans[k];
    const sel=j=>multi?Array.isArray(v)&&v.includes(j):v===j;
    body=`<div class="q">${esc(q.q)}</div><div class="opts ${q.o.some(o=>o.length>22)?'long':''}">${ord.map((j,pos)=>`<button class="opt ${sel(j)?'pick':''}" data-k="${j}">${multi?`<span class="box">${sel(j)?'✓':''}</span>`:''}<span class="mk">${LET[pos]}</span><span>${esc(q.o[j])}</span></button>`).join('')}</div>`;
  }
  $('card').innerHTML=tHead(q,k)+body+`<div class="row"><button class="btn ghost" id="back" ${k===0?'disabled':''}>もどる</button><button class="btn" id="next">${k===TN-1?'見直して提出へ':'次へ'}</button></div>`;
  document.querySelectorAll('.bank .opt').forEach(b=>b.onclick=()=>{ts.ans[k]=b.dataset.w;tSave();render()});
  document.querySelectorAll('.opts .opt').forEach(b=>b.onclick=()=>{const j=+b.dataset.k;
    if(q.t==='multi'){const a=Array.isArray(ts.ans[k])?ts.ans[k]:[];ts.ans[k]=a.includes(j)?a.filter(x=>x!==j):[...a,j]}else ts.ans[k]=j;tSave();render()});
  $('back').onclick=()=>{ts.i--;tSave();render()};$('next').onclick=()=>{ts.i++;tSave();render()};
}
function tConfirm(){
  const left=ts.set.map((_,k)=>k).filter(k=>!tAnswered(k));
  $('card').innerHTML=`<div class="q">提出の前に確かめます</div>
   <table class="plan"><tr><td>出席番号</td><td style="font-size:22px;font-weight:700;letter-spacing:.1em">${esc(ts.no)}</td></tr>
   <tr><td>答えた問題</td><td>${TN-left.length} / ${TN} 問</td></tr></table>
   ${left.length?`<div>まだ答えていない問題（押すとその問題へ）</div><div class="jump">${left.map(k=>`<button class="opt" data-k="${k}">第${k+1}問</button>`).join('')}</div>`:'<div>全部の問題に答えました。</div>'}
   ${ts.warn?`<div class="warn">まだ答えていない問題が${left.length}問あります。このまま提出するときは、もう一度「提出する」を押します。</div>`:''}
   <div class="hint">提出したあとは、答えを変えられません。</div>
   <div class="row"><button class="btn ghost" id="back">問題にもどる</button><button class="btn ghost" id="chg">出席番号を直す</button><button class="btn" id="send">提出する</button></div>`;
  document.querySelectorAll('.jump .opt').forEach(b=>b.onclick=()=>{ts.i=+b.dataset.k;ts.warn=false;tSave();render()});
  $('back').onclick=()=>{ts.i=TN-1;ts.warn=false;tSave();render()};
  $('chg').onclick=()=>{ts.i=-1;ts.warn=false;tSave();render()};
  $('send').onclick=()=>{if(left.length&&!ts.warn){ts.warn=true;render();return}
    ts.warn=false;ts.sending=true;render();
    // ダミーの提出：どこにも送らず、送信しているような表示のあと「提出しました」にする
    setTimeout(()=>{ts.sending=false;const d=new Date();ts.sent=`${d.getMonth()+1}月${d.getDate()}日 ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;tSave();render()},1500)};
}
function tSending(){$('card').innerHTML=`<div class="q">送信しています…</div><div class="prog"><div style="width:70%"></div></div><div class="hint">画面を閉じずに待ちます。</div>`}

  if(p.t==='order')return p.items.map((_,n)=>Array.isArray(v)&&v[n]===n);
  if(p.t==='match')return p.rows.map((r,n)=>v!=null&&v[n]===r[1]);
  if(p.t==='fill')return p.a.map((w,n)=>v!=null&&v[n]===w);
  if(p.t==='num')return [uNum(v)===p.a];
  if(p.t==='tap')return [Array.isArray(v)&&sameSet(v,p.a)];
  return [v===p.a]}
const uCorrect=k=>uParts(k).every(Boolean);
function uChrome(){
  $('ttl').textContent=UDEMO?'小テスト第2回（先生用デモ）':'小テスト第2回';

// 正解の答え（デモの「正解を入れる」で使う。入れると、問題の画面そのものに正解が表示される）
function uKey(k){const p=U[k];
  if(p.t==='order')return p.items.map((_,n)=>n);

  if(p.t==='fill')return Object.fromEntries(p.a.map((w,n)=>[n,w]));

function uDemoBind(){if(!UDEMO)return;

  const j=$('uJump');if(j)j.onchange=()=>{if(j.value==='')return;if(!us.no)us.no='0000';us.i=+j.value;us.act=0;us.warn=false;uSave();render()};

// ===== 計算問題の電卓とヒント =====
// 問題に出てくる数をボタンで入れられる。式は × ÷ を先に計算する（ふつうの電卓と同じ）。eval は使わない
function uHint(k){const p=U[k];if(!p.hint)return '';
  return us.hint[k]?`<div class="hbox"><b>ヒント</b>　${esc(p.hint)}</div>`:`<div><button class="hbtn" id="hintBtn">ヒントを見る</button></div>`}
function bindHint(k){const b=$('hintBtn');if(b)b.onclick=()=>{us.hint[k]=1;uSave();b.parentNode.outerHTML=`<div class="hbox"><b>ヒント</b>　${esc(U[k].hint)}</div>`}}
let cal={k:-1,ex:'',res:null,tape:[]};
function calcEval(ex){ // 数・＋－×÷・かっこ
  const t=ex.match(/\d+(?:\.\d+)?|[+\-×÷()]/g)||[];if(t.join('')!==ex)throw 0;let i=0;
  const num=()=>{const x=t[i++];if(x==='('){const v=sum();if(t[i++]!==')')throw 0;return v}if(x==='-')return -num();if(x==null||!/^\d/.test(x))throw 0;return Number(x)};
  const mul=()=>{let v=num();while(t[i]==='×'||t[i]==='÷'){const o=t[i++],w=num();if(o==='÷'&&w===0)throw 0;v=o==='×'?v*w:v/w}return v};
  const sum=()=>{let v=mul();while(t[i]==='+'||t[i]==='-'){const o=t[i++],w=mul();v=o==='+'?v+w:v-w}return v};
  if(!t.length)throw 0;const v=sum();if(i!==t.length||!isFinite(v))throw 0;return Number(v.toPrecision(12))}
const calcFmt=v=>v.toLocaleString('ja-JP',{maximumFractionDigits:10});
const calcShow=ex=>ex.replace(/\d+(?:\.\d+)?/g,m=>{const [a,b]=m.split('.');return Number(a).toLocaleString('ja-JP')+(b!=null?'.'+b:'')}).replace(/-/g,'−');
function calKey(key){
  const op='+-×÷';
  if(key==='C'){cal.ex='';cal.res=null;return}
  if(key==='←'){cal.ex=cal.ex.slice(0,-1);cal.res=null;return}
  if(key==='='){if(!cal.ex)return;try{const v=calcEval(cal.ex);cal.tape=[`${calcShow(cal.ex)} ＝ ${calcFmt(v)}`,...cal.tape].slice(0,3);cal.res=v;cal.ex=''}catch(e){cal.res='エラー';cal.ex=''}return}
  if(typeof cal.res==='number'&&!cal.ex&&op.includes(key))cal.ex=String(cal.res); // 答えの続きに計算を足せる
  cal.res=null;
  if(op.includes(key)&&op.includes(cal.ex.slice(-1))&&key!=='-')cal.ex=cal.ex.slice(0,-1);
  cal.ex+=key;
}
function calRender(){
  const k=us.i,p=U[k],box=$('calc');if(!box)return;
  if(cal.k!==k)cal={k,ex:'',res:null,tape:[]};
  const main=cal.res!=null?(cal.res==='エラー'?'エラー':calcFmt(cal.res)):cal.ex?calcShow(cal.ex):'0';
  const keys=['C','←','(',')','7','8','9','÷','4','5','6','×','1','2','3','-','0','.','=','+'];
  box.innerHTML=`<div class="ctitle">電卓（問題の数はボタンで入れられます）</div>
   <div class="cnums">${p.nums.map((n,j)=>`<button class="ck cn" data-n="${j}">${esc(n[0])}</button>`).join('')}</div>
   <div class="cdisp"><div class="cex">${esc(cal.tape[0]||'')}</div><div class="cmain" id="cmain">${esc(main)}</div></div>
   <div class="ckeys">${keys.map(x=>`<button class="ck ${'+-×÷'.includes(x)?'op':''} ${x==='='?'eq':''}" data-k="${x}">${x==='-'?'−':x}</button>`).join('')}</div>
   ${p.t==='num'?`<button class="hbtn" id="toAns" ${typeof cal.res==='number'?'':'disabled'}>この数を答えの欄に入れる</button>`:''}
   <div class="ctape">${cal.tape.slice(1).map(esc).join('<br>')}</div>`;
  box.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{calKey(b.dataset.k);calRender()});
  box.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const v=String(p.nums[+b.dataset.n][1]);
    if(cal.res!=null){cal.ex='';cal.res=null}if(/[\d.)]$/.test(cal.ex))cal.ex+='×';cal.ex+=v;calRender()});
  const ta=$('toAns');if(ta)ta.onclick=()=>{const ni=$('ni');ni.value=String(cal.res);us.ans[k]=ni.value;uSave();uChrome()};
}

  uDemoBind();

// 答え合わせ：部分ごとに、あなたの答えと正解を並べる
function uReview(k){
  const p=U[k],v=us.ans[k],pt=uParts(k),mk=b=>`<span class="${b?'o':'x'}">${b?'○':'×'}</span>`;
  const none='未回答';
  if(p.t==='order'){const cur=Array.isArray(v)?v:[];
    return `<div class="pt">正しい順：${p.items.map((t,n)=>`${n+1}. ${esc(t)}`).join('<br>')}</div><div class="pt">あなたの順：${cur.length?cur.map(n=>esc(p.items[n].slice(0,14))+'…').join(' → '):none}</div>`}
  if(p.t==='match')return p.rows.map((r,n)=>`<div class="pt">${mk(pt[n])} ${esc(r[0])}：あなた ${v&&v[n]!=null?esc(p.cats[v[n]]):none} ／ 正解 ${esc(p.cats[r[1]])}</div>`).join('');
  if(p.t==='fill')return p.a.map((w,n)=>`<div class="pt">${mk(pt[n])} ${'①②③④⑤⑥'[n]}：あなた ${v&&v[n]!=null?esc(v[n]):none} ／ 正解 ${esc(w)}</div>`).join('');
  if(p.t==='num')return `<div class="pt">あなた ${uAnswered(k)?esc(String(v).trim())+esc(p.unit):none} ／ 正解 ${p.a}${esc(p.unit)}</div>`;

{s:"B",k:10,p:4,q:"スマホのギガ（データの量）の節約に「効く」ものはどれですか。",o:["動画の画質を、手動で360pにする", "5Gをオフにして4Gにする", "ブラウザのキャッシュを消す", "スマホを再起動する", "機内モードをオンにしてからオフにする"],e:"4G/5G・再起動・機内モードは量に関係ありません。キャッシュを消すと受け取り直すので、むしろ増えます。画質を下げるとデータの量が減ります。"},
{s:"B",k:8,p:0,q:"夜9時にネットが遅くなる理由について、ア〜ウの正しい・まちがいの組み合わせを選びなさい。\nア　「光回線1Gbps」は、出せる速さの上限である\nイ　先に使い始めた人が、優先して速く使える\nウ　全体の速さは、いちばん細い段を、そのとき使っている人数で分けた速さになる",o:["ア 正　イ 誤　ウ 正", "ア 正　イ 正　ウ 正", "ア 誤　イ 誤　ウ 正", "ア 正　イ 正　ウ 誤", "ア 誤　イ 正　ウ 誤"],e:"優先順位はなく、ほぼ均等に分け合います。"},
{s:"C",k:14,p:3,q:"2.4GHz帯の特徴として正しいものはどれですか。",o:["壁や角を回り込みやすい", "5GHz帯より速い", "5GHz帯より波長が短い", "電子レンジや近所のWi-Fiとぶつかりにくい", "5GHz帯より周波数が高い"],e:"2.4GHz は波長が長く（約12cm）、回り込んで遠くまで届きますが、速さは5GHzの方が上です。電子レンジ（2.45GHz）や近所のWi-Fiと混みやすいです。"},
{s:"C",k:16,p:4,q:"2階の奥の部屋に電波が届きません。中継器を置く場所として、いちばん良いのはどこですか。",o:["ルーターの電波が届いている、2階の廊下", "電波がほとんど届かない、2階の奥の部屋", "ルーターのすぐ横", "2階の奥の部屋の、金属の棚の中", "1階の、ルーターからいちばん遠い部屋"],e:"中継器はルーターの電波を受け取って出し直す機械です。電波が届かない場所に置いても働きません。"},
{s:"C",k:14,p:1,q:"鉄筋コンクリートのマンションです。ルーターと同じ部屋でゲームをする人と、別の階で動画を見る人がいます。それぞれに向く電波の組み合わせはどれですか。",o:["同じ部屋 5GHz　／　別の階 2.4GHz", "同じ部屋 2.4GHz　／　別の階 5GHz", "どちらも 5GHz", "どちらも 2.4GHz", "同じ部屋 2.4GHz　／　別の階 2.4GHz と 5GHz のどちらでも同じ"],e:"近くは速い5GHz（笛）、遠い部屋・別の階は届きやすい2.4GHz（太鼓）です。"},
{s:"D",k:17,p:0,q:"小文字だけのパスワードを、8文字から10文字に長くしました。組み合わせの数は何倍になりますか。",o:["676倍", "約1.25倍", "26倍", "52倍", "260倍"],e:"1文字ふえるごとに26倍。2文字ふえたので 26×26＝676倍です。"},
{s:"D",k:17,p:2,q:"総当たり攻撃で、いちばん破られにくいのはどれですか。",o:["小文字だけ 12文字", "全部まぜる（94種類） 8文字", "数字だけ 16けた", "小文字と数字をまぜて 10文字", "数字だけ 12けた"],e:"26¹²は約9.5京、10¹⁶は1京、94⁸は約6千兆、36¹⁰は約3.7千兆。長さが効くので、種類が少なくても小文字12文字がいちばん多くなります。"},
{s:"D",k:18,p:2,q:"総当たり攻撃で、まちがいが続いても「ロック」がかからないのはどちらですか。",o:["サイトから盗んだハッシュを、自分のパソコンで試すとき", "ログイン画面に、パスワードを打ちこんで試すとき", "どちらもロックがかかる", "どちらもロックはかからない", "スマホの画面ロックの暗証番号を、スマホに打ちこんで試すとき"],e:"ロックはサイトが回数を数えて行います。盗んだデータを手元で試すときは、サイトは気づけません。"},
{s:"D",k:19,p:0,q:"本人確認の3種類のうち、「持っている」に当たるものはどれですか。",o:["銀行のキャッシュカード", "パターンロック", "秘密の質問（ペットの名前）", "手のひらの静脈", "顔認証"],e:"パターンロックと秘密の質問は「知っている」、静脈と顔は「体」です。カード・スマホに届く番号・学生証は「持っている」です。"},
{s:"D",k:19,p:3,q:"二段階認証として「弱い」組み合わせはどれですか。",o:["パスワード ＋ 秘密の質問", "パスワード ＋ スマホに届く6けたの番号", "パスワード ＋ 認証アプリの番号", "パスワード ＋ スマホの通知で「はい」を押す", "パスワード ＋ 指紋"],e:"パスワードも秘密の質問も「知っている」なので、2つでも同じ種類です。"},
{s:"D",k:21,p:1,q:"パスキーで、サイトが預かっているものはどれですか。",o:["印影", "ハンコ", "指紋のデータ", "パスワードのハッシュ", "パスワードそのもの"],e:"ハンコはスマホから出ません。サイトには印影だけを預けます。"},
{s:"D",k:21,p:1,q:"パスキーが偽サイト（フィッシング）にだまされにくい理由はどれですか。",o:["ハンコに本物のサイト名が刻まれていて、偽サイトの紙には押さないから", "指紋のデータをサイトに送って、本物か照合するから", "偽サイトには、そもそもアクセスできなくなるから", "印影が30秒ごとに変わるから", "パスキーが、長いパスワードを自動で作ってくれるから"],e:"指紋や顔はスマホの中で確かめるだけで、サイトには送りません。"},
{s:"D",k:19,p:2,q:"次のア〜ウの正しい・まちがいの組み合わせを選びなさい。\nア　認証アプリの番号は、30秒ほどで新しい番号に変わる\nイ　6けたの番号（100万通り）は、3回ためせば当たる見こみが高い\nウ　パスキーは、ふつう「持っている（スマホ）」と「体（指紋や顔）」を組み合わせて使う",o:["ア 正　イ 誤　ウ 正", "ア 正　イ 正　ウ 正", "ア 誤　イ 誤　ウ 正", "ア 正　イ 誤　ウ 誤", "ア 誤　イ 正　ウ 正"],e:"100万通りを3回で当てる確率は、ほぼ0です。"},
{s:"E",k:23,p:1,q:"店舗提示型のコード決済で160円払いました。残高が実際に書きかわるのはどこですか。",o:["コード決済会社のサーバ", "お客のスマホ", "お店のQRコードの紙", "お店のタブレット", "お店のレジの中"],e:"スマホは画面で見せているだけです。書きかわるのはサーバの記録です。"},
{s:"E",k:24,p:3,q:"文化祭の屋台と、コンビニに向くコード決済の方式の組み合わせはどれですか。",o:["屋台 店舗提示型　／　コンビニ 利用者提示型", "屋台 利用者提示型　／　コンビニ 店舗提示型", "どちらも 店舗提示型", "どちらも 利用者提示型", "屋台 店舗提示型　／　コンビニ どちらでも速さは同じ"],e:"屋台はQRを印刷した紙だけで始められる店舗提示型、コンビニは速くてまちがえにくい利用者提示型が向きます。"},
{s:"E",k:24,p:2,q:"利用者提示型のコードが、数分ごとに書きかわるのはなぜですか。",o:["画面を写真にとられても、あとで使われないようにするため", "スマホの電池を長もちさせるため", "残高をスマホの中で計算し直すため", "お店のレジが読みやすくするため", "1回ごとの手数料を、スマホで計算し直すため"],e:"いまだけ使える番号にしておけば、写真にとられても使えません。"},
{s:"E",k:25,p:3,q:"クレジットカードで1万円の服を買い、「承認」が返ってきました。この瞬間のお金の動きとして正しいものはどれですか。",o:["まだ、だれのお金も動いていない", "お客の銀行口座から1万円が引かれた", "カード会社がお店に1万円を払い終わった", "お店の売上からすぐに手数料が引かれた", "カード会社が、お客の口座から1万円を仮に引いた"],e:"承認までは「使っていいか」の確認だけです。お客の口座が減るのは月1回の引き落としのときです。"},
{s:"E",k:25,p:3,q:"8,000円の商品がカードで売れました。加盟店手数料が4％のとき、お店に入るお金はいくらですか。",o:["7,680円", "7,200円", "7,960円", "8,320円", "7,600円"],e:"8,000 × 0.04 ＝ 320円が手数料。8,000 − 320 ＝ 7,680円です。"},
{s:"E",k:23,p:4,q:"朝の駅に2,400人が来ます。改札は4台で、QRで通ると1人2.0秒かかります。全員が通り終わるのに何分かかりますか。",o:["約20分", "約5分", "約10分", "約40分", "約80分"],e:"1台で1分に30人、4台で120人。2,400 ÷ 120 ＝ 20分です。ICの1.0秒なら10分ですみます。"},
{s:"E",k:26,p:1,q:"「通信が切れても払える」と「新しい割引運賃をすぐ始められる」。それぞれ得意なのはどちらの形ですか。",o:["通信が切れても 分散処理　／　新しい割引 集中処理", "通信が切れても 集中処理　／　新しい割引 分散処理", "どちらも 分散処理", "どちらも 集中処理", "通信が切れても どちらも払えない　／　新しい割引 分散処理"],e:"分散処理はその場で計算でき、集中処理は真ん中だけ直せば済みます。"},
{s:"E",k:22,p:4,q:"自分のお金（現金や銀行口座）が減るのはいつですか。正しい組み合わせを選びなさい。",o:["Suica チャージしたとき　／　デビットカード 使った瞬間　／　クレジットカード 翌月などにまとめて", "Suica 使った瞬間　／　デビットカード チャージしたとき　／　クレジットカード 翌月などにまとめて", "Suica チャージしたとき　／　デビットカード 翌月などにまとめて　／　クレジットカード 使った瞬間", "Suica 翌月などにまとめて　／　デビットカード 使った瞬間　／　クレジットカード チャージしたとき", "Suica 使った瞬間　／　デビットカード 使った瞬間　／　クレジットカード 使った瞬間"],e:"Suica は前払い（プリペイド）、デビットカードはその場で払う、クレジットカードは後払い（ポストペイ）です。"},
{s:"E",k:23,p:0,q:"名前を登録した Suica を落としました。駅で手続きすると、残高の入った新しいカードを作ってもらえます。それができるのはなぜですか。",o:["残高はお金そのものではなく「数字の記録」で、会社にも同じ記録があるから", "カードに GPS が入っていて、落とした場所が分かるから", "落としたカードで払おうとした人を、お店が必ず見つけるから", "落としたカードの残高は、自動で2倍に増えるから", "Suica の残高は、いつも銀行口座の中に入っているから"],e:"電子マネーの残高は「数字の記録」です。会社に同じ記録があるので、新しいカードに書き直せます。財布の100円玉は、なくしたら終わりです。"},
{s:"E",k:25,p:3,q:"ふだん家の近くでしか使わない人のクレジットカードです。カード会社の不正検知が「あやしい」と判断しやすいのはどれですか。",o:["夜中の3時に、海外のネットのお店で30万円の買い物", "夕方に、近所のスーパーで3,000円の買い物", "昼に、近くのコンビニで500円の買い物", "休みの日に、近くのガソリンスタンドで5,000円の給油", "朝に、いつもの駅で定期券を買う"],e:"不正検知は「いつもとちがう使い方」（場所・時間・金額）を見つけて、承認しない・止める・本人に連絡するしくみです。"},
{s:"F",k:27,p:2,q:"ビットコインの説明として正しいものはどれですか。",o:["国や会社が管理せず、参加する人みんなで記録を持ち合う、インターネット上のお金", "日本銀行が発行している、電子のお金", "コード決済の会社が残高を管理している、電子マネー", "銀行口座とつないで、使った瞬間に口座から引かれるお金", "銀行が発行し、国が残高を守っている電子のお金"],e:"ビットコインのように、インターネット上でやりとりされ、国や会社が管理していないお金を仮想通貨といいます（日本の法律では「暗号資産」とよびます）。"},
{s:"F",k:27,p:4,q:"取り引きの記録を持っているのはだれですか。電子マネーとビットコインの正しい組み合わせを選びなさい。",o:["電子マネー 1つの会社　／　ビットコイン 参加するみんな", "電子マネー 参加するみんな　／　ビットコイン 1つの会社", "どちらも 1つの会社", "どちらも 参加するみんな", "電子マネー 国　／　ビットコイン サトシ・ナカモト"],e:"電子マネーは会社が記録を持つので、会社が止まればお金も止まります。ビットコインは全員が同じ記録帳を持つので、1台が止まってもほかが動いています。"},
{s:"F",k:27,p:3,q:"文章の「指紋」（ハッシュ値）について、ア〜ウの正しい・まちがいの組み合わせを選びなさい。\nア　同じ文章なら、いつ・どこで計算しても同じ指紋になる\nイ　長い文章ほど、指紋も長くなる\nウ　指紋から、元の文章にもどせる",o:["ア 正　イ 誤　ウ 誤", "ア 正　イ 正　ウ 正", "ア 誤　イ 誤　ウ 正", "ア 正　イ 誤　ウ 正", "ア 誤　イ 正　ウ 誤"],e:"指紋の長さは、文章が長くても短くても同じです。指紋から元の文章にはもどせません。1文字ちがうだけで、まったく別の指紋になります。"},
{s:"F",k:30,p:2,q:"ブロック1〜5が鎖のようにつながっています。ブロック3の記録を書きかえると、どうなりますか。",o:["ブロック3から後ろが、全部こわれる", "ブロック3だけがこわれる", "ブロック1と2がこわれる", "何も起きない", "ブロック1から5まで、全部がこわれる"],e:"ブロック3の指紋が変わり、ブロック4に書いてある「前の指紋」と合わなくなります。ブロック4の指紋も変わるので、後ろが全部こわれます。"},
{s:"F",k:29,p:2,q:"Aさんの残高は20です。ブロックに入れて「よい」取り引きはどれですか。",o:["Aさんが、本人のハンコで20全部をBさんに送る", "Aさんが、本人のハンコで30をBさんに送る", "Bさんが、Aさんのハンコをまねて、Aさんの10を送る", "Aさんが、同じ20をBさんにもCさんにも送る", "Aさんが、ハンコを押さずに10をBさんに送る"],e:"残高より多い取り引き、本人ではないハンコ・ハンコのない取り引き、同じお金を2回使う二重払いは入れられません。20全部なら残高の中なので入れられます。"},
{s:"F",k:28,p:1,q:"マイニングで、頭にそろえる「0」の数を1つ増やしました。ナンスを見つけるまでに試す回数は、およそどうなりますか。",o:["約16倍に増える", "約2倍に増える", "約半分に減る", "変わらない", "約10倍に増える"],e:"指紋は0〜9とa〜fの16種類の文字でできています。頭の1文字が「0」になるのは16回に1回なので、およそ16倍になります。"},
{s:"F",k:30,p:4,q:"ウソの記録を通して、みんなのチェーンを追いぬくために、犯人に必要なものはどれですか。",o:["全体の半分より多い計算の力", "ブロックを1つだけ書きかえること", "自分の記録帳だけを書きかえること", "管理者のゆるし", "ナンスを1回で見つける運"],e:"計算をいちばん多く積み重ねた（いちばん長い）チェーンが正しい記録になります。半分より多い計算の力がないと、正直なみんなに追いつけません（51%攻撃）。"},
{s:"F",k:31,p:1,q:"ビットコインの弱点として正しいものはどれですか。",o:["秘密鍵をなくすと、取り戻してくれる人がいない", "管理する会社がつぶれると、全部止まる", "記録帳を、決まった会社の人しか見られない", "だれでも、記録帳を自由に書きかえられる", "国が発行しているので、国の都合で増やされる"],e:"ほかに、電気をたくさん使う・1ブロックに約10分かかる・送り先をまちがえても取り消せない、も弱点です。管理する会社はいないので会社がつぶれて止まることはなく、記録帳はだれでも見られます。"},
];
// 試験範囲（確定版）の記述5問（2026-11-17 剛さん：5問・易しめ。2つの言葉を使う形。考査の記述と同じ文）。c は採点の観点
const HW=[
{s:"A",k:6,q:"ビデオ通話がTCPではなくUDPを使う理由を、「再送」「止まる」の2つの言葉を使って説明しなさい。",m:"TCPは欠けたパケットを再送するので、再送を待つあいだ映像や声が止まる。通話は止まらないことが大事なので、再送しないUDPを使う。",c:["TCPは欠けたら「再送」する（待つ）、と書けている", "待つと映像や声が「止まる」ので再送しないUDP、と書けている"]},
{s:"A",k:5,q:"家の中のスマホの住所は、ほかの家と同じ番号でも混ざらない。外へ出るときに家のルーターがしていることを、「NAT」「外向きの住所」の2つの言葉を使って説明しなさい。",m:"家のルーターがNATで、送信元の住所をその家の外向きの住所に書き換えている。外からは家ごとにちがう住所に見えるので、混ざらない。",c:["ルーターがNATで送信元を書き換える、と書けている", "家ごとにちがう「外向きの住所」にする、と書けている"]},
{s:"D",k:21,q:"サイトからデータが漏れても、パスキーならログインに使われない理由を、「印影」「ハンコ」の2つの言葉を使って説明しなさい。",m:"サイトが預かっているのは印影だけで、ハンコは自分のスマホから出ない。印影からハンコは作れないので、漏れてもログインに使えない。",c:["サイトにあるのは「印影」だけ、と書けている", "印影から「ハンコ」は作れない（ハンコはスマホの中）、と書けている"]},
{s:"E",k:26,q:"Suicaが2001年に分散処理（改札機とカードで計算する形）を選んだ理由を、「遅い」「0.2秒」の2つの言葉を使って説明しなさい。",m:"当時は回線や真ん中のコンピュータが遅く、毎回問い合わせると改札の0.2秒に間に合わなかった。だから改札機とカードで計算した。",c:["回線やコンピュータが「遅い」、と書けている", "問い合わせると「0.2秒」に間に合わない、と書けている"]},
{s:"F",k:30,q:"古いブロックを書きかえても、ウソの記録が通らない理由を、「作り直し」「半分」の2つの言葉を使って説明しなさい。",m:"書きかえたブロックから後ろを全部作り直す必要がある。そのあいだもみんなのチェーンはのびるので、追いつくには全体の半分より多い計算の力がいる。",c:["後ろのブロックを全部「作り直し」する必要がある、と書けている", "全体の「半分」より多い計算の力がいる、と書けている"]},
];
// ===== 試験範囲（確定版）：選択45問（ア〜オの5択）＋記述5問。章をえらんで解ける。どの問題からも解説（KD）へ飛べる =====
const HKEY='fukushu-han-v1';
const HSEC=[...Object.keys(CH),'W']; // 章 A〜F と、記述 W
const hName=s=>s==='W'?'記述問題':CH[s];
let hs={v:2,sec:null,i:-1,ans:{},self:{},text:{},shown:{}}; // ans：選択の問題番号→選んだ位置（0〜4）。self・text・shown：記述の番号ごと
try{const o=JSON.parse(localStorage.getItem(HKEY)||'null');if(o&&typeof o==='object'){const old=o.v!==2;hs={...hs,...o};if(old)hMigrate()}}catch(e){}
// 2026-11-17 に選択50→45・記述10→5 に絞った。前の版で保存した答えを、新しい番号に付け直す（外した問題の答えは捨てる）
function hMigrate(){
  const q=[...Array(50).keys()].filter(n=>![16,17,18,19,23].includes(n)),w=[0,1,5,6,9];
  const re=(o,map)=>{const r={};map.forEach((old,nw)=>{if(o&&o[old]!=null)r[nw]=o[old]});return r};
  hs.ans=re(hs.ans,q);hs.self=re(hs.self,w);hs.text=re(hs.text,w);hs.shown=re(hs.shown,w);hs.sec=null;hs.i=-1;hs.v=2}
function hSave(){try{localStorage.setItem(HKEY,JSON.stringify(hs))}catch(e){}}
const hList=s=>s==='W'?HW.map((_,j)=>j):HQ.map((_,j)=>j).filter(j=>HQ[j].s===s);
function hOpts(j){const q=HQ[j],a=q.o.slice(1),r=[];for(let n=0;n<5;n++)r.push(n===q.p?q.o[0]:a.shift());return r} // 画面の並び（正解は p の位置）
const hOK=j=>hs.ans[j]===HQ[j].p;
const hDoneSec=s=>hList(s).filter(j=>s==='W'?hs.self[j]!=null:hs.ans[j]!=null).length;
function hKai(k){ks={item:KD.findIndex(d=>d.n===k),page:1,step:0,ret:'han'};setMode('kai')}
function hRender(){
  $('ttl').textContent='試験範囲（確定版）';
  if(!hs.sec)return hTop();
  const L=hList(hs.sec);
  $('chips').innerHTML=`<span class="chip now">${esc(hName(hs.sec))}</span>`;
  $('count').textContent=hs.i<L.length?`${hs.i+1} / ${L.length}`:'';
  $('bar').style.width=(hDoneSec(hs.sec)/L.length*100)+'%';
  if(hs.i>=L.length)return hResult();
  return hs.sec==='W'?hWritten(L[hs.i]):hChoice(L[hs.i]);
}
function hTop(){
  $('chips').innerHTML='';$('count').textContent='';
  const nq=HQ.filter((_,j)=>hs.ans[j]!=null).length,ok=HQ.filter((_,j)=>hOK(j)).length,nw=HW.filter((_,j)=>hs.self[j]!=null).length;
  $('bar').style.width=((nq+nw)/(HQ.length+HW.length)*100)+'%';
  $('card').innerHTML=`<div class="q">試験範囲（確定版）　全${HQ.length+HW.length}問</div>
   <table class="plan"><tr><td>選択問題</td><td>${HQ.length}問</td><td>ア〜オから1つ選びます。答えるとすぐに正解と解説が出ます</td></tr>
   <tr><td>記述問題</td><td>${HW.length}問</td><td>書いてから模範解答と採点の観点を見て、自分で判定します</td></tr></table>
   <div class="hint">どの問題からも「くわしい解説」へ飛べます（しくみ・例題・記述）。見終わったら「問題にもどる」で続きから解けます。</div>
   <div class="h-secs">${HSEC.map(s=>{const L=hList(s),d=hDoneSec(s),c=s==='W'?L.filter(j=>hs.self[j]===0).length:L.filter(hOK).length;
     return `<button class="mbtn h-sec" data-s="${s}"><span class="t">${esc(hName(s))}</span><span class="d">${s==='W'?'記述':'選択'} ${L.length}問</span><span class="s">${d?`${d} / ${L.length} 問 済み・${s==='W'?'できた':'正解'} ${c}`:'まだ'}</span></button>`}).join('')}</div>
   <div class="parts"><span>選択 正解 <b>${ok}</b> / ${HQ.length}</span><span>記述 済み <b>${nw}</b> / ${HW.length}</span></div>
   <div class="row"><button class="btn ghost" id="hreset">記録を消して最初から</button><button class="btn ghost" id="tomenu">メニューへ</button></div>`;
  $('card').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const s=b.dataset.s,L=hList(s);hs.sec=s;
    const k=L.findIndex(j=>s==='W'?hs.self[j]==null:hs.ans[j]==null);hs.i=k<0?L.length:k;hSave();render()});
  $('tomenu').onclick=()=>setMode('menu');
  $('hreset').onclick=()=>{const b=$('hreset');if(b.dataset.sure){hs={v:2,sec:null,i:-1,ans:{},self:{},text:{},shown:{}};hSave();render()}else{b.dataset.sure=1;b.textContent='もう一度押すと消えます'}};
}
function hNav(next,left=''){return `<div class="row">${left}<button class="btn ghost" id="hup">章をえらぶ</button><button class="btn ghost" id="hback" ${hs.i===0?'disabled':''}>もどる</button>${next?'<button class="btn" id="hnext">次へ</button>':''}</div>`}
function hBindNav(){$('hup').onclick=()=>{hs.sec=null;hSave();render()};$('hback').onclick=()=>{hs.i--;hSave();render()};if($('hnext'))$('hnext').onclick=()=>{hs.i++;hSave();render()};
  if($('hkai'))$('hkai').onclick=()=>hKai(+$('hkai').dataset.k)}
const hKaiBtn=k=>`<button class="btn ghost h-kai" id="hkai" data-k="${k}" title="${esc(KD.find(d=>d.n===k).t)}">くわしい解説 No.${k}</button>`;
function hChoice(j){
  const q=HQ[j],op=hOpts(j),v=hs.ans[j],done=v!=null,ok=done&&v===q.p,long=op.some(o=>o.length>22);
  $('card').innerHTML=`<div class="sec"><span class="lbl">選択　${hs.i+1}</span><span class="nm">${esc(CH[q.s])}</span></div><div class="q">${esc(q.q)}</div>
   <div class="opts h-opts ${long?'long':''}">${op.map((o,n)=>`<button class="opt ${done?(n===q.p?'right':n===v?'wrong':''):''}" data-n="${n}" ${done?'disabled':''}><span class="mk">${LET[n]}</span><span>${esc(o)}</span></button>`).join('')}</div>
   ${done?`<div class="fb ${ok?'ok':'ng'}"><strong>${ok?'正解です。':'正解は「'+LET[q.p]+'」です。'}</strong>${esc(q.e)}</div>`:''}
   ${hNav(done,done?hKaiBtn(q.k):'')}`;
  if(!done)$('card').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{hs.ans[j]=+b.dataset.n;hSave();render()});
  hBindNav();
}
function hWritten(j){
  const q=HW[j],shown=hs.shown[j],done=hs.self[j]!=null;
  $('card').innerHTML=`<div class="sec"><span class="lbl">記述　${hs.i+1}</span><span class="nm">${esc(CH[q.s])}</span></div><div class="q">${esc(q.q)}</div>
   <textarea id="ta" placeholder="ここに書きます" ${shown?'readonly':''}>${esc(hs.text[j]||'')}</textarea>
   ${shown?`<div class="model"><strong>模範解答の例</strong><br>${esc(q.m)}<div style="margin-top:6px"><strong>採点の観点（2つとも書けていれば○）</strong></div><ol class="list">${q.c.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>
   <div class="hint">自分の答えと見比べて、えらびなさい。</div>
   <div class="self">${['できた','半分できた','できなかった'].map((t,n)=>`<button class="opt ${hs.self[j]===n?'pick':''}" data-n="${n}">${t}</button>`).join('')}</div>`:''}
   ${shown?hNav(done,hKaiBtn(q.k)):`<div class="row"><button class="btn ghost" id="hup">章をえらぶ</button><button class="btn ghost" id="hback" ${hs.i===0?'disabled':''}>もどる</button><button class="btn" id="hshow">書けたので模範解答を見る</button></div><div class="warn" id="hwarn" hidden></div>`}`;
  const ta=$('ta');ta.oninput=()=>{hs.text[j]=ta.value;hSave()};
  if($('hshow'))$('hshow').onclick=()=>{const n=ta.value.trim().length;if(n<10){const w=$('hwarn');w.hidden=false;w.textContent=n?`答えが短すぎます（今 ${n}文字）。10文字以上書いてから押すと、模範解答が出ます。`:'先に自分の答えを書きます（10文字以上）。書いてから押すと、模範解答が出ます。';ta.focus();return}hs.shown[j]=1;hSave();render()};
  $('card').querySelectorAll('.self .opt').forEach(b=>b.onclick=()=>{hs.self[j]=+b.dataset.n;hSave();render()});
  hBindNav();
}
function hResult(){
  const s=hs.sec,L=hList(s),W=s==='W';
  const miss=L.filter(j=>W?hs.self[j]!==0:!hOK(j));
  const c=L.length-miss.length;
  $('card').innerHTML=`<div class="q">${esc(hName(s))}　結果</div>
   <div><span class="res-total">${c}</span><span style="font-size:20px"> / ${L.length} 問 ${W?'できた':'正解'}</span></div>
   ${miss.length?`<div><b>${W?'「できた」以外':'まちがえた・まだの問題'}（${miss.length}）</b><ul style="margin:4px 0 0">${miss.map(j=>{const q=W?HW[j]:HQ[j],n=L.indexOf(j),t=q.q.split('\n')[0];
     return `<li>${n+1}．${esc(t.slice(0,40))}${t.length>40?'…':''}　<button class="btn ghost" style="padding:2px 10px;font-size:14px" data-go="${n}">問題</button> <button class="btn ghost" style="padding:2px 10px;font-size:14px" data-kk="${q.k}">解説 No.${q.k}</button></li>`}).join('')}</ul></div>`:'<div>全部できました。</div>'}
   <div class="row"><button class="btn ghost" id="hup">章をえらぶ</button>${miss.length?'<button class="btn" id="hretry">'+(W?'「できた」以外を':'まちがえた問題を')+'やり直す</button>':''}</div>`;
  $('hup').onclick=()=>{hs.sec=null;hSave();render()};
  $('card').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{hs.i=+b.dataset.go;hSave();render()});
  $('card').querySelectorAll('[data-kk]').forEach(b=>b.onclick=()=>hKai(+b.dataset.kk));
  if($('hretry'))$('hretry').onclick=()=>{miss.forEach(j=>{if(W){delete hs.self[j];delete hs.shown[j]}else delete hs.ans[j]});hs.i=L.indexOf(miss[0]);hSave();render()};
}
const KPG=['問い','しくみ','例題','記述で確かめる'];
let ks={item:-1,page:0,step:0};
const kRich=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
function kMax(){if(ks.item<0)return 0;const d=KD[ks.item];return ks.page===2?d.ex.st.length:ks.page===3?1:0}
function kOpen(i){ks={item:i,page:0,step:0};if(mode!=='kai')setMode('kai');else render()}
function kNext(){if(ks.item<0)return;if(ks.step<kMax()){ks.step++;return render()}if(ks.page<3){ks.page++;ks.step=0;render()}}
function kPrev(){if(ks.item<0)return;if(ks.page===0){ks.item=-1;return render()}ks.page--;ks.step=0;render()}
function kRender(){
  $('ttl').textContent='解説';$('count').textContent='';
  if(ks.item<0){
    $('chips').innerHTML='';$('bar').style.width='0';
    $('card').innerHTML=`<div class="q">どこの解説を見ますか</div><div class="hint">アンケートと同じ31項目で、1項目4枚です。<span style="color:#c7741f;font-weight:700">●</span>＝わからない人が多かった項目</div>
     <div class="k-idx">${Object.keys(CH).map(s=>`<div><h3>${esc(CH[s])}</h3>${KD.filter(d=>d.s===s).map(d=>`<button data-k="${KD.indexOf(d)}" class="${KMANY.includes(d.n)?'many':''}"><b>${d.n}</b><span>${esc(d.t)}</span>${KMANY.includes(d.n)?'<span class="k-many">●</span>':''}</button>`).join('')}</div>`).join('')}</div>
     <div class="row"><button class="btn ghost" id="kmenu">メニューへ</button></div>`;
    $('card').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>kOpen(+b.dataset.k));$('kmenu').onclick=()=>setMode('menu');
    try{history.replaceState(null,'','#kai')}catch(e){}
    return;
  }
  const d=KD[ks.item],pg=ks.page,stp=ks.step;
  $('chips').innerHTML=KPG.map((t,k)=>`<span class="chip ${k===pg?'now':k<pg?'done':''}">${t}</span>`).join('');
  $('count').textContent=`No.${d.n}`;$('bar').style.width=((pg+1)/4*100)+'%';
  let h=`<div class="sec"><span class="lbl">No.${d.n}　${esc(KPG[pg])}</span><span class="nm">${esc(CH[d.s])}</span></div><div class="k-body">`;
  if(pg===0)h+=`<div class="k-ask"><div class="k-tag">${esc(d.t)}</div><p class="k-q">${kRich(d.q)}</p><p class="k-qs">${kRich(d.qs)}</p></div>`;
  else if(pg===1)h+=`<div class="q" style="margin:0">${esc(d.t)}</div>`
    +`<div class="k-key"><span class="h">ここだけは押さえる</span>${kRich(d.y)}</div>`
    +(d.fig?'<div class="k-fig">'+d.fig.map((b,i)=>{let c='';if(b[0]==='!'){c=' w';b=b.slice(1)}else if(b[0]==='#'){c=' g';b=b.slice(1)}return (i?'<span class="k-ar">→</span>':'')+`<div class="k-bx${c}">${kRich(b)}</div>`}).join('')+'</div>':'')
    +(d.tbl?'<table class="k-tb"><tr>'+d.tbl.h.map(x=>`<th>${esc(x)}</th>`).join('')+'</tr>'+d.tbl.r.map(r=>'<tr>'+r.map(c=>`<td>${kRich(c)}</td>`).join('')+'</tr>').join('')+'</table>':'')
    +(d.pts?'<ul class="k-pts">'+d.pts.map(x=>`<li>${kRich(x)}</li>`).join('')+'</ul>':'');
  else if(pg===2)h+=`<div class="k-exq">${kRich(d.ex.q)}</div><ol class="k-st">${d.ex.st.slice(0,stp).map((x,i)=>`<li class="${i===d.ex.st.length-1?'ans':''}">${kRich(x)}</li>`).join('')}</ol>`
    +(stp<d.ex.st.length?`<div><button class="btn ghost" id="kstep">次の一行を見る（${stp} / ${d.ex.st.length}）</button></div>`:'');
  else h+=`<div class="k-wq">${kRich(d.w.q)}</div><div class="hint">自分の答えを、ノートかプリントに書いてから見ましょう。</div>`
    +(stp?`<div class="k-model"><h4>模範解答の例</h4>${kRich(d.w.m)}</div><div class="k-keys"><h4>採点の観点（2つとも書けていれば○）</h4><ul>${d.w.k.map(x=>`<li>${kRich(x)}</li>`).join('')}</ul></div>`
      :`<div><button class="btn ghost" id="kstep">模範解答を見る</button></div>`);
  h+=`</div><div class="row">${ks.ret==='han'?'<button class="btn" id="kret">問題にもどる</button>':ks.ret==='yoten'?'<button class="btn" id="kret">要点まとめにもどる</button>':''}<button class="btn ghost" id="kidx">一覧</button><button class="btn ghost" id="kback">もどる</button><button class="btn" id="knext" ${pg===3?'disabled':''}>${pg===3?'おわり':'次へ'}</button></div>`;
  $('card').innerHTML=h;$('card').scrollTop=0;
  if($('kstep'))$('kstep').onclick=()=>{ks.step++;render()};
  $('kidx').onclick=()=>{ks.item=-1;ks.ret=null;render()};if($('kret'))$('kret').onclick=()=>{const r=ks.ret;ks.ret=null;setMode(r)};$('kback').onclick=kPrev;$('knext').onclick=()=>{ks.step=kMax();kNext()};
  try{history.replaceState(null,'','#kai'+d.n)}catch(e){}
}
addEventListener('keydown',e=>{if(mode!=='kai'||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();kNext()}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();kPrev()}
  else if(e.key==='Escape'){ks.item=-1;render()}});
{const m=/^#kai(\d*)$/i.exec(location.hash);if(m){mode='kai';const j=m[1]?KD.findIndex(d=>d.n===+m[1]):-1;if(j>=0)ks.item=j}}
render();
</script>
