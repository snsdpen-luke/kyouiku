<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0;font-size:14px}img{max-width:100%}</style>
<title>ふりかえり演習</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
/* layout: 問題カード1枚を画面いっぱいに。4:3 横画面に収め、上に部ごとの進み具合 */
:root{
  --bg:#eef2f6; --card:#ffffff; --ink:#1c2836; --sub:#5b6876; --line:#d5dde6;
  --accent:#2a5fc4; --accent-soft:#e3ebfa; --ok:#1d7f55; --ok-soft:#e1f3ea; --ng:#b8402b; --ng-soft:#fbe7e2;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-head:"Zen Maru Gothic","BIZ UDPGothic","Hiragino Sans",sans-serif;
}
/* ライトモード固定（端末がダークモードでも白基調で表示する） */
:root{color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
.app{max-width:1040px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-family:var(--f-head);font-size:22px;margin:0;font-weight:900}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--sub);background:var(--card)}
.chip.now{border-color:var(--accent);color:var(--accent);font-weight:700}
.chip.done{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.count{font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog div{height:100%;background:var(--accent)}
.card{flex:1;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 28px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.sec{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec .lbl{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.06em}
.sec .nm{font-family:var(--f-head);font-size:17px;font-weight:700;color:var(--sub)}
.tag{font-size:13px;font-weight:700;padding:2px 10px;border-radius:6px;background:var(--ng-soft);color:var(--ng)}
.q{font-size:21px;font-weight:700;line-height:1.6;white-space:pre-line;text-wrap:pretty}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.long{grid-template-columns:1fr}
.opt{font:inherit;font-size:17px;text-align:left;padding:12px 16px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:54px;display:flex;gap:10px;align-items:flex-start}
.opt .mk{flex:none;font-weight:700;color:var(--sub)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt.pick{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.miss{border-color:var(--ok);border-style:dashed}
.opt:disabled{cursor:default}
.box{width:20px;height:20px;border:2px solid var(--sub);border-radius:4px;flex:none;margin-top:3px;display:grid;place-items:center;font-size:14px;line-height:1}
.opt.pick .box{border-color:var(--accent);background:var(--accent);color:var(--card)}
.fb{border-radius:10px;padding:12px 16px;font-size:16px}
.fb.ok{background:var(--ok-soft)} .fb.ng{background:var(--ng-soft)}
.fb strong{display:block;margin-bottom:2px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:auto;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:17px;padding:12px 22px;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:var(--card);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:6px}
.bank .opt{min-height:0;padding:6px 8px;font-size:16px;justify-content:center;text-align:center}
.tin{font:inherit;font-size:22px;width:min(420px,100%);padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
textarea{font:inherit;font-size:17px;width:100%;min-height:130px;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.model{background:var(--accent-soft);border-radius:10px;padding:12px 16px}
.self{display:flex;gap:8px;flex-wrap:wrap}
.self .opt{min-height:0}
.hint{font-size:14px;color:var(--sub)}
.res-total{font-family:var(--f-head);font-size:40px;font-weight:900;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:240px 1fr 64px;gap:10px;align-items:center;font-size:15px}
.track{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--accent)}
.num{font-variant-numeric:tabular-nums;text-align:right}
.parts{display:flex;gap:24px;flex-wrap:wrap;font-size:16px}
.parts b{font-size:22px;font-variant-numeric:tabular-nums}
table.plan{border-collapse:collapse;font-size:16px}
table.plan td{padding:4px 18px 4px 0;border-bottom:1px solid var(--line)}
table.plan td:first-child{white-space:nowrap}
ol.list{margin:4px 0 0;padding-left:1.4em;font-size:16px}
.mbtn{font:inherit;text-align:left;padding:20px 22px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:8px}
.mbtn:hover{border-color:var(--accent)}
.mbtn .t{font-family:var(--f-head);font-size:24px;font-weight:900;color:var(--accent)}
.mbtn .d{font-size:16px;line-height:1.6}
.mbtn .s{font-size:14px;color:var(--sub)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.nobox label{font-size:15px;color:var(--sub)}
.nobox input{font:inherit;font-size:28px;width:160px;padding:8px 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);letter-spacing:.15em;font-variant-numeric:tabular-nums}
.warn{color:var(--ng);font-size:15px;font-weight:700}
.jump{display:flex;gap:6px;flex-wrap:wrap}
.jump .opt{min-height:0;padding:4px 12px;font-size:15px}
.sent{font-family:var(--f-head);font-size:30px;font-weight:900;color:var(--ok)}
.rv{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:4px;font-size:15px}
.rv .h{display:flex;gap:10px;align-items:baseline;font-weight:700}
.rv .mark{flex:none;width:28px;font-size:18px}
.rv .mark.o{color:var(--ok)} .rv .mark.x{color:var(--ng)}
.rv .e{color:var(--sub)}
.hbtn{font:inherit;font-size:14px;font-weight:700;padding:4px 12px;border-radius:8px;border:2px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.menu.three{grid-template-columns:repeat(3,1fr)}
/* 小テスト第2回：ストーリー・並べ替え・組み合わせ・穴うめ・計算・シミュレーション */
.chip.sc{font-size:12px;padding:2px 8px}
.tag.k{background:var(--accent-soft);color:var(--accent)}
.q2{font-size:18px;font-weight:700;line-height:1.55;white-space:pre-line;text-wrap:pretty}
.ordl{display:flex;flex-direction:column;gap:6px}
.ordl .opt{min-height:0;padding:8px 12px;font-size:16px;align-items:center}
.badge{flex:none;width:30px;height:30px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-weight:900;color:var(--sub)}
.opt.pick .badge{border:none;background:var(--accent);color:var(--card)}
.mt{display:flex;flex-direction:column;gap:5px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:16px;border-bottom:1px solid var(--line);padding-bottom:5px}
.seg{display:flex;gap:4px}
.seg .opt{min-height:0;padding:5px 10px;font-size:15px;justify-content:center;white-space:nowrap}
.fl{display:flex;flex-direction:column;gap:8px;font-size:17px;line-height:2}
.blank{font:inherit;font-size:16px;font-weight:700;min-width:120px;padding:2px 10px;margin:0 2px;border-radius:8px;border:2px dashed var(--sub);background:var(--card);color:var(--ink);cursor:pointer}
.blank.fill{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.blank.act{outline:3px solid var(--accent);outline-offset:1px}
.words{display:flex;gap:6px;flex-wrap:wrap}
.words .opt{min-height:0;padding:6px 14px;font-size:16px}
.numin{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}
.numin input{font:inherit;font-size:28px;width:200px;padding:6px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.rule{background:#f6f8fb;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:15px;line-height:1.6}
.spots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.spot{font:inherit;text-align:left;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:6px;font-size:14px}
.spot.pick{border-color:var(--accent);background:var(--accent-soft)}
.spot .nm2{font-weight:900;font-size:16px}
.leg{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.wall{display:inline-block;width:12px;height:22px;border-radius:2px}
.wall.wd{background:#b9824b}.wall.cn{background:#8a9099}
.dev{font-size:12px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--line)}
.mail{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;background:#fbfcfe}
.mail .opt{min-height:0;padding:6px 10px;font-size:15px;border-style:dashed}
.mail .opt.pick{border-style:solid}
.mail .btnlike{color:var(--accent);font-weight:700}
.lock{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.digits{display:flex;gap:3px;flex-wrap:wrap;max-width:560px}
.digits span{width:24px;height:34px;border-radius:5px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700}
.stp{font:inherit;font-size:26px;font-weight:900;width:56px;height:56px;border-radius:12px;border:2px solid var(--accent);background:var(--card);color:var(--accent);cursor:pointer}
.big{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
.chain{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.blk{font:inherit;text-align:left;padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:13px;display:flex;flex-direction:column;gap:2px}
.blk b{font-size:16px}
.blk.bad{background:var(--ng-soft)}
.blk.pick{border-color:var(--accent);outline:3px solid var(--accent-soft)}
.blk .hx{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--sub)}
.blk .rb{font-size:12px;font-weight:700;color:var(--accent);min-height:1.2em}
.rv .pt{padding-left:38px}
.rv .pt .o{color:var(--ok);font-weight:700} .rv .pt .x{color:var(--ng);font-weight:700}
/* 電卓とヒント */
.cq{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
.cl{display:flex;flex-direction:column;gap:12px}
.hbox{background:#fff6dc;border:1px solid #e9c46a;border-radius:10px;padding:8px 14px;font-size:15px;line-height:1.6}
.calc{border:1px solid var(--line);border-radius:12px;background:#f6f8fb;padding:10px;display:flex;flex-direction:column;gap:6px}
.ctitle{font-size:12px;font-weight:700;color:var(--sub)}
.cdisp{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 10px;text-align:right;min-height:58px}
.cex{font-size:12px;color:var(--sub);min-height:1.3em;overflow-wrap:anywhere}
.cmain{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.2}
.cnums{display:flex;gap:4px;flex-wrap:wrap}
.ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.ck{font:inherit;font-size:18px;font-weight:700;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.ck.op{color:var(--accent)} .ck.eq{background:var(--accent);color:var(--card);border-color:var(--accent)}
.ck.cn{height:auto;padding:4px 8px;font-size:14px;border:2px solid var(--accent);color:var(--accent)}
.ctape{font-size:12px;color:var(--sub);min-height:1em}
@media (max-width:760px){.cq{grid-template-columns:1fr}}
@media (max-width:760px){.menu{grid-template-columns:1fr}.menu.three{grid-template-columns:1fr}.spots,.chain{grid-template-columns:1fr 1fr}.opts{grid-template-columns:1fr}.bar{grid-template-columns:120px 1fr 54px}.card{padding:18px}}
@media (prefers-reduced-motion:no-preference){.fill,.prog div{transition:width .5s ease}}
</style>

</head>
<body>
<div class="app">
  <header>
    <h1 id="ttl">ふりかえり演習</h1>
    <div class="chips" id="chips"></div>
    <div class="count" id="count"></div>
    <button class="hbtn" id="menuBtn" hidden>メニュー</button>
  </header>
  <div class="prog"><div id="bar" style="width:0"></div></div>
  <section class="card" id="card"></section>
</div>

<script>
const CH={A:'メッセージが届くまで',B:'速い・遅いの正体',C:'電波はどこまで届くか',D:'パスワードは何秒で破られる？',E:'残高はどこにある？',F:'サトシ・ナカモト事件ファイル'};
const PART={term:'第1部　用語',one:'第2部　選択',multi:'第2部　選択',w:'第3部　記述'};
// t:'term' 入力 / 'one' 1つ選ぶ / 'multi' すべて選ぶ / 'w' 記述
const Q=[
// ===== 第1部 用語 =====
{t:'term',s:'A',q:'パケットの先頭に付く「送り状」。宛先・送信元・番号・ポート番号などが書かれている。',a:['ヘッダ','ヘッダー']},
{t:'term',s:'A',q:'名前（talk.example.com など）から、数字の住所（IPアドレス）を調べるしくみ。',a:['DNS']},
{t:'term',s:'A',q:'同じ住所の中で、どのアプリ宛てかを示す「部屋番号」。',a:['ポート番号','ポート']},
{t:'term',s:'A',q:'ルーターを1台通るごとに1ずつ減り、0になるとパケットが捨てられる数。',a:['TTL']},
{t:'term',s:'A',q:'受け取った側が返す「届いた」という返事。',a:['ACK','アック']},
{t:'term',s:'A',q:'家の中の住所（192.168.〜）を、外向きの住所に書き換えるしくみ。ルーターが行う。',a:['NAT','ナット']},
{t:'term',s:'B',q:'動画の再生の前に、数秒ぶんを先に受け取って貯めておくこと。空になると「ぐるぐる」が出る。',a:['バッファ','バッファー']},
{t:'term',s:'B',q:'相手に小さなデータを送り、返ってくるまでの時間を測ること。単位は ms。',a:['ping','ピング','ピン']},
{t:'term',s:'B',q:'通信の経路の中で、いちばん細いところ。全体の速さはここで決まる。',a:['ボトルネック']},
{t:'term',s:'B',q:'一度受け取ったデータをスマホに保存して、次は受け取り直さなくて済むようにするしくみ。',a:['キャッシュ']},
{t:'term',s:'B',q:'動画の、1秒あたりのコマ数を表す単位（アルファベット3文字）。',a:['fps']},
{t:'term',s:'C',q:'電波が進むうちに弱くなること。距離・壁・床・水などで起きる。（漢字2文字）',a:['減衰','げんすい']},
{t:'term',s:'C',q:'同じ周波数の電波がぶつかって、通信が乱れること。（漢字2文字）',a:['干渉','かんしょう']},
{t:'term',s:'C',q:'ルーターの電波を受け取り、別の場所から出し直す機械。',a:['中継器','ちゅうけいき','中継機']},
{t:'term',s:'C',q:'1秒に波が何回ふれるかを表すもの。単位は Hz。（漢字3文字）',a:['周波数','しゅうはすう']},
{t:'term',s:'D',q:'よく使われるパスワードや単語の一覧から、先にためしていく攻撃。',a:['辞書攻撃','じしょこうげき']},
{t:'term',s:'D',q:'サイトがパスワードをそのまま保存せず、元に戻せない記号に変換したもの。',a:['ハッシュ']},
{t:'term',s:'D',q:'「知っている」と「持っている」など、種類のちがう2つで本人を確かめること。',a:['二要素認証','2要素認証','にようそにんしょう']},
{t:'term',s:'D',q:'本物そっくりの偽サイトで、パスワードなどを入力させて盗むこと。',a:['フィッシング']},
{t:'term',s:'E',q:'残高が、カードやスマホのICチップに記録されるタイプの電子マネー。',a:['ICカード型','ICカードがた','IC型']},
{t:'term',s:'E',q:'クレジットカードで払うとき、「この番号で使っていい？」とカード発行会社に問い合わせること。',a:['オーソリ','オーソリゼーション']},
{t:'term',s:'E',q:'ICカードと改札機が、おたがいに「本物か」を確かめあうこと。（漢字4文字）',a:['相互認証','そうごにんしょう']},
{t:'term',s:'E',q:'コイルのまわりの磁界が変わると、コイルに電気が生まれる現象。（漢字4文字）',a:['電磁誘導','でんじゆうどう']},
{t:'term',s:'E',q:'真ん中の1台のコンピュータが、まとめて計算する形。（漢字4文字）',a:['集中処理','しゅうちゅうしょり']},
{t:'term',s:'E',q:'残高が、カードの中ではなく会社のコンピュータに記録されるタイプの電子マネー。コード決済など。スマホの画面は見せているだけ。',a:['サーバ型','サーバー型','サーバがた']},
{t:'term',s:'E',q:'カード会社のコンピュータが、いつもとちがう使い方（場所・時間・金額）を見つけて、承認しない・止めるしくみ。（漢字4文字）',a:['不正検知','ふせいけんち']},
{t:'term',s:'F',q:'取り引きの記録をまとめた箱（ブロック）を、前の箱の指紋（ハッシュ値）でつないで、鎖のようにしたもの。',a:['ブロックチェーン']},
{t:'term',s:'F',q:'条件に合う指紋が出るまで計算をくり返し、新しいブロックを完成させること。一番先にできた人は報酬をもらえる。',a:['マイニング']},
{t:'term',s:'F',q:'マイニングで、記録は変えずに変え続ける数字。頭に「0」が並ぶ指紋になる数字を探す。',a:['ナンス']},
{t:'term',s:'F',q:'電子のお金のデータをコピーして、同じお金を2回使ってしまうこと。',a:['二重払い','にじゅうばらい','二重支払い']},
{t:'term',s:'F',q:'ビットコインを送るときに使う、自分だけのハンコ。なくすと、取り戻してくれる人がいない。',a:['秘密鍵','ひみつかぎ']},

// ===== 第2部 選択：A =====

];

const EXTRA=['パケット','ルーター','UDP','波長','速度制限','パスキー','ブロック','プリペイド'];
const BANK=[...Q.filter(q=>q.t==='term').map(q=>q.a[0]),...EXTRA].sort((a,b)=>a.localeCompare(b,'ja'));
const LET='アイウエオカ';
let st={i:-1,ans:{},tin:{},self:{},text:{},shown:{},ord:{},pick:{}};
const KEY='fukushu-v5';
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)st=Object.assign(st,s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).normalize('NFKC').toLowerCase().replace(/[\s・\-ー－―‐。、.,]/g,'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const isTermOK=(q,v)=>q.a.some(x=>norm(x)===norm(v));
const sameSet=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
function correct(i){const q=Q[i];
  if(q.t==='term')return st.tin[i]!=null&&isTermOK(q,st.tin[i]);
  if(q.t==='one')return st.ans[i]===q.a;
  if(q.t==='multi')return Array.isArray(st.ans[i])&&sameSet(st.ans[i],q.a);
  return false}
function answered(i){const q=Q[i];return q.t==='w'?st.self[i]!=null:q.t==='term'?st.tin[i]!=null:st.ans[i]!=null}
function order(i){const q=Q[i];if(!st.ord[i]){const a=q.o.map((_,k)=>k);for(let n=a.length-1;n>0;n--){const r=Math.floor(Math.random()*(n+1));[a[n],a[r]]=[a[r],a[n]]}st.ord[i]=a;save()}return st.ord[i]}
const partOf=q=>q.t==='term'?1:q.t==='w'?3:2;

function chrome(){
  const parts=[1,2,3].map(p=>{const idx=Q.map((q,i)=>i).filter(i=>partOf(Q[i])===p);
    const cur=st.i>=0&&st.i<Q.length&&partOf(Q[st.i])===p;const done=idx.every(answered);
    return `<span class="chip ${cur?'now':done?'done':''}">${['','第1部 用語','第2部 選択','第3部 記述'][p]}（${idx.length}）</span>`});
  $('chips').innerHTML=parts.join('');
  $('count').textContent=st.i>=0&&st.i<Q.length?`${st.i+1} / ${Q.length}`:'';
  $('bar').style.width=(Q.filter((q,i)=>answered(i)).length/Q.length*100)+'%';
}
function head(q){return `<div class="sec"><span class="lbl">${PART[q.t]}</span><span class="nm">${esc(CH[q.s])}</span>${q.t==='multi'?'<span class="tag">すべて選ぶ</span>':''}</div>`}
function nav(canNext){return `<div class="row"><button class="btn ghost" id="back" ${st.i===0?'disabled':''}>もどる</button><button class="btn" id="next" ${canNext?'':'disabled'}>次へ</button></div>`}
function bindNav(){$('back').onclick=()=>{st.i--;save();render()};const n=$('next');if(n)n.onclick=()=>{st.i++;save();render()}}

function render(){
  $('menuBtn').hidden=mode==='menu';
  if(mode==='menu')return menu();
  if(mode==='test')return tRender();
  if(mode==='test2')return uRender();
  $('ttl').textContent='ふりかえり演習';
  chrome();
  if(st.i<0)return start();
  if(st.i>=Q.length)return result();
  const q=Q[st.i];
  if(q.t==='term')return term(q);
  if(q.t==='w')return written(q);
  return choice(q);
}
function term(q){
  const i=st.i,done=st.tin[i]!=null,ok=done&&isTermOK(q,st.tin[i]);
  const cls=w=>!done?'':w===q.a[0]?'right':w===st.tin[i]?'wrong':'';
  $('card').innerHTML=head(q)+`<div class="q">${esc(q.q)}</div>
   <div class="hint">これを何といいますか。下の一覧から選びなさい。</div>
   ${done?`<div class="fb ${ok?'ok':'ng'}"><strong>${ok?'正解です。':'正解は「'+esc(q.a[0])+'」です。'}</strong></div>`:''}
   <div class="bank">${BANK.map(w=>`<button class="opt ${cls(w)}" data-w="${esc(w)}" ${done?'disabled':''}>${esc(w)}</button>`).join('')}</div>
   <div class="row"><button class="btn ghost" id="back" ${i===0?'disabled':''}>もどる</button><button class="btn" id="next" ${done?'':'disabled'}>次へ</button></div>`;
  if(!done)document.querySelectorAll('.bank .opt').forEach(b=>b.onclick=()=>{st.tin[i]=b.dataset.w;save();render()});
  bindNav();
}
function choice(q){
  const i=st.i,ord=order(i),multi=q.t==='multi',done=st.ans[i]!=null;
  const long=q.o.some(o=>o.length>22);
  const pick=multi?(done?st.ans[i]:(st.pick[i]||[])):null;
  const cls=k=>{
    if(!done)return multi&&pick.includes(k)?'pick':'';
    if(multi){const sel=pick.includes(k),r=q.a.includes(k);return sel&&r?'right':sel?'wrong':r?'miss':''}
    return k===q.a?'right':k===st.ans[i]?'wrong':''};
  const ok=done&&correct(i);
  const ansText=multi?q.a.map(k=>LET[ord.indexOf(k)]).sort().join('・'):LET[ord.indexOf(q.a)];
  $('card').innerHTML=head(q)+`<div class="q">${esc(q.q)}</div>
   <div class="opts ${long?'long':''}">${ord.map((k,pos)=>`<button class="opt ${cls(k)}" data-k="${k}" ${done?'disabled':''}>${multi?`<span class="box">${pick.includes(k)?'✓':''}</span>`:''}<span class="mk">${LET[pos]}</span><span>${esc(q.o[k])}</span></button>`).join('')}</div>
   ${done?`<div class="fb ${ok?'ok':'ng'}"><strong>${ok?'正解です。':'正解は「'+ansText+'」です。'}</strong>${esc(q.e)}</div>`:''}
   <div class="row"><button class="btn ghost" id="back" ${i===0?'disabled':''}>もどる</button>${done?'<button class="btn" id="next">次へ</button>':multi?`<button class="btn" id="go" ${pick.length?'':'disabled'}>答える</button>`:''}</div>`;
  if(!done)document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;
    if(multi){const p=st.pick[i]||[];st.pick[i]=p.includes(k)?p.filter(x=>x!==k):[...p,k];save();render()}
    else{st.ans[i]=k;save();render()}});
  if($('go'))$('go').onclick=()=>{st.ans[i]=[...(st.pick[i]||[])];save();render()};
  bindNav();
}
function written(q){
  const i=st.i,shown=st.shown[i],done=st.self[i]!=null;
  $('card').innerHTML=head(q)+`<div class="q">${esc(q.q)}</div>

const shuffle=a=>{a=a.slice();for(let n=a.length-1;n>0;n--){const r=Math.floor(Math.random()*(n+1));[a[n],a[r]]=[a[r],a[n]]}return a};
function tMake(){ // 章ごとにくじで選び、章の順に並べる（記述は入れない）
  return Object.keys(TPLAN).flatMap(s=>shuffle(Q.map((q,i)=>i).filter(i=>Q[i].s===s&&Q[i].t!=='w')).slice(0,TPLAN[s]).sort((a,b)=>a-b))}

  if(q.t==='term')return v!=null&&isTermOK(q,v);
  if(q.t==='one')return v===q.a;
  return Array.isArray(v)&&sameSet(v,q.a)}
function tOrd(k){const q=Q[ts.set[k]];if(!ts.ord[k]){ts.ord[k]=shuffle(q.o.map((_,j)=>j));tSave()}return ts.ord[k]}

    if(p.view==='mail')return `<div class="mail">${p.items.map((t,j)=>`<button class="opt ${cur.includes(j)?'pick':''} ${j===5?'btnlike':''}" data-j="${j}"><span class="box">${cur.includes(j)?'✓':''}</span><span>${esc(t)}</span></button>`).join('')}</div>`;
    const hx=['0004c1','0009ae','000f3b','0002d8','0007a5','00016e'];
    return `<div class="chain">${p.items.map((t,j)=>`<button class="blk ${j===2?'bad':''} ${cur.includes(j)?'pick':''}" data-j="${j}"><b>${esc(t)}</b><span class="hx">前の指紋 ${j?hx[j-1]+'…':'（なし）'}</span><span class="hx">指紋 ${j===2?'7c19e2':hx[j]}…</span>${j===2?'<span style="font-size:12px;color:var(--ng);font-weight:700">取り引きを書きかえた → 指紋が変わった</span>':''}<span class="rb">${cur.includes(j)?'✓ 作り直す':''}</span></button>`).join('')}</div>
     <div class="hint">指紋は頭の6文字だけ書いています。このチェーンのきまりは「指紋の頭に0が3つ並ぶこと」です。</div>`}
  if(p.t==='step'){const n=v??p.start;
    return `<div class="lock"><button class="stp" id="sm">－</button><div><div class="big">${n} けた</div><div class="hint">${v==null?'まだ決めていません（＋か－を押して決めます）':'このけた数で答えます'}</div></div><button class="stp" id="sp">＋</button></div>
     <div class="digits">${'<span>●</span>'.repeat(n)}</div>`}
}
function uQuestion(){
  const k=us.i,p=U[k];
  const top=`<div class="sec"><span class="lbl">第${k+1}問</span><span class="nm">${esc(p.sc)}</span><span class="tag k">${kindOf(p)}</span>${p.t==='tap'?'<span class="tag">すべて選ぶ</span>':''}<span class="hint">${esc(CH[p.s])}</span></div>
   <div class="q2">${esc(p.q)}</div>${uBody(k)}`;
  const calc=p.nums!=null;
  $('card').innerHTML=uDemo()+(calc?`<div class="cq"><div class="cl">${top}${uHint(k)}</div><div class="calc" id="calc"></div></div>`:top)+`
   <div class="row"><button class="btn ghost" id="back" ${k===0?'disabled':''}>もどる</button><button class="btn" id="next">${k===U.length-1?'見直して提出へ':'次へ'}</button></div>`;
  const v=us.ans[k];
  if(p.t==='order')document.querySelectorAll('.ordl .opt').forEach(b=>b.onclick=()=>{const n=+b.dataset.n,a=Array.isArray(v)?v:[];uSet(k,a.includes(n)?a.filter(x=>x!==n):[...a,n])});
  if(p.t==='match')document.querySelectorAll('.seg .opt').forEach(b=>b.onclick=()=>{uSet(k,Object.assign({},v||{},{[b.dataset.r]:+b.dataset.j}))});
  if(p.t==='fill'){
    document.querySelectorAll('.blank').forEach(b=>b.onclick=()=>{us.act=+b.dataset.b;render()});
    document.querySelectorAll('.words .opt').forEach(b=>b.onclick=()=>{const a=Object.assign({},v||{},{[us.act]:b.dataset.w});
      const nx=p.a.map((_,n)=>n).find(n=>n>us.act&&a[n]==null)??p.a.map((_,n)=>n).find(n=>a[n]==null);if(nx!=null)us.act=nx;uSet(k,a)});
  }
  if(p.t==='num'){const ni=$('ni');ni.oninput=()=>{us.ans[k]=ni.value;uSave();uChrome()};ni.onkeydown=e=>{if(e.key==='Enter')$('next').click()}}
  if(p.t==='spot')document.querySelectorAll('.spot').forEach(b=>b.onclick=()=>uSet(k,+b.dataset.j));
  if(p.t==='tap')document.querySelectorAll('.mail .opt,.blk').forEach(b=>b.onclick=()=>{const j=+b.dataset.j,a=Array.isArray(v)?v:[];uSet(k,a.includes(j)?a.filter(x=>x!==j):[...a,j])});
  if(p.t==='step'){const n=v??p.start;$('sm').onclick=()=>uSet(k,Math.max(p.min,n-1));$('sp').onclick=()=>uSet(k,Math.min(p.max,n+1))}
  if(calc){calRender();bindHint(k)}
  const go=d=>{us.i+=d;us.act=0;uSave();render()};
  $('back').onclick=()=>go(-1);$('next').onclick=()=>go(1);uDemoBind();
}

// ===== 計算問題の電卓とヒント =====
// 問題に出てくる数をボタンで入れられる。式は × ÷ を先に計算する（ふつうの電卓と同じ）。eval は使わない
function uHint(k){const p=U[k];if(!p.hint)return '';
  return us.hint[k]?`<div class="hbox"><b>ヒント</b>　${esc(p.hint)}</div>`:`<div><button class="hbtn" id="hintBtn">ヒントを見る</button></div>`}
function bindHint(k){const b=$('hintBtn');if(b)b.onclick=()=>{us.hint[k]=1;uSave();b.parentNode.outerHTML=`<div class="hbox"><b>ヒント</b>　${esc(U[k].hint)}</div>`}}
let cal={k:-1,ex:'',res:null,tape:[]};
function calcEval(ex){ // 数・＋－×÷・かっこ
  const t=ex.match(/\d+(?:\.\d+)?|[+\-×÷()]/g)||[];if(t.join('')!==ex)throw 0;let i=0;
  const num=()=>{const x=t[i++];if(x==='('){const v=sum();if(t[i++]!==')')throw 0;return v}if(x==='-')return -num();if(x==null||!/^\d/.test(x))throw 0;return Number(x)};
  const mul=()=>{let v=num();while(t[i]==='×'||t[i]==='÷'){const o=t[i++],w=num();if(o==='÷'&&w===0)throw 0;v=o==='×'?v*w:v/w}return v};
  const sum=()=>{let v=mul();while(t[i]==='+'||t[i]==='-'){const o=t[i++],w=mul();v=o==='+'?v+w:v-w}return v};
  if(!t.length)throw 0;const v=sum();if(i!==t.length||!isFinite(v))throw 0;return Number(v.toPrecision(12))}
const calcFmt=v=>v.toLocaleString('ja-JP',{maximumFractionDigits:10});
const calcShow=ex=>ex.replace(/\d+(?:\.\d+)?/g,m=>{const [a,b]=m.split('.');return Number(a).toLocaleString('ja-JP')+(b!=null?'.'+b:'')}).replace(/-/g,'−');
function calKey(key){
  const op='+-×÷';
  if(key==='C'){cal.ex='';cal.res=null;return}
  if(key==='←'){cal.ex=cal.ex.slice(0,-1);cal.res=null;return}
  if(key==='='){if(!cal.ex)return;try{const v=calcEval(cal.ex);cal.tape=[`${calcShow(cal.ex)} ＝ ${calcFmt(v)}`,...cal.tape].slice(0,3);cal.res=v;cal.ex=''}catch(e){cal.res='エラー';cal.ex=''}return}
  if(typeof cal.res==='number'&&!cal.ex&&op.includes(key))cal.ex=String(cal.res); // 答えの続きに計算を足せる
  cal.res=null;
  if(op.includes(key)&&op.includes(cal.ex.slice(-1))&&key!=='-')cal.ex=cal.ex.slice(0,-1);
  cal.ex+=key;
}
function calRender(){
  const k=us.i,p=U[k],box=$('calc');if(!box)return;
  if(cal.k!==k)cal={k,ex:'',res:null,tape:[]};
  const main=cal.res!=null?(cal.res==='エラー'?'エラー':calcFmt(cal.res)):cal.ex?calcShow(cal.ex):'0';
  const keys=['C','←','(',')','7','8','9','÷','4','5','6','×','1','2','3','-','0','.','=','+'];
  box.innerHTML=`<div class="ctitle">電卓（問題の数はボタンで入れられます）</div>
   <div class="cnums">${p.nums.map((n,j)=>`<button class="ck cn" data-n="${j}">${esc(n[0])}</button>`).join('')}</div>
   <div class="cdisp"><div class="cex">${esc(cal.tape[0]||'')}</div><div class="cmain" id="cmain">${esc(main)}</div></div>
   <div class="ckeys">${keys.map(x=>`<button class="ck ${'+-×÷'.includes(x)?'op':''} ${x==='='?'eq':''}" data-k="${x}">${x==='-'?'−':x}</button>`).join('')}</div>
   ${p.t==='num'?`<button class="hbtn" id="toAns" ${typeof cal.res==='number'?'':'disabled'}>この数を答えの欄に入れる</button>`:''}
   <div class="ctape">${cal.tape.slice(1).map(esc).join('<br>')}</div>`;
  box.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{calKey(b.dataset.k);calRender()});
  box.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const v=String(p.nums[+b.dataset.n][1]);
    if(cal.res!=null){cal.ex='';cal.res=null}if(/[\d.)]$/.test(cal.ex))cal.ex+='×';cal.ex+=v;calRender()});
  const ta=$('toAns');if(ta)ta.onclick=()=>{const ni=$('ni');ni.value=String(cal.res);us.ans[k]=ni.value;uSave();uChrome()};
}
function uConfirm(){
  const left=U.map((_,k)=>k).filter(k=>!uAnswered(k));
  $('card').innerHTML=uDemo()+`<div class="q">提出の前に確かめます</div>
   <table class="plan"><tr><td>出席番号</td><td style="font-size:22px;font-weight:700;letter-spacing:.1em">${esc(us.no)}</td></tr>
   <tr><td>答えた問題</td><td>${U.length-left.length} / ${U.length} 問</td></tr></table>
   ${left.length?`<div>まだ答えていない・とちゅうの問題（押すとその問題へ）</div><div class="jump">${left.map(k=>`<button class="opt" data-k="${k}">第${k+1}問${uStarted(k)?'（とちゅう）':''}</button>`).join('')}</div>`:'<div>全部の問題に答えました。</div>'}
   ${us.warn?`<div class="warn">まだ答えていない問題が${left.length}問あります。このまま提出するときは、もう一度「提出する」を押します。</div>`:''}
   <div class="hint">提出は1回だけです。提出したあとは、答えを変えられません。</div>
   <div class="row"><button class="btn ghost" id="back">問題にもどる</button><button class="btn ghost" id="chg">出席番号を直す</button><button class="btn" id="send">提出する</button></div>`;
  document.querySelectorAll('.jump .opt').forEach(b=>b.onclick=()=>{us.i=+b.dataset.k;us.act=0;us.warn=false;uSave();render()});
  $('back').onclick=()=>{us.i=U.length-1;us.warn=false;uSave();render()};
  $('chg').onclick=()=>{us.i=-1;us.warn=false;uSave();render()};
  $('send').onclick=()=>{if(left.length&&!us.warn){us.warn=true;render();return}
    us.warn=false;us.sending=true;render();
    // ダミーの提出：どこにも送らず、送信しているような表示のあと「提出しました」にする
    setTimeout(()=>{us.sending=false;const d=new Date();us.sent=`${d.getMonth()+1}月${d.getDate()}日 ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;uSave();render()},1500)};
  uDemoBind();
}
function uSending(){$('card').innerHTML=`<div class="q">送信しています…</div><div class="prog"><div style="width:70%"></div></div><div class="hint">画面を閉じずに待ちます。</div>`}
// 答え合わせ：部分ごとに、あなたの答えと正解を並べる
function uReview(k){
  const p=U[k],v=us.ans[k],pt=uParts(k),mk=b=>`<span class="${b?'o':'x'}">${b?'○':'×'}</span>`;
  const none='未回答';
  if(p.t==='order'){const cur=Array.isArray(v)?v:[];
    return `<div class="pt">正しい順：${p.items.map((t,n)=>`${n+1}. ${esc(t)}`).join('<br>')}</div><div class="pt">あなたの順：${cur.length?cur.map(n=>esc(p.items[n].slice(0,14))+'…').join(' → '):none}</div>`}
  if(p.t==='match')return p.rows.map((r,n)=>`<div class="pt">${mk(pt[n])} ${esc(r[0])}：あなた ${v&&v[n]!=null?esc(p.cats[v[n]]):none} ／ 正解 ${esc(p.cats[r[1]])}</div>`).join('');
  if(p.t==='fill')return p.a.map((w,n)=>`<div class="pt">${mk(pt[n])} ${'①②③④⑤⑥'[n]}：あなた ${v&&v[n]!=null?esc(v[n]):none} ／ 正解 ${esc(w)}</div>`).join('');
  if(p.t==='num')return `<div class="pt">あなた ${uAnswered(k)?esc(String(v).trim())+esc(p.unit):none} ／ 正解 ${p.a}${esc(p.unit)}</div>`;
  if(p.t==='spot')return `<div class="pt">あなた ${v!=null?esc(p.spots[v][0]+' '+p.spots[v][1]):none} ／ 正解 ${esc(p.spots[p.a][0]+' '+p.spots[p.a][1])}</div>`;
  if(p.t==='tap'){const lab=j=>p.view==='mail'?esc(p.items[j].slice(0,12))+'…':esc(p.items[j]);
    return `<div class="pt">正解：${p.a.map(lab).join('　')}</div><div class="pt">あなた：${Array.isArray(v)&&v.length?v.slice().sort((a,b)=>a-b).map(lab).join('　'):none}</div>`}
  return `<div class="pt">あなた ${v!=null?v+'けた':none} ／ 正解 ${p.a}けた</div>`;
}
function uDone(){
  const ok=U.filter((_,k)=>uCorrect(k)).length;
  $('card').innerHTML=uDemo()+`<div class="sent">提出しました</div>
   <div>出席番号 <b>${esc(us.no)}</b>　受付 ${esc(us.sent)}</div>
   <div><span class="res-total">${ok}</span><span style="font-size:20px"> / ${U.length} 問 正解</span></div>
   <div class="bars">${SCN.map(s=>{const a=U.map((_,k)=>k).filter(k=>U[k].s===s);const r=a.filter(uCorrect).length;
     return `<div class="bar"><span>${esc(CH[s])}</span><div class="track"><div class="fill" style="width:${r/a.length*100}%"></div></div><span class="num">${r}/${a.length}</span></div>`}).join('')}</div>
   <div class="row"><button class="btn" id="tomenu">メニューへ</button></div>
   <div class="q" style="font-size:18px">答え合わせ</div>
   ${U.map((p,k)=>{const c=uCorrect(k);return `<div class="rv"><div class="h"><span class="mark ${c?'o':'x'}">${c?'○':'×'}</span><span>第${k+1}問（${esc(kindOf(p))}）　${esc(p.q.split('\n')[0])}</span></div>
     ${uReview(k)}${us.hint&&us.hint[k]?'<div class="pt hint">（ヒントを見た）</div>':''}<div class="e pt">${esc(p.e)}</div></div>`}).join('')}`;
  $('tomenu').onclick=()=>setMode('menu');uDemoBind();
}
render();
</script>
