<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0;font-size:14px}img{max-width:100%}</style>
<title>電子計測制御 後期中間考査 出題範囲</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
/* layout: 問題カード1枚を画面いっぱいに（ふりかえり演習と同じ形）。4:3 横画面に収め、右に用語欄 */
:root{
  --bg:#eef2f6; --card:#ffffff; --ink:#1c2836; --sub:#5b6876; --line:#d5dde6;
  --accent:#2a5fc4; --accent-soft:#e3ebfa; --ok:#1d7f55; --ok-soft:#e1f3ea; --ng:#b8402b; --ng-soft:#fbe7e2; --panel:#f3f6f9;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-head:"Zen Maru Gothic","BIZ UDPGothic","Hiragino Sans",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;box-sizing:border-box}
*{box-sizing:border-box}
.app{max-width:1040px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:8px}
header{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
h1{font-family:var(--f-head);font-size:20px;margin:0;font-weight:900}
.chips{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.chip{font-size:13px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--sub);background:var(--card);font-variant-numeric:tabular-nums}
.chip.now{border-color:var(--accent);color:var(--accent);font-weight:700}
.chip.done{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.count{font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}
.ver{font-size:12px;color:var(--sub)}
.prog{height:6px;flex:none;border-radius:3px;background:var(--line);overflow:hidden}
.prog div{height:100%;background:var(--accent)}
.card{flex:1;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 22px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.qwrap{flex:1;min-height:0;display:flex;gap:18px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.gloss{width:220px;flex:none;background:var(--panel);border-radius:10px;padding:12px 14px;font-size:15px;align-self:flex-start;min-height:180px}
.gloss h2{margin:0 0 8px;font-size:13px;letter-spacing:.12em;color:var(--sub);font-weight:700}
.gloss dt{font-weight:700;color:var(--accent);margin-bottom:2px}
.gloss dd{margin:0}
.gloss .wait{color:var(--sub);font-size:14px;margin:0}
.sec{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec .lbl{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.06em}
.sec .nm{font-family:var(--f-head);font-size:15px;font-weight:700;color:var(--sub)}
.sec .lv{font-size:13px;color:var(--sub);letter-spacing:.08em}
.q{font-size:20px;font-weight:700;line-height:1.5;text-wrap:pretty}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.opts.long{grid-template-columns:1fr}
.opt{font:inherit;font-size:16px;line-height:1.4;text-align:left;padding:8px 13px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:44px;display:flex;gap:10px;align-items:center}
.opt .mk{flex:none;font-weight:700;color:var(--sub)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{border-radius:10px;padding:8px 13px;font-size:15px}
.fb.ok{background:var(--ok-soft)} .fb.ng{background:var(--ng-soft)}
.fb strong{display:block}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:auto;flex-wrap:wrap;position:sticky;bottom:0;background:var(--card);padding-top:4px}
.row .left{margin-right:auto}
.btn{font:inherit;font-weight:700;font-size:16px;padding:9px 20px;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:var(--card);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.hint{font-size:14px;color:var(--sub)}
.res-total{font-family:var(--f-head);font-size:40px;font-weight:900;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:180px 1fr 64px;gap:10px;align-items:center;font-size:15px}
.track{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--accent)}
.num{font-variant-numeric:tabular-nums;text-align:right}
.parts{display:flex;gap:20px;flex-wrap:wrap;font-size:15px}
.parts b{font-size:19px;font-variant-numeric:tabular-nums}
.miss{display:flex;gap:5px;flex-wrap:wrap}
.miss button{font:inherit;font-size:14px;min-width:42px;min-height:34px;border-radius:8px;border:1.5px solid var(--ng);background:var(--ng-soft);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.start label{font-size:15px;color:var(--sub)}
.start .err{font-size:15px;color:var(--ng);font-weight:700;margin-top:4px}
.start input{font:inherit;font-size:22px;width:130px;padding:6px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
table.plan{border-collapse:collapse;font-size:16px}
table.plan td{padding:4px 18px 4px 0;border-bottom:1px solid var(--line)}
@media (max-width:760px){.qwrap{flex-direction:column}.gloss{width:auto;align-self:stretch;min-height:0}.opts{grid-template-columns:1fr}.bar{grid-template-columns:120px 1fr 54px}.card{padding:14px}}
@media (prefers-reduced-motion:no-preference){.fill,.prog div{transition:width .5s ease}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>電子計測制御 後期中間考査 出題範囲</h1>
    <div class="chips" id="chips"></div>
    <div class="count" id="count"></div>
    <div class="ver" id="ver"></div>
  </header>
  <div class="prog"><div id="bar" style="width:0"></div></div>
  <section class="card" id="card"></section>
</div>

<script>
const VER='2026-11-09d';
// 問題データ。1行1問：[分野, 種類, 難しさ, 用語, 問題文, [正解, 誤り4つ], 解説]
// 分野 A〜E（CH）／種類 m 意味・u 使いどころ・b 大事な場面（KIND）／難しさ 1〜3。
// 正解は必ず先頭に書く。画面に出す順番は positions()・order() が解く人ごとに決める。
// 用語は GLOSS の見出しと同じ文字にする（右の用語欄に出る）。直したら node regression-seigyo100.js 制御クイズ100.html で確かめる。
const CH={A:'自動駐車・自動運転',B:'走る・止まる・曲がる',C:'安全・運転支援',D:'快適・便利',E:'センサと計測'};
const CHS={A:'自動駐車',B:'走る止まる',C:'安全支援',D:'快適便利',E:'センサ'};
const KIND={m:'用語の意味',u:'使いどころ',b:'大事な場面'};
const RAW=[
// ===== A 自動駐車・自動運転 =====
['A','m',1,'自動駐車','「自動駐車」の説明として正しいものはどれですか。',['ハンドルやアクセル、ブレーキを車が動かして駐車する機能','空いている駐車場を探して運転手のスマホに知らせる機能','車のまわりの映像を画面に映して運転手に見せるだけの機能','駐車料金を計算して自動で支払いをすませる機能','駐車したあとにドアのカギと窓を自動で閉める機能'],'操作そのものを車が行うのが自動駐車です。映像を見せるだけなら、操作するのは運転手のままです。'],
['A','m',1,'バック駐車','「バック駐車」とはどのような駐車ですか。',['車をうしろ向きに下げて枠に入れる駐車','車を前向きのまま進めて枠に入れる駐車','道路のわきに車を縦に並べて止める駐車','機械の台に載せて上の階へ運ぶ駐車','運転手が降りてから遠隔で動かす駐車'],'うしろ向きに枠へ入れる駐車で、日本の駐車場で多い形です。授業のシミュレーターもこの形でした。'],
['A','m',2,'切り返し','駐車の「切り返し」とはどのような操作ですか。',['前進と後退を入れかえて、車の向きや位置を直すこと','ハンドルをまっすぐのまま、一定の速さで下がること','シフトを P に入れて、サイドブレーキをかけること','ウインカーを出してから、となりの車線へ移ること','アクセルを強く踏んで、段差を一気に乗りこえること'],'一度で入らないときや、バックを始めるときに、前後の動きを入れかえて向きと位置を直します。'],
['A','m',2,'操作のレベル','「自動運転への階段」のレベルは、何で分けていましたか。',['車が引き受ける操作の種類','走っている道路の広さ','車についたカメラの台数','車体の大きさと重さ','運転手の年齢と経験'],'レベル1 ブレーキ → 2 アクセル → 3 シフト → 4 ハンドル → 5 全部、と任せる操作を増やしました。'],
['A','m',2,'クリープ','オートマチック車の「クリープ」とはどのような動きですか。',['アクセルを踏まなくても、ゆっくり進む動き','ブレーキを踏まなくても、自動で止まる動き','ハンドルを切らなくても、自動で曲がる動き','坂道でブレーキをはなしても、下がらない動き','エンジンを止めても、惰性で走り続ける動き'],'シフトが D や R なら、アクセルを踏まなくても車はゆっくり動きます。駐車ではこの動きをよく使います。'],
['A','m',2,'引き継ぎ','自動運転の「引き継ぎ」とはどのようなことですか。',['運転手が操作をして、車から運転を受け取ること','車が前の車から、走る道のデータを受け取ること','記録した運転のデータを、別の車へ写すこと','エンジンからモーターへ、動かす役を移すこと','運転を終えて、車のカギを次の人へ渡すこと'],'「自動運転への階段」のレベル3以上では、シフトやハンドルにさわると運転手が引き継ぎます。'],
['A','m',1,'ECU','車の「ECU」とは何ですか。',['センサの値を見て、どう動かすか決める車の中のコンピュータ','タイヤの回転を測って、電気の信号に変える車輪についたセンサ','ハンドルを回す力を助けるために取りつけられた小さなモーター','前の車までの距離を電波で測るために車の前についた装置','排気ガスをきれいにしてから外へ出すために通す車の部品'],'「測る → 決める → 動かす」の「決める」を受け持ちます。'],
['A','u',1,'超音波センサ','自動駐車で、超音波センサは主に何に使いますか。',['うしろの壁や横の車までの距離を測る','ハンドルを回す力をモーターで助ける','エンジンに入る空気の量を調べて決める','タイヤの中の空気の圧力を調べて知らせる','運転手の顔を見て眠気がないかを調べる'],'音がはね返ってくるまでの時間で、近くの物までの距離を測ります。バンパーについている丸い部品です。'],
['A','u',1,'ステアリングモーター','自動駐車で、ステアリングモーターは何をしますか。',['車のコンピュータの指令でハンドルを回す','タイヤの回転を測って速さを計算する','バックのときだけ後ろのライトをつける','エンジンを冷やす水を送ってめぐらせる','前の車までの距離を電波で測って伝える'],'ふだんはハンドル操作を軽くするモーターです。自動駐車では、指令を受けてこれがハンドルを動かします。'],
['A','u',2,'カメラ','「自動運転への階段」のレベル3以上で、カメラは何に使いましたか。',['枠の白線を見て、車の位置と向きを測る','路面の温度を測って、雪かどうか調べる','うしろの車との速さの差を電波で測る','タイヤが何回転したかを細かく数える','車内の人数を数えて、重さを計算する'],'カメラで「枠の真ん中から何 m 先か」と車の向きを測り、切り返す位置やハンドルの計算に使いました。'],
['A','u',2,'車輪速センサ','自動駐車で、車輪速センサを使って分かることはどれですか。',['車の速さと、進んだ距離','うしろの壁までの距離','枠の白線の位置と向き','路面が雨か雪かの違い','車内の温度と明るさ'],'タイヤの回転を数えると、速さだけでなく進んだ距離も計算できます。'],
['A','u',2,'雨滴センサ','レベル5で、雨滴センサや外の気温は何のために測ると考えましたか。',['路面に合う数字の行に切り替えるため','枠の真ん中までの距離を計算するため','まわりの車が来る方向を調べるため','ハンドルの角度をセンサで確かめるため','エンジンの回転数を上げ下げするため'],'雨か雪かを車が判断して、晴れ・雨・雪の表から、その路面の行の数字に切り替える設定でした。'],
['A','u',3,'手動運転の記録','手動運転の記録（R に入れた位置の平均）は、自動運転のどこに使いましたか。',['シフトとハンドルで使う「切り返す位置」の数字','歩行者が飛び出してくる時刻を当てる数字','まわりの車の台数をあらかじめ決める数字','10回テストの合格に必要な回数を決める数字','昼と夜で画面の明るさを切りかえる数字'],'人の運転を計測した数字が、車のコンピュータの数字になりました。計測が制御につながる例です。'],
['A','u',2,'測る・決める・動かす','自動駐車の「測る → 決める → 動かす」に合う組み合わせはどれですか。',['超音波センサ → ECU → ステアリングモーター','ステアリングモーター → 超音波センサ → ECU','ECU → ステアリングモーター → 超音波センサ','超音波センサ → ステアリングモーター → ECU','ステアリングモーター → ECU → 超音波センサ'],'センサが測り、コンピュータが決め、アクチュエータが動かす形は、どの制御でも同じです。'],
['A','b',1,'自動ブレーキ','駐車中の自動ブレーキ（レベル1）が特に役に立つ場面はどれですか。',['バック中に、うしろの物に近づいたとき','高速道路を、同じ速さで走っているとき','車を止めて、ライトを消し忘れたとき','信号待ちで、エンジンを止めているとき','燃料が減り、ランプがついているとき'],'センサが決めた距離より近い物を見つけると、車がブレーキをかけます。'],
['A','b',2,'終わりの条件','自動駐車の手順で、「終わりの条件」が大事になるのはどのようなときですか。',['センサの値を見て、次の手順へ進んでよいか決めるとき','駐車が終わったあとに、運転手が車から降りるとき','手順を画面に表示して、運転手に読んでもらうとき','車を買うときに、駐車の機能をつけるか選ぶとき','手順の名前を決めて、説明書に書いておくとき'],'「車の向きが90°変わったら次へ」のように、測った値が次へ進むきっかけになります。'],
['A','b',3,'止まるまでに進む距離','雪道で自動駐車をするとき、特に大事なことはどれですか。',['止まるまでにのびる分を見て、速さを下げるか余裕を大きくする','すべりやすいので、速さを上げて早く駐車を終わらせてしまう','雪は白く明るいので、ライトを消して電気を節約しておく','どの路面でも結果は同じなので、晴れの数字をそのまま使う','雪の日はセンサが不要なので、電源を切って動かしておく'],'すべりやすいと、同じ速さでも止まるまでに進む距離がのびます。晴れ向きの数字のままだと止まりきれません。'],
['A','b',3,'ブレーキの遅れ','「止める距離」に余裕が必要な理由として、正しいものはどれですか。',['センサが気づいても、ブレーキが効いて止まるまでに車は進むから','ブレーキをかけると、車が少しうしろへ戻る動きをするから','超音波は、遠い物ほど速く返ってくる性質を持っているから','距離を測ると、タイヤの空気が少しずつ減ってしまうから','止まる距離が短いと、センサの電気が足りなくなるから'],'気づいてから効き始めるまでの遅れがあり、速いほど止まるまでに長く進みます。'],
['A','b',3,'データ収集','自動運転の数字を決めるとき、昼夜や車の台数がちがう記録を集めることが大事なのはなぜですか。',['同じ条件だけの記録では、ちがう条件で働くか分からないから','記録の数を増やすと、車の燃料の使う量が減っていくから','いろいろな記録があると、センサが要らなくなるから','記録を集めるほど、駐車の枠が広くなっていくから','条件を変えると、運転の点数がいつも高く出るから'],'計測した場面でしか、車の判断は確かめられません。いろいろな条件の記録が、制御の土台になります。'],
['A','b',1,'計測の大切さ','制御で「計測」が大事だと分かるのはどのような場面ですか。',['センサの値がまちがっていると、正しく直しても車が狙いからはずれる','モーターが新しければ、センサの値がまちがっていても正しく動く','プログラムが長ければ、センサがなくてもまわりの様子が必ず分かる','画面がきれいであれば、車が測っている値を気にしなくてもよい','車の色や形がよければ、センサの値がなくても安全に止められる'],'制御は、測った値を信じて動きます。計測がずれると、制御も一緒にずれます。'],

// ===== B 走る・止まる・曲がる =====

'バック駐車':'うしろ向きに枠へ入れる駐車です。日本の駐車場で多い形です。',
'切り返し':'前進と後退を入れかえて、車の向きや位置を直す操作です。',
'操作のレベル':'車が引き受ける操作で分けた段階です。ブレーキ → アクセル → シフト → ハンドル → 全部。',
'クリープ':'アクセルを踏まなくても、オートマチック車がゆっくり進む動きです。',
'引き継ぎ':'自動で動いている途中で、運転手が操作をして運転を受け取ることです。',
'超音波センサ':'人に聞こえない高い音を出し、返ってくるまでの時間で距離を測る部品です。',
'ステアリングモーター':'ハンドルを回すモーターです。ふだんは操作を軽くする役をします。',
'カメラ':'映像から白線・人・車・標識などを見つけるセンサです。',
'車輪速センサ':'タイヤの回る速さを測るセンサです。進んだ距離も計算できます。',
'雨滴センサ':'ガラスについた雨を見つけるセンサです。',

'終わりの条件':'次の手順へ進むきっかけです。センサの値で決めます。',
'止まるまでに進む距離':'ブレーキをかけ始めてから止まるまでに進む距離です。速いほど、すべりやすいほど長くなります。',
'ブレーキの遅れ':'センサが気づいてから、ブレーキが十分に効くまでの時間です。',
'データ収集':'制御の数字を決めるために、いろいろな条件で記録を集めることです。',
'ABS':'タイヤがロックしかけたら、ブレーキを一瞬ゆるめてタイヤを回し続けるしくみです。',
'ACC':'前の車までの距離を測りながら、速さを前の車に合わせて走る制御です。',
'横滑り防止（ESC）':'すべりそうなとき、タイヤごとにブレーキをかけて車の向きを立て直すしくみです。',
'トラクションコントロール':'発進でタイヤが空回りしたら、エンジンの力をしぼるしくみです。',
'電動パワーステアリング':'ハンドルを回す力をモーターで助けるしくみです。',
'回生ブレーキ':'減速の勢いをモーターで電気に変えて、ためるしくみです。',
'電子スロットル':'アクセルの踏んだ量をセンサで測り、モーターで空気の弁を動かすしくみです。',
'オートライト':'まわりが暗くなると、ヘッドライトを自動でつける機能です。',
'オートワイパー':'雨の量に合わせて、ワイパーの速さを自動で変える機能です。',
'エアバッグ':'強くぶつかったときだけ、袋を一気にふくらませて体を守る装置です。',
'後側方警戒':'ミラーで見えにくい斜めうしろの車を知らせる機能です。',
'車線維持支援':'車線の真ん中を走るように、ハンドル操作を手伝う機能です。',
'燃料噴射':'エンジンに入る空気に合わせて、ちょうどよい量のガソリンをふきこむ制御です。',
'イモビライザー':'登録したキーでないとエンジンがかからない、盗難防止のしくみです。',
'ヒルスタートアシスト':'坂道発進で、ブレーキをはなしても少しの間ずり下がらないようにする機能です。',
'窓の挟み込み防止':'窓を閉める途中で何かをはさむと、止まって少し下がる機能です。',
'ペダル踏み間違い加速抑制':'壁が近いのにアクセルを強く踏むと、加速をおさえる機能です。',
'ドライバー異常検知':'居眠りやよそ見を見つけて注意する機能です。',

'センサ':'まわりの様子を測って、電気の信号に変える部品です。',
'パルス':'1回だけ短く出る電気の信号です。数えると回数が分かります。',
'分解能':'どれだけ細かく測れるかです。',
'しきい値':'「ここより大きければ読む」と決めた線です。',
'飛行時間（TOF）':'音や電波が出てから返ってくるまでの時間です。往復時間と同じ意味です。',
'TTC（衝突余裕時間）':'このまま走るとぶつかるまでの秒数です。距離 ÷ 相対速度。',
'FMCW':'周波数を変えながら電波を出し続け、返りとの周波数の差から距離を出す方式です。',
'ミリ波レーダー':'波の長さが数ミリの電波で、物までの距離と速さを測る装置です。',
'センサロータ':'タイヤと一緒に回る、歯のついた輪です。',
'トリガー（Trig）':'「今、音を出せ」という合図の信号です。',
'ヨーレートセンサ':'車の向きが回る速さを測るセンサです。',
'アクティブ型':'ホール素子などを使った車輪速センサです。電源が要りますが、止まる直前まで読めます。',
'ロック':'急ブレーキでタイヤの回転が止まり、回らないまま地面をすべる状態です。',
'音速と気温':'音速は気温が高いほど速くなります。音速 ≒ 331.5 ＋ 0.6 × 気温（m/s）。',
'車間時間':'前の車が通った場所を、自分が何秒後に通るかです。距離 ÷ 自分の速さ。',
'センサフュージョン':'ちがう種類のセンサの結果を合わせて、1つの判断を出すことです。',
'残響':'音を出したあと、振動板がしばらく震え続けることです。',
'レーダー反射断面積（RCS）':'その物が電波をどれだけ強く返すかの大きさです。',
'アクチュエータ':'指令を受けて実際に動く部品です。モーターやブレーキなどです。',
'ECU':'車の中のコンピュータです。センサの値を見て、どう動かすか決めます。',
'クルーズコントロール':'決めた速さで、アクセルを踏まなくても走り続ける機能です。',
'オートエアコン':'設定した温度になるように、風の強さや温度を調整し続ける機能です。',
'ブレーキ（アクチュエータ）':'コンピュータの指令で動くブレーキは、アクチュエータの1つです。',
'測る・決める・動かす':'制御の基本の形です。センサ → コンピュータ → アクチュエータ。',
'計測の大切さ':'制御は測った値をもとに動くので、測りまちがえると制御もずれます。',
'点火時期':'ガソリンに火をつけるタイミングです。',
'オートマチックの変速':'速さや踏み方に合わせて、ギアを自動で切りかえる制御です。',
'エンジン冷却ファン':'エンジンを冷やす水が熱くなると回るファンです。',
'ブレーキアシスト':'ブレーキを急に踏むと、緊急と判断してブレーキを強める機能です。',
'オートブレーキホールド':'止まると、ブレーキから足をはなしても止まったままにする機能です。',
'下り坂の速度制御':'急な下り坂で、ブレーキを自動でかけて低い速さを保つ機能です。',
'衝突被害軽減ブレーキ':'ぶつかりそうになると警告し、危ないと自動でブレーキをかける機能です。',
'車線はみ出し警報':'白線からはみ出しそうになると知らせる機能です。',
'シートベルトの巻き取り':'ぶつかった瞬間にベルトを巻き取り、体を固定するしくみです。プリテンショナーと呼びます。',
'オートハイビーム':'前の車の有無で、ハイビームとロービームを切りかえる機能です。',
'標識認識':'カメラで標識を読み取り、メーターに表示する機能です。',
'後退時車両検知':'バックで出るときに、横から来る車を知らせる機能です。',
'パーキングセンサ':'駐車のとき、近くの物までの距離を音で知らせる機能です。',
'バックカメラ自動表示':'R に入れると、うしろの映像を画面に出す機能です。',
'シートベルト警告':'座っているのにベルトを締めていないと、ランプとブザーで知らせる機能です。',
'スマートエントリー':'キーを持って近づき、ドアハンドルにふれるとカギが開く機能です。',
'間欠ワイパー':'ワイパーが「動く・止まる」をくり返す機能です。タイマーで動きます。',
'車速感応オートドアロック':'走り出すと、自動でドアのカギをかける機能です。',
'キーの閉じ込み防止':'キーを車内に置いたままだと、ロックせずに知らせる機能です。',
'曲がる方向を照らすライト':'ハンドルを切った方向をライトで照らす機能です。',
'タイヤ空気圧警報':'タイヤの空気が減ると知らせる機能です。',
'ワンタッチウインカー':'レバーを軽く倒すだけで、ウインカーが3回点滅する機能です。',
'室内灯':'ドアを開けるとつき、閉めるとしばらくして消える車内の明かりです。',
'ライト消し忘れ防止':'ライトをつけたまま降りても、自動で消える機能です。',
'自動防眩ルームミラー':'うしろの車のライトがまぶしいと、ミラーを自動で暗くする機能です。',
'半ドア警告':'ドアがきちんと閉まっていないと知らせる機能です。',
'燃料残量警告':'燃料が少なくなると、ランプで知らせる機能です。',
};

// 出題の順番：分野を順に回し（A B C D E A …）、各分野の中は難しさ 1・2・3 を順に回す。全員同じ順番
const Q=(()=>{
  const counter={},all=RAW.map(r=>{counter[r[0]]=(counter[r[0]]||0)+1;
    return {id:r[0]+String(counter[r[0]]).padStart(2,'0'),g:r[0],t:r[1],d:r[2],w:r[3],q:r[4],o:r[5],e:r[6]}});
  const lists=Object.keys(CH).map(g=>{
    const by=[1,2,3].map(d=>all.filter(q=>q.g===g&&q.d===d)),out=[];
    for(let k=0;out.length<all.filter(q=>q.g===g).length;k++){const b=by[k%3];if(b.length)out.push(b.shift())}
    return out});
  const seq=[];for(let k=0;seq.length<all.length;k++)for(const l of lists)if(l[k])seq.push(l[k]);
  return seq})();
const LET='アイウエオ';
const KEY='seigyo100-v2'; // 問題を入れかえたので v1 の記録は引きつがない
const blank=()=>({no:'',i:-1,ans:{},ord:{},pos:null});
let st=blank();
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)st=Object.assign(st,s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){for(let n=a.length-1;n>0;n--){const r=Math.floor(Math.random()*(n+1));[a[n],a[r]]=[a[r],a[n]]}return a}
// 正解の位置：ア〜オを同じ数ずつ配り、同じ位置が3問続かないように並べる（解く人ごとに違う）
function positions(){
  if(st.pos&&st.pos.length===Q.length)return st.pos;
  const pool=Q.map((_,k)=>k%5);let a;
  for(let t=0;t<5000;t++){a=shuffle(pool.slice());if(a.every((v,k)=>k<2||!(v===a[k-1]&&v===a[k-2])))break}
  st.pos=a;save();return a}
// order：画面の上から順に、元の選択肢の番号（0 が正解）を並べたもの
function order(i){const id=Q[i].id;
  if(!st.ord[id]){const a=shuffle([1,2,3,4]);a.splice(positions()[i],0,0);st.ord[id]=a;save()}
  return st.ord[id]}
const answered=i=>st.ans[Q[i].id]!=null;
const correct=i=>st.ans[Q[i].id]===0;
const idxOf=f=>Q.map((q,i)=>i).filter(i=>f(Q[i]));
const doneCount=()=>Q.filter((q,i)=>answered(i)).length;

function chrome(){
  const cur=st.i>=0&&st.i<Q.length?Q[st.i].g:null;
  $('chips').innerHTML=Object.keys(CH).map(g=>{const a=idxOf(q=>q.g===g),n=a.filter(answered).length;
    return `<span class="chip ${cur===g?'now':n===a.length?'done':''}">${CHS[g]} ${n}/${a.length}</span>`}).join('');
  $('count').textContent=st.i>=0&&st.i<Q.length?`${st.i+1} / ${Q.length}`:'';
  $('ver').textContent='版 '+VER;
  $('bar').style.width=(doneCount()/Q.length*100)+'%';
}
function render(){
  chrome();
  if(st.i<0)return start();
  if(st.i>=Q.length)return result();
  question();
}
function question(){
  const i=st.i,q=Q[i],ord=order(i),pick=st.ans[q.id],done=pick!=null,ok=done&&pick===0;
  const long=q.o.some(o=>o.length>15);
  const cls=k=>!done?'':k===0?'right':k===pick?'wrong':'';
  $('card').innerHTML=`<div class="qwrap"><div class="main">
    <div class="sec"><span class="lbl">${KIND[q.t]}</span><span class="nm">${esc(CH[q.g])}</span><span class="lv" aria-label="むずかしさ ${q.d}">${'★'.repeat(q.d)+'☆'.repeat(3-q.d)}</span></div>
    <div class="q">${esc(q.q)}</div>
    <div class="opts ${long?'long':''}">${ord.map((k,pos)=>`<button class="opt ${cls(k)}" data-k="${k}" ${done?'disabled':''}><span class="mk">${LET[pos]}</span><span>${esc(q.o[k])}</span></button>`).join('')}</div>
    ${done?`<div class="fb ${ok?'ok':'ng'}"><strong>${ok?'正解です。':'正解は「'+LET[ord.indexOf(0)]+'」です。'}</strong>${esc(q.e)}</div>`:''}
    <div class="row"><button class="btn ghost left" id="toRes">結果を見る</button><button class="btn ghost" id="back" ${i===0?'disabled':''}>もどる</button>${done?`<button class="btn" id="next">${i===Q.length-1?'採点する':'次へ'}</button>`:''}</div>
   </div>
   <aside class="gloss" aria-label="用語"><h2>用語</h2>${done?`<dl><dt>${esc(q.w)}</dt><dd>${esc(GLOSS[q.w])}</dd></dl>`:'<p class="wait">答えると、この問題の用語の説明がここに出ます。</p>'}</aside></div>`;
  if(!done)document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{st.ans[q.id]=+b.dataset.k;save();render()});
  $('back').onclick=()=>{st.i--;save();render()};
  $('toRes').onclick=()=>{st.i=Q.length;save();render()};
  if($('next'))$('next').onclick=()=>{st.i++;save();render()};
}
function start(){
  $('card').innerHTML=`<div class="q">後期中間考査の出題範囲です。車の制御とセンサの用語を、5択で確かめます</div>
   <table class="plan">${Object.keys(CH).map(g=>`<tr><td>${esc(CH[g])}</td><td>${Q.filter(q=>q.g===g).length}問</td></tr>`).join('')}</table>
   <p style="margin:0">用語の意味・使いどころ・大事な場面を問います。答えるとすぐに正解と解説が出ます。途中でやめても、この端末に続きが残ります。</p>
   <div class="start"><label for="no">出席番号（4けた）</label><br><input id="no" inputmode="numeric" maxlength="4" autocomplete="off" value="${esc(st.no)}" placeholder="3101"><div class="err" id="noErr" hidden>出席番号は4けたの数字で入れてください。</div></div>
   <div class="row"><button class="btn" id="go">はじめる</button></div>`;
  const no=$('no');
  $('go').onclick=()=>{const v=no.value.normalize('NFKC').trim();
    if(!/^[0-9]{4}$/.test(v)){$('noErr').hidden=false;no.focus();return}
    st.no=v;st.i=0;positions();save();render()};
}
function result(){
  const all=idxOf(()=>true),n=doneCount(),sc=a=>a.filter(correct).length,total=sc(all);
  const miss=all.filter(i=>answered(i)&&!correct(i)),first=all.find(i=>!answered(i));
  $('card').innerHTML=`<div class="q">出席番号 ${esc(st.no)} の結果</div>
   <div><span class="res-total">${total}</span><span style="font-size:20px"> / ${Q.length} 問 正解</span>${n<Q.length?`<span class="hint">　（解いたのは ${n} 問）</span>`:''}</div>
   <div class="bars">${Object.keys(CH).map(g=>{const a=idxOf(q=>q.g===g),r=sc(a);
     return `<div class="bar"><span>${esc(CH[g])}</span><div class="track"><div class="fill" style="width:${r/a.length*100}%"></div></div><span class="num">${r}/${a.length}</span></div>`}).join('')}</div>
   <div class="parts">${Object.keys(KIND).map(t=>{const a=idxOf(q=>q.t===t);return `<span>${KIND[t]} <b>${sc(a)}</b> / ${a.length}</span>`}).join('')}</div>
   ${miss.length?`<div class="hint">まちがえた問題（番号を押すと見直せます）</div><div class="miss">${miss.map(i=>`<button data-i="${i}">${i+1}</button>`).join('')}</div>`:''}
   <div class="hint">この画面を先生に見せてください。いちばん短いバーの分野を見直しましょう。</div>
   <div class="row"><button class="btn ghost left" id="reset">最初からやり直す</button><button class="btn ghost" id="back">最後の問題にもどる</button>${first!=null?`<button class="btn" id="cont">続きをとく</button>`:''}</div>`;
  document.querySelectorAll('.miss button').forEach(b=>b.onclick=()=>{st.i=+b.dataset.i;save();render()});
  $('back').onclick=()=>{st.i=Q.length-1;save();render()};
  if($('cont'))$('cont').onclick=()=>{st.i=first;save();render()};
  // ブラウザの confirm は Classroom などで使えないので、2回押しで確かめる
  let armed=false;const rs=$('reset');
  rs.onclick=()=>{if(!armed){armed=true;rs.textContent='もう一度押すと記録を消します';return}
    const no=st.no;st=blank();st.no=no;save();render()};
}
render();
</script>
