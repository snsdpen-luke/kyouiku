<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>【題】音で距離を測る</title>
<!--
  kyouzai ひな形（.claude/skills/kyouzai/template.html）。写して、日本語名の本体（例：音で距離を測る.html）にして使う。
  直すのは「★授業ごと」の所だけ。「■共通」の所は、直さない（直すならスキルのひな形のほうを直す）。
  使わない部品は、/*== 部品名 ==*/ から /*== 部品名 おわり ==*/ までを消してよい。
  外から何も読まない（フォント・ライブラリ・画像も中に入れる）。confirm / alert は使わない（ask / tell を使う）。
-->
<style>
/* ■共通：色と文字。ライトモード固定・端末内のフォントだけ */
:root{
  color-scheme:light;
  --bg:#eef2f6; --card:#fff; --ink:#1c2836; --sub:#5b6876; --line:#d5dde6; --panel:#f3f6f9;
  --accent:#2a5fc4; --accent-soft:#e3ebfa;          /* ★授業ごと：アクセント色はこの2つだけ変える */
  --ok:#1d7f55; --ok-soft:#e1f3ea; --ng:#b8402b; --ng-soft:#fbe7e2; --warn:#8a5a00; --warn-soft:#fff3d6;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-num:ui-monospace,"Cascadia Mono","Menlo","Noto Sans Mono",monospace;
  --fs:clamp(15px,0.55vw + 11px,19px);              /* 本文の大きさ：画面の幅に合わせて 15〜19px */
  --tap:44px;                                       /* 押せる物の最小の大きさ */
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.6;
  -webkit-text-size-adjust:100%;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
b{font-weight:700}

/* ■共通：画面の枠。上（題・章）→ 進み具合 → 本文（左：カード／右：用語欄）→ 下（前へ・次へ） */
.app{height:100%;height:100dvh;display:flex;flex-direction:column;gap:6px;
  padding:8px max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
  max-width:1400px;margin:0 auto}
.top{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;min-width:0}
.top h1{font-size:1.15em;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chips{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.chip{font-size:max(14px,.85em);padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--sub);background:var(--card);white-space:nowrap}
.chip.now{border-color:var(--accent);color:var(--accent);font-weight:700}
.chip.done{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.ver{font-size:max(14px,.75em);color:var(--sub);white-space:nowrap}
.hbtn{min-height:var(--tap);padding:2px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:max(14px,.85em)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog>i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.body{flex:1 1 auto;display:grid;grid-template-columns:minmax(0,1fr) clamp(200px,22vw,280px);gap:10px;min-height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:clamp(12px,1.6vw,22px);
  overflow:auto;min-height:0;container-type:inline-size;overscroll-behavior:contain}
.gloss{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;overflow:auto;min-height:0;font-size:max(14px,.9em)}
.gloss h2{font-size:.95em;margin:0 0 6px;color:var(--sub)}
.gloss dt{font-weight:700;margin-top:10px;color:var(--accent)}
.gloss dd{margin:2px 0 0}
.gloss .none{color:var(--sub)}
.foot{display:flex;align-items:center;gap:10px}
.foot .pno{flex:1;text-align:center;color:var(--sub);font-size:max(14px,.85em)}
.btn{min-height:var(--tap);min-width:var(--tap);padding:6px 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
#glossBtn{display:none}

/* 狭い画面（縦長タブレット・スマートフォン）：用語欄は「用語」ボタンで開く引き出しにする */
@media (max-width:820px), (max-aspect-ratio:1/1){
  .body{grid-template-columns:minmax(0,1fr)}
  .gloss{position:fixed;inset:auto 8px 8px 8px;max-height:55dvh;z-index:20;box-shadow:0 8px 30px #0003;display:none}
  .gloss.open{display:block}
  #glossBtn{display:inline-block}
  .top h1{flex:1}
  .chips{order:5;flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
}

/* ■共通：カードの中身 */
.card h2{font-size:1.3em;margin:0 0 .4em;line-height:1.35}
.card p{margin:.4em 0}
.lead{color:var(--sub)}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(10px,1.5vw,20px);height:100%;min-height:0}
.split>.fig{min-height:0;position:relative}
.split>.txt{min-height:0;overflow:auto}
@container (max-width:640px){
  .split{grid-template-columns:minmax(0,1fr);height:auto}
  .split>.fig{aspect-ratio:var(--fig-ar,4/3);max-height:60dvh}
}
.goal{background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin:.5em 0}
.clear{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:8px 12px;font-weight:700;margin:.5em 0}

/*== 問題 ==*/
.qno{color:var(--sub);font-size:max(14px,.85em)}
.qt{font-size:1.08em;margin:.2em 0 .6em}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;min-height:var(--tap);padding:8px 12px;border-radius:10px;
  border:2px solid var(--line);background:var(--card);line-height:1.45}
.opt .k{flex:none;font-weight:700;color:var(--sub);min-width:1.4em}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.miss{border-color:var(--ok);border-style:dashed}
.opt:disabled{cursor:default;color:var(--ink)}
.bank{display:flex;flex-wrap:wrap;gap:6px}
.bank .opt{display:inline-flex;padding:6px 12px}
.numrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numrow input,.wbox textarea{min-height:var(--tap);padding:6px 10px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:1em}
.numrow input{width:9em;font-family:var(--f-num)}
.wbox textarea{width:100%;min-height:6em}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;line-height:1.55}
.fb.ok{background:var(--ok-soft)} .fb.ng{background:var(--ng-soft)} .fb.mid{background:var(--warn-soft)}
.fb b.h{display:block;margin-bottom:2px}
.sensei-ans{font-size:max(14px,.75em);color:#fff;background:var(--warn);border-radius:6px;padding:0 6px;margin-left:6px}
/*== 問題 おわり ==*/

/*== シミュレーター ==*/
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.stage canvas{display:block;background:#fbfcfd;border:1px solid var(--line);border-radius:10px;touch-action:none}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;margin:.5em 0}
.stepper{display:inline-flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.stepper .lab{padding:0 6px;font-size:max(14px,.85em);color:var(--sub)}
.stepper .val{min-width:5.5em;text-align:center;font-family:var(--f-num);font-weight:700}
.stepper button{min-width:var(--tap);min-height:var(--tap);border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:1.1em}
.readout{font-family:var(--f-num);background:var(--panel);border-radius:10px;padding:6px 10px;margin:.4em 0}
/*== シミュレーター おわり ==*/

/*== 小テスト ==*/
.nobox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:.6em 0}
.nobox input{width:6em;min-height:var(--tap);font-size:1.3em;text-align:center;font-family:var(--f-num);border:2px solid var(--line);border-radius:10px}
.timer{font-family:var(--f-num);font-weight:700;padding:2px 10px;border-radius:8px;background:var(--panel)}
.timer.hot{background:var(--ng-soft);color:var(--ng)}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin:.4em 0}
.jump .btn{min-width:var(--tap);padding:4px 10px}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;margin:.5em 0}
.rv{width:100%;border-collapse:collapse;font-size:max(14px,.9em)}
.rv td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
.mark{font-weight:700} .mark.o{color:var(--ok)} .mark.x{color:var(--ng)}
/*== 小テスト おわり ==*/

/* ■共通：まとめ（修了画面） */
.cert{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.cert .box{background:var(--panel);border-radius:12px;padding:10px 14px}
.cert h3{margin:0;font-size:max(14px,.85em);color:var(--sub)}
.cert .big{font-size:1.6em;font-weight:700}
.bars{display:grid;gap:4px;margin-top:4px}
.bars .row{display:grid;grid-template-columns:7em 1fr 3.5em;gap:6px;align-items:center;font-size:max(14px,.85em)}
.bars .track{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bars .fill{height:100%;background:var(--accent)}

/* ■共通：ダイアログ・先生用 */
.veil{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.veil.on{display:flex}
.modal{background:#fff;border-radius:14px;padding:18px;max-width:440px;width:100%}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.note{position:fixed;left:12px;right:12px;bottom:70px;z-index:40;background:#fffbe8;border:2px solid #e2c56b;border-radius:12px;padding:10px 14px;max-height:40dvh;overflow:auto;font-size:.9em}
.sbar{background:var(--warn);color:#fff;border-radius:10px;padding:4px 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:max(14px,.8em)}
.sbar select{min-height:var(--tap);max-width:100%;flex:1 1 12em;border-radius:8px;border:0;padding:0 6px;background:#fff;color:var(--ink)}
.sbar .btn{min-height:var(--tap);border:0;padding:0 12px;color:var(--warn)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{body{overflow:visible}.foot,.top .hbtn,.sbar{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="sbar" id="sbar" hidden></div>
  <header class="top">
    <h1 id="ttl"></h1>
    <nav class="chips" id="chips"></nav>
    <button class="hbtn" id="glossBtn">用語</button>
    <span class="ver" id="ver"></span>
  </header>
  <div class="prog"><i id="bar"></i></div>
  <main class="body">
    <section class="card" id="card" aria-live="polite"></section>
    <aside class="gloss" id="gloss"></aside>
  </main>
  <footer class="foot" id="foot">
    <button class="btn" id="prev">← 前へ</button>
    <span class="pno" id="pno"></span>
    <button class="btn pri" id="next">次へ →</button>
  </footer>
</div>
<div class="veil" id="veil"><div class="modal" role="dialog"><div id="mMsg"></div>
  <div class="row"><button class="btn" id="mNo">やめる</button><button class="btn pri" id="mYes">はい</button></div></div></div>
<div class="note" id="note" hidden></div>

<script>
"use strict";
/* ============================================================
   ★授業ごと：ここから下の「データ」だけを書きかえる
   ============================================================ */
const VER = "2026-11-12a";               // 直したら必ず上げる（画面右上に出る）
const FOLDER = "template";               // 配る場所のフォルダ名。保存の名前にも使う（例："oto"）
const TITLE = "音で距離を測る";           // 画面の題

// 章（画面上の丸い札）。ページの sec に書く
const SECS = ["導入", "しくみ", "ミッション", "練習", "小テスト", "まとめ"];

// 用語。ページの terms・問題の term に、ここの見出しと同じ文字を書く
const TERMS = {
  "超音波": "人の耳に聞こえない、高い音（20kHz より高い）。",
  "往復時間": "音を出してから、はね返った音が戻るまでの時間。",
  "音速": "音が1秒に進む距離。空気中では気温で変わる（0℃で約331.5m/s、1℃ごとに約0.6m/s 速くなる）。",
};

// 計算のもと（モデル）。シミュレーターも問題の答えも、ここだけを使う。
// 確認スクリプトでは、同じ式を別に書き直して突き合わせる（ここをそのまま使わない）
const MODEL = {
  v: T => 331.5 + 0.6 * T,                         // 音速 [m/s]（T：気温 ℃）
  roundTrip: (d, T) => 2 * d / (331.5 + 0.6 * T),  // 往復時間 [s]（d：距離 m）
};

// 分野（採点の内訳）。問題の ch に書く
const CH = { A: "音の速さ", B: "距離の計算" };

// 問題。id は保存に使うので、一度配ったら変えない。
//   one  ：1つ選ぶ。o の先頭が正解（画面では位置を混ぜる）。e は解説
//   multi：すべて選ぶ。a は正解の番号の配列（2つ以上・全部ではない）
//   term ：語群から選ぶ。a は正解（別解があれば配列に足す）。語群は term 問題の正解＋EXTRA
//   num  ：数を書く。a は正解の数、tol は許す誤差（書かなければ正解の1%）、unit は単位
//   w    ：記述。m は模範解答、k は観点2つ。自分で「できた／半分／できなかった」を選ぶ（点には入れない）
const Q = [
  { id: "A1", ch: "A", t: "one", q: "気温が上がると、音速はどうなりますか。", o: ["速くなる", "遅くなる", "変わらない", "音が出なくなる"], e: "1℃上がるごとに約0.6m/s 速くなります。", term: "音速" },
  { id: "A2", ch: "A", t: "term", q: "人の耳に聞こえない、高い音を何といいますか。", a: ["超音波"], e: "20kHz より高い音です。", term: "超音波" },
  { id: "A3", ch: "A", t: "num", q: "気温20℃のときの音速は何 m/s ですか。", a: MODEL.v(20), tol: 0.5, unit: "m/s", e: "331.5 + 0.6 × 20 = 343.5 m/s です。", term: "音速" },
  { id: "B1", ch: "B", t: "num", q: "気温20℃。2m 先の壁で、往復時間は何 ms ですか（小数第1位まで）。", a: MODEL.roundTrip(2, 20) * 1000, tol: 0.1, unit: "ms", e: "行きと帰りで 4m。4 ÷ 343.5 = 0.01164… 秒 ＝ 約11.6 ms です。", term: "往復時間" },
  { id: "B2", ch: "B", t: "multi", q: "距離を求めるのに使うものを、すべて選びなさい。", o: ["往復時間", "音速", "壁の色", "センサの重さ"], a: [0, 1], e: "距離 ＝ 音速 × 往復時間 ÷ 2。色や重さは使いません。", term: "往復時間" },
  { id: "B3", ch: "B", t: "one", q: "距離を求める式で、最後に 2 でわるのはなぜですか。", o: ["音が行って帰ってくるから", "音が壁で2つに分かれて進むから", "センサが左右に2つ付いているから", "単位を m から cm にそろえるため"], e: "往復時間には、行きと帰りの両方が入っているからです。", term: "往復時間" },
  { id: "B4", ch: "B", t: "w", q: "寒い日に、距離センサの値が少しずれるのはなぜか、説明しなさい。", m: "寒いと音速が遅くなり、同じ距離でも往復時間が長くなる。20℃の音速で計算すると、実際より遠く出る。", k: ["音速が気温で変わることを書いている", "往復時間が長くなり、距離が遠く出ることを書いている"], term: "音速" },
];
const EXTRA = ["電波", "赤外線"];        // 語群に足す、まちがいの言葉

// シミュレーター。init：最初の状態、step：0.05秒ずつ進める、draw：描く（w×h の座標で描く）、ctrls：操作部品
const SIMS = {
  echo: {
    w: 800, h: 450,                       // 描く座標の大きさ（この比で拡大縮小する）
    init: () => ({ d: 2, T: 20, t: 0, pulse: -1 }),
    step(S, dt) { S.t += dt; if (S.pulse >= 0) { S.pulse += dt; if (S.pulse > MODEL.roundTrip(S.d, S.T) * 60) S.pulse = -1; } },
    draw(g, S, w, h) {
      const x0 = 80, px = (w - 160) / 5, wx = x0 + S.d * px;            // 0〜5m を横に並べる
      g.fillStyle = "#1c2836"; g.fillRect(x0 - 50, h / 2 - 30, 50, 60);   // センサ
      g.fillStyle = "#8a96a3"; g.fillRect(wx, h / 2 - 120, 18, 240);      // 壁
      g.strokeStyle = "#d5dde6"; g.lineWidth = 2; g.beginPath(); g.moveTo(x0, h - 60); g.lineTo(w - 80, h - 60); g.stroke();
      g.fillStyle = "#5b6876"; g.font = "22px sans-serif"; g.textAlign = "center";
      for (let m = 0; m <= 5; m++) g.fillText(m + "m", x0 + m * px, h - 30);
      if (S.pulse >= 0) {                                                 // 音の波（60倍ゆっくり見せる）
        const tt = S.pulse / 60, go = MODEL.v(S.T) * tt, x = go <= S.d ? x0 + go * px : x0 + (2 * S.d - go) * px;
        g.strokeStyle = "#2a5fc4"; g.lineWidth = 4; for (let k = 0; k < 3; k++) { g.beginPath(); g.arc(x, h / 2, 14 + k * 10, -0.6, 0.6); g.stroke(); }
      }
    },
    ctrls(box, S, sim) {
      box.append(
        stepper("距離", () => S.d.toFixed(1) + " m", v => S.d = clamp(+(S.d + v).toFixed(1), 0.5, 5), 0.1),
        stepper("気温", () => S.T + " ℃", v => S.T = clamp(S.T + v, -10, 40), 5),
        button("音を出す", () => { S.pulse = 0; }),
      );
      const out = el("div", "readout"); box.append(out);
      sim.onDraw = () => { out.textContent = "往復時間 " + (MODEL.roundTrip(S.d, S.T) * 1000).toFixed(2) + " ms ／ 音速 " + MODEL.v(S.T).toFixed(1) + " m/s"; };
    },
  },
};

// ページ（上から順に進む）。kind：slide / sim / drill / test / end
//   slide：html（説明）、fig（左に出す SVG などの html）、q（問題の id。1問だけ出す）
//   sim  ：シミュレーターのミッション。goal（文）、ok（合格の条件）。合格しなくても次へ進める
//   drill：問題の練習。pick（どの問題か）。1問ずつ、答えるとすぐ正解と解説
//   test ：小テスト（TEST の設定で出す）
//   end  ：まとめ（修了画面）。点数・ミッション・用語は自動で数える
//   note ：先生用メモ（N キー）。★ソースは全世界から読めるので、秘密は書かない
const PAGES = [
  { sec: "導入", kind: "slide", title: "見えない物差し", terms: ["超音波"],
    fig: `<svg viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-label="車の後ろのセンサから音が出て壁ではね返る図"><rect x="20" y="120" width="120" height="60" rx="12" fill="#2a5fc4"/><circle cx="50" cy="185" r="14" fill="#1c2836"/><circle cx="115" cy="185" r="14" fill="#1c2836"/><rect x="330" y="60" width="20" height="180" fill="#8a96a3"/><path d="M160 150 q 20 -20 0 -40 M180 160 q 30 -30 0 -60 M200 170 q 40 -40 0 -80" stroke="#2a5fc4" stroke-width="4" fill="none"/></svg>`,

const QI = Object.fromEntries(Q.map(q => [q.id, q]));
const BANK = [...new Set(Q.filter(q => q.t === "term").map(q => q.a[0]).concat(EXTRA))].sort((a, b) => a.localeCompare(b, "ja"));
const tolOf = q => q.tol != null ? q.tol : Math.abs(q.a) * 0.01;
// judge：答えが正しいか（true / false）。記述は null（自分で評価する）
function judge(q, a) {
  if (a == null) return false;
  switch (q.t) {
    case "one": return a === 0;
    case "multi": return Array.isArray(a) && a.length === q.a.length && q.a.every(k => a.includes(k));
    case "term": return q.a.some(x => norm(x) === norm(a));
    case "num": { const v = typeof a === "number" ? a : parseFloat(fixNo(a)); return Number.isFinite(v) && Math.abs(v - q.a) <= tolOf(q) + 1e-9; }
    case "w": return null;
  }
  return false;
}
// 正解の位置（1つ選ぶ問題）：ア・イ・ウ…をなるべく同じ数ずつ、同じ位置が3問続かないように配る（人ごとに違う）
function posOf(q) {
  if (st.pos[q.id] != null) return st.pos[q.id];
  const used = Object.values(st.pos), last = used.slice(-2), n = q.o.length;
  const cnt = k => used.filter(v => v === k).length;
  let cand = shuffle([...Array(n).keys()]).filter(k => !(last.length === 2 && last[0] === k && last[1] === k));
  cand.sort((a, b) => cnt(a) - cnt(b));
  st.pos[q.id] = cand[0]; save(); return cand[0];
}
// 画面の上から順に、元の選択肢の番号を並べる
function orderOf(q) {
  if (st.ord[q.id]) return st.ord[q.id];
  let a;
  if (q.t === "one") { a = shuffle([...Array(q.o.length).keys()].slice(1)); a.splice(posOf(q), 0, 0); }
  else a = shuffle([...Array(q.o.length).keys()]);
  st.ord[q.id] = a; save(); return a;
}
// 1問を box に描く。ans：今の答え、onAns(答え)：確定したとき、show：正解と解説を出すか

  } else if (q.t === "term") {

// 押せる部品（ドラッグに頼らない）：− と ＋ のボタンで値を変える
function stepper(label, show, add, stepv) {
  const w = el("span", "stepper"); const lab = el("span", "lab", esc(label)), val = el("span", "val");
  const upd = () => { val.textContent = show(); };
  const minus = el("button", "", "−"), plus = el("button", "", "＋");
  minus.setAttribute("aria-label", label + "を下げる"); plus.setAttribute("aria-label", label + "を上げる");
  minus.onclick = () => { add(-stepv); upd(); }; plus.onclick = () => { add(stepv); upd(); };
  upd(); w.append(lab, minus, val, plus); w.upd = upd; return w;
}
// シミュレーターを fig に置く。縦横比を保って拡大縮小し、0.05秒の固定きざみで進める
const FIX = 0.05;
const raf = window.requestAnimationFrame ? f => window.requestAnimationFrame(f) : f => setTimeout(() => f(performance.now()), 16);
function mountSim(fig, ctrlBox, name, keep) {
  const def = SIMS[name];
  const S = keep && st.sims[name] ? Object.assign(def.init(), st.sims[name]) : def.init();
  fig.style.setProperty("--fig-ar", def.w + "/" + def.h);
  const stage = el("div", "stage"), cv = el("canvas"); stage.append(cv); fig.append(stage);
  const g = cv.getContext("2d");
  const sim = { S, def, onDraw: null, acc: 0, last: 0, alive: true };
  const fit = () => {
    const r = fig.getBoundingClientRect(); if (!r.width || !r.height) return;
    const k = Math.min(r.width / def.w, r.height / def.h), dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.style.width = Math.floor(def.w * k) + "px"; cv.style.height = Math.floor(def.h * k) + "px";
    cv.width = Math.round(def.w * k * dpr); cv.height = Math.round(def.h * k * dpr); sim.scale = k * dpr; drawNow();
  };
  const drawNow = () => { if (!g) return; g.setTransform(sim.scale || 1, 0, 0, sim.scale || 1, 0, 0); g.clearRect(0, 0, def.w, def.h); def.draw(g, S, def.w, def.h); if (sim.onDraw) sim.onDraw(); };
  const frame = t => {
    if (!sim.alive) return;
    if (!document.hidden) {
      const dt = sim.last ? Math.min(0.25, (t - sim.last) / 1000) : 0; sim.last = t; sim.acc += dt;
      while (sim.acc >= FIX) { def.step(S, FIX); sim.acc -= FIX; }
      drawNow(); if (sim.tick) sim.tick();
    } else sim.last = 0;
    raf(frame);
  };
  if (ctrlBox && def.ctrls) def.ctrls(ctrlBox, S, sim);
  if (typeof ResizeObserver === "function") { sim.ro = new ResizeObserver(fit); sim.ro.observe(fig); }
  sim.stop = () => { sim.alive = false; if (sim.ro) sim.ro.disconnect(); if (keep) { st.sims[name] = S; save(); } };
  setTimeout(fit, 0); raf(frame);
  running = sim; return sim;
}

// 小テスト：出席番号4けた → くじで出題 → 制限時間（締め切りの時刻で持つ）→ 確認 → 提出（ダミー）→ 1回だけ
function testBuild() {
  const set = [];
  for (const [c, n] of Object.entries(TEST.plan)) set.push(...shuffle(Q.filter(q => q.ch === c && TEST.types.includes(q.t)).map(q => q.id)).slice(0, n));
  return set;
}
const tAnswered = ts => ts.set.filter(id => ts.ans[id] != null && !(Array.isArray(ts.ans[id]) && !ts.ans[id].length)).length;
const tScore = ts => ts.set.filter(id => judge(QI[id], ts.ans[id])).length;
function tFinish(timeUp) {
  const ts = st.test; ts.sending = true; ts.timeUp = !!timeUp; save(); render();
  setTimeout(() => { ts.sending = false; ts.sent = new Date().toLocaleString("ja-JP"); ts.score = tScore(ts); save(); render(); }, timeUp ? 0 : 1500);
}
function drawTest(card) {
  const ts = st.test;
  $("foot").hidden = !!(ts && !ts.sent);
  if (!ts) {
    const n = Object.values(TEST.plan).reduce((a, b) => a + b, 0);

    const box = el("div", "nobox", `<label for="no">出席番号（4けた）</label>`); const inp = el("input"); inp.id = "no"; inp.inputMode = "numeric"; inp.maxLength = 4; inp.autocomplete = "off";
    const msg = el("span", "lead"); msg.id = "nomsg";

      st.test = { no: v, set: testBuild(), ans: {}, i: 0, dl: Date.now() + TEST.min * 60000, sent: null, warn: false }; save(); render();
    }, "pri"); go.id = "tgo";

  }

  if (ts.sent) {

  const upd = () => { const s = left(); tm.textContent = "のこり " + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); tm.classList.toggle("hot", s <= 60); if (s <= 0) { clearInterval(tick); tFinish(true); } };
  upd(); clearInterval(tick); tick = setInterval(upd, 250);
  if (ts.i >= ts.set.length) {          // 確認画面
    const miss = ts.set.map((id, k) => ts.ans[id] == null ? k : -1).filter(k => k >= 0);
    card.append(el("h2", "", "提出の前に"), el("p", "", `答えた数 ${tAnswered(ts)} / ${ts.set.length} 問`));
    if (miss.length) { const j = el("div", "jump"); miss.forEach(k => { const b = button("第" + (k + 1) + "問", () => { ts.i = k; save(); render(); }); b.dataset.k = k; j.append(b); }); card.append(el("p", "lead", "答えていない問題（押すとその問題へ）"), j); }
    if (ts.warn) card.append(el("div", "warn", `まだ ${miss.length}問 答えていません。このまま出すなら、もう一度「提出する」を押してください。`));

  card.append(box);
  if ($("numIn")) $("numIn").addEventListener("input", e => { const v = fixNo(e.target.value); if (v) ts.ans[q.id] = v; else delete ts.ans[q.id]; save(); });

/*== 小テスト おわり ==*/

/* ■共通：ページの組み立て */
// drill のページは、問題1問ずつのページに広げる
const FLOW = [];
PAGES.forEach((P, pi) => {
  if (P.kind === "drill") { const qs = Q.filter(P.pick); qs.forEach((q, k) => FLOW.push(Object.assign({}, P, { qid: q.id, sub: `${k + 1} / ${qs.length}` }))); }
  else FLOW.push(P);
});
const MISSIONS = FLOW.filter(P => P.kind === "sim");
st.p = clamp(st.p | 0, 0, FLOW.length - 1);

function showTerm(names) {
  const list = [...new Set(Array.isArray(names) ? names : names ? [names] : [])].filter(n => TERMS[n]);
  $("gloss").innerHTML = `<h2>用語</h2>` + (list.length ? `<dl>${list.map(n => `<dt>${esc(n)}</dt><dd>${TERMS[n]}</dd>`).join("")}</dl>` : `<p class="none">このページの用語は、ここに出ます。</p>`);
}
function chrome() {
  const P = FLOW[st.p];
  document.title = TITLE; $("ttl").textContent = TITLE; $("ver").textContent = "版 " + VER;
  const curSec = SECS.indexOf(P.sec);
  $("chips").innerHTML = SECS.map((s, k) => `<span class="chip ${k === curSec ? "now" : k < curSec ? "done" : ""}">${esc(s)}</span>`).join("");
  const nowc = $("chips").querySelector(".now"); if (nowc && nowc.scrollIntoView) nowc.scrollIntoView({ block: "nearest", inline: "nearest" });
  $("bar").style.width = (FLOW.length > 1 ? st.p / (FLOW.length - 1) * 100 : 100) + "%";
  $("pno").textContent = (st.p + 1) + " / " + FLOW.length;
  $("prev").disabled = st.p === 0;
  $("next").disabled = st.p === FLOW.length - 1 || !canNext();
  $("foot").hidden = false;
  $("note").textContent = P.note || "（このページの先生用メモはありません）";
}
// 次へ進めるか：問題は答えてから（正解でなくてよい）。先生用はいつでも
function canNext() {
  if (SENSEI) return true;
  const P = FLOW[st.p];
  const qid = P.kind === "drill" ? P.qid : P.q;
  if (qid) { const a = st.ans[qid]; if (a === undefined) return false; if (QI[qid].t === "w" && (a == null || a.self == null)) return false; }
  if (P.kind === "test") return !!(st.test && st.test.sent);
  return true;
}
function render() {
  if (running) { running.stop(); running = null; }
  clearInterval(tick);
  const P = FLOW[st.p], card = $("card");
  card.innerHTML = ""; card.scrollTop = 0;
  chrome(); showTerm(P.terms);
  if (P.kind === "slide" || P.kind === "sim") {
    const hasFig = P.fig || P.sim;
    const wrap = el("div", hasFig ? "split" : ""); const txt = el("div", "txt");
    txt.append(el("h2", "", esc(P.title || "")));
    if (P.html) txt.append(el("div", "", P.html));
    if (P.goal) txt.append(el("div", "goal", "<b>ミッション：</b>" + P.goal));
    const ctrl = el("div", "ctrls"); txt.append(ctrl);
    const clr = el("div", "clear", "🎉 クリア！ 次へ進みましょう。"); clr.id = "clear"; clr.hidden = !st.missions[P.id]; txt.append(clr);
    if (P.q && QI[P.q]) { const qb = el("div"); qb.id = "qbox"; txt.append(qb); drawPracticeQ(qb, QI[P.q], "問題"); }
    if (hasFig) { const fig = el("div", "fig"); wrap.append(fig, txt); card.append(wrap); if (P.fig) fig.innerHTML = P.fig; else { const sim = mountSim(fig, ctrl, P.sim, true); if (P.kind === "sim") sim.tick = () => { if (!st.missions[P.id] && P.ok(sim.S)) { st.missions[P.id] = true; save(); clr.hidden = false; showTerm(P.terms); } }; } }
    else { card.append(txt); }
    if (P.q && QI[P.q] && st.ans[P.q] !== undefined) showTerm([].concat(P.terms || [], QI[P.q].term || []));
  } else if (P.kind === "drill") {
    const q = QI[P.qid]; card.append(el("h2", "", esc(P.title) + ` <span class="qno">${P.sub}</span>`));
    const qb = el("div"); qb.id = "qbox"; card.append(qb); drawPracticeQ(qb, q, CH[q.ch] || "");
  } else if (P.kind === "test") {
    drawTest(card);
  } else if (P.kind === "end") {
    card.append(el("h2", "", esc(P.title || "まとめ"))); if (P.html) card.append(el("div", "", P.html));
    card.append(endSummary());
  }
  $("next").disabled = st.p === FLOW.length - 1 || !canNext();
}
// まとめ：数は全部ここで数える（手で書かない。「5 / 4」のような食い違いを防ぐ）
function scoreBy() {
  const qs = Q.filter(q => q.t !== "w" && FLOW.some(P => P.qid === q.id || P.q === q.id));
  const by = {}; for (const q of qs) { const b = by[q.ch] || (by[q.ch] = { n: 0, ok: 0 }); b.n++; if (judge(q, st.ans[q.id])) b.ok++; }
  return { n: qs.length, ok: qs.filter(q => judge(q, st.ans[q.id])).length, by };
}
function endSummary() {
  const s = scoreBy(), ms = MISSIONS.filter(P => st.missions[P.id]).length;
  const learned = [...new Set(FLOW.filter(P => (P.kind !== "sim" || st.missions[P.id]) && FLOW.indexOf(P) <= st.p).flatMap(P => P.terms || []))];
  const w = el("div", "cert");
  w.innerHTML = `<div class="box"><h3>練習の正解</h3><div class="big" id="endScore">${s.ok} / ${s.n}</div><div class="bars">${Object.entries(s.by).map(([c, b]) => `<div class="row"><span>${esc(CH[c] || c)}</span><span class="track"><span class="fill" style="width:${b.n ? b.ok / b.n * 100 : 0}%;display:block"></span></span><span>${b.ok}/${b.n}</span></div>`).join("")}</div></div>`
    + (MISSIONS.length ? `<div class="box"><h3>クリアしたミッション</h3><div class="big" id="endMis">${ms} / ${MISSIONS.length}</div></div>` : "")
    + (FLOW.some(P => P.kind === "test") ? `<div class="box"><h3>小テスト</h3><div class="big">${st.test && st.test.sent ? st.test.score + " / " + st.test.set.length : "未受験"}</div></div>` : "")
    + `<div class="box"><h3>出てきた用語</h3><div>${learned.map(t => "<b>" + esc(t) + "</b>").join("・") || "—"}</div></div>`;
  const wrap = el("div"); wrap.append(w, el("p", "lead", "この画面を先生に見せてください。"));
  wrap.append(button("記録を消して最初から", () => ask("記録を全部消して、最初からやり直します。よいですか。", () => { st = blank(); save(); render(); }, "消す")));
  return wrap;
}

function go(d) { const n = clamp(st.p + d, 0, FLOW.length - 1); if (n === st.p) return; if (d > 0 && !canNext()) return; st.p = n; save(); render(); }
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("glossBtn").onclick = () => $("gloss").classList.toggle("open");
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase(); if (tag === "input" || tag === "textarea") return;
  if ($("veil").classList.contains("on")) { if (e.key === "Escape") $("mNo").click(); return; }
  if (e.key === "ArrowRight" && !$("foot").hidden) go(1);
  else if (e.key === "ArrowLeft" && !$("foot").hidden) go(-1);
  else if (e.key === "n" || e.key === "N") $("note").hidden = !$("note").hidden;
});
// 横のスワイプでページ送り（シミュレーターの上ではしない）
(() => { let x0 = null, y0 = 0; const c = $("card");
  c.addEventListener("pointerdown", e => { x0 = e.target.closest("canvas,input,textarea,.stepper") ? null : e.clientX; y0 = e.clientY; });
  c.addEventListener("pointerup", e => { if (x0 == null || $("foot").hidden) return; const dx = e.clientX - x0, dy = e.clientY - y0; x0 = null; if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 2) go(dx < 0 ? 1 : -1); });
})();
if (SENSEI) {
  const b = $("sbar"); b.hidden = false;
  b.innerHTML = `<span>先生用（記録は別の箱）</span><select id="sJump" aria-label="ページへ">${FLOW.map((P, k) => `<option value="${k}">${k + 1}. ${esc(P.sec)}：${esc(P.title || "")}${P.sub ? " " + P.sub : ""}</option>`).join("")}</select>`;
  b.append(button("最初から", () => ask("先生用の記録を消します。生徒の記録は消えません。", () => { st = blank(); save(); render(); }, "消す")));
  $("sJump").onchange = e => { st.p = +e.target.value; save(); render(); };
  const _chrome = chrome; chrome = function () { _chrome(); $("sJump").value = st.p; };
}
render();
</script>
</body>
</html>
