<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark">
<title>廃校徘徊 サンプラー</title>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Boku&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0b0909; --panel:#151111; --panel2:#1d1717; --line:#2a1f1f;
  --text:#e6e2da; --sub:#8c8380; --red:#c21414; --accent:#e57373;
}
*{box-sizing:border-box}
/* タブレット1画面に収める：画面の高さ（100dvh）を、上の帯・操作の帯・パッドで分け合う。はみ出さないので、スクロールしない */
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Meiryo",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow:hidden}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}
button{font:inherit;color:inherit}
header{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:4px 10px;height:46px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:24px;margin:0;white-space:nowrap;letter-spacing:.08em;font-weight:400;
  font-family:"Yuji Boku","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;color:var(--red);text-shadow:0 0 18px rgba(143,11,11,.55),2px 3px 0 #000}
header .ver{font-size:11px;color:var(--sub);white-space:nowrap}
header .keys{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.stopbig{margin-left:auto;flex-shrink:0;border:2px solid var(--red);background:#3a0d0d;border-radius:9px;padding:5px 14px;font-size:15px;font-weight:800;cursor:pointer;white-space:nowrap}
.stopbig:active{filter:brightness(1.4)}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:active{filter:brightness(1.3)}
.btn.on{border-color:var(--red);background:#8f0b0b;box-shadow:0 0 14px rgba(194,20,20,.45)}

/* 操作の帯：BGM・全体の音量・自動おどかし・効果音を止める を1段（せまい画面では2段）に */
.bar{flex-shrink:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:6px 10px}
.grp{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 8px;min-height:46px}
.bgmbar{border-width:2px}
.bgmbar.on{border-color:var(--red);animation:glow 1.6s infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 rgba(198,40,40,0)}to{box-shadow:0 0 16px rgba(198,40,40,.75)}}
.bgmbtn{display:flex;align-items:center;gap:8px;border:none;background:none;cursor:pointer;text-align:left;padding:2px}
.lamp{width:22px;height:22px;border-radius:50%;background:#2a2222;border:2px solid #4a3a3a;flex-shrink:0}
.bgmbar.on .lamp{background:#ff3030;border-color:#ffb4b4;box-shadow:0 0 12px #ff3030}
.bgmtx{display:flex;flex-direction:column;line-height:1.15}
.bgmtx .t1{font-size:11px;color:var(--sub)}
.bgmtx .t2{font-size:16px;font-weight:800;white-space:nowrap}
.bgmstate{font-size:15px;font-weight:800;padding:4px 10px;border-radius:8px;border:2px solid #4a3a3a;color:var(--sub);white-space:nowrap}
.bgmbar.on .bgmstate{color:#fff;background:#8f0b0b;border-color:var(--red)}
.sl{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--sub);white-space:nowrap}
.sl input{width:110px;accent-color:var(--red);height:26px;margin:0}
.sl b{width:36px;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.freq{display:flex;gap:4px}
.freq button{border:1px solid var(--line);background:var(--panel2);color:var(--sub);border-radius:6px;padding:5px 8px;font-size:13px;cursor:pointer}
.freq button.sel{color:var(--text);border-color:var(--red)}
.autost{font-size:12px;color:var(--sub);white-space:nowrap}
.autost.on{color:#ffd54f}

/* 効果音：パッドの下に、その音だけの音量・高さ・★ */
.pads{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:8px;padding:0 10px 10px}
.cell{min-width:0;min-height:0;display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px}
.pad{flex:1;min-height:0;position:relative;border:none;border-radius:10px;cursor:pointer;touch-action:none;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 85%,#fff 0%),color-mix(in srgb,var(--c) 45%,#000));
  box-shadow:0 3px 0 color-mix(in srgb,var(--c) 30%,#000),inset 0 1px 0 rgba(255,255,255,.15);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;overflow:hidden;
  transition:transform .05s}
.pad .nm{font-size:clamp(14px,2vw,22px);font-weight:800;white-space:pre-line;text-shadow:0 1px 3px rgba(0,0,0,.8);text-align:center;line-height:1.2}
.pad .ky{position:absolute;left:6px;top:4px;font-size:11px;font-weight:700;opacity:.8;background:rgba(0,0,0,.35);border-radius:4px;padding:0 4px}
.pad .au{position:absolute;right:6px;top:3px;font-size:12px;display:none;color:#ffd54f}
.cell.auto .pad .au{display:block}
.pad.hit{transform:translateY(3px);filter:brightness(1.8);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 30%,#000)}
.ctl{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--sub);height:24px}
.ctl span{width:24px;flex-shrink:0}
.ctl input{flex:1;min-width:0;accent-color:var(--red);height:22px;margin:0}
.ctl b{width:32px;text-align:right;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.star{flex-shrink:0;border:1px solid var(--line);background:var(--panel2);color:var(--sub);border-radius:6px;font-size:11px;padding:2px 5px;cursor:pointer;white-space:nowrap}
.cell.auto .star{color:#ffd54f;border-color:#6b5a1e}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 18px;border-radius:10px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}

/* 縦長（タブレットを縦に持つ）：パッドを2列×3段に */
@media (orientation:portrait){
  .pads{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}
  header .keys{display:none}
}
/* スマホのような小さい画面だけは、1画面に入りきらないのでスクロールさせる */
@media (max-height:560px),(max-width:560px){
  html,body{overflow:auto}
  body{height:auto}
  .pads{grid-template-rows:none}
  .pad{min-height:90px}
}
</style>
</head>
<body>
<header>
  <h1>廃校徘徊</h1>
  <span class="ver" id="ver"></span>
  <span class="keys">キー：効果音 Q W E / A S D　BGM B　効果音を止める Space　全部止める Esc</span>
  <button class="stopbig" id="stopAllTop">■ 全部止める</button>
</header>
<div class="bar">
  <div class="grp bgmbar" id="bgmbar">
    <button class="bgmbtn" id="bgmBtn"><span class="lamp"></span><span class="bgmtx"><span class="t1">BGM（キー B）</span><span class="t2">不気味な低音</span></span></button>
    <span class="bgmstate" id="bgmState"></span>
    <label class="sl">音量<input type="range" id="bgmVol" min="0" max="100" step="5"><b id="vBgm"></b></label>
  </div>
  <div class="grp">
    <label class="sl">全体<input type="range" id="mVol" min="0" max="100" step="5"><b id="vMVol"></b></label>
    <button class="btn" id="stopSfx">■ 効果音だけ止める</button>
  </div>
  <div class="grp">
    <button class="btn" id="autoBtn">自動おどかし：OFF</button>
    <div class="freq" id="freq"><button data-f="1.6">少なめ</button><button data-f="1">ふつう</button><button data-f="0.6">多め</button></div>
    <span class="autost" id="autoSt"></span>
  </div>
</div>
<div class="pads" id="pads"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const VER = "2026-11-05a";
const KEYS = ["KeyQ","KeyW","KeyE","KeyA","KeyS","KeyD"];   // パッドの並び（3×2）とキーボードの並びをそろえる
const BGM_KEYS = ["KeyB"];
const MAX_VOICES = 6;      // 同時に鳴らす効果音の上限。重ねすぎるとスマホの処理が追いつかず、音がとぎれたり「ビー」と鳴ったりする
const NVAR = 3;            // 効果音ごとに3通りの波形を作り、毎回ちがうものを鳴らす（同じ音のくり返しに聞こえないように）
const keyLabel = c => c.replace("Digit","").replace("Key","");

/* ============ 音の合成 ============
   音のファイルは持たない。全部ここで計算して作る（通信なしで動く）。
   どれも (sr: サンプリング周波数, rnd: 乱数) → Float32Array */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const TAU = Math.PI*2;
const arr = (sr,sec) => new Float32Array(Math.max(1,Math.round(sr*sec)));
function lp(x,sr,fc){ const a=1-Math.exp(-TAU*fc/sr); let y=0; for(let i=0;i<x.length;i++){ y+=a*(x[i]-y); x[i]=y; } return x; }
function hp(x,sr,fc){ const a=1-Math.exp(-TAU*fc/sr); let y=0; for(let i=0;i<x.length;i++){ y+=a*(x[i]-y); x[i]=x[i]-y; } return x; }
function noise(n,rnd){ const x=new Float32Array(n); for(let i=0;i<n;i++) x[i]=rnd()*2-1; return x; }
const saw = p => 2*(p%1)-1;
const clamp01 = v => v<0?0:v>1?1:v;
/* 帯域通過フィルタ（共振）。係数を途中で変えられる */
const BP = () => ({x1:0,x2:0,y1:0,y2:0,b0:0,b2:0,a1:0,a2:0});
function bpSet(f,sr,fc,q){ fc=Math.min(fc,sr*.45); const w=TAU*fc/sr, al=Math.sin(w)/(2*q), a0=1+al;
  f.b0=al/a0; f.b2=-al/a0; f.a1=-2*Math.cos(w)/a0; f.a2=(1-al)/a0; return f; }
function bpRun(f,x){ const y=f.b0*x+f.b2*f.x2-f.a1*f.y1-f.a2*f.y2; f.x2=f.x1; f.x1=x; f.y2=f.y1; f.y1=y; return y; }
function peakOf(x){ let p=0; for(let i=0;i<x.length;i++){ const a=Math.abs(x[i]); if(a>p) p=a; } return p; }
function normalize(x,target){ target=target||0.9; const p=peakOf(x); if(p<1e-6) return x;
  const k=target/p; for(let i=0;i<x.length;i++) x[i]*=k; return x; }
function fadeEdges(x,sr,inSec,outSec){ const a=Math.min(x.length,Math.round(sr*inSec)), b=Math.min(x.length,Math.round(sr*outSec));
  for(let i=0;i<a;i++) x[i]*=i/a;
  for(let i=0;i<b;i++) x[x.length-1-i]*=i/b; return x; }
/* 別に作った音 y を x の at 秒の位置に足す（ピークを g にそろえて） */
function mixIn(x,y,sr,at,g){ normalize(y,g); const i0=Math.round(at*sr);
  for(let k=0;k<y.length&&i0+k<x.length;k++) x[i0+k]+=y[k]; }

/* ---- 声（女の声）：声帯の振動（パルス）＋息の音 → 口の形（フォルマント）の共振 ---- */
const VOW = {   // 女声の母音。[中心周波数 Hz, 帯域幅 Hz] × 4
  a:[[850,90],[1300,110],[2900,170],[3900,250]],
  i:[[330,60],[2700,140],[3300,200],[4200,250]],
  u:[[380,70],[1500,110],[2700,170],[3900,250]],
  e:[[550,80],[2200,130],[2950,180],[4000,250]],
  o:[[520,80],[900,90],[2800,170],[3800,250]],
};
const FG = [1,.6,.35,.2];
function vowelAt(kf,t){
  if(typeof kf==="string") return VOW[kf];
  let i=0; while(i<kf.length-1&&kf[i+1][0]<=t) i++;
  const a=kf[i], b=kf[Math.min(i+1,kf.length-1)];
  if(a===b||t<=a[0]) return VOW[a[1]];
  const m=Math.min(1,(t-a[0])/(b[0]-a[0])), A=VOW[a[1]], B=VOW[b[1]];
  return A.map((f,k)=>[f[0]+(B[k][0]-f[0])*m, f[1]+(B[k][1]-f[1])*m]);
}
/* o: dur 秒, f0(t) 声の高さ, vow 母音（"a" か [[秒,"u"],[秒,"a"],…]）, amp(t) 音量,
      breath 息の量, vib [速さHz, 深さセント], rough 声のかすれ（1周期おきに弱める）, fmul 口の大きさ, bw 帯域の広さ, unvoiced ささやき */
function voice(sr,rnd,o){
  const x=arr(sr,o.dur), F=[BP(),BP(),BP(),BP()], fm=o.fmul||1, bw=o.bw||1, br=o.breath||0, rough=o.rough||0, vib=o.vib||[5,20];
  const bn=hp(lp(noise(x.length,rnd),sr,7000),sr,300);
  let ph=0, gp=0, cyc=0, drift=0, jit=1;
  for(let i=0;i<x.length;i++){
    const t=i/sr;
    if(i%32===0){ const V=vowelAt(o.vow,t); for(let k=0;k<4;k++){ const fc=V[k][0]*fm; bpSet(F[k],sr,fc,fc/(V[k][1]*bw)); } }
    drift=drift*.9995+(rnd()*2-1)*.0004;                 // 声の高さが少しずつふらつく
    const f=o.f0(t)*Math.pow(2,vib[1]*Math.sin(TAU*vib[0]*t)/1200+drift)*jit;
    ph+=f/sr;
    if(ph>=1){ ph-=1; cyc++; jit=1+(rnd()*2-1)*(o.jitter||.01); }
    const g = ph<.4 ? .5-.5*Math.cos(Math.PI*ph/.4) : ph<.56 ? Math.cos(Math.PI*(ph-.4)/.32) : 0;
    let v = o.unvoiced ? 0 : (g-gp)*sr/(f*10); gp=g;
    if(rough&&(cyc&1)) v*=1-rough;
    const s=v+br*6*bn[i]*(o.unvoiced?1:(.35+.65*g));
    let y=0; for(let k=0;k<4;k++) y+=bpRun(F[k],s)*FG[k];
    x[i]=y*o.amp(t);
  }
  return hp(x,sr,70);
}
const envAR = (t,dur,a,r) => clamp01(t/a)*clamp01((dur-t)/r);

/* ---- ささやき（息だけの声）----
   syl: [子音, 母音, 長さ秒]。
   t・k は舌や上あごで息を止めて破裂させる音、s は歯のすき間の「スー」、ts は破裂してすぐ「スー」。
   w・m・n・r は息を止めない子音：w は口をすぼめた「う」から開く、m・n は口を閉じた弱い息、r は舌で一瞬はじく */
function whisperWord(sr,rnd,syl){
  const CL={t:.05,s:.14,k:.06,ts:.10,w:.08,m:.07,n:.06,r:.03,"":0};      // 子音の長さ（母音の息が始まるまで）
  let t0=.1; const kf=[], ev=[];
  for(const [c,v,d] of syl){ const vs=t0+CL[c];
    if(c==="w"||c==="m"||c==="n") kf.push([t0,"u"]);
    kf.push([vs,v]); kf.push([vs+(d-CL[c])*.7,v]);
    ev.push({c,v,s:t0,vs,e:t0+d}); t0+=d+.05; }
  const dur=t0+.25, last=ev[ev.length-1];
  const amp=t=>{
    const c=ev.find(e=>t>=e.s&&t<e.vs);
    if(c){ const u=(t-c.s)/(c.vs-c.s);
      return c.c==="w" ? .15+.5*u : (c.c==="m"||c.c==="n") ? .28*clamp01(u*4) : c.c==="r" ? .3 : 0; }
    const e=ev.find(e=>t>=e.vs&&t<e.e); if(!e) return 0; const u=t-e.vs, L=e.e-e.vs;
    let a=(e.c==="w"||e.c==="m"||e.c==="n"||e.c==="r" ? 1 : clamp01(u/.03))*(.35+.65*clamp01((L-u)/.12));
    if(e.v==="u"&&(e.c==="s"||e.c==="ts")) a*=.45;                       // 「す」「つ」の う はほとんど聞こえない
    if(e===last) a*=clamp01((L-u)/L*1.6);
    return a; };
  const x=voice(sr,rnd,{dur, f0:()=>200, vow:kf, unvoiced:true, breath:1, bw:2.2, vib:[0,0], amp});
  normalize(x,1);
  const hiss=(at,len,g)=>{ const y=noise(Math.round(sr*len),rnd), f=bpSet(BP(),sr,6200,1.4);
    for(let k=0;k<y.length;k++) y[k]=bpRun(f,y[k])*Math.pow(Math.sin(Math.PI*k/y.length),.7);
    mixIn(x,y,sr,at,g); };
  const burst=(at,fc)=>{ const y=noise(Math.round(sr*.03),rnd), f=bpSet(BP(),sr,fc,1.6);
    for(let k=0;k<y.length;k++) y[k]=bpRun(f,y[k])*Math.exp(-k/sr*120);
    mixIn(x,y,sr,at,.75); };
  for(const e of ev){
    if(e.c==="s") hiss(e.s,.16,.6);
    else if(e.c==="t"||e.c==="k") burst(e.vs-.012,e.c==="t"?4300:1900);
    else if(e.c==="ts"){ burst(e.s+.02,4300); hiss(e.s+.03,.1,.5); } }
  return x;
}

/* ---- ドアをたたく1発：低い胴鳴り＋板をたたく音＋枠のガタつき ---- */
function knock(x,sr,rnd,at,o){
  o=o||{}; const s=o.s==null?1:o.s, bf=(o.body||85)*(.94+rnd()*.12), slapG=o.slap==null?1:o.slap, ratG=o.rattle==null?1:o.rattle;
  const i0=Math.round(at*sr), n=Math.min(x.length-i0,Math.round(sr*.5));
  const f=bpSet(BP(),sr,650+rnd()*350,1.2), f2=bpSet(BP(),sr,2000+rnd()*600,3);
  let p1=0,p2=0,p3=0;
  for(let k=0;k<n;k++){ const t=k/sr;
    p1+=TAU*bf*(1+1.5*Math.exp(-t*40))/sr; p2+=TAU*bf*2.3*(1+Math.exp(-t*50))/sr; p3+=TAU*bf*4.1/sr;
    const thud=Math.sin(p1)*Math.exp(-t*18)+.5*Math.sin(p2)*Math.exp(-t*30)+.25*Math.sin(p3)*Math.exp(-t*45);
    const nz=rnd()*2-1;
    const slap=bpRun(f,nz)*Math.exp(-t*60)*3*slapG;
    const rat=(t>.01&&t<.2) ? bpRun(f2,nz)*.5*Math.exp(-(t-.01)*20)*(rnd()<.3?1:.2)*ratG : 0;
    x[i0+k]+=s*(Math.tanh(1.5*thud*s)+slap+rat);
  }
}
const SYNTH = {
  /* 女のうめき声（低い）「うぅぅおぉぁぁ…」 */
  moanLow(sr,rnd){ const d=.5;
    return voice(sr,rnd,{dur:d, f0:t=>205+35*Math.sin(Math.PI*t/d)-25*t/d,
      vow:[[0,"u"],[.18,"o"],[.35,"a"],[.5,"o"]], breath:.45, vib:[5.5,30], rough:.18, bw:1.3,
      amp:t=>envAR(t,d,.07,.15)}); },
  /* 女のうめき声（なげき）「あぁぁぁ…」高く上がって落ちる */
  moanHigh(sr,rnd){ const d=.5;
    return voice(sr,rnd,{dur:d, f0:t=>{ const u=t/d; return u<.35 ? 290+150*(u/.35) : 440-200*((u-.35)/.65); },
      vow:[[0,"o"],[.07,"a"],[.35,"a"],[.5,"u"]], breath:.3, vib:[6,50], rough:.12, bw:1.2,
      amp:t=>envAR(t,d,.05,.16)}); },
  /* ドアをはげしくたたく（ドン！ドン！ドン！…）同じ間隔・同じ強さで14回 */
  bangHard(sr,rnd){ const step=.21, cnt=14, x=arr(sr,step*cnt+.5);
    for(let k=0;k<cnt;k++) knock(x,sr,rnd,k*step+(rnd()-.5)*.006,{s:.9+rnd()*.08});
    return x; },
  /* ささやき「わすれもの…」 */
  wasuremono(sr,rnd){ return whisperWord(sr,rnd,[["w","a",.30],["s","u",.25],["r","e",.26],["m","o",.28],["n","o",.80]]); },
  /* ささやき「みつけて…」 */

/* WAV（16bit・モノラル）を読んで、sr の速さに直す（直線でつなぐ） */
function wavAt(b64,sr){
  const bin=atob(b64), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  const dv=new DataView(u.buffer), fsr=dv.getUint32(24,true), n=(u.length-44)>>1;
  const m=Math.round(n*sr/fsr), x=new Float32Array(m);
  for(let i=0;i<m;i++){ const p=i*fsr/sr, k=Math.floor(p), f=p-k;
    const a=dv.getInt16(44+2*Math.min(k,n-1),true), b=dv.getInt16(44+2*Math.min(k+1,n-1),true);
    x[i]=(a+(b-a)*f)/32768; }
  return x;
}
function renderPad(id,sr,variant){
  const idx=PADS.find(p=>p.id===id).seed, takes=SAMPLE_WAV[id];
  const x=takes ? wavAt(takes[(variant||0)%takes.length],sr) : SYNTH[id](sr,mulberry32(1234+idx*7919+(variant||0)*104729));
  return normalize(fadeEdges(x,sr,.001,.02),.9);
}

/* ============ BGM（すき間なくくり返せる長さで作る）============ */
/* 終わりと頭を T 秒かけて重ねる（ずっと続く音） */
function foldFade(x,sr,L,T){ const n=Math.round(L*sr), m=Math.round(T*sr), y=x.slice(0,n);
  for(let i=0;i<m;i++){ const a=i/m; y[i]=x[i]*a+x[n+i]*(1-a); }
  return y; }

const BGM_SYNTH = {
  /* 不気味な低音：うなる低い音＋ときどき増える不協和音＋遠くの高い音 */
  drone(sr,rnd){ const L=24, T=3, x=arr(sr,L+T), q=f=>Math.round(f*L)/L;
    const f1=q(55),f2=q(55.25),f3=q(82.4),f4=q(77.8),f5=q(1244.5),f6=q(1318.5);
    const nz=normalize(lp(lp(noise(x.length,rnd),sr,150),sr,150),1);
    const tri=new Float32Array(x.length);
    for(let i=0;i<x.length;i++){ const t=i/sr; tri[i]=saw(f4*t)+saw(q(77.8*1.005)*t); }
    lp(lp(tri,sr,350),sr,350);
    for(let i=0;i<x.length;i++){ const t=i/sr;
      const l1=.5-.5*Math.cos(TAU*t/12), l2=.5-.5*Math.cos(TAU*t/24);
      const gl=Math.pow(Math.max(0,Math.sin(TAU*t/12-1)),3)*(.6+.4*Math.sin(TAU*t/2));
      x[i]=.5*Math.sin(TAU*f1*t)+.4*Math.sin(TAU*f2*t)+.25*Math.sin(TAU*f3*t)*(.4+.6*l1)
          +.5*tri[i]*l2*l2+(.06*Math.sin(TAU*f5*t)+.05*Math.sin(TAU*f6*t))*gl+nz[i]*.3*(.5+.5*l1); }
    return normalize(foldFade(x,sr,L,T),.7); },
};
const BGMS = [
  {id:"drone",   name:"不気味な低音",       vol:70},
];
function renderBgm(id,sr){ if(!BGM_SYNTH[id]) return null; const idx=BGMS.findIndex(b=>b.id===id); return BGM_SYNTH[id](sr,mulberry32(777+idx*7919)); }

/* ============ 状態 ============ */
const pads = PADS.map((p,i)=>({i,id:p.id,name:p.name,c:p.c,kind:p.kind,auto:p.auto,vol:100,pitch:0,bufs:[],last:-1}));
const bgms = BGMS.map((b,i)=>({i,id:b.id,name:b.name,vol:b.vol,on:false,ab:null,src:null,g:null}));
let masterVol=85, autoOn=false, freqMul=1, autoNext={a:0,s:0};
const $ = id => document.getElementById(id);

/* ============ 音を鳴らす ============ */
let ctx=null, master=null, bus=null;
const active=new Set();
function ensureCtx(){
  if(ctx){ if(ctx.state==="suspended") ctx.resume(); return ctx; }
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC){ toast("このブラウザでは音が出せません"); return null; }
  /* "playback"：音をためる量を多めにする。スマホの処理に余裕ができ、音がとぎれにくい（少し遅れて鳴るが、お化け屋敷では気にならない） */
  try{ ctx=new AC({latencyHint:"playback"}); }catch(e){ ctx=new AC(); }
  master=ctx.createGain(); master.gain.value=masterVol/100;
  const comp=ctx.createDynamicsCompressor();     // 重ねて鳴らしても音が割れないように
  /* それでも山が 1 をこえそうなときは、平らに切らずに丸める（ソフトクリッパー）。切ると「ビー」「バリッ」と鳴る */
  const shaper=ctx.createWaveShaper(), N=2048, curve=new Float32Array(N);
  for(let i=0;i<N;i++){ const v=i/(N-1)*2-1; curve[i]=Math.abs(v)<.8 ? v : Math.sign(v)*(.8+.2*Math.tanh((Math.abs(v)-.8)/.2)); }
  shaper.curve=curve; shaper.oversample="2x";
  master.connect(comp); comp.connect(shaper); shaper.connect(ctx.destination);
  bus=ctx.createGain(); bus.connect(master);       // 効果音と BGM はここに集まる（エコー・残響はかけない）
  for(const b of bgms) if(b.on) startBgm(b);
  setTimeout(prerender,200);
  return ctx;
}
function toBuffer(x,sr){ const ab=ctx.createBuffer(1,x.length,sr); ab.copyToChannel(x,0); return ab; }
function padBuffer(p,v){ return p.bufs[v] || (p.bufs[v]=toBuffer(renderPad(p.id,ctx.sampleRate,v),ctx.sampleRate)); }
function bgmBuffer(b){ return b.ab || (b.ab=toBuffer(renderBgm(b.id,ctx.sampleRate),ctx.sampleRate)); }
/* 最初の音を出したあと、残りの音を少しずつ作っておく（押したときに待たせない） */
function prerender(){
  const job=bgms.find(b=>!b.ab) || null;
  if(job){ bgmBuffer(job); setTimeout(prerender,60); return; }
  for(const p of pads) for(let v=0;v<NVAR;v++) if(!p.bufs[v]){ padBuffer(p,v); setTimeout(prerender,30); return; }
}
/* 鳴っている効果音を短くフェードして止める（いきなり切るとプツッと鳴る） */
function fadeOut(v,sec){ const t=ctx.currentTime;
  try{ v.g.gain.cancelScheduledValues(t); v.g.gain.setValueAtTime(v.g.gain.value,t); v.g.gain.linearRampToValueAtTime(0,t+sec); v.src.stop(t+sec+.02); }catch(e){}
  active.delete(v); }
/* o.pan：左右（-1〜1）、o.rate：高さを少し変える（自動おどかしで使う） */
function playPad(i,o){
  o=o||{}; flash(i); const c=ensureCtx(); if(!c) return;
  const p=pads[i]; let v=Math.floor(Math.random()*NVAR); if(v===p.last) v=(v+1)%NVAR; p.last=v;
  for(const a of [...active]) if(a.i===i) fadeOut(a,.08);                   // 同じパッドは重ねず、前の音と入れかえる
  while(active.size>=MAX_VOICES) fadeOut(active.values().next().value,.08);  // 上限をこえたら、いちばん古い音から止める
  const src=c.createBufferSource(), g=c.createGain();
  src.buffer=padBuffer(p,v);
  src.playbackRate.value=Math.pow(2,p.pitch/12)*(o.rate||(1+(Math.random()-.5)*.03));
  g.gain.value=p.vol/100; src.connect(g);
  if(o.pan&&c.createStereoPanner){ const pn=c.createStereoPanner(); pn.pan.value=o.pan; g.connect(pn); pn.connect(bus); } else g.connect(bus);
  src.start();
  const a={i,src,g}; active.add(a); src.onended=()=>active.delete(a);
}
function stopSfx(){ if(!ctx){ active.clear(); return; } for(const a of [...active]) fadeOut(a,.15); }
function startBgm(b){
  if(!ctx||b.src) return;
  const src=ctx.createBufferSource(), g=ctx.createGain(), now=ctx.currentTime;
  src.buffer=bgmBuffer(b); src.loop=true;
  g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(b.vol/100,now+1.5);   // ふわっと入る
  src.connect(g); g.connect(bus); src.start();
  b.src=src; b.g=g;
}
function stopBgm(b){
  if(!ctx||!b.src) return;
  const now=ctx.currentTime, g=b.g, src=b.src;
  g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value,now); g.gain.linearRampToValueAtTime(0,now+2);
  try{ src.stop(now+2.1); }catch(e){}
  b.src=null; b.g=null;
}
function toggleBgm(i){ const b=bgms[i]; b.on=!b.on;
  if(b.on){ if(ensureCtx()) startBgm(b); } else stopBgm(b);
  renderBgms(); }
function stopAll(){ stopSfx(); for(const b of bgms){ if(b.on){ b.on=false; stopBgm(b); } } renderBgms(); }

/* 画面が消えると音も止まるので、使っている間は画面を消さない（対応していないブラウザでは何もしない） */
let wakeLock=null;
function keepAwake(){ try{ if(navigator.wakeLock&&!wakeLock) navigator.wakeLock.request("screen").then(l=>{ wakeLock=l; l.addEventListener("release",()=>{ wakeLock=null; }); }).catch(()=>{}); }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&ctx) keepAwake(); });

/* ============ 自動おどかし：★の付いた音から、ばらばらの間隔で1つ鳴らす ============
   気配（a：うめき声・ドア・足音など）は 8〜16秒おき、不意打ち（s：悲鳴・バタンなど）は 18〜35秒おき。少なめ・多めで間隔を伸び縮みさせる */
const AUTO_RANGE = {a:[8,16], s:[18,35]};
function scheduleAuto(k){ const [lo,hi]=AUTO_RANGE[k]; autoNext[k]=Date.now()+(lo+Math.random()*(hi-lo))*freqMul*1000; }
function autoTick(){
  if(!autoOn){ renderAuto(); return; }
  for(const k of ["a","s"]) if(Date.now()>=autoNext[k]){
    const c=pads.filter(p=>p.auto&&p.kind===k);
    if(c.length) playPad(c[Math.floor(Math.random()*c.length)].i,{pan:Math.random()*1.6-.8, rate:.94+Math.random()*.12});
    scheduleAuto(k); }
  renderAuto();
}
function setAuto(on){ autoOn=on; if(on){ ensureCtx(); keepAwake(); scheduleAuto("a"); scheduleAuto("s"); } renderAuto(); }

/* ============ 保存（ブラウザの中だけ）============ */
const LS_KEY="kyouiku-obake-v7";
function saveSettings(){
  try{ localStorage.setItem(LS_KEY,JSON.stringify({masterVol,freqMul,
    pads:pads.map(p=>({vol:p.vol,pitch:p.pitch,auto:p.auto})), bgms:bgms.map(b=>({id:b.id,vol:b.vol}))})); }catch(e){}
}
function loadSettings(){
  try{ const s=JSON.parse(localStorage.getItem(LS_KEY)||"null"); if(!s) return;
    if(typeof s.masterVol==="number") masterVol=s.masterVol;
    if(typeof s.freqMul==="number") freqMul=s.freqMul;
    (s.pads||[]).forEach((q,i)=>{ const p=pads[i]; if(!p||!q) return;
      if(typeof q.vol==="number") p.vol=q.vol; if(typeof q.pitch==="number") p.pitch=q.pitch; if(typeof q.auto==="boolean") p.auto=q.auto; });
    (s.bgms||[]).forEach(q=>{ const b=bgms.find(x=>q&&x.id===q.id); if(b&&typeof q.vol==="number") b.vol=q.vol; });
  }catch(e){}
}

/* ============ 画面 ============ */
const padEls=[], cellEls=[];
const fmtPitch = v => (v>0?"+":"")+v;
function buildPads(){
  const box=$("pads");
  pads.forEach((p,i)=>{
    const c=document.createElement("div"); c.className="cell";
    c.innerHTML='<button class="pad"><span class="ky">'+keyLabel(KEYS[i])+'</span><span class="au">★</span><span class="nm"></span></button>'
      +'<div class="ctl"><span>音量</span><input type="range" class="vol" min="0" max="150" step="5" aria-label="音量"><b class="vv"></b></div>'
      +'<div class="ctl"><span>高さ</span><input type="range" class="pit" min="-12" max="12" step="1" aria-label="高さ"><b class="pv"></b>'
      +'<button class="star" title="自動おどかしで鳴らすかどうか"></button></div>';
    const b=c.querySelector(".pad"); b.style.setProperty("--c",p.c);
    b.addEventListener("pointerdown",e=>{ e.preventDefault(); hitPad(i); });
    b.addEventListener("contextmenu",e=>e.preventDefault());
    c.querySelector(".vol").addEventListener("input",e=>{ p.vol=+e.target.value; renderPads(); saveSettings(); });
    c.querySelector(".pit").addEventListener("input",e=>{ p.pitch=+e.target.value; renderPads(); saveSettings(); });
    c.querySelector(".pit").addEventListener("change",()=>playPad(i));   // 高さを変えたら、手をはなしたときに1回鳴らして聞かせる
    c.querySelector(".star").addEventListener("click",()=>{ p.auto=!p.auto; renderPads(); renderAuto(); saveSettings(); });
    box.appendChild(c); padEls.push(b); cellEls.push(c);
  });
  $("bgmBtn").addEventListener("pointerdown",e=>{ e.preventDefault(); keepAwake(); toggleBgm(0); });
  $("bgmVol").addEventListener("input",e=>{ const g=bgms[0]; g.vol=+e.target.value; if(g.g&&ctx) g.g.gain.setTargetAtTime(g.vol/100,ctx.currentTime,.1); renderBgms(); saveSettings(); });
}
function hitPad(i){ keepAwake(); playPad(i); }
function flash(i){ const el=padEls[i]; if(!el) return; el.classList.remove("hit"); void el.offsetWidth; el.classList.add("hit");
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("hit"),130); }
function renderPads(){
  pads.forEach((p,i)=>{ const c=cellEls[i];
    c.querySelector(".nm").textContent=p.name;
    c.querySelector(".vol").value=p.vol; c.querySelector(".vv").textContent=p.vol+"%";
    c.querySelector(".pit").value=p.pitch; c.querySelector(".pv").textContent=fmtPitch(p.pitch);
    c.querySelector(".star").textContent=p.auto?"★自動":"☆自動";
    c.classList.toggle("auto",p.auto); });
}
function renderBgms(){ const b=bgms[0];
  $("bgmbar").classList.toggle("on",b.on);
  $("bgmState").textContent=b.on?"♪ 鳴っている":"止まっている";
  $("bgmVol").value=b.vol; $("vBgm").textContent=b.vol+"%"; }
function renderPanel(){
  $("mVol").value=masterVol; $("vMVol").textContent=masterVol+"%";
  document.querySelectorAll("#freq button").forEach(b=>b.classList.toggle("sel",+b.dataset.f===freqMul));
}
function renderAuto(){
  $("autoBtn").classList.toggle("on",autoOn);
  $("autoBtn").textContent="自動おどかし："+(autoOn?"ON":"OFF");
  const st=$("autoSt"), na=pads.filter(p=>p.auto&&p.kind==="a").length, ns=pads.filter(p=>p.auto&&p.kind==="s").length;
  const left=k=>Math.max(0,Math.ceil((autoNext[k]-Date.now())/1000));
  st.classList.toggle("on",autoOn);
  st.textContent = !autoOn ? "★の音（気配 "+na+"・不意打ち "+ns+"）をばらばらに鳴らす"
    : na+ns===0 ? "★の付いた音がありません（パッドの下の ☆自動 を押す）"
    : [na?"気配 あと "+left("a")+" 秒":"", ns?"不意打ち あと "+left("s")+" 秒":""].filter(Boolean).join("　");
}
let toastT=0;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),3500); }

function bindPanel(){
  $("mVol").oninput=e=>{ masterVol=+e.target.value; if(master) master.gain.value=masterVol/100; renderPanel(); saveSettings(); };
  document.querySelectorAll("#freq button").forEach(b=>b.onclick=()=>{ freqMul=+b.dataset.f;
    if(autoOn){ scheduleAuto("a"); scheduleAuto("s"); } renderPanel(); renderAuto(); saveSettings(); });
  $("autoBtn").onclick=()=>setAuto(!autoOn);
  $("stopSfx").onclick=stopSfx;
  $("stopAllTop").onclick=stopAll;
  document.addEventListener("keydown",e=>{
    if(e.repeat) return;
    const i=KEYS.indexOf(e.code);
    if(i>=0){ e.preventDefault(); hitPad(i); return; }
    const j=BGM_KEYS.indexOf(e.code);
    if(j>=0){ e.preventDefault(); toggleBgm(j); return; }
    if(e.code==="Space"){ e.preventDefault(); stopSfx(); }
    else if(e.code==="Escape"){ e.preventDefault(); stopAll(); }
  });
}

$("ver").textContent="版 "+VER;
loadSettings(); buildPads(); bindPanel(); renderPads(); renderBgms(); renderPanel(); renderAuto();
setInterval(autoTick,500);

/* 検証用の窓口（regression-obake.js が叩く） */
window.OBAKE = { VER, KEYS, BGM_KEYS, NVAR, MAX_VOICES, SAMPLE_WAV, PADS, BGMS, SYNTH, BGM_SYNTH, pads, bgms, renderPad, renderBgm, peakOf,
  hitPad, toggleBgm, stopAll, setAuto, get autoOn(){ return autoOn; }, get freqMul(){ return freqMul; } };
</script>
</body>
</html>
