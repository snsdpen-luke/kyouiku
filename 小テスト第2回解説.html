<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>小テスト第2回 解説</title>
<style>
/* 先生が大画面に映す解説スライド集。わからないところアンケートの31項目（ASK の番号と同じ）ごとに4枚：
   問い → しくみ → 例題（→ で1段ずつ出す）→ 記述で確かめる（→ で模範解答）。1024x768 の舞台を拡大縮小。ライトモード固定 */
:root{
  --bg:#eef2f6; --paper:#ffffff; --ink:#1c2836; --sub:#5b6876; --line:#d5dde6;
  --accent:#2a5fc4; --accent-soft:#e3ebfa; --ok:#1d7f55; --ok-soft:#e1f3ea; --warm:#c7741f; --warm-soft:#fff3e2; --panel:#f3f6f9;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Meiryo",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body)}
#vp{position:relative;width:100%;height:100%;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1024px;height:768px;background:var(--paper);border-radius:6px;display:flex;flex-direction:column;overflow:hidden;transform:translate(-50%,-50%)}
#view{flex:1;min-height:0;display:flex;flex-direction:column}
header.top{display:flex;align-items:baseline;gap:14px;padding:20px 28px 6px}
header.top .no{font-weight:700;color:var(--accent);font-size:18px;white-space:nowrap}
header.top h2{margin:0;font-weight:900;font-size:30px;line-height:1.3}
header.top .kind{margin-left:auto;font-size:16px;font-weight:700;color:var(--sub);white-space:nowrap}
.body{flex:1;min-height:0;padding:8px 32px 12px;display:flex;flex-direction:column;gap:14px;font-size:calc(28px*var(--k,1));line-height:1.55;overflow:hidden}
/* 一覧 */
.idx{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px;font-size:calc(15px*var(--k,1))}
.ch h3{margin:0 0 4px;font-size:14px;color:var(--sub);letter-spacing:.05em}
.ch button{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;border:1px solid var(--line);background:#fbfcfe;border-radius:7px;padding:4px 8px;margin:0 0 4px;font:inherit;color:inherit;cursor:pointer;line-height:1.35}
.ch button:hover{border-color:var(--accent);background:var(--accent-soft)}
.ch button b{color:var(--accent);min-width:1.6em;text-align:right;font-variant-numeric:tabular-nums}
.lead{font-size:17px;color:var(--sub);margin:0}
/* 問い */
.ask{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:0 24px}
.ask .tag{color:var(--accent);font-weight:700;letter-spacing:.1em;font-size:20px}
.ask .q{font-size:calc(44px*var(--k,1));font-weight:900;line-height:1.4;margin:0}
.ask .qs{font-size:calc(28px*var(--k,1));color:var(--sub);margin:0}
/* 図 */
.fig{display:flex;align-items:stretch;gap:6px;flex-wrap:nowrap}
.fig .bx{flex:1;min-width:0;border:2px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:8px 8px;text-align:center;font-weight:700;font-size:calc(22px*var(--k,1));line-height:1.35;display:flex;align-items:center;justify-content:center;white-space:pre-line}
.fig .bx.w{border-color:var(--warm);background:var(--warm-soft)}
.fig .bx.g{border-color:var(--ok);background:var(--ok-soft)}
.fig .ar{align-self:center;color:var(--sub);font-weight:900;font-size:24px;flex:none}
table.tb{border-collapse:collapse;width:100%;font-size:calc(23px*var(--k,1));line-height:1.4}
table.tb th,table.tb td{border:1px solid var(--line);padding:6px 10px;vertical-align:top;text-align:left}
table.tb th{background:var(--panel);font-weight:700}
table.tb td:first-child{font-weight:700;background:#fbfcfe;white-space:nowrap}
ul.pts{margin:0;padding-left:1.2em}
ul.pts li{margin:0 0 6px}
ul.pts li b,.st b{color:var(--accent)}
/* 例題 */
.exq{background:var(--panel);border-radius:10px;padding:12px 16px;font-weight:700;white-space:pre-line}
ol.st{margin:0;padding-left:1.6em}
ol.st li{margin:0 0 8px;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s}
ol.st li.on{opacity:1;transform:none}
ol.st li.ans{font-weight:900;color:var(--ok)}
.more{font-size:16px;color:var(--sub)}
/* 記述 */
.wq{border-left:6px solid var(--accent);padding:6px 0 6px 14px;font-weight:700;white-space:pre-line}
.ans{display:none;gap:10px;flex-direction:column}
.ans.on{display:flex}
.model{background:var(--ok-soft);border-radius:10px;padding:12px 16px}
.model h4,.keys h4{margin:0 0 4px;font-size:16px;color:var(--ok);letter-spacing:.08em}
.keys{background:var(--warm-soft);border-radius:10px;padding:10px 16px;font-size:calc(23px*var(--k,1))}
.keys h4{color:var(--warm)}
.keys ul{margin:0;padding-left:1.2em}
.btnrow{display:flex;gap:10px}
.btn{font:inherit;font-size:18px;font-weight:700;border:0;border-radius:8px;padding:8px 18px;background:var(--accent);color:#fff;cursor:pointer}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.35;cursor:default}
/* 下の帯 */
footer{display:flex;align-items:center;gap:10px;padding:10px 20px;border-top:1px solid var(--line);background:#fbfcfe}
footer .dots{display:flex;gap:6px;margin:0 auto}
footer .dots i{width:30px;height:8px;border-radius:4px;background:var(--line)}
footer .dots i.on{background:var(--accent)}
footer .pg{font-size:14px;color:var(--sub);min-width:120px;text-align:right}
#note{position:absolute;left:20px;right:20px;bottom:64px;background:#fffbe8;border:1px solid #e6d58a;border-radius:8px;padding:10px 14px;font-size:16px;line-height:1.6;white-space:pre-line}
.ver{position:absolute;right:10px;top:6px;font-size:11px;color:var(--sub)}
</style>
</head>
<body>
<div id="vp"><div id="stage">
 <div class="ver" id="ver"></div>
 <div id="view"></div>
 <footer>
  <button class="btn ghost" id="home">一覧</button>
  <button class="btn ghost" id="prev">← 前へ</button>
  <div class="dots" id="dots"></div>
  <span class="pg" id="pg"></span>
  <button class="btn" id="next">次へ →</button>
 </footer>
 <div id="note" hidden></div>
</div></div>
<script>
(()=>{
const VER="2026-11-16b";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// **〜** を強調にする（中身は esc 済み）
const rich=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const CH={A:'メッセージが届くまで',B:'速い・遅いの正体',C:'電波はどこまで届くか',D:'パスワードは何秒で破られる？',E:'残高はどこにある？',F:'サトシ・ナカモト事件ファイル'};
// n はアンケート（ふりかえり演習.html の ASK）の番号と同じ。
// q 問い / qs 問いの下の一言 / fig 図（箱を → でつなぐ。先頭が ! は橙、# は緑）/ tbl 表 / pts しくみ / ex 例題（st は1段ずつ出す。最後が答え）/ w 記述（m 模範解答、k 採点の観点）/ nt 先生用メモ
const D=[
{n:1,s:'A',t:'パケットに分けて送る（パケットの数・バイトの計算）',
 q:'6,000,000バイトの動画は、いくつの箱に分かれて届く？',qs:'インターネットでは、大きなデータをそのまま1つでは送りません。',
 fig:['大きなデータ\n6,000,000バイト','1,500バイトずつ\nに切る','番号つきの箱\n（パケット）','相手が番号順に\n並べ直す'],
 pts:['**パケットの数 ＝ 全体のバイト数 ÷ 1つに入るバイト数**','文字のバイト数（この授業の約束）：日本語1文字＝**3バイト**、英数字1文字＝**1バイト**','「1％が消えた」は「100個に1個」。消えた数 ＝ パケットの数 × 0.01'],
 ex:{q:'4,500,000バイトの写真を、1,500バイトずつのパケットに分けて送ります。\nとちゅうで2％が消えました。送り直すパケットは何個ですか。',
  st:['パケットの数：4,500,000 ÷ 1,500 ＝ **3,000個**','2％は「100個に2個」なので × 0.02','消えた数：3,000 × 0.02 ＝ 60個','答え　60個（TCPなら、この60個だけを送り直します）']},
 w:{q:'大きなデータを小さなパケットに分けて送ると、どんな良いことがありますか。「送り直し」という言葉を使って説明しなさい。',
  m:'とちゅうで一部が消えても、消えたパケットだけを送り直せばよく、データ全部を最初から送り直さなくてすむ。',
  k:['消えた分（一部）だけ送り直せばよい、と書けている','全部を送り直さなくてよい（むだが少ない）、と書けている']},
 nt:'割り算のあとに×0.01（％）がつながると崩れる生徒が多い。「100個に1個」と言いかえる。\n日本語のバイト数（3バイト）は「明日10時」＝11バイトの例も使える。'},
{n:2,s:'A',t:'ヘッダ（宛先・送信元・番号）',
 q:'宅配便の送り状がない荷物は、どうなる？',qs:'パケットの先頭にも「送り状」が付いています。それがヘッダです。',
 tbl:{h:['ヘッダに書くこと','何に使う？'],r:[['宛先','ルーターが、次にどこへ運ぶかを決める'],['送信元','相手が「届いた」の返事（ACK）を返す先'],['番号','相手が元の順に並べる・欠けたものを見つける'],['ポート番号','同じ住所の中の、どのアプリ宛てか（部屋番号）']]},
 pts:['ルーターが見るのは**宛先だけ**。中身は読みません','パケットは別々の道を通ることがあり、着く順番はばらばらになります'],
 ex:{q:'ヘッダに「宛先」と「番号」はありますが、「送信元」がありません。どうなりますか。',
  st:['ルーターは宛先だけを見て運ぶ → 相手には**届く**','番号がある → 正しい順に**並べられる**','送信元がない → 「届いた」の返事を**どこへ返せばよいか分からない**','答え　届くが、返事（ACK）が返せない']},
 w:{q:'ヘッダに「番号」が書かれていないと、受け取った側は何が困りますか。理由とともに説明しなさい。',
  m:'パケットは別々の道を通り、着く順番がばらばらになる。番号がないと、元の順番に並べ直せない。また、どのパケットが欠けたかも分からず、送り直しをたのめない。',
  k:['着く順番がばらばらになる、と書けている','元の順に並べられない（または欠けが分からない）、と書けている']},
 nt:'宛先・送信元・番号を「送り状の3つの欄」として板書すると覚えやすい。'},
{n:3,s:'A',t:'IPアドレスと DNS',
 q:'「talk.example.com」という名前だけで、なぜ相手の場所が分かる？',qs:'ルーターが読めるのは、名前ではなく数字の住所です。',
 fig:['スマホ\n「talk.example.com\nはどこ？」','!DNS\n（ネットの電話帳）','「203.0.113.5\nです」','ヘッダの宛先に\n数字の住所を書く'],
 pts:['**IPアドレス**：ネットの上の数字の住所（例 203.0.113.5）','**DNS**：名前から数字の住所を調べるしくみ','ヘッダの宛先には数字を書くので、**DNSで調べるのが先**、パケットを作るのはそのあと'],
 ex:{q:'メッセージを送るとき、「DNSで住所を調べる」と「ヘッダを付ける」は、どちらが先ですか。',
  st:['ヘッダの宛先には、数字の住所（IPアドレス）を書く','名前（talk.example.com）のままでは、宛先に書けない','だから、まずDNSで数字の住所を調べる','答え　DNSが先']},
 w:{q:'DNSが止まると、サーバーそのものは動いていても、多くのサイトが開けなくなります。その理由を説明しなさい。',
  m:'サイトの名前から数字の住所（IPアドレス）を調べられなくなるので、パケットの宛先が書けず、送れないから。',
  k:['名前から数字の住所を調べられない、と書けている','宛先が書けない（送れない）、と書けている']},
 nt:'「電話帳」「住所録」のたとえで。小テスト第2回の並べかえ（DNS → ヘッダ → NAT → ルーター → ACK）の1つ目。'},
{n:4,s:'A',t:'ルーターと TTL',
 q:'道に迷ったパケットは、ずっとネットの中を回り続ける？',qs:'パケットには「寿命」が書いてあります。',
 fig:['送り出す\nTTL 3','ルーター\nTTL 2','ルーター\nTTL 1','!ルーター\nTTL 0\n→ 捨てる'],
 pts:['ルーターは**宛先を見て**、次のルーターへバケツリレーで運ぶ','**TTL**：ルーターを**1台通るごとに1減り**、**0になると捨てられる**','迷子のパケットが、いつまでも回り続けないためのしくみ'],
 ex:{q:'TTLを64にして送り出しました。\n① ルーターを10台通って届きました。届いたときのTTLは？\n② 道にルーターが70台あったら、どうなりますか。',
  st:['① 1台ごとに1減る：64 − 10 ＝ **54**','② 64台目のルーターで0になる','0になったところで捨てられる → 相手には**届かない**','答え　① 54　② とちゅうで捨てられて届かない']},
 w:{q:'TTLというしくみがないと、どんなことが起きますか。説明しなさい。',
  m:'宛先が見つからない迷子のパケットが、いつまでもルーターの間を回り続け、回線がむだに混んでしまう。',
  k:['迷子のパケットが回り続ける、と書けている','回線が混む（むだになる）、と書けている']},
 nt:'TTLは「ルーターを通れる残りの回数」。時間（秒）ではない点を確認。'},
{n:5,s:'A',t:'NAT（家の中の住所と外向きの住所）',
 q:'サーバーから見ると、あなたのスマホの住所はどう見える？',qs:'家（学校）の中の住所は、外ではそのまま使えません。',
 fig:['スマホ\n送信元\n192.168.0.12','!家のルーター（NAT）\n送信元を書き換え','外へ\n送信元\n203.0.113.77','#サーバー\nには 203.0.113.77\nに見える'],
 pts:['**192.168.〜** は家の中だけで使う住所。ほかの家にも同じ番号がある','外へ出るとき、ルーターが送信元を**外向きの住所**に書き換える（**NAT**）','返事は外向きの住所に届き、ルーターが家の中の機器に戻す'],
 ex:{q:'スマホ 192.168.0.12、家のルーター（外向き）203.0.113.77、サーバー 203.0.113.5 です。\nヘッダの送信元は、それぞれ何ですか。',
  st:['① スマホを出たところ：まだ家の中 → 送信元 **192.168.0.12**','② ルーターを出たところ：NATで書き換え → 送信元 **203.0.113.77**','③ サーバーが友だちへ送り直すとき：サーバーが新しく作る箱 → 送信元 **203.0.113.5**','答え　① 192.168.0.12　② 203.0.113.77　③ 203.0.113.5']},
 w:{q:'家の中のスマホの住所（192.168.0.12）は、ほかの家でも同じ番号が使われています。それでも混ざらずに通信できる理由を、「NAT」という言葉を使って説明しなさい。',
  m:'外へ出るときに、家のルーターがNATで送信元を、その家の外向きの住所に書き換えるから。外からは家ごとにちがう住所に見え、返事はルーターが家の中の機器に戻す。',
  k:['ルーターが送信元を外向きの住所に書き換える、と書けている','外からは家ごとにちがう住所に見える（返事はルーターが戻す）、と書けている']},
 nt:'小テスト第2回の穴うめ（ヘッダの住所）がそのまま例題。③はサーバーが「新しく箱を作る」のがポイント。'},
{n:6,s:'A',t:'TCP と UDP・ACK と再送',
 q:'ビデオ通話で映像が一瞬乱れても、止まらずに続くのはなぜ？',qs:'送り方には、TCPとUDPの2種類があります。',
 tbl:{h:['','TCP','UDP'],r:[['届いたかの確認','ACK（届いた）を待つ','確認しない'],['欠けたら','**送り直す（再送）**','そのまま次へ進む'],['向くもの','文字・写真・送金','ビデオ通話・ゲームの位置']]},
 pts:['1つも欠けてはいけないもの → **TCP**','古いデータを待つより、次のデータが大事なもの → **UDP**'],
 ex:{q:'TCPでパケットを送ったのに、ACKが返ってきません。送った側はどうしますか。',
  st:['しばらく待つ','返ってこなければ、そのパケットを**送り直す**','ACKが返ってくるまでくり返す','答え　送り直す（だからTCPは欠けずに届く）']},
 w:{q:'オンラインゲームのキャラの位置にUDPが使われる理由を、「再送」「古い」の2つの言葉を使って説明しなさい。',
  m:'TCPのように再送を待つと、届くのは古い位置で、そのあいだ画面が止まってしまう。古い位置より新しい位置が大事なので、再送しないUDPを使う。',
  k:['再送を待つと止まる（遅れる）、と書けている','古いデータより新しいデータが大事、と書けている']},
 nt:'ACKが返らない原因（行きで消えた・帰りで消えた・相手の電源が切れている・宛先がちがう）も合わせて確認できる。'},
{n:7,s:'B',t:'bps とバイトの計算（Mbps・MB・秒）',
 q:'100Mbpsの回線なら、100MBのファイルは1秒で届く？',qs:'まず予想してください。b と B のちがいがカギです。',
 fig:['データの量\nMB（バイト）','!× 8','Mb（ビット）','!÷ 速さ（Mbps）','#かかる秒数'],
 pts:['**b（小文字）＝ビット、B（大文字）＝バイト**。1バイト＝8ビット','bps は「1秒に送れるビットの数」','**秒 ＝ ビット数 ÷ 速さ**。MBのときは、先に×8してMbにする'],
 ex:{q:'40Mbpsの回線で、500MBの動画を受け取ります。何秒かかりますか。',
  st:['MBをMbにする：500 × 8 ＝ **4,000Mb**','秒 ＝ ビット数 ÷ 速さ：4,000 ÷ 40 ＝ 100','100秒 ＝ 1分40秒','答え　100秒']},
 w:{q:'「100Mbpsの回線なら、100MBのファイルが1秒で届く」は正しいですか。理由とともに説明しなさい。',
  m:'正しくない。Mbpsは1秒に送れるビットの数で、MBはバイトの数。1バイトは8ビットなので、100MBは800Mbになり、800 ÷ 100 ＝ 8秒かかる。',
  k:['正しくない、と答えている','ビットとバイトのちがい（×8）を使って、8秒と説明できている']},
 nt:'最初の問いで手を挙げさせる（1秒だと思う人？）。「小文字のbはビット」を一番に。'},
{n:8,s:'B',t:'回線を分け合う・ボトルネック',
 q:'光回線1Gbpsなのに、夜9時になると遅いのはなぜ？',qs:'通り道のどこか1か所でも細いと、全体が遅くなります。',
 fig:['家のWi-Fi\n300Mbps','!古いルーター\n100Mbps','光回線\n1Gbps（上限）','地域の回線\nみんなで分け合う'],
 pts:['全体の速さは、通り道で**いちばん細いところ（ボトルネック）**で決まる','回線は、同時に使う人数で**ほぼ均等に分け合う**（先に使った人が優先、はない）','1人あたりの速さ ＝ 回線の速さ ÷ 同時に使う人数'],
 ex:{q:'学校の回線は30Mbpsで、60人が同時に均等に使っています。3MBの写真を受け取るのに何秒かかりますか。',
  st:['1人あたり：30 ÷ 60 ＝ **0.5Mbps**','3MBをMbに：3 × 8 ＝ **24Mb**','24 ÷ 0.5 ＝ 48','答え　48秒（1人で使えば 24 ÷ 30 ＝ 0.8秒）']},

function figH(f){return '<div class="fig">'+f.map((b,i)=>{let c='';if(b[0]==='!'){c=' w';b=b.slice(1)}else if(b[0]==='#'){c=' g';b=b.slice(1)}
  return (i?'<span class="ar">→</span>':'')+`<div class="bx${c}">${rich(b)}</div>`}).join('')+'</div>'}
function tblH(t){return '<table class="tb"><tr>'+t.h.map(h=>`<th>${esc(h)}</th>`).join('')+'</tr>'+t.r.map(r=>'<tr>'+r.map(c=>`<td>${rich(c)}</td>`).join('')+'</tr>').join('')+'</table>'}
function maxStep(){if(item<0)return 0;const d=D[item];return page===2?d.ex.st.length:page===3?1:0}
function render(){
  const dots=$('dots');
  if(item<0){
    view.innerHTML=`<header class="top"><span class="no">小テスト第2回</span><h2>解説 ― わからないところアンケートの31項目</h2></header>
     <div class="body"><p class="lead">アンケートで多かった項目をタップします。1項目4枚（問い・しくみ・例題・記述で確かめる）。</p>
     <div class="idx">${Object.keys(CH).map(s=>`<div class="ch"><h3>${esc(CH[s])}</h3>${D.filter(d=>d.s===s).map(d=>`<button data-i="${D.indexOf(d)}"><b>${d.n}</b><span>${esc(d.t)}</span></button>`).join('')}</div>`).join('')}</div></div>`;
    view.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>open(+b.dataset.i));fit();
    dots.innerHTML='';$('pg').textContent='';$('prev').disabled=true;$('next').disabled=true;$('home').disabled=true;
    $('note').textContent=NOTE0;try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
    return;
  }
  const d=D[item];
  let h=`<header class="top"><span class="no">No.${d.n}　${esc(CH[d.s])}</span><span class="kind">${KIND[page]}</span></header>`;
  if(page===0){
    h+=`<div class="body"><div class="ask"><div class="tag">${esc(d.t)}</div><p class="q">${rich(d.q)}</p><p class="qs">${rich(d.qs)}</p></div></div>`;
  }else if(page===1){
    h=h.replace('</span><span class="kind">',`</span><h2>${esc(d.t)}</h2><span class="kind">`);
    h+='<div class="body">'+(d.fig?figH(d.fig):'')+(d.tbl?tblH(d.tbl):'')+(d.pts?'<ul class="pts">'+d.pts.map(p=>`<li>${rich(p)}</li>`).join('')+'</ul>':'')+'</div>';
  }else if(page===2){
    h=h.replace('</span><span class="kind">',`</span><h2>例題</h2><span class="kind">`);
    h+=`<div class="body"><div class="exq">${rich(d.ex.q)}</div><ol class="st">${d.ex.st.map((s,i)=>`<li class="${i<step?'on':''}${i===d.ex.st.length-1?' ans':''}">${rich(s)}</li>`).join('')}</ol>${step<d.ex.st.length?'<div class="more">→ で次の一行</div>':''}</div>`;
  }else{
    h=h.replace('</span><span class="kind">',`</span><h2>記述問題</h2><span class="kind">`);
    h+=`<div class="body"><div class="wq">${rich(d.w.q)}</div>
     <div class="btnrow"><button class="btn ghost" id="show">${step?'模範解答をかくす':'模範解答を見せる'}</button></div>
     <div class="ans${step?' on':''}"><div class="model"><h4>模範解答の例</h4>${rich(d.w.m)}</div><div class="keys"><h4>採点の観点（2つとも書けていれば○）</h4><ul>${d.w.k.map(k=>`<li>${rich(k)}</li>`).join('')}</ul></div></div></div>`;
  }
  view.innerHTML=h;
  if(page===3)$('show').onclick=()=>{step=step?0:1;render()};
  fit();
  dots.innerHTML=KIND.map((_,k)=>`<i class="${k===page?'on':''}"></i>`).join('');
  $('pg').textContent=`${page+1} / 4`;$('prev').disabled=false;$('next').disabled=page===3&&step>=1;$('home').disabled=false;
  $('note').textContent=`No.${d.n}　${KIND[page]}\n${NOTES[page]}\n${d.nt}`;
  try{history.replaceState(null,'','#'+d.n)}catch(e){}
}
// はみ出したら、その画面の文字を少しずつ小さくする
function fit(){const b=view.querySelector('.body');if(!b)return;let k=1;b.style.setProperty('--k',k);
  while(b.scrollHeight>b.clientHeight+1&&k>.6){k-=.04;b.style.setProperty('--k',k.toFixed(2))}}
function open(i){item=i;page=0;step=0;render()}
function next(){if(item<0)return;if(step<maxStep()){step++;render();return}if(page<3){page++;step=0;render()}}
function prev(){if(item<0)return;if(page===0){item=-1;render();return}page--;step=0;render()}
$('next').onclick=next;$('prev').onclick=prev;$('home').onclick=()=>{item=-1;render()};
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();next()}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}
  else if(e.key==='Escape'){item=-1;render()}
  else if(e.key==='n'||e.key==='N')$('note').hidden=!$('note').hidden});
const vp=$('vp'),stage=$('stage');
const scale=()=>{const s=Math.min(vp.clientWidth/1024,vp.clientHeight/768);stage.style.transform='translate(-50%,-50%) scale('+s+')'};
addEventListener('resize',scale);scale();
$('ver').textContent='版 '+VER;
const m=/^#(\d+)$/.exec(location.hash);const j=m?D.findIndex(d=>d.n===+m[1]):-1;
if(j>=0)open(j);else render();
window.__KAISETSU={D,open,next,prev,get state(){return{item,page,step}}};
})();
</script>
</body>
</html>
