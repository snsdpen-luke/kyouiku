<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>駐車を学習する車</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 4:3 固定ステージ（1024x768）。上：駐車場の地図、下：運転／記録／自動運転の切り替えパネル。ライト固定 */
:root{color-scheme:light;
  --bg:#e9edf1; --paper:#fbfcfd; --ink:#18212b; --sub:#5a6672; --line:#cfd6dd;
  --copper:#b8642a; --copper-soft:#f3e2d4; --steel:#3d5a73; --steel-soft:#cdd8e2;
  --lot:#e3e7ea; --mark:#fbfcfd; --good:#2c8a4f; --danger:#d23c32; --panel:#f1f4f7;
  --f-disp:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
[hidden]{display:none!important}
#vp{position:relative;width:100%;height:100%}
#stage{position:absolute;left:50%;top:50%;width:1024px;height:768px;background:var(--paper);border-radius:6px;box-shadow:0 2px 18px rgba(0,0,0,.12);overflow:hidden;display:flex;flex-direction:column;padding:10px 28px 12px;box-sizing:border-box;gap:8px}
header{display:flex;align-items:center;gap:14px}
header h1{margin:0;font-family:var(--f-disp);font-weight:400;font-size:24px;white-space:nowrap}
.grp{display:flex;gap:6px}
button{font:inherit;font-size:15px;border:2px solid var(--steel);background:var(--paper);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;user-select:none;-webkit-user-select:none}
button:hover{background:var(--panel)}
button.sel{background:var(--steel);color:var(--paper)}
button.go{background:var(--copper);border-color:var(--copper);color:#fff;font-weight:700}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--copper);outline-offset:2px}
.tabs button{border-radius:8px 8px 0 0;border-bottom-width:0;padding:6px 14px}
.sp{flex:1}
canvas{display:block;border-radius:6px;background:var(--lot);touch-action:none}
.cvwrap{position:relative}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);border-radius:6px}
.ovbox{background:var(--paper);border-radius:10px;padding:18px 28px;display:flex;flex-direction:column;gap:10px;align-items:center;min-width:300px}
.ovt{font-family:var(--f-disp);font-size:32px}
.overlay.win .ovt{color:var(--good)}.overlay.lose .ovt{color:var(--danger)}
.ovs{font-size:16px;color:var(--sub);text-align:center}
.panel{flex:1;min-height:0;display:flex;gap:22px;align-items:stretch}
.status{font-size:18px;font-weight:700}
.note{font-size:14px;color:var(--sub)}
/* 運転 */
.side{display:flex;flex-direction:column;gap:10px;flex:1;min-width:0;justify-content:center}
.gate{display:flex;flex-direction:column;gap:4px;background:var(--ink);padding:8px;border-radius:10px;align-self:center}
.gate button{width:58px;padding:4px 0;font-family:var(--f-num);font-size:20px;font-weight:700;background:transparent;border:2px solid transparent;color:var(--line)}
.gate button.sel{background:var(--copper);border-color:var(--copper);color:#fff}
.gate .gk{color:var(--line);text-align:center;font-family:var(--f-num);font-size:12px}
.wcol{display:flex;flex-direction:column;align-items:center;gap:6px;align-self:center}
.wheelbox{position:relative;width:210px;height:210px}
#cvWheel{background:transparent;cursor:grab;border-radius:50%}
.wv{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-family:var(--f-num);font-size:16px;font-weight:700;pointer-events:none}
.pedals{display:flex;gap:10px}
.pedal{width:104px;height:44px;padding:0;border-radius:10px;font-weight:700;background:var(--panel);touch-action:none}
.pedal.acc{width:92px;height:48px}
.pedal.sel:not(.acc){background:var(--danger);border-color:var(--danger);color:#fff}
.pedal.acc.sel{background:var(--good);border-color:var(--good);color:#fff}
.rec{display:inline-flex;align-items:center;gap:8px;font-size:15px}
.rec i{width:12px;height:12px;border-radius:50%;background:var(--danger);display:inline-block}
.count{font-family:var(--f-num);font-size:15px}
/* 記録を見る */
.runs{width:250px;flex:none;display:flex;flex-direction:column;gap:6px;overflow:auto}
.run{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:6px;padding:6px 8px;border:2px solid transparent;cursor:pointer;font-size:14px}
.run.sel{border-color:var(--copper)}
.run .sw{width:14px;height:14px;border-radius:3px;flex:none}
.run .nm{flex:1;min-width:0}
.run small{color:var(--sub);display:block}
.run input{width:18px;height:18px;accent-color:var(--copper)}
.run button{font-size:12px;padding:2px 6px;border-width:1px}
.tblwrap{flex:1;min-width:0;overflow:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);font-size:12px;color:var(--sub);text-align:center}
td.op{background:var(--copper-soft)}
th.op{background:var(--copper-soft);color:var(--copper)}
td.arrow,th.arrow{text-align:center;color:var(--sub);padding:5px 2px}
tr.chg td{font-weight:700}
tr.hl td{background:#fff3b0}
.empty{padding:20px;color:var(--sub);font-size:16px;line-height:1.7}
/* 自動 */
.acol{display:flex;flex-direction:column;gap:10px;width:300px;flex:none;justify-content:center}
.mimic{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;justify-content:center}
.mimic h3{margin:0;font-size:14px;color:var(--sub)}
.big{font-size:20px;font-weight:700}
</style>
</head>
<body>
<div id="vp"><div id="stage">
  <header>
    <h1>駐車を学習する車</h1>
    <div class="grp" id="stgs"></div>
    <span class="sp"></span>
    <button id="snd">音：ON</button>
  </header>
  <div class="grp tabs" id="tabs">
    <button data-t="drive" class="sel">① 運転してデータを集める</button>
    <button data-t="data">② 記録を見る</button>
    <button data-t="auto">③ 学習して自動運転</button>
  </div>
  <div class="cvwrap"><canvas id="cv" data-w="968" data-h="350"></canvas>
    <div class="overlay" id="ov" hidden><div class="ovbox"><div class="ovt" id="ovT"></div><div class="ovs" id="ovS"></div><div class="grp"><button id="ovOk" class="go">OK</button></div></div></div>
  </div>

  <div class="panel" id="pDrive">
    <div class="side">
      <div class="big" id="dStatus"></div>
      <div class="rec"><i></i><span id="dRec">記録中</span></div>
      <div class="count" id="dCount"></div>
      <div class="grp"><button id="dReset">はじめから</button></div>
    </div>
    <div class="gate" id="gate"><button data-g="P" class="sel">P</button><button data-g="R">R</button><button data-g="N">N</button><button data-g="D">D</button><small class="gk">↑↓</small></div>
    <div class="wcol">
      <div class="wheelbox"><canvas id="cvWheel" data-w="210" data-h="210" tabindex="0" aria-label="ハンドル"></canvas><div class="wv" id="wheelV">まっすぐ</div></div>
      <div class="pedals"><button id="brake" class="pedal">ブレーキ <small>Z</small></button><button id="accel" class="pedal acc">アクセル <small>X</small></button></div>
    </div>
  </div>

  <div class="panel" id="pData" hidden>
    <div class="runs" id="runs"></div>
    <div class="tblwrap" id="tblwrap"><table id="tbl"></table></div>
  </div>

  <div class="panel" id="pAuto" hidden>
    <div class="acol">
      <div class="grp"><button id="aLearn" class="go">学習する</button><button id="aGo">自動スタート</button></div>
      <div id="aInfo" class="note"></div>
      <div class="big" id="aStatus"></div>
      <div class="count" id="aScore"></div>
    </div>
    <div class="mimic">
      <h3>いま まねている記録</h3>
      <div class="tblwrap" style="flex:none"><table id="mtbl"></table></div>
      <div class="note" id="mNote"></div>
    </div>
  </div>
</div></div>

<script>
/* ===== 車と駐車場のモデル（単位 m） ===== */
const L=2.6,DMAX=35*Math.PI/180,RO=0.9,FO=3.5,HW=0.875;
const WALL=0.3,SX=1.0,ENTRY=5.8,AB=10.8,BSW=2.7,BUMP1=5.4,BUMP2=5.75,NSLOT=9;
const STAGES=[
 {id:'E',name:'イージー',sw:2.6,y0:8.3,empties:[2,3,4],tol:0.45,ang:0.10},
 {id:'N',name:'ノーマル',sw:2.3,y0:9.6,empties:[4,5,6],tol:0.30,ang:0.07},
 {id:'H',name:'ハード',  sw:2.2,y0:9.6,empties:[4,5,6],tol:0.20,ang:0.05,pillar:true}];
function makeWorld(st,empty){const sw=st.sw,o=[];
 for(let k=0;k<NSLOT;k++){if(k===empty)continue;const cx=SX+sw*k+sw/2;o.push([cx-HW,0.8,cx+HW,5.2,0]);}
 for(let k=-2;k<NSLOT+3;k++){const cx=SX+BSW*k+BSW/2;o.push([cx-HW,AB,cx+HW,AB+4.4,1]);}
 const sl=SX+sw*empty;if(st.pillar)o.push([sl-0.4,BUMP2+0.05,sl+0.08,BUMP2+0.6,2]);
 return {st,obs:o,empty,sw,gc:sl+sw/2};}
function corners(s){const c=Math.cos(s.th),n=Math.sin(s.th);return [[-RO,-HW],[FO,-HW],[FO,HW],[-RO,HW]].map(([a,b])=>[s.x+a*c-b*n,s.y+a*n+b*c]);}
function hit(W,s){const Cs=corners(s);for(let i=0;i<4;i++){const a=Cs[i],b=Cs[(i+1)%4];for(let t=0;t<1;t+=0.1){const x=a[0]+(b[0]-a[0])*t,y=a[1]+(b[1]-a[1])*t;
 if(y<WALL||x<-4.6||x>27||y>13.5)return true;for(const o of W.obs)if(x>o[0]&&x<o[2]&&y>o[1]&&y<o[3])return true;}}return false;}
function move(s,v,dt){s.x+=v*Math.cos(s.th)*dt;s.y+=v*Math.sin(s.th)*dt;s.th+=v*Math.tan(s.d)/L*dt;}
function rearDist(s){return s.y-RO*Math.sin(s.th)-WALL;}
function judge(W,s){const cx=s.x+1.3*Math.cos(s.th),front=s.y+FO*Math.sin(s.th);
 if(s.y>ENTRY)return {ok:false,t:'まだ枠に入っていません'};
 if(Math.abs(cx-W.gc)>W.st.tol)return {ok:false,t:'枠からずれています'};
 if(front>ENTRY+0.05)return {ok:false,t:'枠からはみ出しています'};
 if(Math.abs(s.th-Math.PI/2)>W.st.ang)return {ok:false,t:'ななめに止まっています'};return {ok:true,t:'駐車成功！'};}
function onBump(W,s){const c=Math.cos(s.th),n=Math.sin(s.th);let k=0;[0,L].forEach(a=>{const y=s.y+a*n,x=s.x+a*c;if(y>BUMP1&&y<BUMP2&&x>SX&&x<SX+W.sw*NSLOT)k++;});return k;}

/* ===== 記録と学習 ===== */
// 記録の1行：[時刻, 枠の真ん中からの前後(m), y, 向き(rad), ハンドル(-1左〜1右), 速さ(m/s), シフト, ペダル]
const DT=0.05,AHEAD=2,AHEADV=8,K=3;
function rowFeat(r){return [r[1]/3,(r[2]-7)/1.5,r[3]/0.6,r[4]*0.6,r[5]*0.2];}
function stateFeat(W,s){return [(s.x+1.3*Math.cos(s.th)-W.gc)/3,(s.y-7)/1.5,s.th/0.6,s.wh*0.6,s.v*0.2];}
// 学習：記録した全部の行を「状況 → そのあとの操作」の組にして覚える
function learn(runs){const mem=[];runs.forEach((run,ri)=>{const R=run.rows;for(let i=0;i<R.length;i++){const j=Math.min(R.length-1,i+AHEAD),jv=Math.min(R.length-1,i+AHEADV);
  if(Math.abs(R[i][5])<0.02&&Math.abs(R[jv][5])<0.02&&Math.abs(R[j][4]-R[i][4])<0.02&&i<R.length-1)continue; // 止まっているだけの行は使わない
  mem.push({f:rowFeat(R[i]),w:R[j][4],v:R[jv][5],ri,i});}});return mem;}
// 自動運転：今の状況にいちばん近い記録を K 個さがして、その操作をまねる
function decide(mem,f){const best=[];for(const m of mem){let d=0;for(let i=0;i<5;i++){const q=f[i]-m.f[i];d+=q*q;}
 if(best.length<K||d<best[best.length-1].d){best.push({d,m});best.sort((a,b)=>a.d-b.d);if(best.length>K)best.pop();}}
 if(!best.length)return {w:0,v:0,near:null};const w=best.reduce((a,b)=>a+b.m.w,0)/best.length,v=best.reduce((a,b)=>a+b.m.v,0)/best.length;return {w,v,near:best[0].m,dist:Math.sqrt(best[0].d)};}

 if(!man.crash&&!man.done&&(man.gear!=='P'||man.rows.length)){man.t+=dt;man.acc_t+=dt;while(man.acc_t>=DT){man.acc_t-=DT;recordRow();}}
 if(!man.done&&!man.crash&&man.gear==='P'&&man.v===0&&man.rows.length){const j=judge(W,s);
  if(j.ok){man.done=true;recordRow();const id=nextId++;runs.push({id,stage:ST.id,empty:W.empty,rows:man.rows,demo:false,use:true,color:COLORS[(id-1)%COLORS.length]});save();selRun=id;updCount();
   tone([523,659,784],0.25,0.07,'triangle');showOv('win','駐車成功！',`記録${stageRuns().length}として保存しました（${man.rows.length}行・${fmt(man.t,1)}秒）`);}
  else if(man.msgT<=0)say(j.t);}
 man.msgT-=dt;
 const st=$('dStatus');if(man.msgT>0){st.textContent=man.msg;st.style.color=C.danger;}else{st.textContent=ST.name+'　'+{P:'P',R:'R：バック',N:'N',D:'D：前進'}[man.gear];st.style.color=C.ink;}
 $('dRec').textContent=man.rows.length?`記録中　${man.rows.length} 行`:'シフトを入れると記録が始まります';
 draw(s,W,{guide:man.gear==='R',crash:man.crash});drawWheel();}

/* ===== ② 記録を見る ===== */
function buildRuns(){const box=$('runs');box.innerHTML='';const list=stageRuns();
 const top=document.createElement('div');top.className='grp';const bd=document.createElement('button');bd.textContent='見本データを入れる';bd.onclick=()=>{(DEMOS[ST.id]||[]).forEach(d=>{const id=nextId++;runs.push({id,stage:ST.id,empty:d.empty,rows:d.rows,demo:true,use:true,color:COLORS[(id-1)%COLORS.length]});});save();buildRuns();buildTable();updCount();};
 top.appendChild(bd);box.appendChild(top);
 if(!list.length){const p=document.createElement('div');p.className='empty';p.textContent='まだ記録がありません。①で駐車に成功すると、ここに増えます。';box.appendChild(p);return;}
 list.forEach((r,i)=>{const d=document.createElement('div');d.className='run'+(r.id===selRun?' sel':'');
  d.innerHTML=`<span class="sw" style="background:${r.color}"></span><span class="nm">記録${i+1}${r.demo?'（見本）':''}<small>${r.rows.length}行・${fmt(r.rows[r.rows.length-1][0],1)}秒</small></span>`;
  const cb=document.createElement('input');cb.type='checkbox';cb.checked=r.use;cb.title='学習に使う';cb.onclick=e=>{e.stopPropagation();r.use=cb.checked;save();au.mem=null;};
  const del=document.createElement('button');del.textContent='消す';del.onclick=e=>{e.stopPropagation();if(del.dataset.c){runs=runs.filter(x=>x!==r);save();if(selRun===r.id)selRun=null;buildRuns();buildTable();updCount();au.mem=null;}else{del.dataset.c=1;del.textContent='本当に？';}};
  d.appendChild(cb);d.appendChild(del);d.onclick=()=>{selRun=r.id;buildRuns();buildTable();};box.appendChild(d);});
 const n=document.createElement('div');n.className='note';n.textContent='☑ = 学習に使う';box.appendChild(n);}
const pedName={A:'アクセル',B:'ブレーキ','-':'—'};
const wheelName=w=>Math.abs(w)<0.03?'まっすぐ':(w<0?'左 ':'右 ')+fmt(Math.abs(w)*100)+'%';
const dxName=d=>(d>=0?'+':'')+fmt(d,1)+' m';
function rowCells(r){return `<td>${fmt(r[0],1)} 秒</td><td>${dxName(r[1])}</td><td>${fmt(r[2]-ENTRY,1)} m</td><td>${fmt(r[3]*180/Math.PI)}°</td><td class="arrow">→</td><td class="op">${wheelName(r[4])}</td><td class="op">${pedName[r[7]]}</td><td class="op">${r[6]}</td>`;}
const head=`<tr><th>時刻</th><th>枠の真ん中から<br>（前後）</th><th>枠の入口から<br>（通路側へ）</th><th>車の向き</th><th class="arrow"></th><th class="op">ハンドル</th><th class="op">ペダル</th><th class="op">シフト</th></tr>`;
function buildTable(){const t=$('tbl');const r=runs.find(x=>x.id===selRun);
 if(!r){t.innerHTML=`<tr><td class="empty" style="text-align:left">記録をえらぶと、ここに数字の表が出ます。<br>左（白）が「車が知っていること」、右（オレンジ）が「そのとき人がした操作」です。</td></tr>`;return;}
 let h=head,prev=null;r.rows.forEach((row,i)=>{const chg=prev&&(row[6]!==prev[6]||row[7]!==prev[7]);if(i%10===0||chg||i===r.rows.length-1)h+=`<tr class="${chg?'chg':''}" data-i="${i}">${rowCells(row)}</tr>`;prev=row;});
 t.innerHTML=h;}

/* ===== ③ 学習して自動運転 ===== */
$('aLearn').onclick=()=>{const use=stageRuns().filter(r=>r.use);if(!use.length){au.mem=null;$('aInfo').textContent='学習に使う記録がありません。①で集めるか、②で見本データを入れてください。';return;}
 au.mem=learn(use);au.useRuns=use;au.ok=0;au.n=0;$('aInfo').textContent=`記録 ${use.length} 回分（${au.mem.length} 行）を覚えました。`;updAuto();};
$('aGo').onclick=()=>{if(!au.mem){$('aInfo').textContent='先に「学習する」を押してください。';return;}const sc=newScene();au.W=makeWorld(ST,sc.e);au.s={x:0,y:sc.y0,th:0,d:0,wh:0,v:0};Object.assign(au,{run:true,res:null,t:0,still:0,acc:0,near:null});$('ov').hidden=true;updAuto();};
function updAuto(){$('aGo').disabled=!au.mem;$('aScore').textContent=au.n?`成功 ${au.ok} / ${au.n} 回`:'';
 if(!au.mem)$('aInfo').textContent=$('aInfo').textContent||'「学習する」を押すと、☑の記録を覚えます。';
 $('aStatus').textContent=au.res?au.res.t:au.run?'自動運転中…':'';$('aStatus').style.color=au.res?(au.res.ok?C.good:C.danger):C.ink;}
function tickAuto(dt){if(au.run){au.acc+=dt;while(au.acc>=DT&&au.run){au.acc-=DT;const c=decide(au.mem,stateFeat(au.W,au.s));au.near=c.near;autoStep(au.s,c);au.t+=DT;
   if(hit(au.W,au.s)){finishAuto({ok:false,t:'ぶつかった！'});break;}
   if(Math.abs(au.s.v)<0.02&&Math.abs(c.v)<0.05){au.still+=DT;if(au.still>1.5)finishAuto(judge(au.W,au.s));}else au.still=0;
   if(au.t>90)finishAuto({ok:false,t:'迷って止まりました'});}}
 if(au.s)draw({x:au.s.x,y:au.s.y,th:au.s.th,d:au.s.d},au.W,{traces:true,near:au.near,crash:au.res&&!au.res.ok&&au.res.t.startsWith('ぶつ')});
 else{const sc=W||makeWorld(ST,ST.empties[0]);draw(null,sc,{traces:true});}
 if(au.near){const r=au.useRuns[au.near.ri],row=r.rows[au.near.i];$('mtbl').innerHTML=head.replace('<tr>','<tr><th></th>')+`<tr class="hl"><td style="text-align:center"><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${r.color}"></span></td>${rowCells(row)}</tr>`;
  $('mNote').textContent=`記録${stageRuns().indexOf(r)+1}${r.demo?'（見本）':''}の ${fmt(row[0],1)} 秒の場面が、いまの状況にいちばん近い。だから、そのときの操作をまねています。`;}
 else{$('mtbl').innerHTML=head;$('mNote').textContent='';}}
function finishAuto(res){au.run=false;au.res=res;au.n++;if(res.ok){au.ok++;tone([523,659,784],0.25,0.07,'triangle');}else tone([180],0.35,0.1,'sawtooth');updAuto();}

/* ===== 描画 ===== */
let SC=30,OX=150,OY=-6;const P=(x,y)=>[OX+x*SC,OY+y*SC];
function drawLot(c,Wd){const w=968,h=350;const [x1]=P(-4.6,0),[x2]=P(27,0);c.fillStyle=C.ink;c.fillRect(0,0,x1,h);c.fillRect(x2,0,w,h);const [,wy]=P(0,WALL);c.fillRect(0,0,w,wy);
 c.strokeStyle=C.mark;c.lineWidth=3;for(let k=0;k<=NSLOT;k++){const [x,y1]=P(SX+Wd.sw*k,WALL);const [,y2]=P(0,ENTRY);c.beginPath();c.moveTo(x,y1);c.lineTo(x,y2);c.stroke();}
 for(let k=-2;k<=NSLOT+3;k++){const [x,y1]=P(SX+BSW*k,AB-0.5);c.beginPath();c.moveTo(x,y1);c.lineTo(x,h);c.stroke();}
 const y1=P(0,BUMP1)[1],y2=P(0,BUMP2)[1];for(let k=0;k<NSLOT;k++){const a=P(SX+Wd.sw*k,0)[0]+4,b=P(SX+Wd.sw*(k+1),0)[0]-4;c.fillStyle=C.line;c.fillRect(a,y1,b-a,y2-y1);c.strokeStyle=C.sub;c.lineWidth=1.5;c.beginPath();for(let x=a;x<b;x+=8){c.moveTo(x,y2);c.lineTo(x+6,y1);}c.stroke();}
 const [e1,ey]=P(SX+Wd.sw*Wd.empty,ENTRY),[e2]=P(SX+Wd.sw*(Wd.empty+1),ENTRY);c.strokeStyle=C.copper;c.setLineDash([8,6]);c.lineWidth=3;c.strokeRect(e1+3,P(0,WALL)[1]+3,e2-e1-6,ey-P(0,WALL)[1]-6);c.setLineDash([]);
 Wd.obs.forEach(o=>{const [a,b]=P(o[0],o[1]),[cc,d]=P(o[2],o[3]);if(o[4]===2){c.fillStyle=C.ink;c.fillRect(a,b,cc-a,d-b);c.strokeStyle=C.danger;c.lineWidth=2;c.strokeRect(a+1,b+1,cc-a-2,d-b-2);return;}
  c.fillStyle=C['steel-soft'];c.beginPath();c.roundRect?c.roundRect(a,b,cc-a,d-b,6):c.rect(a,b,cc-a,d-b);c.fill();c.fillStyle=C.line;c.fillRect(a+6,o[4]?b+24:d-38,cc-a-12,14);});}
function drawCar(c,s,crash){const Cs=corners(s).map(p=>P(...p));c.fillStyle=crash?C.danger:C.copper;c.beginPath();Cs.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.closePath();c.fill();
 const ct=Math.cos(s.th),sn=Math.sin(s.th);const wp=[[2.2,-0.7],[2.9,-0.6],[2.9,0.6],[2.2,0.7]].map(([a,b])=>P(s.x+a*ct-b*sn,s.y+a*sn+b*ct));c.fillStyle=C.paper;c.globalAlpha=.8;c.beginPath();wp.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.closePath();c.fill();c.globalAlpha=1;
 [[L,-HW+0.15],[L,HW-0.15]].forEach(([a,b])=>{const [x,y]=P(s.x+a*ct-b*sn,s.y+a*sn+b*ct);c.save();c.translate(x,y);c.rotate(s.th+s.d);c.fillStyle=C.ink;c.fillRect(-11,-4,22,8);c.restore();});
 [[0,-HW+0.15],[0,HW-0.15]].forEach(([a,b])=>{const [x,y]=P(s.x+a*ct-b*sn,s.y+a*sn+b*ct);c.save();c.translate(x,y);c.rotate(s.th);c.fillStyle=C.ink;c.fillRect(-11,-4,22,8);c.restore();});}
function drawTraces(c,Wd,list,opts){list.forEach(r=>{const sel=opts.sel===r.id;c.strokeStyle=r.color;c.globalAlpha=opts.faint?0.45:sel?1:0.5;c.lineWidth=sel?4:2.5;c.beginPath();
  r.rows.forEach((row,i)=>{const [x,y]=P(Wd.gc+row[1],row[2]);i?c.lineTo(x,y):c.moveTo(x,y);});c.stroke();
  if(sel){c.fillStyle=r.color;r.rows.forEach((row,i)=>{if(i%10)return;const [x,y]=P(Wd.gc+row[1],row[2]);c.beginPath();c.arc(x,y,3,0,Math.PI*2);c.fill();});}});c.globalAlpha=1;}
function guide(c,s,Wd){const g={...s};const A=[],B=[];for(let i=0;i<=60;i++){const ct=Math.cos(g.th),sn=Math.sin(g.th);const rx=g.x-RO*ct,ry=g.y-RO*sn;A.push(P(rx+HW*sn,ry-HW*ct));B.push(P(rx-HW*sn,ry+HW*ct));move(g,-1,0.05);}
 c.strokeStyle=C.good;c.lineWidth=3;c.setLineDash([6,5]);[A,B].forEach(a=>{c.beginPath();a.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.stroke();});c.setLineDash([]);}
function draw(s,Wd,o){const {c}=X.cv;c.clearRect(0,0,968,350);drawLot(c,Wd);
 if(tab==='data')drawTraces(c,Wd,stageRuns(),{sel:selRun});
 if(o.traces&&au.useRuns&&au.mem)drawTraces(c,Wd,au.useRuns,{faint:true});
 if(o.near&&au.useRuns){const r=au.useRuns[o.near.ri],row=r.rows[o.near.i];const [x,y]=P(Wd.gc+row[1],row[2]);c.strokeStyle='#e0b000';c.lineWidth=3;c.beginPath();c.arc(x,y,9,0,Math.PI*2);c.stroke();
  if(s){const [cx,cy]=P(s.x+1.3*Math.cos(s.th),s.y+1.3*Math.sin(s.th));c.setLineDash([3,3]);c.beginPath();c.moveTo(cx,cy);c.lineTo(x,y);c.stroke();c.setLineDash([]);}}
 if(o.guide&&s&&!o.crash)guide(c,s,Wd);
 if(s)drawCar(c,s,o.crash);}
function drawWheel(){const {c,w,h}=X.cvWheel;c.clearRect(0,0,w,h);const R=92;c.save();c.translate(w/2,h/2);c.rotate(man.wheel*Math.PI/180);
 c.strokeStyle=C.ink;c.lineWidth=22;c.beginPath();c.arc(0,0,R,0,Math.PI*2);c.stroke();c.strokeStyle=C.sub;c.lineWidth=3;c.beginPath();c.arc(0,0,R+11,0,Math.PI*2);c.stroke();c.beginPath();c.arc(0,0,R-11,0,Math.PI*2);c.stroke();
 c.strokeStyle=C.ink;c.lineWidth=14;c.lineCap='round';c.beginPath();c.moveTo(-R+8,10);c.lineTo(-32,10);c.moveTo(R-8,10);c.lineTo(32,10);c.moveTo(0,36);c.lineTo(0,R-8);c.stroke();
 c.fillStyle=C.panel;c.strokeStyle=C.ink;c.lineWidth=3;c.beginPath();c.arc(0,0,36,0,Math.PI*2);c.fill();c.stroke();c.fillStyle=C.copper;c.fillRect(-7,-R-11,14,22);c.restore();
 $('wheelV').textContent=Math.abs(man.wheel)<3?'まっすぐ':(man.wheel<0?'左 ':'右 ')+fmt(Math.abs(man.wheel))+'°';}

/* ループ */
buildStages();resetDrive();setTab('drive');
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
 if(tab==='drive')tickDrive(dt);else if(tab==='auto')tickAuto(dt);else{const sel=runs.find(r=>r.id===selRun);const Wd=sel?makeWorld(ST,sel.empty):W;draw(null,Wd,{});}
 requestAnimationFrame(loop);}
requestAnimationFrame(loop);
window.__T={man,au,runs:()=>runs,setTab,ST:()=>ST,W:()=>W};
})();
</script>
