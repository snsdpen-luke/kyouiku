<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>電気回路α中間考査範囲</title>
<style>
/* 白基調・通信なし（外部フォントを読まない）・4:3 の横画面に収める。右に用語の説明欄 */
:root{
  color-scheme:light;
  --bg:#f3f5f4; --card:#fff; --ink:#151a18; --sub:#5d6763; --line:#d9dfdc;
  --accent:#0f6b4f; --accent-soft:#e6f2ec; --ok:#0f6b4f; --ok-soft:#e3f4ea; --ng:#b91c1c; --ng-soft:#fdeceb; --warn:#b45309; --warn-soft:#fff6e5;
  --f:"Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--f);
  padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
button{font:inherit;color:inherit;touch-action:manipulation}
.app{max-width:1280px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:8px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:19px;margin:0}
.ver{font-size:11px;color:var(--sub);margin-left:auto}
.count{font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog div{height:100%;background:var(--accent);width:0}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:10px}
.card,.side{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto;min-height:0}
.card{padding:18px 24px;display:flex;flex-direction:column;gap:12px}
.side{padding:12px 14px;font-size:14px}
.side h2{font-size:14px;margin:0 0 6px;color:var(--sub)}
.side dl{margin:0}
.side dt{font-weight:700;margin-top:8px}
.side dd{margin:2px 0 0;color:#333}
.side .none{color:var(--sub)}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:12.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--sub)}
.tag.kind{border-color:var(--accent);color:var(--accent);font-weight:700}
.q{font-size:19px;font-weight:700;white-space:pre-line}
.fig{display:flex;justify-content:center}
.fig svg{max-width:100%;height:auto;max-height:260px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts.long{grid-template-columns:1fr}
.opts.three{grid-template-columns:1fr 1fr 1fr}
.opts.three .opt{font-size:14.5px;min-height:44px;padding:8px 10px}
.opt{font-size:16px;text-align:left;padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);cursor:pointer;min-height:50px;display:flex;gap:10px;align-items:center}
.opt .mk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--sub);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--sub)}
.opt.pick{border-color:var(--accent);background:var(--accent-soft)}
.opt.pick .mk{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.miss{border-color:var(--ok);border-style:dashed}
.opt:disabled{cursor:default}
.opt svg{flex:none}
.tin{font:inherit;font-size:20px;width:min(460px,100%);padding:8px 12px;border-radius:10px;border:2px solid var(--line)}
.tin.num{width:160px;text-align:right}
.unit{font-size:18px;margin-left:6px}
.fb{border-radius:10px;padding:10px 14px;font-size:15.5px}
.fb.ok{background:var(--ok-soft)} .fb.ng{background:var(--ng-soft)}
.fb b.h{display:block;font-size:16px}
.fb .src{display:block;margin-top:4px;font-size:13px;color:var(--sub)}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.key{font-size:13.5px;padding:1px 8px;border-radius:6px;background:#fff;border:1px solid var(--line)}
.key.hit{border-color:var(--ok);color:var(--ok);font-weight:700}
.key.lack{border-color:var(--ng);color:var(--ng);font-weight:700}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:auto;flex-wrap:wrap;align-items:center}
.btn{font-weight:700;font-size:16px;padding:10px 20px;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.warn{border-color:var(--ng);background:var(--ng)}
.btn:disabled{opacity:.4;cursor:default}
.lead{color:var(--sub);margin:0}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.menu button{text-align:left;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);cursor:pointer}
.menu button b{display:block;font-size:15.5px}
.menu button small{color:var(--sub);font-size:13px}
.big{display:flex;gap:10px;flex-wrap:wrap}
.big .btn{font-size:18px;padding:14px 24px}
h3{font-size:16px;margin:6px 0 0}
.score{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:190px 1fr 70px;gap:8px;align-items:center;font-size:14px}
.track{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--accent)}
.num{font-variant-numeric:tabular-nums;text-align:right}
.qlist{display:flex;flex-wrap:wrap;gap:4px}
.qlist button{width:38px;height:34px;border-radius:6px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:13px}
.qlist button.done{background:var(--accent-soft);border-color:var(--accent)}
.qlist button.ok{background:var(--ok-soft);border-color:var(--ok)}
.qlist button.ng{background:var(--ng-soft);border-color:var(--ng)}
.qlist button.now{outline:2px solid var(--ink)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.note{font-size:13px;color:var(--sub)}
table.t{border-collapse:collapse;font-size:14.5px}
table.t td,table.t th{border:1px solid var(--line);padding:3px 8px;text-align:left}
/* 解答欄（マークシート風） */
.sheet{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;border:1.5px solid #b9c4bf;border-radius:8px;background:#fbfcfb}
.sheet-h{font-size:13px;font-weight:700;color:var(--sub);writing-mode:horizontal-tb}
.bub{width:40px;height:40px;border-radius:50%;border:2px solid #7d8a84;background:#fff;color:#4a5550;font-weight:700;font-size:15px;cursor:pointer;display:grid;place-items:center;padding:0}
.bub.sm{width:30px;height:30px;font-size:13px}
.bub.fill{background:#151a18;border-color:#151a18;color:#fff}
.bub.right{box-shadow:0 0 0 3px var(--ok)}
.bub.wrong{background:var(--ng);border-color:var(--ng);color:#fff}
.bub:disabled{cursor:default}
.dgrid{display:flex;gap:10px}
.dcol{display:flex;flex-direction:column;gap:3px;align-items:center}
.dh{font-size:12px;color:var(--sub)}
.dval{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-left:8px}
textarea{font:inherit;font-size:17px;width:100%;min-height:110px;padding:10px;border-radius:10px;border:2px solid var(--line)}
/* 図示 */
.ztools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ztools .lab{font-size:13px;font-weight:700;color:var(--sub);margin-right:2px}
.ztools .sep{color:var(--line)}
.zc,.zm{font-size:15px;padding:6px 12px;border-radius:8px;border:1.5px solid var(--line);background:#fff;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.zc i{display:inline-block;width:16px;height:16px;border-radius:3px;border:1px solid #777}
.zc.on{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.btn.sm{font-size:14px;padding:6px 12px}
.zbox{border:1px solid var(--line);border-radius:10px;background:#fcfcfa}
.zbox svg{width:100%;height:auto;max-height:62vh;display:block;touch-action:manipulation}
.zbox.ans svg{max-height:40vh}
/* 図示は図を画面の残りの高さに収める（4:3 の横画面でスクロールしない） */
.main.wide{grid-template-columns:minmax(0,1fr) 210px}
.card.dmode{gap:6px;padding:12px 18px}
.card.dmode .q{font-size:15.5px;line-height:1.5}
.card.dmode .note{font-size:12px}
.card.dmode .zbox:not(.ans){flex:1 1 0;min-height:240px;display:flex}
.card.dmode .zbox:not(.ans) svg{flex:1;height:100%;max-height:none}
.card.dmode.shown .zbox:not(.ans){flex:none;height:46vh}
@media (max-width:900px){.main{grid-template-columns:1fr}.side{max-height:30vh}.opts{grid-template-columns:1fr}.card{padding:14px}.bar{grid-template-columns:110px 1fr 60px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>電気回路α中間考査範囲</h1>
    <span class="count" id="count"></span>
    <span class="timer" id="timer"></span>
    <span class="ver" id="ver"></span>
  </header>
  <div class="prog"><div id="bar"></div></div>
  <div class="main">
    <section class="card" id="card"></section>
    <aside class="side" id="side"></aside>
  </div>
</div>
<script>
"use strict";
const VER = "2026-10-30e";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const MK = ["ア", "イ", "ウ", "エ", "オ", "カ"];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ============================================================
   図記号（「複線図れんしゅう」の sym() と同じ描き方。JIS C 0303:2000）
   ============================================================ */
function sym(type, x, y, k) {
  const ink = "#151a18", sw = 2 * Math.max(1, k * 0.8), R = 17 * k, lamp = "#fff";
  const txt = (t, fs, dx, dy, anchor, w) => `<text x="${x + (dx || 0)}" y="${y + (dy || 0) + fs * 0.36}" text-anchor="${anchor || "middle"}" font-size="${fs}" font-weight="${w || 700}" fill="${ink}">${t}</text>`;
  const circ = (r, fill) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill || "#fff"}" stroke="${ink}" stroke-width="${sw}"/>`;
  const box = (w, h, fill) => `<rect x="${x - w / 2}" y="${y - h / 2}" width="${w}" height="${h}" fill="${fill || "#fff"}" stroke="${ink}" stroke-width="${sw}"/>`;
  const paren = s2 => `<path d="M${x - 3 * s2} ${y - 6 * s2}Q${x - 8 * s2} ${y} ${x - 3 * s2} ${y + 6 * s2}M${x + 3 * s2} ${y - 6 * s2}Q${x + 8 * s2} ${y} ${x + 3 * s2} ${y + 6 * s2}" fill="none" stroke="${ink}" stroke-width="${sw}"/>`;
  const dot = sub => `<circle cx="${x}" cy="${y}" r="${9 * k}" fill="${ink}"/>` + (sub ? txt(sub, 12 * k, 11 * k, 9 * k, "start") : "");
  const outlet = sub => {
    const r = 15 * k, h = 0.42 * r, c = Math.sqrt(r * r - h * h), vx = 0.3 * r, vy = Math.sqrt(r * r - vx * vx);
    return circ(r) + `<path d="M${x - c} ${y + h}A${r} ${r} 0 0 0 ${x + c} ${y + h}Z" fill="${ink}"/>`
      + `<path d="M${x - c} ${y + h}H${x + c}M${x - vx} ${y - vy}V${y + h}M${x + vx} ${y - vy}V${y + h}" stroke="${ink}" stroke-width="${sw}"/>`
      + (sub ? txt(sub, 11 * k, r + 2 * k, r * 0.55, "start") : "");
  };
  switch (type) {
    case "src": return `<rect x="${x - 34 * k}" y="${y - 20 * k}" width="${68 * k}" height="${40 * k}" rx="${5 * k}" fill="#f5f1e8" stroke="#8b8271" stroke-width="${sw * 0.7}"/>` + txt("電源", 15 * k);
    case "gnd": return `<path d="M${x} ${y - 14 * k}V${y}M${x - 12 * k} ${y}H${x + 12 * k}M${x - 8 * k} ${y + 5 * k}H${x + 8 * k}M${x - 4 * k} ${y + 10 * k}H${x + 4 * k}" stroke="${ink}" stroke-width="${sw}"/>` + txt("E<tspan font-size='" + 8 * k + "' dy='" + 3 * k + "'>D</tspan>", 12 * k, 15 * k, 6 * k, "start");
    case "outletRo": return outlet("") + txt("露出形", 10 * k, 17 * k, -12 * k, "start", 500);
    case "brkB": return box(26 * k, 22 * k) + txt("B", 14 * k);
    case "brkBE": return box(32 * k, 22 * k) + txt("BE", 13 * k);
    case "motor": return circ(R) + txt("M", 16 * k);
    case "box": { const r = 15 * k, d = [0.7071, -0.7071], n = [0.7071, 0.7071]; let g = circ(r);
      [-0.5, 0, 0.5].forEach(o => { const cx = x + n[0] * o * r, cy = y + n[1] * o * r, L = Math.sqrt(1 - o * o) * r * 0.9;
        g += `<line x1="${cx - d[0] * L}" y1="${cy - d[1] * L}" x2="${cx + d[0] * L}" y2="${cy + d[1] * L}" stroke="${ink}" stroke-width="${sw * 0.8}"/>`; });
      return g; }
    case "obox": return box(28 * k, 28 * k);
    case "lamp": return circ(R) + txt("R", 18 * k, 0, 0, "middle", 500);
    case "ceil": return circ(R) + paren(k);
    case "ceilK": return box(40 * k, 22 * k) + paren(k);
    case "fl": return `<rect x="${x - 30 * k}" y="${y - 6 * k}" width="${60 * k}" height="${12 * k}" fill="#fff" stroke="${ink}" stroke-width="${sw}"/>` + circ(12 * k);
    case "outdoor": { const r2 = 9 * k;
      return circ(R) + `<circle cx="${x}" cy="${y}" r="${r2}" fill="none" stroke="${ink}" stroke-width="${sw}"/>`
        + [45, 135, 225, 315].map(a => { const c = Math.cos(a * Math.PI / 180), s2 = Math.sin(a * Math.PI / 180);
          return `<line x1="${x + c * (r2 - 2 * k)}" y1="${y + s2 * (r2 - 2 * k)}" x2="${x + c * (r2 + 2 * k)}" y2="${y + s2 * (r2 + 2 * k)}" stroke="${lamp}" stroke-width="${4 * k}"/>`; }).join(""); }
    case "pl": return circ(8 * k);
    case "sw1": return dot("");
    case "sw3": return dot("3");
    case "sw4": return dot("4");
    case "swH": return dot("H");
    case "swA": return dot("A(3A)");
    case "ts": return box(30 * k, 24 * k) + txt("TS", 12 * k);
    case "rly": return `<rect x="${x - 7 * k}" y="${y - 11 * k}" width="${14 * k}" height="${22 * k}" fill="#fff" stroke="${ink}" stroke-width="${sw}"/><path d="M${x - 6 * k} ${y - 9 * k}L${x + 6 * k} ${y}L${x - 6 * k} ${y + 9 * k}Z" fill="${ink}"/>`;
    case "outlet": return outlet("");
    case "outlet2": return outlet("2");
    case "outletE": return outlet("E");
    case "outletET": return outlet("ET");
    case "outletEET": return outlet("EET");
    case "outlet200": return outlet("E") + txt("20A 250V", 9 * k, 17 * k, 16 * k, "start", 500);
  }
  return "";
}
const symSvg = (type, w, h, k) => `<svg viewBox="0 0 ${w || 90} ${h || 60}" width="${w || 90}" height="${h || 60}" role="img">${sym(type, (w || 90) / 2 - (/^(sw[34HA]|outlet)/.test(type) ? 8 : 0), (h || 60) / 2, k || 1.1)}</svg>`;

/* ============================================================
   用語（右の説明欄）。m の語が問題・選択肢・解説に出たら表示する
   ============================================================ */
const GLOSS = [
  { k: "欠陥", d: "技能試験は作品に欠陥が1つでもあれば不合格。何が欠陥かは試験センターの「欠陥の判断基準」で決まっている。" },
  { k: "施工条件", d: "試験問題に書かれている作業の決まり。電線の色・接続の方法・取付枠の位置などを指定する。守らないと回路が正しくても欠陥。" },
  { k: "接地側", m: ["接地側", "白色", "白"], d: "大地（地面）につながっている側の電線。" },
  { k: "非接地側", d: "大地につながっていない側の電線。" },
  { k: "返り線", m: ["返り線"], d: "スイッチから照明へ戻る電線。スイッチを入れると、ここに電気が来る。色は施工条件の指定がなければ残った色を使う。" },
  { k: "渡り線", m: ["渡り線", "わたり線"], d: "同じ取付枠の器具どうしを、ボックスを通らずに直接つなぐ短い電線。" },
  { k: "リングスリーブ", m: ["リングスリーブ", "スリーブ"], d: "電線どうしをつなぐ金属の筒。リングスリーブ用圧着工具で圧着してつなぐ。" },
  { k: "刻印（圧着マーク）", m: ["刻印", "圧着マーク"], d: "圧着したときにスリーブに付く印。" },
  { k: "差込形コネクタ", m: ["差込形コネクタ", "コネクタ"], d: "心線を差し込むだけで電線どうしをつなげる器具。" },
  { k: "VVF", m: ["VVF"], d: "600V ビニル絶縁ビニルシースケーブル平形。1.6mm・2.0mm、2心・3心などがある。" },
  { k: "EM-EEF", m: ["EM-EEF", "エコケーブル"], d: "600V ポリエチレン絶縁耐燃性ポリエチレンシースケーブル平形（エコケーブル）。外装が硬く、ストリッパではぎにくいことがある。" },
  { k: "VVR", m: ["VVR"], d: "600V ビニル絶縁ビニルシースケーブル丸形。中に介在物（すき間をうめる詰め物）が入っている。" },
  { k: "IV", m: ["IV"], d: "600V ビニル絶縁電線。外装（シース）が無いので、金属管や PF 管の中に通して使う。" },
  { k: "シース（外装）", m: ["シース", "外装"], d: "ケーブルのいちばん外側の被覆。中の絶縁電線を守る。" },
  { k: "絶縁被覆", m: ["絶縁被覆", "被覆"], d: "1本1本の心線を包む被覆。色（黒・白・赤・緑）で区別する。" },
  { k: "心線", m: ["心線"], d: "電線の中の銅線。" },
  { k: "ストリップゲージ", m: ["ストリップゲージ", "ゲージ"], d: "器具やコネクタに付いている、被覆をはぐ長さの目盛り。" },
  { k: "取付枠", m: ["取付枠"], d: "埋込連用のスイッチやコンセントを取り付ける金属の枠。器具を3つまで付けられる。" },
  { k: "受金ねじ部", m: ["受金ねじ部"], d: "ランプレセプタクルの、電球のねじが入る金具。" },
  { k: "引掛シーリング", m: ["引掛シーリング"], d: "照明器具を引っ掛けて付ける器具。角形と丸形がある。端子に「接地側」の表示がある。" },
  { k: "ランプレセプタクル", m: ["ランプレセプタクル"], d: "電球を付ける器具。端子はねじ締めで、心線で輪（の）の字を作って結線する。" },
  { k: "3路スイッチ", m: ["3路"], d: "2か所から同じ照明を点けたり消したりするときに使うスイッチ。端子は 0・1・3 の3つ。" },
  { k: "4路スイッチ", m: ["4路"], d: "3路スイッチ2つのあいだに入れて、3か所以上から点滅できるようにするスイッチ。" },
  { k: "確認表示灯（パイロットランプ）", m: ["確認表示灯", "パイロットランプ"], d: "点いているかを知らせる小さなランプ。つなぎ方で、常時点灯・同時点滅・異時点滅が変わる。" },
  { k: "位置表示灯内蔵スイッチ", m: ["位置表示灯"], d: "暗い所でスイッチの位置が分かるよう、小さな表示灯が入ったスイッチ。" },
  { k: "端子台", m: ["端子台"], d: "試験で、タイムスイッチ・自動点滅器・リモコンリレーなどの代わりに使う部品。ねじで締めて結線する。" },
  { k: "ねじなし電線管", m: ["ねじなし", "金属管", "E19"], d: "ねじを切らない金属管。ねじなしボックスコネクタでボックスにつなぐ。" },

  z.boxes.forEach(b => { g += b.obox ? `<rect x="${b.x - 58}" y="${b.y - 58}" width="116" height="116" fill="#fff" stroke="#9aa5a0" stroke-width="2" stroke-dasharray="6 4"/>` : `<circle cx="${b.x}" cy="${b.y}" r="58" fill="#fff" stroke="#9aa5a0" stroke-width="2" stroke-dasharray="6 4"/>`;
    g += `<text x="${b.x + 54}" y="${b.y - 50}" font-size="18" font-weight="700" fill="#151a18">${esc(b.name)}</text>`; });
  z.parts.forEach(p => { g += sym(p.type, p.x, p.y, 1) + (p.label && p.type !== "src" ? `<text x="${p.x + 22}" y="${p.y - 18}" font-size="15" font-weight="700">${esc(p.label)}</text>` : ""); });
  /* 線 */
  lines.forEach((l, i) => { const A = pos(l.a), B = pos(l.b); if (!A || !B) return; const col = COLORS[l.c] || "#888";
    g += `<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="#555" stroke-width="7" stroke-linecap="round"/><line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="${col}" stroke-width="4.5" stroke-linecap="round"/>`;
    if (!ans) g += `<line data-l="${i}" x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="transparent" stroke-width="16"/>`; });
  /* 端子 */
  Object.values(P.term).forEach(t => { const on = sel === t.id;
    g += `<circle cx="${t.x}" cy="${t.y}" r="8" fill="${on ? "#2563eb" : "#fff"}" stroke="#151a18" stroke-width="2"/>`;
    if (t.t.lab) g += `<text x="${t.x}" y="${t.y + (t.y > t.part.y ? 22 : -12)}" font-size="12" font-weight="700" text-anchor="middle" fill="#334">${esc(t.t.lab)}</text>`;
    if (!ans) g += `<circle data-t="${t.id}" cx="${t.x}" cy="${t.y}" r="12" fill="transparent"/>`; });
  /* 接続点 */
  Object.values(P.slots).forEach(s => { const on = sel === s.id, used = lines.some(l => l.a === s.id || l.b === s.id);
    if (ans && !used) return;
    g += `<circle cx="${s.x}" cy="${s.y}" r="${used ? 7 : 6}" fill="${on ? "#2563eb" : used ? "#151a18" : "#fff"}" stroke="#151a18" stroke-width="1.5"/>`;
    if (marks[s.id]) { const b = P.box[s.box], dx = s.x - b.x, dy = s.y - b.y, m = Math.hypot(dx, dy) || 1, mx = s.x + dx / m * 15, my = s.y + dy / m * 15, tw = marks[s.id].length * 13 + 8;
      g += `<rect pointer-events="none" x="${mx - tw / 2}" y="${my - 10}" width="${tw}" height="19" rx="4" fill="#fff" stroke="#0f6b4f" stroke-width="1.5"/><text pointer-events="none" x="${mx}" y="${my + 5}" font-size="13" font-weight="700" text-anchor="middle" fill="#0f6b4f">${esc(marks[s.id])}</text>`; }
    if (!ans) g += `<circle data-s="${s.id}" cx="${s.x}" cy="${s.y}" r="13" fill="transparent"/>`; });
  const [x, y, w, h] = P.vb;
  return `<svg class="zsvg" viewBox="${x} ${y} ${w} ${h}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}

const norm = s => String(s || "").normalize("NFKC").toLowerCase().replace(/[\s　、。・,.「」『』（）()]/g, "")

  return started ? +s : null;
}
const S_MIN = 10;   // 文章は 10 字以上
function judge(q, v) {

  if (q.t === "m") return Array.isArray(v) && v.slice().sort().join() === q.a.slice().sort().join();   // すべて合って正解（部分点なし）
  if (q.t === "n") return markNumber(q, v) === q.a;
  if (q.t === "s") { const s = norm(v); if (s.length < S_MIN) return false; return q.keys.every(g => g.some(w => s.includes(norm(w)))); }
  if (q.t === "d") return zushiScore(q.z, v).ok;
  return false;
}
const keyHits = (q, v) => { const s = norm(v); return q.keys.map(g => ({ w: g[0], hit: g.some(w => s.includes(norm(w))) })); };

const byId = id => BANK.find(q => q.id === id);
function prepOrder(q) { if (q.t === "m") return q.o.map((_, i) => i); if (q.t !== "c") return null; const idx = q.o.map((_, i) => i); return q.fix ? idx : shuffle(idx); }

function startPractice(ids, title) {

/* 模擬テストの問題を選ぶ。区分ごとの数を守り、分野はかたよらないように順に取る。単線図は2つまで */
function makeExam(rnd) {
  const sh = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor((rnd || Math.random)() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const used = new Set(), ids = [], pts = {}, sec = {};
  /* 単線図は2つまで。単線図・計算の区分が足りる組み合わせになるまで選び直す */
  const all = [...new Set(BANK.filter(q => q.figZ).map(q => q.figZ))], s3 = EXAM.sec[2];
  let figs = [];
  for (let k = 0; k < 200; k++) { const f = sh(all).slice(0, 2); if (BANK.filter(q => s3.pick(q) && (!q.figZ || f.includes(q.figZ))).length >= s3.n + 2) { figs = f; break; } }
  EXAM.sec.forEach((x, si) => {
    let pool = BANK.filter(q => x.pick(q) && !used.has(q.group || q.id) && !(q.rel || []).some(r => ids.includes(r)) && (!q.figZ || figs.includes(q.figZ)));
    const take = [];
    if (x.multi) sh(pool.filter(q => q.t === "m")).slice(0, x.multi).forEach(q => take.push(q));
    const byCat = sh(CATS.map(c => sh(pool.filter(q => q.cat === c.id && !take.includes(q)))).filter(a => a.length));
    let k = 0, guard = 0;
    while (take.length < x.n && guard++ < 999) { const p = byCat[k++ % byCat.length]; const q = p.find(y => !take.includes(y) && !used.has(y.group || y.id)); if (q) { take.push(q); used.add(q.group || q.id); } }
    take.forEach(q => { used.add(q.group || q.id); ids.push(q.id); pts[q.id] = x.pt; sec[q.id] = si; });
  });
  return { ids, pts, sec };
}
function startExam() {
  S = { view: "q", mode: "exam", title: "模擬テスト", ...makeExam(), i: 0, ans: {}, done: {}, ord: {}, t0: Date.now() };
  const ids = S.ids;

}

const KIND = { c: "語群選択（記号をぬる）", m: "語群選択（すべて選ぶ）", n: "数値（数字をぬる）", s: "記述（文章）", d: "記述（図示）" };
const picked = (q, v, oi) => q.t === "m" ? Array.isArray(v) && v.includes(oi) : v === oi;
const rightOpt = (q, oi) => q.t === "m" ? q.a.includes(oi) : oi === q.a;
/* 解答欄の部品 */
function bubbleRow(q, v, shown) {

    return `<button class="bub ${cls}" data-o="${oi}" ${shown ? "disabled" : ""} aria-label="${MK[k]}">${MK[k]}</button>`; }).join("")}</div>`;
}
function digitGrid(q, v, shown) {
  const n = digitsOf(q), arr = Array.isArray(v) ? v : [], pl = ["一", "十", "百", "千"];
  const ansD = String(q.a).padStart(n, " ").split("");

  for (let c = 0; c < n; c++) {

    for (let d = 0; d <= 9; d++) { let cls = arr[c] === d ? "fill" : ""; if (shown && ansD[c] === String(d)) cls += " right"; if (shown && arr[c] === d && ansD[c] !== String(d)) cls += " wrong";

}
function zTools(q, v, shown) {
  if (shown) return "";
  const z = q.z, cols = [...new Set(z.cables.flatMap(c => c.colors))].filter(c => COLORS[c]);
  const cur = S.zcol || "黒", sel = S.zsel;

    const oi = +b.dataset.o;
    if (q.t === "m") {   // すべて選ぶ：押すたびに付け外し。「欠陥はない」はほかと一緒に選べない
      const none = q.o.indexOf("欠陥はない"); let a = Array.isArray(S.ans[id]) ? S.ans[id].slice() : [];
      a = a.includes(oi) ? a.filter(x => x !== oi) : oi === none ? [oi] : a.filter(x => x !== none).concat([oi]);
      S.ans[id] = a.sort();
    } else S.ans[id] = oi;
    render(); });
  document.querySelectorAll(".bub[data-d]").forEach(b => b.onclick = () => { const a = Array.isArray(S.ans[id]) ? S.ans[id].slice() : Array(digitsOf(q)).fill(null);
    const c = +b.dataset.c, d = +b.dataset.d; a[c] = a[c] === d ? null : d; S.ans[id] = a; render(); });
  const tin = $("tin");
  if (tin) { tin.oninput = () => { S.ans[id] = tin.value; const c = $("check"); if (c) c.disabled = !tin.value.trim(); }; }
  if (q.t === "d") bindZ(q);
  const go = (k) => { S.i = k; S.zsel = null; S.zhist = []; S.zmsg = ""; render(); };
  if ($("check")) $("check").onclick = () => { S.done[id] = true; mark(id, judge(q, S.ans[id])); render(); };
  if ($("next")) $("next").onclick = () => go(S.i + 1);
  if ($("back")) $("back").onclick = () => go(S.i - 1);
  if ($("finish")) $("finish").onclick = finish;
  document.querySelectorAll(".qlist button").forEach(b => b.onclick = () => go(+b.dataset.j));
  const quit = $("quit");
  quit.onclick = () => { if (S.mode === "exam" && !quit.dataset.sure) { quit.dataset.sure = 1; quit.textContent = "本当にやめる（記録しない）"; quit.classList.add("warn"); return; } home(); };
}
/* 図示の操作：端子（か接続点）をタップ → 行き先をタップで線。線をタップで消す。接続点をタップして刻印を選ぶ */
function bindZ(q) {
  const id = q.id, z = q.z, P = zPrep(z);
  const val = () => { const v = S.ans[id] || { lines: [], marks: {} }; S.ans[id] = v; return v; };
  const push = () => { (S.zhist = S.zhist || []).push(JSON.stringify(val())); };
  const svg = document.querySelector(".zbox:not(.ans) svg"); if (!svg || S.done[id]) return;
  svg.addEventListener("click", e => {
    const el = e.target, t = el.dataset.t, s = el.dataset.s, l = el.dataset.l;
    const v = val(), sel = S.zsel;
    if (t || s) {
      const hit = t || s;
      if (sel && sel !== hit) {
        const w = P.wireOf(sel, hit);
        if (w) { push(); v.lines.push({ a: sel, b: hit, c: S.zcol || "黒" }); S.zsel = null; S.zmsg = ""; }
        else { S.zmsg = "そこへはケーブルが通っていないので、線を引けません。"; S.zsel = hit; }
      } else S.zsel = sel === hit ? null : hit;
    } else if (l !== undefined) { push(); v.lines.splice(+l, 1); S.zsel = null; }
    else S.zsel = null;
    render();
  });
  document.querySelectorAll("[data-zc]").forEach(b => b.onclick = () => { S.zcol = b.dataset.zc; render(); });
  document.querySelectorAll("[data-zm]").forEach(b => b.onclick = () => { const v = val(); push(); if (b.dataset.zm) v.marks[S.zsel] = b.dataset.zm; else delete v.marks[S.zsel]; render(); });
  if ($("zundo")) $("zundo").onclick = () => { const h = S.zhist || []; if (h.length) { S.ans[id] = JSON.parse(h.pop()); render(); } };
  if ($("zclear")) $("zclear").onclick = () => { push(); S.ans[id] = { lines: [], marks: {} }; S.zsel = null; render(); };
}
function finish() {
  const exam = S.mode === "exam";
  /* 図示は項目ごとの部分点（できた割合 × 配点、切り捨て） */
  const rows = S.ids.map(id => { const q = byId(id), ok = judge(q, S.ans[id]), pt = exam ? S.pts[id] : 1;
    const got = ok ? pt : q.t === "d" && exam ? Math.floor(zushiScore(q.z, S.ans[id]).frac * pt) : 0; return { q, ok, pt, got }; });
  if (exam) rows.forEach(r => mark(r.q.id, r.ok));
  stopTimer();
  const got = rows.reduce((s, r) => s + r.got, 0), full = rows.reduce((s, r) => s + r.pt, 0);
  const byCat = CATS.map(c => { const rs = rows.filter(r => r.q.cat === c.id); return { c, n: rs.length, ok: rs.filter(r => r.ok).length }; }).filter(x => x.n);
  const kan = k => { const rs = rows.filter(r => EXAM.sec[S.sec[r.q.id]].kan === k); return `${rs.reduce((s, r) => s + r.got, 0)} / ${rs.reduce((s, r) => s + r.pt, 0)} 点`; };
  const min = S.t0 ? Math.round((Date.now() - S.t0) / 60000) : null;
  S.view = "result"; head(S.title + "　結果", 100);
  $("card").innerHTML = `<div class="score">${exam ? `${got} / ${full} 点` : `${rows.filter(r => r.ok).length} / ${rows.length} 問 正解`}</div>
    ${exam ? `<p class="lead"><b>知識・技能 ${kan("知")}</b>　／　<b>思考・判断・表現 ${kan("思")}</b></p>` : ""}
    ${min !== null ? `<p class="lead">かかった時間 約${min}分（目安 ${EXAM.minutes}分）</p>` : ""}
    <div class="bars">${byCat.map(x => `<div class="bar"><span>${esc(x.c.name)}</span><div class="track"><div class="fill" style="width:${x.ok / x.n * 100}%"></div></div><span class="num">${x.ok} / ${x.n}</span></div>`).join("")}</div>
    <h3>ふりかえり（番号を押すと、その問題の答えと解説）</h3>
    <div class="qlist">${rows.map((r, k) => `<button data-j="${k}" class="${r.ok ? "ok" : "ng"}">${k + 1}</button>`).join("")}</div>
    <div id="rev"></div>
    <div class="row"><button class="btn ghost" id="home">はじめの画面へ</button>${rows.some(r => !r.ok) ? `<button class="btn" id="redo">まちがえた問題をもう一度</button>` : ""}</div>`;
  document.querySelectorAll(".qlist button").forEach(b => b.onclick = () => { const r = rows[+b.dataset.j], q = r.q, v = S.ans[q.id];
    const yours = q.t === "c" ? (v === undefined ? "（無回答）" : q.o[v]) : q.t === "m" ? (Array.isArray(v) && v.length ? v.map(i => MK[i]).join("・") : "（無回答）") : q.t === "n" ? (markNumber(q, v) ?? "（無回答）") : q.t === "d" ? `${r.got} / ${r.pt} 点` : (v || "（無回答）");
    $("rev").innerHTML = `<div class="fb ${r.ok ? "ok" : "ng"}"><b class="h">${b.textContent}．${esc(q.q)}</b>あなたの答え：${esc(yours)}<br>答え：${esc(answerText(q))}`
      + (q.t === "s" ? `<div class="keys">指定語句：${keyHits(q, v).map(k => `<span class="key ${k.hit ? "hit" : "lack"}">${esc(k.w)}</span>`).join("")}</div>` : "")
      + (q.t === "d" ? `<div class="zbox">${zSvg(q.z, v, null, false)}</div>` + zReport(q, v) : "")
      + `${q.ex ? `<div>${esc(q.ex)}</div>` : ""}${q.src ? `<span class="src">${esc(q.src)}</span>` : ""}</div>`;
    setSide([q.q, q.ex || ""]); });
  $("home").onclick = home;
  if ($("redo")) $("redo").onclick = () => startPractice(rows.filter(r => !r.ok).map(r => r.q.id), "まちがえた問題");
}

$("ver").textContent = "版 " + VER;
window.GINOU = { BANK, CATS, judge, norm, EXAM, startExam, startPractice, home, get S() { return S; } };
/* 先生用：URL の末尾に #q=問題の id でその問題を開く（例 #q=kouho-1）。#exam で模擬テスト */
const hq = decodeURIComponent(location.hash || "");
if (hq.startsWith("#q=") && byId(hq.slice(3))) startPractice([hq.slice(3)], "指定の問題");
else if (hq === "#exam") startExam();
else home();
</script>
</body>
</html>
