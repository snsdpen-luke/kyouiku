<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arduino 教材 1回目</title>
<style>
  :root {
    --bg:#15171c; --panel:#20232b; --panel2:#2a2e38; --line:#3a3f4b;
    --text:#e8eaf0; --sub:#9aa0ad; --on:#ffb43c; --ok:#5fd68a; --ng:#ff6b6b;
    --real:#4aa3ff; --sim:#c58bff;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:"Yu Gothic UI","Meiryo",sans-serif; font-size:16px; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap;
           padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--line); }
  h1 { font-size:20px; margin:0 12px 0 0; }
  button { font:inherit; cursor:pointer; border:none; border-radius:8px; padding:8px 16px;
           background:var(--panel2); color:var(--text); }
  button:hover { filter:brightness(1.15); }
  #connect { background:var(--on); color:#000; font-weight:bold; }
  #disconnect { display:none; background:var(--ng); color:#000; font-weight:bold; }
  #status { color:var(--sub); }
  #level.hard { background:var(--ng); color:#000; font-weight:bold; }
  #level { margin-left:auto; }
  #status.ok { color:var(--ok); }
  #status.ng { color:var(--ng); }
  #sensei { color:var(--ng); font-weight:bold; display:none; }

  nav { display:flex; gap:6px; padding:12px 20px 0; flex-wrap:wrap; }
  nav button { padding:5px 9px; font-size:14px; border-left:4px solid transparent; }
  nav button.real { border-left-color:var(--real); }
  nav button.sim  { border-left-color:var(--sim); }
  nav button.both { border-left-color:var(--real); border-right:4px solid var(--sim); }
  nav button.active { background:var(--on); color:#000; font-weight:bold; }

  main { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; padding:16px 20px 24px; }
  @media (max-width:1050px) { main { grid-template-columns:minmax(0,1fr); } }
  section { background:var(--panel); border-radius:12px; padding:16px; min-width:0; }
  h2 { font-size:18px; margin:0 0 6px; }
  h3 { font-size:15px; margin:18px 0 8px; color:var(--sub); font-weight:normal; }
  .kind { display:inline-block; font-size:13px; border-radius:4px; padding:2px 8px; margin-right:8px;
          vertical-align:2px; color:#000; font-weight:bold; }
  .kind.real { background:var(--real); }
  .kind.sim  { background:var(--sim); }
  .goal { margin:8px 0 0; font-size:17px; }

  svg.wire { width:100%; height:auto; background:#f4f1e8; border-radius:8px; display:block; }
  .usbonly { background:var(--panel2); border-radius:8px; padding:14px; color:var(--sub); }

  /* コード：コピー不可 */
  .code { background:#0e1014; border-radius:8px; padding:14px; overflow-x:auto; font-size:15px;
          line-height:1.7; font-family:Consolas,"BIZ UDGothic",monospace; white-space:pre; margin:0;
          user-select:none; -webkit-user-select:none; cursor:default; }
  .code .c { color:#6f7787; }
  .blank { display:inline-block; min-width:3.2em; text-align:center; border:2px dashed var(--on);
           border-radius:4px; color:var(--on); font-weight:bold; padding:0 4px; line-height:1.3; }
  .blank.ans { border-style:solid; background:var(--on); color:#000; }
  ol.hints { margin:0; padding-left:0; list-style:none; }
  ol.hints li { margin:6px 0; }
  ol.hints b { color:var(--on); margin-right:6px; }
  ol.hints { user-select:none; -webkit-user-select:none; }
  .shape[hidden], .shapebtn[hidden] { display:none; }
  .shapebtn { font-size:13px; padding:2px 10px; margin-left:8px; background:#3a3f4b; }
  .shape { display:inline-block; margin-left:8px; padding:2px 8px; border-radius:4px; background:#0e1014;
           color:var(--on); font-family:Consolas,"BIZ UDGothic",monospace; font-size:14px; }
  .more { background:var(--panel2); border-radius:8px; padding:10px 14px; margin-top:14px; }
  .more b { color:var(--ok); }
  .ref { border-collapse:collapse; margin-top:6px; }
  .ref td { border:1px solid var(--line); padding:4px 10px; text-align:center; }

  canvas { width:100%; height:auto; background:#0e1014; border-radius:8px; display:block; }
  .realbox { background:#0e1014; border-radius:8px; padding:24px; min-height:260px; }
  .realbox .big { font-size:22px; font-weight:bold; color:var(--real); margin-bottom:14px; }
  .realbox label { display:block; margin:10px 0; font-size:17px; cursor:pointer; }
  .realbox input { transform:scale(1.4); margin-right:10px; }
  #log { height:130px; overflow-y:auto; font-size:13px; background:#0e1014; border-radius:8px;
         padding:10px; margin:0; font-family:Consolas,monospace; white-space:pre-wrap; }
  #log .bad { color:var(--ng); }
  .sendrow { display:flex; gap:8px; margin-top:8px; }
  .sendrow input { flex:1; font:inherit; font-family:Consolas,monospace; background:#0e1014; color:var(--text);
                   border:1px solid var(--line); border-radius:8px; padding:6px 10px; min-width:0; }
  .note { color:var(--sub); font-size:14px; margin-top:8px; }
  .tabsep { flex-basis:auto; height:auto; color:var(--sub); font-size:14px; align-self:center; margin:0 4px 0 0; }
  .ctrl { display:none; flex-wrap:wrap; gap:16px; align-items:center; margin-top:10px;
          background:var(--panel2); border-radius:8px; padding:12px; }
  .ctrl input[type=range] { width:180px; vertical-align:middle; }
  #log .out { color:#4aa3ff; }
  table.pins { border-collapse:collapse; margin-top:10px; width:100%; }
  table.pins th, table.pins td { border:1px solid var(--line); padding:6px 10px; text-align:left; }
  table.pins th { background:var(--panel2); color:var(--sub); font-weight:normal; }
  table.pins tr.dim td { opacity:0.3; }
  .dot { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; vertical-align:-1px; border:1px solid #888; }
</style>
</head>
<body>

<header>
  <h1>Arduino 教材 1回目</h1>
  <button id="connect">UNO に接続</button>
  <button id="disconnect">切断</button>
  <span id="status">未接続</span>
  <button id="level">むずかしさ：ふつう</button>
  <span id="sensei">先生モード（答えを表示中）</span>
</header>

<nav id="tabs"></nav>

<main>
  <section>
    <h2 id="title"></h2>
    <p class="goal" id="goal"></p>
    <h3>配線</h3>
    <div id="wiring"></div>
    <h3>コード（<span style="color:var(--on)">□</span> の中を自分で考えて打つ）</h3>
    <pre class="code" id="code"></pre>
    <h3>ヒント</h3>
    <ol class="hints" id="hints"></ol>
    <div id="extra"></div>
    <div class="more" id="more"></div>
  </section>

  <section>
    <h2 id="simtitle"></h2>
    <canvas id="sim" width="640" height="420"></canvas>
    <div id="ctrl" class="ctrl"></div>
    <div class="realbox" id="realbox"></div>
    <h3>UNO から届いた文字</h3>
    <pre id="log"></pre>
    <div class="sendrow">
      <input id="manual" placeholder="試しに送る（例：freq=440）" autocomplete="off">
      <button id="manualBtn">送る</button>
    </div>
    <p class="note">UNO がなくても、上の欄に打てば画面の動きを試せます。</p>
  </section>
</main>

<script>
// =====================================================================
// 配線図
// =====================================================================
function pin(x, y, label) {
  return `<rect x="${x - 10}" y="${y - 8}" width="30" height="16" fill="#111"/>
          <text x="${x - 16}" y="${y + 6}" font-size="16" fill="#fff" text-anchor="end">${label}</text>`;
}
function uno(h, extra = "") {
  return `<rect x="20" y="20" width="200" height="${h}" rx="10" fill="#1f6fb2"/>
          <text x="110" y="52" fill="#fff" font-size="20" text-anchor="middle" font-weight="bold">UNO R3</text>${extra}`;
}

function wireBuiltinLed() {
  return `
<svg class="wire" viewBox="0 0 560 200" xmlns="http://www.w3.org/2000/svg" font-family="Meiryo,sans-serif">
  ${uno(160)}
  <rect x="120" y="100" width="22" height="12" rx="2" fill="#ffd34d" stroke="#000"/>
  <text x="150" y="111" font-size="15" fill="#fff">L</text>
  <line x1="145" y1="106" x2="300" y2="106" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="310" y="100" font-size="16" fill="#333">基板の「L」の小さなLED</text>
  <text x="310" y="124" font-size="14" fill="#666">13番ピンにつながっている</text>
  <text x="310" y="160" font-size="14" fill="#666">配線はいらない（USBだけ）</text>
</svg>`;
}

function wireLed() {
  return `
<svg class="wire" viewBox="0 0 560 240" xmlns="http://www.w3.org/2000/svg" font-family="Meiryo,sans-serif">
  ${uno(200)}
  ${pin(220, 90, "D6")}
  ${pin(220, 180, "GND")}
  <!-- 抵抗 -->
  <line x1="240" y1="90" x2="290" y2="90" stroke="#2b7de9" stroke-width="5" stroke-linecap="round"/>
  <rect x="290" y="80" width="70" height="20" rx="8" fill="#d9b98a" stroke="#8a6d45"/>
  <rect x="304" y="80" width="6" height="20" fill="#c0392b"/>
  <rect x="316" y="80" width="6" height="20" fill="#c0392b"/>
  <rect x="328" y="80" width="6" height="20" fill="#8b4513"/>
  <text x="325" y="70" font-size="14" fill="#333" text-anchor="middle">抵抗 220Ω</text>
  <line x1="360" y1="90" x2="430" y2="90" stroke="#888" stroke-width="4"/>
  <!-- LED -->
  <path d="M430 90 L430 70 Q430 40 455 40 Q480 40 480 70 L480 100 L430 100 Z" fill="#ff5252" opacity="0.9"/>
  <line x1="445" y1="100" x2="445" y2="150" stroke="#888" stroke-width="4"/>
  <line x1="465" y1="100" x2="465" y2="135" stroke="#888" stroke-width="4"/>
  <line x1="430" y1="90" x2="445" y2="100" stroke="#888" stroke-width="4"/>
  <text x="500" y="70" font-size="14" fill="#333">LED</text>
  <text x="380" y="140" font-size="13" fill="#333" text-anchor="end">長い足（＋）</text>
  <text x="472" y="165" font-size="13" fill="#333">短い足（－）</text>
  <polyline points="465,135 465,180 240,180" fill="none" stroke="#222" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;
}

function wireServo() {
  const rows = [["GND", "#7a4a1d", "茶"], ["5V", "#e23b3b", "赤"], ["D9", "#f08a24", "オレンジ"]];
  let w = "";
  rows.forEach(([p, c, n], i) => {
    const y = 80 + i * 50;
    w += pin(220, y, p);
    w += `<line x1="240" y1="${y}" x2="380" y2="${y}" stroke="${c}" stroke-width="6" stroke-linecap="round"/>
          <text x="310" y="${y - 10}" font-size="13" fill="#333" text-anchor="middle">${n}</text>`;
  });
  return `
<svg class="wire" viewBox="0 0 560 240" xmlns="http://www.w3.org/2000/svg" font-family="Meiryo,sans-serif">
  ${uno(200)}
  ${w}
  <rect x="380" y="65" width="16" height="130" fill="#333"/>
  <rect x="396" y="60" width="130" height="140" rx="6" fill="#2f6fd6"/>
  <circle cx="490" cy="100" r="18" fill="#fff"/>
  <rect x="430" y="95" width="70" height="10" rx="5" fill="#fff"/>
  <text x="461" y="170" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">SG90</text>
</svg>`;
}

function switchParts(x, y) {   // タクトスイッチの絵（足の座標を返す用に固定配置）
  return `<rect x="${x}" y="${y}" width="70" height="70" rx="6" fill="#333"/>
    <circle cx="${x + 35}" cy="${y + 35}" r="18" fill="#111" stroke="#666" stroke-width="3"/>
    <rect x="${x - 12}" y="${y + 6}" width="12" height="9" fill="#bbb"/>
    <rect x="${x + 70}" y="${y + 6}" width="12" height="9" fill="#bbb"/>
    <rect x="${x - 12}" y="${y + 55}" width="12" height="9" fill="#bbb"/>
    <rect x="${x + 70}" y="${y + 55}" width="12" height="9" fill="#bbb"/>`;
}

function wireSwitchLed() {
  return `
<svg class="wire" viewBox="0 0 560 330" xmlns="http://www.w3.org/2000/svg" font-family="Meiryo,sans-serif">
  ${uno(290)}
  ${pin(220, 80, "D2")}
  ${pin(220, 170, "D6")}
  ${pin(220, 280, "GND")}
  <!-- スイッチ -->
  ${switchParts(400, 50)}
  <text x="435" y="40" font-size="13" fill="#333" text-anchor="middle">タクトスイッチ（対角線の2本）</text>
  <line x1="240" y1="80" x2="388" y2="60" stroke="#2b7de9" stroke-width="5" stroke-linecap="round"/>
  <polyline points="482,109 548,109 548,280" fill="none" stroke="#222" stroke-width="5" stroke-linejoin="round"/>
  <!-- 抵抗とLED -->
  <line x1="240" y1="170" x2="290" y2="170" stroke="#e23b3b" stroke-width="5" stroke-linecap="round"/>
  <rect x="290" y="160" width="70" height="20" rx="8" fill="#d9b98a" stroke="#8a6d45"/>
  <text x="325" y="152" font-size="13" fill="#333" text-anchor="middle">抵抗 220Ω</text>
  <line x1="360" y1="170" x2="400" y2="170" stroke="#888" stroke-width="4"/>
  <path d="M400 170 L400 150 Q400 125 422 125 Q444 125 444 150 L444 180 L400 180 Z" fill="#ff5252"/>
  <text x="440" y="212" font-size="13" fill="#333">LED</text>
  <text x="440" y="230" font-size="12" fill="#666">長い足が抵抗側</text>
  <polyline points="430,180 430,280" fill="none" stroke="#888" stroke-width="4"/>
  <line x1="240" y1="280" x2="548" y2="280" stroke="#222" stroke-width="5" stroke-linecap="round"/>
</svg>`;
}

function wireSwitch() {
  return `
<svg class="wire" viewBox="0 0 560 220" xmlns="http://www.w3.org/2000/svg" font-family="Meiryo,sans-serif">
  ${uno(180)}
  ${pin(220, 90, "D2")}
  ${pin(220, 170, "GND")}
  ${switchParts(400, 70)}
  <text x="435" y="55" font-size="13" fill="#333" text-anchor="middle">タクトスイッチ（対角線の2本）</text>
  <line x1="240" y1="90" x2="388" y2="80" stroke="#2b7de9" stroke-width="5" stroke-linecap="round"/>
  <polyline points="482,129 520,129 520,195 240,195 240,170" fill="none" stroke="#222" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="300" y="215" font-size="12" fill="#666">USB でPCにもつなぐ</text>
</svg>`;
}

function wireSonic(withServo) {
  const rows = [["5V", "VCC", "#e23b3b"], ["D7", "Trig", "#2bb673"], ["D8", "Echo", "#9b59b6"], ["GND", "GND", "#222"]];
  let w = "";
  rows.forEach(([u, m, c], i) => {
    const y = 70 + i * 40;
    w += pin(220, y, u);
    w += `<line x1="240" y1="${y}" x2="380" y2="${y}" stroke="${c}" stroke-width="5" stroke-linecap="round"/>
          <rect x="380" y="${y - 6}" width="14" height="12" fill="#bbb"/>
          <text x="400" y="${y + 5}" font-size="14" fill="#333">${m}</text>`;
  });
  let servo = "";
  if (withServo) {
    const sr = [["GND", "#7a4a1d", "茶"], ["5V", "#e23b3b", "赤"], ["D9", "#f08a24", "オレンジ"]];
    sr.forEach(([p, c, n], i) => {
      const y = 260 + i * 34;
      servo += pin(220, y, p) +
        `<line x1="240" y1="${y}" x2="380" y2="${y}" stroke="${c}" stroke-width="5" stroke-linecap="round"/>
         <text x="310" y="${y - 7}" font-size="12" fill="#333" text-anchor="middle">${n}</text>`;
    });
    servo += `<rect x="380" y="245" width="140" height="100" rx="6" fill="#2f6fd6"/>
      <text x="450" y="302" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">SG90</text>`;
  }
  const h = withServo ? 370 : 230;
  return `
<svg class="wire" viewBox="0 0 560 ${h}" xmlns="http://www.w3.org/2000/svg" font-family="Meiryo,sans-serif">
  ${uno(h - 40)}
  ${w}
  <rect x="450" y="40" width="96" height="160" rx="6" fill="#1d5fa8"/>
  <circle cx="498" cy="85" r="26" fill="#ccc" stroke="#777" stroke-width="4"/>
  <circle cx="498" cy="155" r="26" fill="#ccc" stroke="#777" stroke-width="4"/>
  <text x="498" y="222" font-size="13" fill="#333" text-anchor="middle">HC-SR04</text>
  ${servo}
  ${withServo ? `<text x="95" y="200" font-size="12" fill="#fff" text-anchor="middle">5V と GND は</text>
                 <text x="95" y="218" font-size="12" fill="#fff" text-anchor="middle">2本ずつ必要。</text>
                 <text x="95" y="236" font-size="12" fill="#fff" text-anchor="middle">ブレッドボードで</text>
                 <text x="95" y="254" font-size="12" fill="#fff" text-anchor="middle">分ける</text>` : ""}
</svg>`;
}

function usbOnly() {
  return `<div class="usbonly">配線はいらない。USB ケーブルで PC とつなぐだけ。<br>結果は右の画面に出る。</div>`;
}

// =====================================================================
// 課題データ
//   code の中の {A} などが穴。answers に答え。
// =====================================================================
const NOTE_TABLE = `
<table class="ref"><tr><td>ド</td><td>レ</td><td>ミ</td><td>ファ</td><td>ソ</td><td>ラ</td><td>シ</td><td>ド</td></tr>
<tr><td>262</td><td>294</td><td>330</td><td>349</td><td>392</td><td>440</td><td>494</td><td>523</td></tr></table>
<p class="note">数字は「1秒に何回ふるえるか（Hz）」。大きいほど高い音。</p>`;

const SONIC_MEASURE =
`  digitalWrite(TRIG, LOW);
  delayMicroseconds(2);
  digitalWrite(TRIG, HIGH);      // 音を出す
  delayMicroseconds(10);
  digitalWrite(TRIG, LOW);
  long t = pulseIn(ECHO, HIGH);  // 音が行って帰ってくる時間（マイクロ秒）`;

const LESSONS = [
  {
    kind: "real", tab: "1 Lチカ",
    title: "基板のLEDを点滅させる",
    goal: "基板の「L」のLEDが、1秒ついて1秒消える。",
    wiring: wireBuiltinLed,
    code:
`void setup() {
  pinMode(13, {A});
}

void loop() {
  digitalWrite(13, HIGH);
  delay(1000);
  digitalWrite(13, {B});
  delay(1000);
}`,
    answers: { A: "OUTPUT", B: "LOW" },
    hints: {
      A: "13番ピンを「出力」に使う。出力は英語で？（大文字で打つ）",
      B: "HIGH はつける。消すのは？",
    },
    more: "delay の数字を変えて、速く点滅させてみよう。",
    real: ["「L」のLEDが1秒ごとに点滅した", "delay を変えたら速さが変わった"],
  },
  {
    kind: "real", tab: "2 外付けLED",
    title: "自分でつないだLEDを点滅させる",
    goal: "ブレッドボードのLEDが点滅する。",
    wiring: wireLed,
    code:
`const int LED = {A};

void setup() {
  pinMode(LED, OUTPUT);
}

void loop() {
  digitalWrite(LED, HIGH);
  delay({B});
  digitalWrite(LED, LOW);
  delay(200);
}`,
    answers: { A: "6", B: "200" },
    hints: {
      A: "LEDをつないだピンの番号。配線図を見る。",
      B: "つけている時間。消えている時間と同じにしよう（ミリ秒）。",
    },
    more: "LEDの向きを逆にさしたらどうなる？ 試して、理由を考えよう。",
    real: ["LEDが点滅した", "LEDの長い足が抵抗の側になっている"],
  },
  {
    kind: "real", tab: "3 明るさ",
    title: "LEDをじわっと明るくする",
    goal: "LEDがだんだん明るくなり、だんだん暗くなる。",
    wiring: wireLed,
    code:
`const int LED = 6;

void setup() {
  pinMode(LED, OUTPUT);
}

void loop() {
  for (int b = 0; b <= {A}; b++) {
    analogWrite(LED, b);
    delay({B});
  }
  for (int b = 255; b >= 0; b--) {
    analogWrite(LED, b);
    delay(5);
  }
}`,
    answers: { A: "255", B: "5" },
    hints: {
      A: "analogWrite で使える一番大きい数。下の行にヒントがある。",
      B: "暗くなるときと同じ速さにする。",
    },
    more: "delay を 20 にすると？ 明るくなるのに何秒かかるか、計算してから試そう。",
    real: ["LEDがだんだん明るくなった", "LEDがだんだん暗くなった"],
  },
  {
    kind: "real", tab: "4 スイッチ",
    title: "スイッチを押すとLEDがつく",
    goal: "スイッチを押している間だけ、LEDがつく。",
    wiring: wireSwitchLed,
    code:
`const int SW = 2;
const int LED = 6;

void setup() {
  pinMode(SW, INPUT_PULLUP);   // 押していないとき HIGH、押すと LOW
  pinMode(LED, OUTPUT);
}

void loop() {
  if (digitalRead(SW) == {A}) {
    digitalWrite(LED, HIGH);
  } else {
    digitalWrite(LED, {B});
  }
}`,
    answers: { A: "LOW", B: "LOW" },

function variant(L, i) {
  if (!HARDMODE || !HARD[i + 1]) return { code: L.code, answers: L.answers, hints: L.hints };
  let code = L.code;
  const answers = { ...L.answers }, hints = { ...L.hints };
  let next = Math.max(...Object.keys(L.answers).map(k => k.charCodeAt(0))) + 1;
  for (const [str, hint] of HARD[i + 1]) {
    const pos = code.indexOf(str);
    if (pos < 0) continue;
    const k = String.fromCharCode(next++);
    code = code.slice(0, pos) + `{${k}}` + code.slice(pos + str.length);
    answers[k] = str; hints[k] = hint;
  }
  // A, B, C… を上から順にふり直す
  const order = [...code.matchAll(/\{([A-Z])\}/g)].map(m => m[1]);
  const map = {}; order.forEach((k, j) => map[k] = String.fromCharCode(65 + j));
  const ans2 = {}, hint2 = {};
  order.forEach(k => { ans2[map[k]] = answers[k]; hint2[map[k]] = hints[k]; });
  code = code.replace(/\{([A-Z])\}/g, (_, k) => `{${map[k]}}`);
  return { code, answers: ans2, hints: hint2 };
}

function esc(s) { return s.replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c])); }

// 答えの「形」：記号と最初の単語は見せて、ほかの文字は □ にする
function shapeOf(ans) {
  const words = ans.match(/[A-Za-z0-9_]+/g) || [];
  if (words.length <= 1) {
    // 1語だけの答え（OUTPUT、1500 など）は、最初の1文字だけ見せる
    return ans.replace(/[A-Za-z0-9_]+/g, w => w.length >= 3 ? w[0] + "□".repeat(w.length - 1) : "□".repeat(w.length));
  }
  let first = true;
  return ans.replace(/[A-Za-z0-9_]+/g, w => {
    if (first) { first = false; return w; }
    return "□".repeat(w.length);
  });
}

function renderCode(L) {   // L は variant() の結果
  // コメント部分を灰色に
  const lines = L.code.split("\n").map(line => {
    const i = line.indexOf("//");
    let body = i >= 0 ? line.slice(0, i) : line;
    let com = i >= 0 ? line.slice(i) : "";
    body = esc(body).replace(/\{([A-Z])\}/g, (_, k) =>
      SENSEI ? `<span class="blank ans">${esc(L.answers[k])}</span>` : `<span class="blank">${k}</span>`);
    com = com ? `<span class="c">${esc(com).replace(/\{([A-Z])\}/g, "$1")}</span>` : "";
    return body + com;
  });
  return lines.join("\n");
}

  line = line.trim();

  let ok = false, freq = null, ms = null;

  for (const part of line.split(",")) {
    const m = part.match(/^\s*([a-zA-Z]+)\s*[=:]\s*(-?\d+(?:\.\d+)?)\s*$/);
    if (!m) continue;
    const k = m[1].toLowerCase(), v = parseFloat(m[2]);
    if (k === "freq") { freq = v; ok = true; }
    else if (k === "ms") { ms = v; ok = true; }
    else if (k in state && k !== "ledSeen") { state[k] = v; got[k] = v; ok = true; }
  }
  if ("led" in got) state.ledSeen = true;
  if ("angle" in got && "dist" in got) radarPts.push({ a: got.angle, d: got.dist, t: performance.now() });
  if ("score" in got) { scores.push(got.score); if (scores.length > 50) scores.shift(); }

let actx = null;
function audio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === "suspended") actx.resume();
  return actx;
}
document.addEventListener("pointerdown", () => audio(), { once: true });

function playTone(freq, ms) {
  lastFreq = { f: freq, t: performance.now(), ms };
  if (!actx || freq <= 0 || freq > 20000) return;
  const c = actx, t = c.currentTime, dur = Math.min(ms, 3000) / 1000;
  const o = c.createOscillator(), g = c.createGain();
  o.type = "triangle"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.5, t + 0.01);
  g.gain.setValueAtTime(0.5, t + Math.max(0.02, dur - 0.05));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(c.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

  try {

    port = null;

    return;
  }
  try {
    if (!port.readable) await port.open({ baudRate: 9600 });   // すでに開いていればそのまま使う
  } catch (err) {
    port = null;
    setStatus(`このポートは、ほかのものが使用中です。Arduino IDE（書き込み中・シリアルプロッタ）や、` +

    return;
  }
  setStatus("接続中（書き込む前に「切断」を押す）", "ok");
  btnC.style.display = "none"; btnD.style.display = "inline-block";
  readLoop();

async function readLoop() {

  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      let i;
      while ((i = buf.indexOf("\n")) >= 0) { handleLine(buf.slice(0, i)); buf = buf.slice(i + 1); }
      if (buf.length > 1000) buf = "";
    }
  } catch {}
  await closePort();
}
async function closePort() {
  try { if (reader) await reader.cancel(); } catch {}
  try { if (readClosed) await readClosed; } catch {}
  try { if (port) await port.close(); } catch {}
  reader = null; readClosed = null; port = null;
  setStatus("未接続");
  btnC.style.display = "inline-block"; btnD.style.display = "none";
}
btnD.onclick = () => closePort();
if ("serial" in navigator) navigator.serial.addEventListener("disconnect", e => { if (port && e.target === port) closePort(); });

let writeQ = Promise.resolve();
function sendToUno(s) {
  const shown = s.replace(/\n/g, "");
  if (!port || !port.writable) {
    logLines.push(`<span class="out">→ UNO へ ${esc(shown)}（未接続なので届かない）</span>`);
    return;
  }
  logLines.push(`<span class="out">→ UNO へ ${esc(shown)}</span>`);
  writeQ = writeQ.then(async () => {
    try {
      const w = port.writable.getWriter();
      await w.write(new TextEncoder().encode(s));
      w.releaseLock();
    } catch {}
  });
}

// tone=周波数 を送り続けている間、鳴りつづける音
let toneOsc = null, toneGain = null, toneT = 0;
function setTone(f) {
  toneT = performance.now();
  if (!actx) return;
  if (f <= 0) { stopTone(); return; }
  if (!toneOsc) {
    toneOsc = actx.createOscillator(); toneGain = actx.createGain();
    toneOsc.type = "triangle"; toneGain.gain.value = 0.35;
    toneOsc.connect(toneGain).connect(actx.destination);
    toneOsc.frequency.value = f; toneOsc.start();
  }
  toneOsc.frequency.setTargetAtTime(f, actx.currentTime, 0.015);
}
function stopTone() {
  if (!toneOsc) return;
  const o = toneOsc, gn = toneGain; toneOsc = null; toneGain = null;
  gn.gain.setTargetAtTime(0, actx.currentTime, 0.02);
  o.stop(actx.currentTime + 0.1);
}
setInterval(() => { if (toneOsc && performance.now() - toneT > 400) stopTone(); }, 100);

function wrapText(s, x, y, maxW, lh, size, color) {
  g.font = `bold ${size}px Meiryo, sans-serif`; g.fillStyle = color; g.textAlign = "center";
  let line = "", lines = [];
  for (const ch of s) {
    // 「。」「、」は行の頭に来ないように、前の行にくっつける
    if (g.measureText(line + ch).width > maxW && !"。、）」".includes(ch)) { lines.push(line); line = ch; } else line += ch;
  }
  lines.push(line);
  lines.forEach((l, i) => g.fillText(l, x, y + i * lh));
}

  if (G.over) { SIMINIT.dino(); sendToUno("r"); return; }
  if (G.y === 0) G.vy = 760;
}
SIMDATA.dino = got => { if (got.jump === 1) dinoJump(); };
function drawDino() {
  const now = performance.now(), dt = Math.min(0.05, (now - G.last) / 1000); G.last = now;
  const gy = 330;
  if (!G.over) {
    G.t += dt; G.speed += 8 * dt; G.score += G.speed * dt / 10;
    G.vy -= 2200 * dt; G.y = Math.max(0, G.y + G.vy * dt); if (G.y === 0) G.vy = Math.max(0, G.vy);
    G.next -= dt;
    if (G.next <= 0) { G.obs.push({ x: W + 20, w: 18 + Math.random() * 18, h: 35 + Math.random() * 35 }); G.next = 0.9 + Math.random() * 1.2; }
    G.obs.forEach(o => o.x -= G.speed * dt);
    G.obs = G.obs.filter(o => o.x > -50);
    G.inv -= dt;
    const dx = 80, dw = 40, dh = 50, dyTop = gy - dh - G.y;
    for (const o of G.obs) {
      if (G.inv <= 0 && o.x < dx + dw - 6 && o.x + o.w > dx + 6 && gy - o.h < dyTop + dh - 4) {
        G.lives--; G.inv = 1.2; sendToUno("h"); playTone(150, 300);
        if (G.lives <= 0) G.over = true;
        break;
      }
    }
  }
  clear();
  g.fillStyle = "#3a3f4b"; g.fillRect(0, gy, W, 3);
  const blink = G.inv > 0 && Math.floor(now / 100) % 2;
  if (!blink) {
    const x = 80, y = gy - 50 - G.y;
    g.fillStyle = "#5fd68a"; g.fillRect(x, y + 10, 30, 40); g.fillRect(x + 14, y, 26, 20);
    g.fillStyle = "#0e1014"; g.fillRect(x + 30, y + 5, 4, 4);
  }
  g.fillStyle = "#c58bff"; G.obs.forEach(o => g.fillRect(o.x, gy - o.h, o.w, o.h));
  text(`スコア ${Math.floor(G.score)}`, W - 20, 40, 22, "#e8eaf0", "right", true);
  text("命 " + "●".repeat(Math.max(0, G.lives)) + "○".repeat(3 - Math.max(0, G.lives)), 20, 40, 22, "#ff6b6b", "left", true);
  text("UNO のスイッチ（またはスペースキー）でジャンプ", W / 2, 390, 15, "#9aa0ad");
  if (G.over) {
    g.fillStyle = "rgba(0,0,0,0.6)"; g.fillRect(0, 0, W, H);
    text("ゲームオーバー", W / 2, 180, 40, "#ff6b6b", "center", true);
    text(`スコア ${Math.floor(G.score)}`, W / 2, 230, 28, "#e8eaf0", "center", true);
    text("ジャンプでもう一度", W / 2, 280, 18, "#9aa0ad");
  }
}

SIMINIT.breakout = () => {
  G = { bx: W / 2, by: 300, vx: 190, vy: -260, lives: 3, bricks: [], over: false, overT: 0, last: performance.now(), mouse: null };
  for (let r = 0; r < 4; r++) for (let c = 0; c < 8; c++) G.bricks.push({ x: 20 + c * 76, y: 50 + r * 28, alive: true, r });
};
function drawBreakout() {
  const now = performance.now(), dt = Math.min(0.03, (now - G.last) / 1000); G.last = now;
  const pw = 110, py = 385;
  const fresh = state.pad !== null && now - lastPadT < 1000;
  const p = fresh ? state.pad : (G.mouse !== null ? G.mouse : 50);
  const px = Math.max(0, Math.min(100, p)) / 100 * (W - pw);
  if (!G.over) {
    G.bx += G.vx * dt; G.by += G.vy * dt;
    if (G.bx < 8) { G.bx = 8; G.vx = Math.abs(G.vx); }
    if (G.bx > W - 8) { G.bx = W - 8; G.vx = -Math.abs(G.vx); }
    if (G.by < 8) { G.by = 8; G.vy = Math.abs(G.vy); }
    if (G.vy > 0 && G.by > py - 8 && G.by < py + 6 && G.bx > px - 6 && G.bx < px + pw + 6) {
      G.vy = -Math.abs(G.vy) * 1.02;
      G.vx = ((G.bx - (px + pw / 2)) / (pw / 2)) * 300;
    }
    for (const b of G.bricks) {
      if (b.alive && G.bx > b.x && G.bx < b.x + 70 && G.by > b.y && G.by < b.y + 22) {
        b.alive = false; G.vy = -G.vy; sendToUno("b"); playTone(660 + b.r * 110, 60); break;
      }
    }
    if (G.by > H + 10) {
      G.lives--; sendToUno(String(Math.max(0, G.lives))); playTone(150, 300);
      if (G.lives <= 0) { G.over = true; G.overT = now; }
      else { G.bx = W / 2; G.by = 300; G.vx = 190; G.vy = -260; }
    }
    if (G.bricks.every(b => !b.alive)) G.bricks.forEach(b => b.alive = true);
  } else if (now - G.overT > 3000) { SIMINIT.breakout(); sendToUno("3"); }
  clear();
  const colors = ["#ff6b6b", "#ffb43c", "#5fd68a", "#4aa3ff"];
  G.bricks.forEach(b => { if (b.alive) { g.fillStyle = colors[b.r]; g.fillRect(b.x, b.y, 70, 22); } });
  g.fillStyle = "#e8eaf0"; g.fillRect(px, py, pw, 12);
  g.beginPath(); g.arc(G.bx, G.by, 8, 0, Math.PI * 2); g.fillStyle = "#fff"; g.fill();
  text("命 " + "●".repeat(Math.max(0, G.lives)), 16, 30, 18, "#ff6b6b", "left", true);
  text(fresh ? `pad = ${state.pad}` : "pad = 来ていない（マウスでも動く）", W - 16, 30, 15, fresh ? "#9aa0ad" : "#ff6b6b", "right");
  if (G.over) text("ゲームオーバー（3秒でもう一度）", W / 2, 250, 30, "#ff6b6b", "center", true);
}
let lastPadT = -1e9;
SIMDATA.breakout = got => { if ("pad" in got) lastPadT = performance.now(); };

SIMDATA.quiz = got => {
  if (!("ans" in got)) return;
  if (G.phase === "end") { SIMINIT.quiz(); sendToUno("n"); return; }
  if (G.phase !== "ask" || (got.ans !== 1 && got.ans !== 2)) return;
  const ok = got.ans === QUIZ[G.qi][1];
  G.last = ok; G.phase = "result"; G.judgeT = performance.now();
  if (ok) G.score++;

};
function drawQuiz() {
  const now = performance.now();

  current = i;
  const L = LESSONS[i];
  document.querySelectorAll("#tabs button").forEach((b, j) => b.classList.toggle("active", j === i));
  const kindLabel = L.kind === "real" ? `<span class="kind real">実機</span>`
                  : L.kind === "sim" ? `<span class="kind sim">画面</span>`
                  : `<span class="kind real">実機</span><span class="kind sim">画面</span>`;
  document.getElementById("title").innerHTML = `${kindLabel}課題${i + 1}：${esc(L.title)}`;
  document.getElementById("goal").textContent = "ゴール：" + L.goal;
  document.getElementById("wiring").innerHTML = L.wiring();
  const V = variant(L, i);
  codeEl.innerHTML = renderCode(V);
  document.getElementById("hints").innerHTML = Object.entries(V.hints)
    .map(([k, h]) => `<li><b>${k}</b>${esc(h)}${SENSEI ? `　→ <b>${esc(V.answers[k])}</b>` :
      ` <button class="shapebtn" data-k="${k}">形を見る</button><code class="shape" hidden>${esc(shapeOf(V.answers[k]))}</code>`}</li>`).join("");
  document.querySelectorAll("#hints .shapebtn").forEach(btn => btn.onclick = () => {
    btn.hidden = true; btn.nextElementSibling.hidden = false;
  });
  document.getElementById("extra").innerHTML = L.extra || "";
  document.getElementById("more").innerHTML = `<b>できたら：</b>${esc(L.more).replace(/\{([A-Z])\}/g, "$1")}`;

  if (L.sim) {
    cv.style.display = "block"; realbox.style.display = "none";
    document.getElementById("simtitle").textContent = "画面で確かめる";
  } else {
    cv.style.display = "none"; realbox.style.display = "block";
    document.getElementById("simtitle").textContent = "実機で確かめる";
    realbox.innerHTML = `<div class="big">UNO の実物を見よう</div>` +
      L.real.map(t => `<label><input type="checkbox">${esc(t)}</label>`).join("");
  }
  // 前の課題の表示をリセット
  Object.assign(state, STATE0);
  radarPts = []; scores = [];
  stopTone();
  G = {};
  if (L.sim && SIMINIT[L.sim]) SIMINIT[L.sim]();
  if (L.sim === "remote") { buildRemoteCtrl(); ctrl.style.display = "flex"; }
  else { ctrl.innerHTML = ""; ctrl.style.display = "none"; }
  lastFreq = { f: null, t: -1e9 };
  logLines = [];
}

// ゲーム用：スペースでジャンプ、マウスでパドル
addEventListener("keydown", e => {
  if (e.key === " " && LESSONS[current].sim === "dino" && document.activeElement !== manual) {
    e.preventDefault(); audio(); dinoJump();
  }
});
cv.addEventListener("mousemove", e => {
  if (LESSONS[current].sim !== "breakout") return;
  const r = cv.getBoundingClientRect();
  G.mouse = (e.clientX - r.left) / r.width * 100;
});

const tabs = document.getElementById("tabs");
LESSONS.forEach((L, i) => {
  if (i === 10) {
    const br = document.createElement("div");
    br.style.flexBasis = "100%";
    tabs.appendChild(br);
    const sep = document.createElement("span");
    sep.className = "tabsep"; sep.textContent = "作品 →";
    tabs.appendChild(sep);
  }
  const b = document.createElement("button");
  b.textContent = L.tab;
  b.className = L.kind;
  b.onclick = () => { showLesson(i); b.blur(); };
  tabs.appendChild(b);
});
showLesson(0);

function frame() {
  const L = LESSONS[current];
  if (L.sim) DRAW[L.sim]();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
