<title>生まれ変わりのサイコロ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one column on a near-black ground with a vignette. Mincho headings, cold gray-blue accents, red only for Japan and for the "no second life" warning. A 3D die rolls full-screen at birth. */
:root{
  --bg:#0b0c0f; --surface:#131519; --ink:#d9dde3; --muted:#7b828d; --line:#252930; --soft:#1a1d22;
  --band:#060709; --band-fg:#e4e7ec; --band-muted:#7b828d;
  --blue:#7d9cc9; --blue-soft:#172030; --cyan:#a9c6e0; --cyan-soft:#1b2633; --indigo:#8a8fbf; --indigo-soft:#1c1e2e;
  --red:#d6332b; --red-soft:#2a1214;
  --pip:#0b0c0f; --dieface:#d9dde3; --v0:#1e232b; --v1:#2a323d; --v2:#3a4758; --v3:#52647b;
  --f-jp:"BIZ UDPGothic","Hiragino Sans","Noto Sans CJK JP","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-min:"BIZ UDPMincho","Hiragino Mincho ProN","Noto Serif CJK JP","Noto Serif JP","Yu Mincho",serif;
  --f-num:"BIZ UDPGothic","Hiragino Sans","Noto Sans CJK JP",system-ui,sans-serif;
  color-scheme:dark;
}

*{box-sizing:border-box}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-jp);font-size:17px;line-height:1.75;font-weight:500}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-min);font-weight:800;line-height:1.3;margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:clamp(1.35rem,4.2vw,1.75rem)}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.small{font-size:.85rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{border:0;border-radius:4px;padding:14px 28px;font-weight:700;font-size:1.05rem;background:var(--ink);color:var(--bg);letter-spacing:.04em;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{font-family:var(--f-num);font-size:.78rem;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}

/* ---- title band ---- */
.band{background:var(--band);color:var(--band-fg);border:1px solid var(--line);border-radius:6px;padding:36px 28px;display:flex;flex-direction:column;gap:20px;overflow:hidden;position:relative}
.band .eyebrow{color:var(--band-muted)}
.logo{display:flex;flex-direction:column;gap:2px}
.logo .sub{font-weight:700;font-size:clamp(1.1rem,3.6vw,1.5rem);letter-spacing:.3em;color:var(--band-muted)}
.logo .main{display:flex;align-items:center;gap:.04em;font-family:var(--f-min);font-weight:800;font-size:clamp(2.8rem,11vw,4.8rem);line-height:1;letter-spacing:.04em}
.logo .glyph{width:.86em;height:.86em;border-radius:.16em;background:var(--ink);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:.12em;margin-left:.06em;transform:rotate(-8deg)}
.logo .glyph i{width:.14em;height:.14em;border-radius:50%;background:var(--bg);place-self:center}
.band .lead{font-family:var(--f-num);font-size:clamp(1.3rem,5vw,2rem);font-weight:600;color:var(--cyan)}
.band p{color:var(--band-fg)}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rule{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.rule .n{font-family:var(--f-num);font-weight:700;color:var(--blue)}
.rule b{font-weight:900}
@media (max-width:620px){.rules{grid-template-columns:1fr}}

/* ---- dice overlay ---- */
.overlay{position:fixed;inset:0;z-index:50;background:var(--band);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;color:var(--band-fg);padding:24px}
.scene{width:120px;height:120px;perspective:600px}
.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;transform:rotateX(-20deg) rotateY(25deg)}
.face{position:absolute;inset:0;background:var(--dieface);border-radius:18px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:16px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.06)}
.face i{width:20px;height:20px;border-radius:50%;background:var(--pip);place-self:center}
.face.one i{background:var(--red);width:26px;height:26px}
.f1{transform:translateZ(60px)}
.f6{transform:rotateY(180deg) translateZ(60px)}
.f2{transform:rotateY(90deg) translateZ(60px)}
.f5{transform:rotateY(-90deg) translateZ(60px)}
.f3{transform:rotateX(90deg) translateZ(60px)}
.f4{transform:rotateX(-90deg) translateZ(60px)}
.shadow{width:110px;height:14px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(6px);margin-top:-18px}
.cast{font-family:var(--f-min);font-weight:800;font-size:clamp(1.8rem,7vw,2.8rem);letter-spacing:.2em;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
.cast.on{opacity:1;transform:none}
.cast small{display:block;font-family:var(--f-num);font-size:.9rem;letter-spacing:.3em;color:var(--band-muted);text-align:center;font-weight:500}

/* ---- birth cards ---- */
.dice{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (max-width:560px){.dice{grid-template-columns:1fr}}
.die{perspective:800px;min-width:0}
.die .in{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:var(--surface);animation:flip .6s cubic-bezier(.2,.8,.3,1.2) both;transform-origin:center}
.die .k{font-size:.8rem;color:var(--muted)}
.die .v{font-weight:900;font-size:1.15rem}
.die .p{font-family:var(--f-num);font-size:.8rem;color:var(--muted)}
.die.no .in{background:var(--soft);border-style:dashed}
.die.no .v{color:var(--muted)}
@keyframes flip{from{transform:rotateX(90deg);opacity:0}to{transform:none;opacity:1}}
.odds{display:flex;flex-direction:column;gap:2px;border-left:4px solid var(--blue);padding:6px 0 6px 16px}
.odds .big{font-family:var(--f-num);font-size:clamp(1.5rem,6vw,2.2rem);font-weight:700;color:var(--blue)}

/* ---- status ---- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.status{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--band);color:var(--band-fg);border:1px solid var(--line);border-radius:6px;padding:12px 18px;display:flex;flex-direction:column;gap:8px}
.status-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.age{font-family:var(--f-num);font-size:1.7rem;font-weight:700;line-height:1}
.where{font-size:.82rem;color:var(--band-muted)}
.tot{font-family:var(--f-num);color:var(--cyan);font-weight:600}
.gauges{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.g{display:flex;flex-direction:column;gap:3px;min-width:0}
.g .lab{display:flex;justify-content:space-between;font-size:.76rem;gap:4px}
.g .lab span:last-child{font-family:var(--f-num);font-weight:700}
.bar{height:6px;background:rgba(127,135,148,.28);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .7s ease}
.g.flash .bar i{background:var(--cyan)}
.g.flash .lab span:last-child{color:var(--cyan)}
@media (max-width:520px){.gauges{grid-template-columns:repeat(3,1fr)}}
.panel .gauges .lab{color:var(--ink)}

/* ---- wall ---- */
.wallhead{display:flex;gap:16px;align-items:flex-start}
.brick{flex:none;width:48px;height:48px;display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:4px}
.brick span{background:var(--ink);border-radius:2px}
.brick span:nth-child(3){grid-column:span 2}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;transition:border-color .15s,transform .15s}
.opt:hover:not(:disabled){border-color:var(--blue);transform:translateX(2px)}
.opt .tag{font-size:.75rem;font-weight:900;padding:2px 10px;border-radius:999px;grid-row:span 2;align-self:start;margin-top:3px;letter-spacing:.08em}
.opt.try .tag{background:var(--ink);color:var(--bg)}
.opt.safe .tag{background:var(--soft);color:var(--muted)}
.opt .meta{font-family:var(--f-num);font-size:.8rem;color:var(--muted)}
.opt:disabled{opacity:.55;cursor:not-allowed;background:var(--soft)}

/* ---- judge roll ---- */
.judge{display:flex;align-items:center;gap:18px;padding:14px 16px;border-radius:14px;background:var(--soft)}
.mini{width:64px;height:64px;perspective:400px;flex:none}
.mini .cube{transform:rotateX(-20deg) rotateY(25deg)}
.mini .face{border-radius:10px;padding:8px}
.mini .face i{width:10px;height:10px}
.mini .face.one i{width:13px;height:13px}
.mini .f1{transform:translateZ(32px)}.mini .f6{transform:rotateY(180deg) translateZ(32px)}.mini .f2{transform:rotateY(90deg) translateZ(32px)}.mini .f5{transform:rotateY(-90deg) translateZ(32px)}.mini .f3{transform:rotateX(90deg) translateZ(32px)}.mini .f4{transform:rotateX(-90deg) translateZ(32px)}
.readout{display:flex;flex-direction:column;gap:2px}
.readout .roll{font-family:var(--f-num);font-size:2rem;font-weight:700;line-height:1}
.readout .need{font-family:var(--f-num);font-size:.85rem;color:var(--muted)}

/* ---- outcome ---- */
.outcome{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;animation:rise .4s ease both}
.outcome.ok{background:var(--cyan-soft)}
.outcome.ng{background:var(--indigo-soft)}
.outcome.stay{background:var(--soft)}
.outcome .head{font-weight:900;font-size:1.2rem}
.outcome.ok .head{color:var(--cyan)}
.outcome.ng .head{color:var(--indigo)}
.deltas{display:flex;flex-wrap:wrap;gap:8px}
.deltas span{font-family:var(--f-num);font-size:.85rem;background:var(--surface);border-radius:6px;padding:1px 10px}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* ---- log ---- */
.log-row{display:grid;grid-template-columns:3.2em 1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline;font-size:.92rem}
.log-row:first-child{border-top:0}
.log-row .a{font-family:var(--f-num);color:var(--muted)}
.mark{font-size:.75rem;font-weight:900;padding:1px 10px;border-radius:999px;white-space:nowrap}
.mark.ok{background:var(--cyan-soft);color:var(--cyan)}
.mark.ng{background:var(--indigo-soft);color:var(--indigo)}
.mark.stay{background:var(--soft);color:var(--muted)}

/* ---- result ---- */
.chart-wrap{overflow-x:auto}
svg text{font-family:var(--f-num)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.q{border-left:4px solid var(--blue);padding:4px 0 4px 16px;display:flex;flex-direction:column;gap:8px}
.q ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
.card-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card-sum div{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.card-sum .n{font-family:var(--f-num);font-size:1.5rem;font-weight:700}
.card-sum .k{font-size:.8rem;color:var(--muted)}
@media (max-width:560px){.card-sum{grid-template-columns:repeat(2,1fr)}}
.src{font-size:.78rem;color:var(--muted)}
.fadein{animation:rise .4s ease both}
@media (prefers-reduced-motion:reduce){.fadein,.outcome,.die .in{animation:none}.bar i{transition:none}}

/* ---- village ---- */
.village{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;max-width:440px}
.pyr-wrap{max-width:520px}
.pyr{width:100%;height:auto;display:block}
.tier{stroke:var(--bg);stroke-width:2}.tier.t0{fill:var(--v0)}.tier.t1{fill:var(--v1)}.tier.t2{fill:var(--v2)}.tier.t3{fill:var(--v3)}
.pyr .cell{fill:#c9d1dc;fill-opacity:.55;transition:r .12s}
.pyr .cell.jpc{fill:var(--red);fill-opacity:1;r:8px}
.pyr .cell.hit{fill:#ffffff;fill-opacity:1;r:9px}
.pyr .cell.me{fill:#ffffff;fill-opacity:1;r:9px;stroke:#ffffff;stroke-opacity:.35;stroke-width:4;animation:ring 1.6s ease-in-out infinite}
@keyframes ring{50%{stroke-width:12}}
.pyr .you{font-family:var(--f-min);font-weight:800;font-size:18px;fill:#ffffff;paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.pyr .tl{font-family:var(--f-jp);font-weight:700;font-size:17px;fill:var(--ink)}
.pyr .tn{font-family:var(--f-num);font-weight:700;font-size:19px;fill:var(--blue)}
.sw.me{background:#ffffff;box-shadow:0 0 0 3px rgba(255,255,255,.3)}
.b0,.sw.b0{background:var(--v0)}.b1,.sw.b1{background:var(--v1)}.b2,.sw.b2{background:var(--v2)}.b3,.sw.b3{background:var(--v3)}

@keyframes pulse{50%{box-shadow:0 0 0 9px var(--cyan-soft)}}
.vlegend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.82rem;color:var(--muted)}
.vlegend span{display:inline-flex;align-items:center;gap:6px}
.vlegend b{color:var(--ink);font-weight:600}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block;position:relative}
.sw.jpm{background:var(--red)}
.cmp{display:grid;grid-template-columns:2.4em 1fr 4.2em;gap:8px;align-items:center;font-size:.78rem;color:var(--muted)}
.cmp .bar{height:6px}
.cmp.jp .bar i{background:var(--red)}
.cmp .num{text-align:right;color:var(--ink)}
.tally{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tally div{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.tally .n{font-size:1.8rem;font-weight:700;color:var(--blue)}
.tally div:last-child .n{color:var(--red)}
.tally small{font-size:.9rem;color:var(--muted)}
.tally .k{font-size:.8rem;color:var(--muted)}
details.src summary{cursor:pointer;color:var(--blue)}
details.src ul{margin:8px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
details.src a{color:var(--blue)}
@media (prefers-reduced-motion:reduce){.cell.me,.pyr .cell.me{animation:none}}

/* ---- rebirth ---- */
.confirm{position:fixed;inset:0;z-index:60;background:rgba(5,6,8,.96);display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px));animation:fadeBg .6s ease both}
.confirm .box{max-width:460px;display:flex;flex-direction:column;gap:18px;text-align:center;align-items:center}
.confirm h2{font-size:clamp(1.6rem,6vw,2.2rem);letter-spacing:.08em}
.confirm .cnt{font-family:var(--f-num);color:var(--muted);letter-spacing:.2em;font-size:.85rem}
.confirm .warn{color:var(--muted)}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
@keyframes fadeBg{from{opacity:0}to{opacity:1}}
.scare{position:fixed;inset:0;z-index:70;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;overflow:hidden}
.scare canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.16;mix-blend-mode:screen}
.scare .broken{width:min(42vw,180px);position:relative;animation:shake .12s steps(2) infinite}
.scare .msg{position:relative;font-family:var(--f-min);font-weight:800;color:#f1f1f1;font-size:clamp(1.6rem,6.8vw,3.4rem);letter-spacing:.1em;text-align:center;line-height:1.4}
.scare .msg span{opacity:0;transition:opacity .25s}
.scare .msg span.on{opacity:1}
.scare .msg.glitch{animation:glitch .18s steps(2) infinite}
.scare .sub{position:relative;color:var(--red);font-family:var(--f-min);font-weight:600;letter-spacing:.3em;opacity:0;transition:opacity 1s}
.scare .sub.on{opacity:1}
.scare .btn{position:relative;opacity:0;transition:opacity 1s}
.scare .btn.on{opacity:1}
.boomflash{animation:boomflash .5s steps(3) 1}
@keyframes boomflash{0%{background:#fff}50%{background:#6b0000}100%{background:#000}}
@keyframes shake{0%{transform:translate(1px,-1px) rotate(-1deg)}100%{transform:translate(-2px,1px) rotate(1deg)}}
@keyframes glitch{0%{text-shadow:3px 0 var(--red),-3px 0 #4a8fd6;transform:translateX(1px)}100%{text-shadow:-2px 0 var(--red),2px 0 #4a8fd6;transform:translateX(-1px)}}
.locked{color:var(--red);font-family:var(--f-min);font-weight:600;letter-spacing:.1em}
@media (prefers-reduced-motion:reduce){.scare .broken,.scare .msg.glitch,.boomflash,.confirm{animation:none}}

.place{font-size:clamp(1.6rem,6.5vw,2.4rem);letter-spacing:.06em;min-height:1.4em}
.place.spin{color:var(--muted)}
.place.landed{animation:rise .5s ease both}
.tier{transition:fill .15s,opacity .15s}
.tier.lit{fill:#7f93ad}
.pyr .medot{fill:#ffffff;stroke:#ffffff;stroke-opacity:.35;stroke-width:4;animation:ring 1.6s ease-in-out infinite}
.pyr .jpdot{fill:var(--red)}
.pyr .jpl{fill:var(--red);font-size:16px}
.pyr .lead{stroke:var(--red);stroke-width:1.5}
.sbs{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.sb{display:grid;grid-template-columns:8.5em 1fr 3em;gap:10px;align-items:center;font-size:.85rem}
.sbn{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbb{display:flex;height:12px;border-radius:2px;overflow:hidden;background:var(--soft)}
.sbb i{display:block;height:100%}
.sbb i.t0{background:var(--v0)}.sbb i.t1{background:var(--v1)}.sbb i.t2{background:var(--v2)}.sbb i.t3{background:var(--v3)}
.sbb i.hl{background:#c9d4e2}
.sbv{text-align:right;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.pyr .medot,.place.landed{animation:none}}
.tempt{color:var(--muted);font-family:var(--f-min);font-weight:600;letter-spacing:.06em}
.pyr .prevdot{fill:none;stroke:#aeb7c4;stroke-width:2.5;stroke-dasharray:4 3}
.pyr .prevl{fill:#aeb7c4;font-size:15px}
.sw.prev{background:transparent;border:2px dashed #aeb7c4}
.place .rg{display:block;font-family:var(--f-jp);font-weight:500;font-size:.9rem;letter-spacing:.2em;color:var(--muted)}
.place{min-height:2.6em}
.overlay.slow{animation:darken 5.6s ease-in both}
@keyframes darken{from{background:var(--band)}to{background:#000}}
.overlay.slow .shadow{display:none}
.scene.zoom{transition:transform 5.6s ease-in;transform:scale(1.55)}
.scene.tremble{animation:shake .08s steps(2) infinite}
.scene.zoom.tremble{transform:none;scale:1.55}
.careers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (max-width:520px){.careers{grid-template-columns:1fr}}
.career{text-align:left;border:1px solid var(--line);background:var(--soft);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;transition:border-color .15s,transform .15s}
.career:hover{border-color:var(--ink);transform:translateX(2px)}
.career b{font-family:var(--f-min);font-weight:800;font-size:1.15rem;letter-spacing:.04em}
.career span{font-size:.82rem;color:var(--muted)}
.gate{color:var(--red)}
p.gate{margin-top:6px}
.plan-l{font-family:var(--f-min);font-weight:800;font-size:1.05rem;letter-spacing:.04em}
#plan{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px 14px;resize:vertical;line-height:1.6}
#plan:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.powers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:480px){.powers{grid-template-columns:1fr}}
.mine{border-left:3px solid var(--ink);padding-left:12px;font-family:var(--f-min);font-weight:600}

function born(jp){
  const c=jp?JAPAN:pickCountry();

  if(jp)bi=3;else{let r=rnd(),a=0;bi=3;for(let i=0;i<4;i++){a+=c[3+i];if(r<a){bi=i;break}}}
  const band=BANDS[bi];

  const q=jp?.93:WCUM[bi]+rnd()*WORLDB[bi];
  // 暮らしの項目：世界全体の割合に合うように、お金が少ない人ほど持っていない確率が高いモデル
  const env={};
  for(const it of ITEMS){const t=1-it.world;const pr=1/(1+Math.exp(-(q-t)/.05));env[it.k]=jp?true:rnd()<pr}
  const j=()=>Math.round(rnd()*6-3);
  const stats={
    body:15+(env.water?8:0)+j(),
    know:8+(env.school?8:0)+(env.net?4:0)+j(),
    skill:8+(env.elec?4:0)+j(),
    link:12+j(),
    money:band.money+j()
  };
  for(const k in stats)stats[k]=Math.max(1,stats[k]);
  S={jp:!!jp,country:c,bi,band,env,q,stats,exp:{},step:0,age:0,log:[],hist:[]};

}

const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function faceHTML(n){let h="";for(let i=0;i<9;i++)h+=PIPS[n].includes(i)?`<i style="grid-area:${Math.floor(i/3)+1}/${i%3+1}"></i>`:"";return `<div class="face f${n} ${n===1?"one":""}">${h}</div>`}

const FACE_ROT={1:[0,0],2:[0,-90],3:[-90,0],4:[90,0],5:[0,90],6:[0,180]};
async function rollCube(cube,ms){
  const n=1+Math.floor(rnd()*6);const [fx,fy]=FACE_ROT[n];
  const sx=(2+Math.floor(rnd()*2))*360,sy=(2+Math.floor(rnd()*2))*360;
  cube.style.transition="none";cube.style.transform="rotateX(-20deg) rotateY(25deg)";

  cube.style.transform=`rotateX(${fx-sx-12}deg) rotateY(${fy+sy+18}deg)`;
  await wait(RM?50:ms);
  return n;
}

function noise(cv){
  const ctx=cv.getContext("2d");let on=true;
  const draw=()=>{if(!on)return;cv.width=160;cv.height=100;const im=ctx.createImageData(160,100);for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}ctx.putImageData(im,0,0);requestAnimationFrame(draw)};
  if(!RM)draw();return ()=>{on=false};
}
function boom(){
  try{
    const A=new (window.AudioContext||window.webkitAudioContext)();const t=A.currentTime;
    const o=A.createOscillator(),g=A.createGain();o.type="sawtooth";o.frequency.setValueAtTime(70,t);o.frequency.exponentialRampToValueAtTime(32,t+2.4);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+2.6);
    o.connect(g).connect(A.destination);o.start(t);o.stop(t+2.7);
    const len=A.sampleRate*.5,buf=A.createBuffer(1,len,A.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
    const n=A.createBufferSource(),ng=A.createGain();n.buffer=buf;ng.gain.value=.18;n.connect(ng).connect(A.destination);n.start(t);
  }catch(e){}
}

  sc.innerHTML=`<canvas></canvas>${brokenDieSVG()}<p class="msg glitch">${[...msg].map(c=>`<span>${c}</span>${c==="、"?"<br>":""}`).join("")}</p><p class="sub">サイコロは、一度しか振れない。</p><button class="btn danger" id="backlife">本当の人生にもどる</button>`;

  await wait(RM?0:600);
  for(const sp of spans){sp.classList.add("on");await wait(RM?0:230)}

  sc.querySelector(".msg").classList.remove("glitch");
  sc.querySelector(".sub").classList.add("on");

  const bt=$("#backlife");bt.classList.add("on");bt.focus();

}

/* ===== pyramid (no dots; only "you" and Japan appear) ===== */
const PY={AX:168,TOP:16,H:360,HW:162};
const half=y=>PY.HW*(y-PY.TOP)/PY.H;
function tiersGeom(){
  let cum=0;const t={};
  for(const bi of [3,2,1,0]){const a=cum;cum+=WORLDB[bi];t[bi]={y0:PY.TOP+PY.H*Math.sqrt(a),y1:PY.TOP+PY.H*Math.sqrt(Math.min(cum,1))}}
  return t;
}
function villageHTML(){
  const T=tiersGeom();let polys="",labels="";
  for(const bi of [3,2,1,0]){
    const t=T[bi];
    polys+=`<polygon class="tier t${bi}" id="tier${bi}" points="${PY.AX-half(t.y0)},${t.y0} ${PY.AX+half(t.y0)},${t.y0} ${PY.AX+half(t.y1)},${t.y1} ${PY.AX-half(t.y1)},${t.y1}"/>`;
    const thin=t.y1-t.y0<30;
    const ly=thin?(t.y0+t.y1)/2+8:(t.y0*.35+t.y1*.65);
    const lx=Math.min(PY.AX+half(ly)+14,PY.AX+PY.HW+14);
    labels+=`<text x="${lx}" y="${ly-4}" class="tl">${BANDS[bi].name}</text><text x="${lx}" y="${ly+18}" class="tn">世界の${Math.round(WORLDB[bi]*100)}%</text>`;
  }
  return `<div class="pyr-wrap"><svg class="pyr" id="village" viewBox="0 0 520 400" role="img" aria-label="世界の所得のピラミッド。上の段ほど1日に使えるお金が多い。段の広さが人数">${polys}${labels}<g id="marks"></g></svg></div>`;
}
function dotIn(bi,fx){
  const t=tiersGeom()[bi];
  const thin=t.y1-t.y0<30;
  const y=thin?(t.y0+t.y1)/2:t.y0+(t.y1-t.y0)*(.45+rnd()*.4);
  const w=half(y)-16;
  return [PY.AX+(fx==null?(rnd()*2-1):fx)*w,y];
}
function svgEl(tag,attrs,txt){const e=document.createElementNS("http://www.w3.org/2000/svg",tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(txt)e.textContent=txt;return e}

}

/* ===== 壁のこえ方：努力・才能・運 =====
   努力：書いたこえ方に入っている工夫（チェック、0〜4）。
   才能：進路を選んだときに決まる（1〜5）。最後の画面まで見えない。
   運：最後のサイコロ。
   関門は「実際の割合」をふつうの人の見こみとし、努力と才能で上下する。 */
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* 努力の自動判定（APIは使わない。文の中身を厳しめに読む） */
const JUDGE=[
  ["num","数字で決めている","回数・時間・期限が数字で書いてある",/[0-9０-９一二三四五六七八九十百千]+ *(回|時間|分|日|週|か月|ヶ月|カ月|ケ月|年|冊|問|本|人|点|km|キロ|ページ|曲|件|社|校)|毎(日|朝|晩|週|月)/],
  ["who","人を使っている","だれに聞くか・頼るかが書いてある",/(先生|先輩|後輩|親|母|父|兄|姉|友|仲間|コーチ|監督|プロ|専門家|上司|同僚|医師|看護師|弁護士|農家|店長|師匠|お客|客|銀行|塾|講師|チーム|家族|地域|近所|知り合い|相談|教わ|教えて|聞きに|聞く|見てもら|頼)/],
  ["why","原因を見ている","何がだめだったのか・なぜかを調べる",/(原因|なぜ|理由|分析|調べ|記録|比べ|確かめ|弱点|苦手|まちがい|間違い|ふり返|振り返|データ|動画で|見直)/],
  ["chg","やり方を変えている","何かをやめる・減らす・変える・試す",/(やめ|減らす|減ら|削|捨て|変え|変更|工夫|試す|試し|切りかえ|切り替え|順番|やり方|作り直|作りなお|貯め|節約)/]];
const VAGUE=/(がんば|頑張|努力する|根性|気合|なんとか|何とか|全力|必死|精一杯|せいいっぱい|やる気|気持ち|あきらめない|諦めない)/;
function judgePlan(text,last){
  const t=text.replace(/\s/g,"");
  const hit=JUDGE.map(([k,n,d,re])=>({k,n,d,ok:re.test(t)}));
  let e=hit.filter(h=>h.ok).length;const notes=[];
  if(t.length<20){e=Math.min(e,1);notes.push("短すぎる。20文字未満は、努力1が上限。")}
  if(VAGUE.test(t)&&e<2){e=0;notes.push("「がんばる」「気合」だけでは、何をするのかわからない。")}
  if(last&&t===last.replace(/\s/g,"")){e=Math.max(0,e-2);notes.push("前と同じ文。同じやり方では、同じ結果になりやすい。")}
  return {e,hit,notes};
}
const logit=p=>Math.log(p/(1-p)),sig=x=>1/(1+Math.exp(-x));
function chanceOf(ev,effort){
  const s=S,tw=s.career.type==="talent"?.8:.4;
  const base=ev.gate?ev.g.rate:.35;
  let L=logit(clamp(base,.02,.98))+.6*(effort-3)+tw*(s.talent-3)+.08*Math.min(s.exp,8);
  if(!ev.gate)L-=.5*s.dodged;
  else if(ev.g.job)L-=.4*s.gateFails+.3*(s.chase||0);
  else L-=.4*(s.fails||0)+.4*s.gateFails+.3*s.dodged+.7*(s.chase||0); // こえられなかった壁・浪人・よけた壁が、関門で重くのしかかる
  return clamp(sig(L),.01,.99);
}

async function choose(kind,text){
  const s=S,ev=s.events[s.step];
  const J=text?judgePlan(text,s.lastPlan):null,effort=J?J.e:0;
  if(text)s.lastPlan=text;
  app.querySelectorAll(".opt,#plan").forEach(b=>b.disabled=true);
  let res;
  const box=$("#opts");

  $("#e5").onclick=()=>{s.def=d.value.trim();endingScreen()};
}
function endingScreen(){
  const s=S;
  app.innerHTML=`<section class="panel ending fadein">
    <p class="eyebrow">Game over</p>
    <h2 class="locked">人は、生まれ変われない。</h2>
    ${s.def?`<p class="mydef">あきらめずに挑戦する力とは、<br><b>${esc(s.def)}</b></p>`:""}
    <p>ゲームのあなたは、何度でもやり直せた。<br>本当のあなたの人生は、1回だけ。そして、まだ1つも決まっていない。</p>
    <p class="muted">ゲームのあなたは「${s.career.name}」を「${s.route.name}」でめざした。${FORMMAP[s.route.name]?`進路希望調査でいえば「${FORMMAP[s.route.name]}」の道だ。`:"この道は、進路希望調査の選択肢には、ぴったり当てはまるものがない。"}</p>
    <p class="muted">それは、本当のあなたの答えでなくていい。<br>ゲームで知った数字と壁と、今書いた一文を持って、今度は自分のことを選ぼう。</p>
    <ol class="small">
      <li>本当のあなたが、今いちばん行きたい道は？</li>
      <li>その道の最初の壁は、何だと思う？</li>
      <li>その壁を、だれと、何を、どれだけやってこえる？</li>
    </ol>
    ${FORM_URL?`<div class="row"><a class="btn" id="toform" href="${FORM_URL}" target="_blank" rel="noopener">本当の進路希望調査に答える</a></div>
    <p class="small muted">Googleフォームが新しいタブで開く。</p>`:`<p class="mydef">さあ、先生から配られた本当の進路希望調査に答えよう。</p>`}
  </section>`;
  window.scrollTo({top:0});
}

/* ===== 教師用：全体を一気に見る ===== */
let TEACH=false,TC=3,TR=0;
const SAMPLE=["毎日2時間、先生に聞いて苦手な原因を調べ、スマホの時間を減らす","がんばる、絶対にあきらめない","先輩に相談して練習メニューを変える","動画で自分のフォームを分析して、週3回コーチに見てもらう"];
function teachBtn(){
  if($("#tbtn"))return;
  const b=document.createElement("button");b.id="tbtn";b.className="tbtn";b.textContent="教師用メニュー";
  b.onclick=()=>{document.querySelectorAll(".overlay,.confirm,.scare").forEach(x=>x.remove());teacherScreen()};
  document.body.appendChild(b);
}
function tJapan(){born(false);PREV=S;born(true)}
function tStart(){
  tJapan();const c=CAREERS[TC],r=c.routes[Math.min(TR,c.routes.length-1)];
  Object.assign(S,{career:c,route:r,events:mkEvents([...r.walls,LAST_WALL]),step:0,log:[],tries:0,gateFails:0,passed:false,gaveUp:false,talent:3,dodged:0,exp:0,lastPlan:"",gatesPassed:0,chase:0,job:null,crossGate:null,failedGate:null,fails:0,crossN:0,hist:[]});
  return S;
}
function tFilled(){
  const s=tStart();
  s.events.forEach((ev,i)=>{const res=i%3===1?"ng":"ok";const e=[4,0,2,3][i%4];
    s.log.push({age:ev.a,title:ev.gate?ev.g.name:ev.t,choice:esc(SAMPLE[i%4]),res,effort:e,gate:ev.gate,rate:ev.gate?rateTxt(ev.g.rate):""});
    s.hist.push({age:ev.a,res,effort:e,gate:ev.gate});s.age=ev.a});
  s.step=s.events.length-1;s.passed=true;s.talent=4;
  return s;
}
const PIN="0315";
function askPin(){
  const ov=document.createElement("div");ov.className="confirm";
  ov.innerHTML=`<div class="box"><h2>暗証番号</h2><input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" class="pin"><p class="small gate" id="pinmsg"></p>
    <div class="row" style="justify-content:center"><button class="btn" id="pinok">開く</button><button class="btn ghost" id="pinno">やめる</button></div></div>`;
  document.body.appendChild(ov);$("#pin").focus();
  const ok=()=>{if($("#pin").value===PIN){ov.remove();teacherScreen()}else{$("#pinmsg").textContent="ちがう。";$("#pin").value=""}};
  $("#pinok").onclick=ok;$("#pin").onkeydown=e=>{if(e.key==="Enter")ok()};$("#pinno").onclick=()=>ov.remove();
}
function teacherScreen(){
  TEACH=true;teachBtn();
  const c=CAREERS[TC];
  const J=(id,t,d)=>`<button class="tj" id="${id}"><b>${t}</b><span>${d}</span></button>`;
  app.innerHTML=`<section class="panel fadein">

    <div class="tsel">

      ${J("j1","1 タイトル","「今日は、あなたの誕生日です」")}

      ${J("j3","3 生まれ変わりの確認","「本当に、生まれ変わりますか」")}
      ${J("j4","4 人は、生まれ変われない","ゆっくり転がるサイコロの演出（音が出る）")}
      ${J("j5","5 本当の人生","日本の高校生の位置が初めて出る")}
      ${J("j6","6 進路希望調査","3つの型と10の進路")}
      ${J("j7","7 道を選ぶ","上で選んだ進路の、進み方")}
      ${J("j8","8 最初の壁","上で選んだ道の、17歳の壁")}
      ${J("j9","9 関門","実際の数字が出る壁")}
      ${J("j10","10 分かれ道","正社員をめざす／夢を追い続ける")}
      ${J("j11","11 ふり返り","才能を明かす・努力と結果（見本の記録）")}
      ${J("j12","12 エピローグ","仕分ける→並べる→カード→一文")}
      ${J("j13","13 エンディング","進路希望調査フォームへ")}
    </div>
  </section>
  <section class="panel">
    <h3>判定のしくみ（生徒には伏せている）</h3>
    <ul class="small tlist2">
      <li><b>努力（0〜4）</b>：書いた文に次の4つがあるかを言葉で読む。数字（回数・時間・期限、「毎日」など）／人（先生・先輩・親・相談・教わる など）／原因（原因・なぜ・調べる・分析・苦手 など）／変える（やめる・減らす・変える・工夫・試す など）。20文字未満は1まで。「がんばる」「気合」「あきらめない」などだけなら0。前と同じ文は−2。</li>
      <li><b>才能（1〜5）</b>：道を選んだときにサイコロで決まる（1:10% 2:20% 3:40% 4:20% 5:10%）。最後まで見せない。才能の道（スポーツ・音楽）は効き目が2倍。</li>
      <li><b>運</b>：最後のサイコロ。</li>
      <li><b>ふつうの壁</b>：努力3・才能3の人で35%。よけた壁1つごとに下がる。</li>
      <li><b>関門</b>：実際の割合を「努力3・才能3の人」の見こみにして、努力と才能で上下。それまでにこえられなかった壁・よけた壁・浪人の年数・夢を追い直した回数の分だけ下がる。挑戦は3回まで。</li>
      <li><b>分かれ道</b>：関門で3回落ちるか、あきらめると出る。正社員の関門は49.3%（JILPT、東京25〜29歳、2016年）。夢を追い直すたびに、夢の関門も正社員の関門も下がる。</li>
      <li>上下の大きさ（努力1点、才能1段でどれだけ変わるか）は、ゲームが決めた数字。</li>
    </ul>
  </section>
  <section class="panel">
    <h3>全部の進路・道・壁</h3>
    <p class="small muted">赤が関門。％は実際の統計（「ゲーム」はゲームの数字）。どの道にも最後に50歳の壁がある。</p>
    ${CAREERS.map(x=>`<details class="tmap"><summary><b>${x.name}</b> <span class="small muted">${TYPES[x.type].name}</span></summary>
      ${x.routes.map(r=>`<div class="troute"><p><b>${r.name}</b><br><span class="small muted">${r.desc}</span></p><ol>${r.walls.map(w=>`<li class="${w.g?"gate":""}"><span class="num">${w.a}歳</span> ${w.t}${w.g?` → 関門「${w.g.name}」${w.g.game?"ゲーム":rateTxt(w.g.rate)}`:""}</li>`).join("")}</ol></div>`).join("")}

  $("#tc").onchange=e=>{TC=+e.target.value;TR=0;teacherScreen()};

  window.scrollTo({top:0});

titleScreen();
})();
