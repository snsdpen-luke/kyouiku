<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>メッセージが届くまで</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: stage 0 is a messenger replica with an x-ray panel; stages 1–13 are one-screen lessons, each gated by a check question. 用語ノート grows on the right. */
:root{
  --bg:#f6f7f4; --card:#ffffff; --fg:#1f2a2e; --mute:#64737a; --line:#d9ded8;
  --accent:#0f8a7a; --accent-ink:#ffffff; --soft:#e3f2ee; --warn:#c7641b; --bad:#b63a3a; --pkt:#fff8e6; --pkt-line:#e2c879; --hdr:#e8f0fb; --hdr-line:#9db6dd; --chat:#e9edf2; --bubble:#8ee0a3; --bubble-ink:#13301b;
  color-scheme:light;
  --sans:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.7}
.wrap{max-width:1140px;margin:0 auto;padding-block:20px;padding-inline:16px;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px}
@media (max-width:860px){.wrap{grid-template-columns:1fr}}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
h1{margin:0;font-size:1.35rem;font-weight:700}
h1 span{color:var(--mute);font-weight:400;font-size:.9rem;margin-left:.6em}
.prog{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.prog i{display:block;width:18px;height:6px;border-radius:3px;background:var(--line)}
.prog i.done{background:var(--accent)}.prog i.cur{background:var(--warn)}
.stage{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px 24px;min-width:0;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:.78rem;color:var(--mute);letter-spacing:.08em}
h2{margin:0;font-size:1.3rem;text-wrap:balance}
.lead{margin:0;max-width:42em}
.sim{border:1px dashed var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pkts{display:flex;flex-wrap:wrap;gap:10px}
.pkt{background:var(--pkt);border:1.5px solid var(--pkt-line);border-radius:6px;padding:6px 10px;font-family:var(--mono);min-width:64px;text-align:center;position:relative;transition:transform .2s,opacity .3s}
.pkt .d{font-size:1.05rem;font-weight:600}
.pkt .b{font-size:.68rem;color:var(--mute);word-break:break-all;max-width:11em}
.pkt .h{display:flex;flex-direction:column;gap:2px;font-size:.68rem;color:var(--mute);border-bottom:1px solid var(--pkt-line);margin-bottom:4px;padding-bottom:4px;text-align:left}
.pkt .h b{color:var(--fg);font-weight:600}
.pkt.hdr{background:var(--hdr);border-color:var(--hdr-line)}
.pkt.lost{opacity:.25;text-decoration:line-through}
.pkt.pick{cursor:pointer}.pkt.pick:hover{transform:translateY(-2px);border-color:var(--accent)}
.pkt.ok{border-color:var(--accent);background:var(--soft)}
.pkt.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.dev{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:92px;text-align:center;font-size:.85rem}
.dev .ic{font-size:1.9rem;line-height:1}
.dev .ip{font-family:var(--mono);font-size:.72rem;color:var(--mute)}
.dev.on .ip{color:var(--accent);font-weight:600}
.net{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.wire{flex:1;min-width:30px;height:2px;background:var(--line);position:relative}
.wire .ball{position:absolute;top:-6px;left:0;width:14px;height:14px;border-radius:50%;background:var(--warn);font-size:.6rem;line-height:14px;text-align:center;color:#fff;font-family:var(--mono)}
.note{background:var(--soft);border-radius:6px;padding:10px 14px;font-size:.95rem}
.q{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.q .qt{font-weight:700}
.opts{display:flex;flex-direction:column;gap:6px}
.opts button{text-align:left}
.opts label.ck{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:7px;padding:8px 12px;cursor:pointer}
.opts label.ck input{margin-top:6px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:9px 14px;border-radius:7px}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button[disabled]{opacity:.4;cursor:default}
button.right{border-color:var(--accent);background:var(--soft)}
button.wrong{border-color:var(--bad)}
input[type=text],input[type=number],textarea,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
input[type=range]{accent-color:var(--accent);width:180px;max-width:100%}
textarea{width:100%;min-height:90px}
.fb{font-size:.95rem;min-height:1.6em}
.fb.ok{color:var(--accent);font-weight:600}.fb.ng{color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:4px}
aside{display:flex;flex-direction:column;gap:10px}
.note-book{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.note-book h3{margin:0 0 8px;font-size:.95rem;color:var(--mute);letter-spacing:.06em}
.terms{display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.term b{display:block}
.term small{color:var(--mute)}
.terms .empty{color:var(--mute);font-size:.85rem}
.mono{font-family:var(--mono)}
.big{font-size:1.5rem;font-family:var(--mono);letter-spacing:.1em;text-align:center;padding:8px}
table.t{border-collapse:collapse;font-size:.9rem}
table.t td,table.t th{border:1px solid var(--line);padding:4px 10px;text-align:left}
table.t th{color:var(--mute);font-weight:500}
/* messenger replica */
.xr{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px}
@media (max-width:760px){.xr{grid-template-columns:1fr}}
.phone{background:var(--chat);border:1px solid var(--line);border-radius:22px;padding:10px;display:flex;flex-direction:column;height:420px;max-width:100%}
.phone .top{font-weight:700;text-align:center;font-size:.95rem;padding:4px 0 8px;border-bottom:1px solid var(--line)}
.phone .msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:10px 4px}
.bub{max-width:80%;padding:7px 11px;border-radius:14px;font-size:.95rem;line-height:1.4;background:var(--card);align-self:flex-start}
.bub.me{background:var(--bubble);color:var(--bubble-ink);align-self:flex-end;border-bottom-right-radius:4px}
.bub.me small{display:block;font-size:.65rem;opacity:.7;text-align:right}
.phone .inp{display:flex;gap:6px}
.phone .inp input{flex:1}
.xpanel{display:flex;flex-direction:column;gap:10px;min-width:0}
.xstep{border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-height:150px;display:flex;flex-direction:column;gap:8px}
.xstep .xt{font-weight:700}
.xstep .xd{font-size:.92rem;color:var(--mute)}
.xdots{display:flex;gap:4px;flex-wrap:wrap}
.xdots i{display:block;height:6px;flex:1;min-width:14px;border-radius:3px;background:var(--line)}
.xdots i.on{background:var(--warn)}.xdots i.past{background:var(--accent)}
.bytes{display:flex;flex-wrap:wrap;gap:4px;font-family:var(--mono);font-size:.78rem}
.bytes span{border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.bytes span.ch{background:var(--soft);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){.pkt,.pkt.shake{animation:none;transition:none}}
</style>
</head>
<body>

<div class="wrap">
<header>
  <h1>メッセージが届くまで <span>TCP/IPのしくみ</span></h1>
  <div class="prog" id="prog"></div>
</header>
<section class="stage" id="stage"></section>
<aside>
  <div class="note-book"><h3>用語ノート</h3><div class="terms" id="terms"><div class="empty">ステージを進めると、ここに用語がたまります</div></div></div>
  <div class="note-book"><h3>進み方</h3><div style="font-size:.88rem;color:var(--mute)">試す → 確認問題に答える → 次へ、の順に進みます。間違えても正解と解説が出て、次へ進めます。</div></div>
</aside>
</div>

<script>
// ---------- state ----------
const S = {msg:"今日部活ある？", size:3, idx:0, done:[], terms:[], guess:null, notes:""};
try{ const v=JSON.parse(localStorage.getItem('msg-journey-v3')||'null'); if(v&&typeof v==='object') Object.assign(S,v); }catch(e){}
function save(){ try{ localStorage.setItem('msg-journey-v3',JSON.stringify(S)); }catch(e){} }
const IP={me:"192.168.0.12",home:"203.0.113.77",srv:"203.0.113.5",fr:"10.20.30.40",dns:"8.8.8.8"};
const enc=new TextEncoder();
const hex=b=>[...b].map(x=>x.toString(16).padStart(2,'0').toUpperCase()).join(' ');
const bytesOf=s=>enc.encode(s).length;
const chunks=()=>{const a=[];const m=[...S.msg];for(let i=0;i<m.length;i+=S.size)a.push(m.slice(i,i+S.size).join(''));return a;};
const pktHTML=(i,d,hdr,extra='',showBytes=false)=>`<div class="pkt ${hdr?'hdr':''} ${extra}" data-i="${i}">${hdr?`<div class="h">${hdr.to?`<span>宛先 <b>${hdr.to}</b></span>`:''}${hdr.from?`<span>送信元 <b>${hdr.from}</b></span>`:''}${hdr.port?`<span>ポート <b>${hdr.port}</b></span>`:''}${hdr.ttl!==undefined?`<span>TTL <b>${hdr.ttl}</b></span>`:''}${hdr.n?`<span>番号 <b>${i+1}/${hdr.n}</b></span>`:''}</div>`:''}<div class="d">${d}</div>${showBytes?`<div class="b">${hex(enc.encode(d))}</div>`:''}</div>`;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

// ---------- x-ray (stage 0) ----------
function xraySteps(msg){
  const bytes=enc.encode(msg); const c=[]; const m=[...msg]; for(let i=0;i<m.length;i+=3)c.push(m.slice(i,i+3).join(''));
  const n=c.length;
  return [
   {t:"① 文字を数字に変える",d:"コンピュータは文字をそのまま送れません。1文字ずつ数字（バイト）に置き換えます。日本語は1文字＝3バイトです。",
    h:`<div class="bytes">${m.map(ch=>`<span class="ch">${esc(ch)}</span><span>${hex(enc.encode(ch))}</span>`).join('')}</div><div class="note">${m.length}文字 → ${bytes.length}バイト</div>`},
   {t:"② 箱に分ける（パケット）",d:"長いデータは箱に分けて送ります。本物の箱には約1,500バイト入るので、この短い文章は本来1箱で足ります。ここでは仕組みが見えるように、3文字ずつの小さな箱にしています。",
    h:`<div class="pkts">${c.map((d,i)=>pktHTML(i,d,null,'',true)).join('')}</div>`},
   {t:"③ 送り状を貼る（ヘッダ）",d:"箱ごとに、宛先・送信元・何番目か・どのアプリ宛てか、を先頭に貼ります。",
    h:`<div class="pkts">${c.map((d,i)=>pktHTML(i,d,{to:IP.srv,from:IP.me,port:"443",ttl:64,n},'')).join('')}</div>`},
   {t:"④ 家のWi-Fiルーターを出る",d:"家の中だけで使える住所 192.168.0.12 は、外では通じません。家のルーターが、送信元を自分の外向きの住所に書き換えて送り出します。",
    h:`<div class="pkts">${c.slice(0,2).map((d,i)=>pktHTML(i,d,{to:IP.srv,from:IP.home,port:"443",ttl:63,n},'')).join('')}<div class="pkt" style="border-style:dashed">…</div></div><div class="note">送信元 ${IP.me} → <b>${IP.home}</b>　TTL 64 → 63（ルーターを1台通るごとに1減る）</div>`},
   {t:"⑤ ルーターを渡り歩く",d:"プロバイダ、県外の中継、相互接続点……。各ルーターは宛先だけを見て次に回します。中身は読みません。",
    h:`<div class="net">${["家","プロバイダ","福岡","東京","サーバー"].map((x,i)=>`<div class="dev ${i===4?'on':''}"><div class="ic">${i===4?'🏢':i===0?'🏠':'📦'}</div>${x}</div>${i<4?'<div class="wire"></div>':''}`).join('')}</div><div class="note">箱は1個ずつ別々に進みます。別の道を通ることもあります。</div>`},
   {t:"⑥ サーバーに到着・並べ直す",d:"届いた順がバラバラでも、番号で元の順に戻します。足りない番号があれば「○番を送り直してください」と頼み、届いたら「届きました（ACK）」と返します。",
    h:`<div class="pkts">${[...c.keys()].sort(()=>Math.random()-.5).map(i=>pktHTML(i,c[i],{n},'')).join('')}</div><div class="big">→ 番号順に並べると → 「${esc(msg)}」</div>`},
   {t:"⑦ サーバーが友だち宛てに送り直す",d:"メッセージは友だちのスマホに直接は飛びません。LINEのサーバーがいったん預かり、友だちのスマホ宛ての箱を新しく作って送ります。友だちがオフラインなら、預かったまま待ちます。",
    h:`<div class="pkts">${c.map((d,i)=>pktHTML(i,d,{to:IP.fr,from:IP.srv,port:"443",ttl:64,n},'')).join('')}</div>`},
   {t:"⑧ 友だちのスマホで、送り状をはがす",d:"ヘッダをはがし、番号順につなぎ、数字を文字に戻します。画面に吹き出しが出ます。",
    h:`<div class="big">${esc(msg)}</div><div class="note">送るときに包み、届いたらはがす。これを<b>カプセル化</b>といいます。ここまで、およそ 0.1 秒です。</div>`},
  ];
}

// ---------- stages ----------
const STAGES=[
{ title:"送って、裏側を見る", eyebrow:"ステージ 0 / 13　導入",
  lead:"ふだん使うトークアプリと同じような画面です。10文字くらいのメッセージを送ると、右に「裏側」がスローモーションで映ります。最後まで見てから、下の問いに答えてください。",
  sim:()=>`<div class="xr"><div class="phone"><div class="top">ゆうき</div><div class="msgs" id="msgs"><div class="bub">明日の集合、何時だっけ</div></div><div class="inp"><input type="text" id="cmsg" value="" maxlength="20" placeholder="メッセージを入力"><button class="pri" id="csend">送信</button></div></div>
  <div class="xpanel"><div class="xdots" id="xdots"></div><div class="xstep" id="xstep"><div class="xt">送信ボタンを押すと、ここに裏側が映ります</div><div class="xd">8段階あり、自動で進みます。「止める」で止めて見直すことができます。</div></div><div class="row"><button id="xprev" disabled>← 前</button><button id="xpause" disabled>止める</button><button id="xnext" disabled>次 →</button><label style="color:var(--mute);font-size:.85rem">速さ <input type="range" id="xspd" min="1" max="5" value="3" style="width:90px"></label></div></div></div>`,
  wire:()=>{ const inp=document.getElementById('cmsg'), msgs=document.getElementById('msgs'), step=document.getElementById('xstep'), dots=document.getElementById('xdots'); let steps=[],i=-1,playing=false,timer=null;
    const show=k=>{ i=k; const s=steps[k]; step.innerHTML=`<div class="xt">${s.t}</div><div class="xd">${s.d}</div>${s.h}`; dots.innerHTML=steps.map((_,j)=>`<i class="${j<k?'past':j===k?'on':''}"></i>`).join(''); document.getElementById('xprev').disabled=k===0; document.getElementById('xnext').disabled=k===steps.length-1; };
    const spd=()=>[0,7000,5000,3500,2200,1200][+document.getElementById('xspd').value];
    const play=async()=>{ playing=true; document.getElementById('xpause').disabled=false; document.getElementById('xpause').textContent='止める'; while(playing&&i<steps.length-1){ await new Promise(r=>{timer=setTimeout(r,spd());}); if(!playing)break; show(i+1);} if(i===steps.length-1){playing=false;document.getElementById('xpause').disabled=true; S.xrayDone=true; save(); window.dispatchEvent(new Event('xray-done'));} };
    document.getElementById('csend').addEventListener('click',()=>{ const v=inp.value.trim(); if(!v)return; S.msg=v; save(); const b=document.createElement('div'); b.className='bub me'; b.innerHTML=`${esc(v)}<small>送信中…</small>`; msgs.appendChild(b); msgs.scrollTop=msgs.scrollHeight; inp.value=''; steps=xraySteps(v); clearTimeout(timer); playing=false; show(0); play().then(()=>{ b.querySelector('small').textContent='既読'; setTimeout(()=>{ const r=document.createElement('div'); r.className='bub'; r.textContent='OK'; msgs.appendChild(r); msgs.scrollTop=msgs.scrollHeight; },700); }); });
    document.getElementById('xnext').addEventListener('click',()=>{playing=false;clearTimeout(timer);document.getElementById('xpause').textContent='再生';show(i+1);});
    document.getElementById('xprev').addEventListener('click',()=>{playing=false;clearTimeout(timer);document.getElementById('xpause').textContent='再生';show(i-1);});
    document.getElementById('xpause').addEventListener('click',e=>{ if(playing){playing=false;clearTimeout(timer);e.target.textContent='再生';} else {play();} });
  },
  q:"裏側を最後まで見ました。メッセージは、友だちのスマホに<b>直接</b>届いていましたか？",
  opts:["直接届いていた","いちどLINEのサーバーに届き、サーバーが友だちに送り直していた","家のルーターが友だちのスマホに届けていた"], answer:1,
  explain:()=>"サーバーが間に入ります。だから相手がオフラインでも、あとで届きます。ここから1つずつ分解していきます。", term:null },

{ title:"予想を書いておく", eyebrow:"ステージ 1 / 13",
  lead:"裏側を一度見ました。でも、まだ「見た」だけです。ここからは1つずつ自分で確かめます。その前に、今の時点での予想を残しておきましょう。",
  sim:()=>`<div class="big">${esc(S.msg)}</div><div class="note">この文章は、スマホを出るとき「文字」のままでしょうか。「数字」になっているでしょうか。箱は何個でしょうか。あとで答え合わせをします。</div>`,
  wire:()=>{},
  q:"予想です。スマホを出た直後、この文章はどんな姿でしょうか？（正解はまだ出しません）",
  opts:["文字のまま、1つのかたまり","数字（バイト）に変わって、1つのかたまり","数字に変わって、いくつかの箱に分かれている"], answer:null,
  onAnswer:(i)=>{S.guess=i;}, term:null },

{ title:"文字を数字にする", eyebrow:"ステージ 2 / 13",
  lead:"電線や電波で送れるのは数字（電気のON/OFF）だけです。だから文字は先に数字に置き換えます。日本語1文字は3バイト、英数字は1バイトです。実際の変換を見てみましょう。",
  sim:()=>`<label>文章を変えて試す <input type="text" id="m2" value="${esc(S.msg)}" maxlength="20"></label><div class="bytes" id="by"></div><div class="note" id="bn"></div>`,
  wire:()=>{ const inp=document.getElementById('m2'); const draw=()=>{const m=[...inp.value]; document.getElementById('by').innerHTML=m.map(ch=>`<span class="ch">${esc(ch)}</span><span>${hex(enc.encode(ch))}</span>`).join(''); document.getElementById('bn').textContent=`${m.length}文字 → ${bytesOf(inp.value)}バイト`;}; inp.addEventListener('input',draw); draw(); },
  q:"確認です。「<span class='mono'>abc今日</span>」は全部で何バイトでしょうか？（上の欄に打って数えてもかまいません）",
  input:"number", check:v=>+v===bytesOf("abc今日"), answerText:()=>bytesOf("abc今日")+"バイト",
  explain:()=>`英数字 3×1 ＋ 日本語 2×3 ＝ ${bytesOf("abc今日")}バイトです。この置き換えを<b>エンコード</b>といいます。箱の大きさはバイトで数えます。`,
  term:{k:"バイト",v:"データの量の単位。日本語1文字＝3バイト、英数字1文字＝1バイト"},
  term2:{k:"エンコード",v:"文字を数字（バイト）に置き換えること。届いたら逆の操作（デコード）をする"} },

{ title:"箱に分ける", eyebrow:"ステージ 3 / 13",
  lead:"長いデータは箱に分けて送ります。本物の箱には約1,500バイトまで入ります。だから短い文章は本来1箱です。写真（数百万バイト）や動画は、何千箱にもなります。ここでは仕組みが見えるように、わざと小さい箱にしています。",
  sim:()=>`<div class="row"><label>1つの箱に入る文字数 <input type="range" id="size" min="1" max="6" value="${S.size}"> <b id="sizev" class="mono">${S.size}</b></label></div><div class="pkts" id="pk"></div><div class="note" id="cnt"></div>`,

const stage=document.getElementById('stage');
function addTerm(t){ if(t&&!S.terms.find(x=>x.k===t.k)) S.terms.push(t); }
function renderTerms(){ const el=document.getElementById('terms'); el.innerHTML=S.terms.length?S.terms.map(t=>`<div class="term"><b>${t.k}</b><small>${t.v}</small></div>`).join(''):'<div class="empty">ステージを進めると、ここに用語がたまります</div>'; }
function renderProg(){ document.getElementById('prog').innerHTML=STAGES.map((_,i)=>`<i class="${S.done.includes(i)?'done':i===S.idx?'cur':''}"></i>`).join(''); }
function render(){
  const st=STAGES[S.idx]; const already=S.done.includes(S.idx);
  let qhtml='';
  if(st.opts){ qhtml=`<div class="opts" id="opts">${st.opts.map((o,i)=>`<button data-i="${i}">${o}</button>`).join('')}</div>`; }
  else if(st.multi){ qhtml=`<div class="opts" id="multi">${st.multi.map((o,i)=>`<label class="ck"><input type="checkbox" value="${i}"><span>${o}</span></label>`).join('')}<button class="pri" id="chk" style="align-self:flex-start">答える</button></div>`; }
  else if(st.input){ qhtml=`<div class="row"><input type="${st.input}" id="ans" style="width:8em"><button class="pri" id="chk">答える</button></div>`; }
  else if(st.pairs){ qhtml=`<div class="opts" id="pairs">${st.pairs.map((p,i)=>`<label class="row"><b style="min-width:9em">${p[0]}</b><select data-i="${i}"><option value="">選ぶ</option>${p[1].map((x,j)=>`<option value="${j}">${x}</option>`).join('')}</select></label>`).join('')}<button class="pri" id="chk" style="align-self:flex-start">答える</button></div>`; }
  else if(st.order){ qhtml=`<div class="opts" id="order">${st.order.map((o,i)=>`<label class="row"><select data-i="${i}"><option value="">順</option>${st.order.map((_,j)=>`<option value="${j}">${j+1}番目</option>`).join('')}</select><span>${o}</span></label>`).join('')}<button class="pri" id="chk" style="align-self:flex-start">答える</button></div>`; }
  else if(st.match){ qhtml=`<div class="opts" id="match">${st.match.map((m,i)=>`<label class="row"><b style="min-width:7em">${m[0]}</b><select data-i="${i}"><option value="">選ぶ</option>${st.match.map((x,j)=>`<option value="${j}">${x[1]}</option>`).join('')}</select></label>`).join('')}<button class="pri" id="chk" style="align-self:flex-start">答える</button></div>`; }
  stage.innerHTML=`<div class="eyebrow">${st.eyebrow}</div><h2>${st.title}</h2><p class="lead">${st.lead}</p><div class="sim">${st.sim()}</div>
  <div class="q"><div class="qt">${typeof st.q==='function'?st.q():st.q}</div>${qhtml}<div class="fb" id="fb">${already?'<span class="ok">この問題はもう答えました。先へ進めます。</span>':''}</div></div>
  <div class="nav"><button id="prev" ${S.idx===0?'disabled':''}>← 戻る</button><button id="next" class="pri" ${already?'':'disabled'}>${S.idx===STAGES.length-1?'おわり':'次へ →'}</button></div>`;
  st.wire();
  const fb=document.getElementById('fb'), next=document.getElementById('next');
  const finish=(ok,correct)=>{ if(!S.done.includes(S.idx))S.done.push(S.idx); if(!ok&&!(S.miss||[]).includes(S.idx)){S.miss=S.miss||[];S.miss.push(S.idx);} addTerm(st.term); addTerm(st.term2); fb.className='fb '+(ok?'ok':'ng'); fb.innerHTML=(ok?'正解です。':'違います。<b>正解：'+correct+'</b><br>')+'<span style="color:var(--fg);font-weight:400">'+(st.explain?st.explain():'記録しました。次へ進んでください。')+'</span>'; next.disabled=false; stage.querySelectorAll('.q input,.q select,.q button').forEach(e=>{if(e.id!=='next')e.disabled=true;}); renderTerms(); renderProg(); save(); };
  const pass=()=>finish(true,'');
  const fail=correct=>finish(false,correct);
  if(st.opts){ document.getElementById('opts').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i; if(st.answer===null){ st.onAnswer&&st.onAnswer(i); b.classList.add('right'); pass(); } else if(i===st.answer){ b.classList.add('right'); pass(); } else { b.classList.add('wrong'); [...b.parentNode.children][st.answer].classList.add('right'); fail(st.opts[st.answer]); } }); }
  if(st.multi){ document.getElementById('chk').addEventListener('click',()=>{ const sel=[...document.querySelectorAll('#multi input:checked')].map(x=>+x.value).sort(); const ok=JSON.stringify(sel)===JSON.stringify([...st.answers].sort()); document.querySelectorAll('#multi label').forEach((l,i)=>{ if(st.answers.includes(i)) l.style.borderColor='var(--accent)'; }); ok?pass():fail(st.answers.map(i=>st.multi[i]).join('／')); }); }
  if(st.input){ document.getElementById('chk').addEventListener('click',()=>{ const v=document.getElementById('ans').value; if(v==='')return; st.check(v)?pass():fail(st.answerText?st.answerText():'下の解説のとおり'); }); }
  if(st.pairs){ document.getElementById('chk').addEventListener('click',()=>{ const sels=[...document.querySelectorAll('#pairs select')]; if(sels.some(x=>x.value===''))return; const ok=sels.every(x=>+x.value===st.pairs[+x.dataset.i][2]); ok?pass():fail(st.pairs.map(p=>p[0]+'＝'+p[1][p[2]]).join('／')); }); }
  if(st.order){ document.getElementById('chk').addEventListener('click',()=>{ const sels=[...document.querySelectorAll('#order select')]; if(sels.some(x=>x.value===''))return; const ok=sels.every(x=>+x.value===+x.dataset.i); ok?pass():fail(st.order.map((o,i)=>(i+1)+' '+o).join(' → ')); }); }
  if(st.match){ document.getElementById('chk').addEventListener('click',()=>{ const sels=[...document.querySelectorAll('#match select')]; if(sels.some(x=>x.value===''))return; const ok=sels.every(x=>+x.value===+x.dataset.i); ok?pass():fail(st.match.map(m=>m[0]+'＝'+m[1]).join('／')); }); }
  document.getElementById('prev').addEventListener('click',()=>{S.idx--;save();render();});
  next.addEventListener('click',()=>{ if(S.idx<STAGES.length-1){S.idx++;save();render();window.scrollTo({top:0});} else renderDone(); });
}
function renderDone(){
  stage.innerHTML=`<div class="eyebrow">完了</div><h2>おわり</h2><p class="lead">用語ノートに ${S.terms.length} 語たまりました。確認問題は 13 問中 ${13-(S.miss||[]).length} 問を1回で正解。紙のワークシートに写してから、小テストに進んでください。</p><div class="note">${esc(S.notes)||'（自分の言葉の欄が空です）戻って書いてください。'}</div>${S.quiz?`<div class="note">小テストの結果：<b>${S.quiz.score} / ${MAX} 点</b>（${S.quiz.name||'名前なし'}）</div>`:''}<div class="nav"><button id="back">← ステージ 13 に戻る</button><div class="row"><button id="resetb">最初からやり直す</button><button class="pri" id="quizb">${S.quiz?'小テストの結果を見る':'小テストを始める'}</button></div></div>`;
  document.getElementById('back').addEventListener('click',render);
  document.getElementById('resetb').addEventListener('click',()=>{Object.assign(S,{idx:0,done:[],terms:[],guess:null,notes:"",quiz:null,miss:[]});save();render();});
  document.getElementById('quizb').addEventListener('click',()=>S.quiz?renderQuizResult():renderQuiz());
}

// ---------- 小テスト ----------
// 客観問題 1点、記述問題 2点（キーワードで仮採点、最終判定は先生）
const QUIZ=[
 {q:"「<span class='mono'>LINE部活</span>」をバイトに変えると、全部で何バイトになりますか？",type:"num",a:10,pts:1,why:"英数字 4×1 ＋ 日本語 2×3 ＝ 10バイト。"},
 {q:"7,500,000バイトの動画を1箱1,500バイトで送ります。パケットはいくつですか？",type:"num",a:5000,pts:1,why:"7,500,000 ÷ 1,500 ＝ 5,000個。"},
 {q:"自分のスマホからサーバーへ送る<b>最初の</b>パケット。宛先と送信元の組み合わせとして正しいものはどれですか？",type:"one",o:[`宛先 ${IP.srv}／送信元 ${IP.me}`,`宛先 ${IP.fr}／送信元 ${IP.me}`,`宛先 ${IP.me}／送信元 ${IP.srv}`,`宛先 ${IP.fr}／送信元 ${IP.srv}`],a:0,pts:1,why:"まずサーバー宛て。友だちのスマホの住所は最初のパケットには出てきません。"},
 {q:"TTLが30で出発し、ルーターを35台通る道だったとき、このパケットはどうなりますか？",type:"one",o:["途中でTTLが0になり、捨てられる","TTLがマイナス5になるが届く","30台目のルーターがTTLを戻してくれる","TTLは届くかどうかに関係ない"],a:0,pts:1,why:"30台通った時点で0。31台目で捨てられます。"},
 {q:"宅配便の「送り状」にあたるものは何ですか。その名前と、そこに書かれている項目を<b>3つ以上</b>挙げて説明してください。",type:"text",pts:2,kw:[["ヘッダ"],["宛先"],["送信元"],["番号","ポート","TTL"]],need:4,model:"ヘッダ。宛先IP・送信元IP・番号（シーケンス番号）・ポート番号・TTLなどが書かれている。"},
 {q:"DNSが止まると、メッセージが送れなくなります。なぜですか。<b>何ができなくなるか</b>を書いて説明してください。",type:"text",pts:2,kw:[["名前"],["住所","IP"],["調べ","変換","分から","わから"],["宛先"]],need:3,model:"スマホはサーバーの名前（talk.example.com）しか知らない。DNSは名前から数字の住所（IP）を調べる仕組みなので、止まると住所が分からず、ヘッダに宛先が書けない。"},
 {q:"ゲームとトークのパケットが同じスマホ（同じIPアドレス）に届いても混ざりません。<b>何が違うから</b>区別できるのか、建物と部屋のたとえを使って説明してください。",type:"text",pts:2,kw:[["ポート"],["部屋"],["建物","IP"]],need:3,model:"IPアドレスが建物、ポート番号が部屋番号。ヘッダのポート番号がアプリごとに違うので、同じIPに届いても正しいアプリに渡せる。"},
 {q:"送信元に「届いた（ACK）」が返ってきません。原因は行きの箱が消えたのか、ACKが消えたのか、送信元には分かりません。それでも送信元が<b>何をするか</b>、<b>なぜそれでよいか</b>を説明してください。",type:"text",pts:2,kw:[["送り直","再送"],["時間","待っ","待て"],["番号"]],need:2,model:"一定時間ACKが来なければ、原因を調べずに同じ箱を送り直す。同じ箱が2回届いても、番号で見分けて捨てられるので問題ない。"},
 {q:"ビデオ通話では、欠けた箱を送り直しません。文字メッセージとの違いを、<b>TCP と UDP</b> の2語を使って説明してください。",type:"text",pts:2,kw:[["UDP"],["TCP"],["再送","送り直"],["止ま","固ま","遅れ","待"]],need:4,model:"文字は1文字も欠けてはいけないので、再送するTCPを使う。通話は欠けた1コマを待つと映像が止まるので、再送しないUDPを使い、次のコマを見せる。"},
 {q:"自分のスマホの住所は 192.168.0.12 ですが、友だちの家のテレビも 192.168.0.12 かもしれません。それでも世界中で混ざらない理由を、<b>家のルーターが何をしているか</b>を含めて説明してください。",type:"text",pts:2,kw:[["NAT"],["ルーター"],["書き換","書きか"],["外"]],need:3,model:"192.168.〜 は家の中だけで使う番号。外に出るとき家のルーターが送信元を外向きの住所に書き換える（NAT）。外から見えるのはルーターの住所だけなので、家の中の番号が同じでも混ざらない。"},
];
const MAX=QUIZ.reduce((t,x)=>t+x.pts,0);
const norm=t=>(t||'').toLowerCase().replace(/\s/g,'');
function gradeText(x,ans){ const n=norm(ans); const hits=x.kw.filter(g=>g.some(k=>n.includes(k.toLowerCase()))).length; return {hits, pts: hits>=x.need?2 : hits>0?1 : 0}; }
function renderQuiz(){
  stage.innerHTML=`<div class="eyebrow">小テスト　10問・1回だけ</div><h2>小テスト　メッセージが届くまで</h2><p class="lead">用語ノートは見ないで取り組んでください。記述問題は、用語を使って文で書きます。全部答えてから「採点する」を押します。採点は1回だけです。</p>
  <label class="row">名前 <input type="text" id="qname" value="${esc(S.qname||'')}" placeholder="2-6 ○○" style="width:12em"></label>
  <div id="qs" style="display:flex;flex-direction:column;gap:18px">${QUIZ.map((x,i)=>`<div class="q" style="border-top:1px solid var(--line)"><div class="qt">問${i+1}　<span style="font-size:.8rem;color:var(--mute);font-weight:400">${x.pts}点${x.type==='text'?'・記述':''}</span><br>${x.q}</div>${x.type==='num'?`<input type="number" data-q="${i}" style="width:8em">`:x.type==='one'?`<div class="opts">${x.o.map((o,j)=>`<label class="ck"><input type="radio" name="q${i}" value="${j}"><span>${o}</span></label>`).join('')}</div>`:`<textarea data-q="${i}" placeholder="文で書く"></textarea>`}</div>`).join('')}</div>
  <div class="fb" id="qfb"></div><div class="nav"><button id="qback">← 戻る</button><button class="pri" id="grade">採点する</button></div>`;
  document.getElementById('qback').addEventListener('click',renderDone);
  document.getElementById('grade').addEventListener('click',()=>{
    const ans=QUIZ.map((x,i)=>{ if(x.type==='one'){const s=document.querySelector(`input[name="q${i}"]:checked`);return s?+s.value:null;} const v=document.querySelector(`[data-q="${i}"]`).value.trim(); return v===''?null:(x.type==='num'?+v:v); });
    const blank=ans.map((a,i)=>a===null?i+1:null).filter(Boolean);
    if(blank.length){ const f=document.getElementById('qfb'); f.className='fb ng'; f.textContent=`問${blank.join('・')} が未回答です。全部答えてから採点してください。`; return; }
    const res=QUIZ.map((x,i)=>{ if(x.type==='text'){const g=gradeText(x,ans[i]); return {pts:g.pts,hits:g.hits,auto:false};} const ok=ans[i]===x.a; return {pts:ok?x.pts:0,ok,auto:true}; });
    S.qname=document.getElementById('qname').value.trim(); S.quiz={name:S.qname,res,ans,at:new Date().toISOString(),score:res.reduce((t,r)=>t+r.pts,0)}; save(); renderQuizResult();
  });
}
function renderQuizResult(){
  const z=S.quiz; const obj=QUIZ.map((x,i)=>x.type!=='text'?z.res[i].pts:0).reduce((a,b)=>a+b,0); const objMax=QUIZ.filter(x=>x.type!=='text').reduce((t,x)=>t+x.pts,0); const txt=z.score-obj; const txtMax=MAX-objMax;
  stage.innerHTML=`<div class="eyebrow">小テスト　結果</div><h2>${z.score} / ${MAX} 点　<span style="font-size:1rem;color:var(--mute);font-weight:400">${esc(z.name||'名前なし')}</span></h2>
  <div class="stats" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="note">客観問題　<b>${obj} / ${objMax}</b>　自動採点</div><div class="note">記述問題　<b>${txt} / ${txtMax}</b>　仮採点（キーワード）。最終判定は先生</div></div>
  <p class="lead">この画面を先生に見せてください。記述は、先生が文を読んで点を直すことがあります。</p>
  <div style="display:flex;flex-direction:column;gap:12px">${QUIZ.map((x,i)=>{const r=z.res[i]; const mark=r.pts===x.pts?'○':r.pts>0?'△':'×'; const col=r.pts===x.pts?'var(--accent)':r.pts>0?'var(--warn)':'var(--bad)';
    return `<div class="q" style="border-top:1px solid var(--line)"><div class="qt" style="color:${col}">${mark}　問${i+1}　${r.pts}/${x.pts}点${x.type==='text'?`　<span style="font-size:.8rem;font-weight:400">キーワード ${r.hits}/${x.kw.length}（仮）</span>`:''}</div><div style="font-size:.9rem;color:var(--mute)">${x.q}</div>
    ${x.type==='text'?`<div style="font-size:.92rem">あなたの答え：<span style="white-space:pre-wrap">${esc(String(z.ans[i]))}</span></div><div style="font-size:.92rem">模範解答：<b>${x.model}</b></div>`:`<div style="font-size:.92rem">正解：<b>${x.type==='num'?x.a:x.o[x.a]}</b>${r.ok?'':`　／　あなたの答え：${x.type==='num'?z.ans[i]:x.o[z.ans[i]]}`}</div><div style="font-size:.9rem;color:var(--mute)">${x.why}</div>`}</div>`;}).join('')}</div>
  <div class="nav"><button id="qback">← 完了画面へ</button></div>`;
  document.getElementById('qback').addEventListener('click',renderDone);
}
renderTerms(); renderProg(); render();
</script>

</body>
